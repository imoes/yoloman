name: sysctl
fqcn: posix.sysctl
collection: posix
short_description: Manage entries in sysctl.conf.
description: This module manipulates sysctl entries and optionally performs a C(/sbin/sysctl -p) after
  changing them.
options:
  ignoreerrors:
    type: bool
    default: false
    description: Use this option to ignore errors about unknown keys.
  name:
    type: str
    required: true
    aliases:
    - key
    description: The dot-separated path (also known as I(key)) specifying the sysctl variable.
  reload:
    type: bool
    default: true
    description: If C(true), performs a I(/sbin/sysctl -p) if the C(sysctl_file) is updated. If C(false),
      does not reload I(sysctl) even if the C(sysctl_file) is updated.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the entry should be present or absent in the sysctl file.
  sysctl_file:
    type: path
    default: /etc/sysctl.conf
    description: Specifies the absolute path to C(sysctl.conf), if not C(/etc/sysctl.conf).
  sysctl_set:
    type: bool
    default: false
    description: Verify token value with the sysctl command and set with -w if necessary.
  value:
    type: str
    aliases:
    - val
    description: Desired value of the sysctl key.
writes: true
runtime: starlark
source: translated
examples: "\n# Set vm.swappiness to 5 in /etc/sysctl.conf\n- posix.sysctl:\n    name: vm.swappiness\n\
  \    value: '5'\n    state: present\n\n# Remove kernel.panic entry from /etc/sysctl.conf\n- posix.sysctl:\n\
  \    name: kernel.panic\n    state: absent\n    sysctl_file: /etc/sysctl.conf\n\n# Set kernel.panic\
  \ to 3 in /tmp/test_sysctl.conf\n- posix.sysctl:\n    name: kernel.panic\n    value: '3'\n \
  \   sysctl_file: /tmp/test_sysctl.conf\n    reload: false\n\n# Set ip forwarding on in /proc and verify\
  \ token value with the sysctl command\n- posix.sysctl:\n    name: net.ipv4.ip_forward\n    value:\
  \ '1'\n    sysctl_set: true\n\n# Set ip forwarding on in /proc and in the sysctl file and reload if\
  \ necessary\n- posix.sysctl:\n    name: net.ipv4.ip_forward\n    value: '1'\n    sysctl_set:\
  \ true\n    state: present\n    reload: true\n"
