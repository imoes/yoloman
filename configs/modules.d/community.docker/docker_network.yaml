name: docker_network
fqcn: community.docker.docker_network
collection: community.docker
short_description: Manage Docker networks
description: Create/remove Docker networks and connect containers to them. Performs largely the same function
  as the C(docker network) CLI subcommand.
options:
  api_version:
    type: str
    default: auto
    aliases:
    - docker_api_version
    description: The version of the Docker API running on the Docker Host. Defaults to the latest version
      of the API supported by this collection and the docker daemon. If the value is not specified in
      the task, the value of environment variable E(DOCKER_API_VERSION) will be used instead. If the environment
      variable is not set, the default value will be used.
  appends:
    type: bool
    default: false
    aliases:
    - incremental
    description: By default the connected list is canonical, meaning containers not on the list are removed
      from the network. Use O(appends) to leave existing containers connected.
  attachable:
    type: bool
    description: If enabled, and the network is in the global scope, non-service containers on worker
      nodes will be able to connect to the network.
  ca_path:
    type: path
    aliases:
    - ca_cert
    - tls_ca_cert
    - cacert_path
    description: Use a CA certificate when performing server verification by providing the path to a CA
      certificate file. If the value is not specified in the task and the environment variable E(DOCKER_CERT_PATH)
      is set, the file C(ca.pem) from the directory specified in the environment variable E(DOCKER_CERT_PATH)
      will be used. This option was called O(ca_cert) and got renamed to O(ca_path) in community.docker
      3.6.0. The old name has been added as an alias and can still be used.
  client_cert:
    type: path
    aliases:
    - tls_client_cert
    - cert_path
    description: Path to the client's TLS certificate file. If the value is not specified in the task
      and the environment variable E(DOCKER_CERT_PATH) is set, the file C(cert.pem) from the directory
      specified in the environment variable E(DOCKER_CERT_PATH) will be used.
  client_key:
    type: path
    aliases:
    - tls_client_key
    - key_path
    description: Path to the client's TLS key file. If the value is not specified in the task and the
      environment variable E(DOCKER_CERT_PATH) is set, the file C(key.pem) from the directory specified
      in the environment variable E(DOCKER_CERT_PATH) will be used.
  connected:
    type: list
    default: []
    aliases:
    - containers
    description: List of container names or container IDs to connect to a network. Please note that the
      module only makes sure that these containers are connected to the network, but does not care about
      connection options. If you rely on specific IP addresses etc., use the M(community.docker.docker_container)
      module to ensure your containers are correctly connected to this network.
  debug:
    type: bool
    default: false
    description: Debug mode
  docker_host:
    type: str
    default: unix:///var/run/docker.sock
    aliases:
    - docker_url
    description: The URL or Unix socket path used to connect to the Docker API. To connect to a remote
      host, provide the TCP connection string. For example, V(tcp://192.0.2.23:2376). If TLS is used to
      encrypt the connection, the module will automatically replace C(tcp) in the connection URL with
      C(https). If the value is not specified in the task, the value of environment variable E(DOCKER_HOST)
      will be used instead. If the environment variable is not set, the default value will be used.
  driver:
    type: str
    default: bridge
    description: Specify the type of network. Docker provides bridge and overlay drivers, but 3rd party
      drivers can also be used.
  driver_options:
    type: dict
    default: {}
    description: Dictionary of network settings. Consult docker docs for valid options and values.
  enable_ipv6:
    type: bool
    description: Enable IPv6 networking.
  force:
    type: bool
    default: false
    description: With state V(absent) forces disconnecting all containers from the network prior to deleting
      the network. With state V(present) will disconnect all containers, delete the network and re-create
      the network. This option is required if you have changed the IPAM or driver options and want an
      existing network to be updated to use the new options.
  internal:
    type: bool
    description: Restrict external access to the network.
  ipam_config:
    type: list
    description: List of IPAM config blocks. Consult L(Docker docs,https://docs.docker.com/compose/compose-file/compose-file-v2/#ipam)
      for valid options and values. Note that O(ipam_config[].iprange) is spelled differently here (we
      use the notation from the Docker SDK for Python).
  ipam_driver:
    type: str
    description: Specify an IPAM driver.
  ipam_driver_options:
    type: dict
    description: Dictionary of IPAM driver options.
  labels:
    type: dict
    default: {}
    description: Dictionary of labels.
  name:
    type: str
    required: true
    aliases:
    - network_name
    description: Name of the network to operate on.
  scope:
    type: str
    choices:
    - local
    - global
    - swarm
    description: Specify the network's scope.
  ssl_version:
    type: str
    description: Provide a valid SSL version number. Default value determined by L(SSL Python module,
      https://docs.python.org/3/library/ssl.html). If the value is not specified in the task, the value
      of environment variable E(DOCKER_SSL_VERSION) will be used instead.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: V(absent) deletes the network. If a network has connected containers, it cannot be deleted.
      Use the O(force) option to disconnect all containers and delete the network. V(present) creates
      the network, if it does not already exist with the specified parameters, and connects the list of
      containers provided via the connected parameter. Containers not on the list will be disconnected.
      An empty list will leave no containers connected to the network. Use the O(appends) option to leave
      existing containers connected. Use the O(force) options to force re-creation of the network.
  timeout:
    type: int
    default: 60
    description: The maximum amount of time in seconds to wait on a response from the API. If the value
      is not specified in the task, the value of environment variable E(DOCKER_TIMEOUT) will be used instead.
      If the environment variable is not set, the default value will be used.
  tls:
    type: bool
    default: false
    description: Secure the connection to the API by using TLS without verifying the authenticity of the
      Docker host server. Note that if O(validate_certs) is set to V(true) as well, it will take precedence.
      If the value is not specified in the task, the value of environment variable E(DOCKER_TLS) will
      be used instead. If the environment variable is not set, the default value will be used.
  tls_hostname:
    type: str
    description: When verifying the authenticity of the Docker Host server, provide the expected name
      of the server. If the value is not specified in the task, the value of environment variable E(DOCKER_TLS_HOSTNAME)
      will be used instead. If the environment variable is not set, the default value will be used. Note
      that this option had a default value V(localhost) in older versions. It was removed in community.docker
      3.0.0.
  use_ssh_client:
    type: bool
    default: false
    description: For SSH transports, use the C(ssh) CLI tool instead of paramiko.
  validate_certs:
    type: bool
    default: false
    aliases:
    - tls_verify
    description: Secure the connection to the API by using TLS and verifying the authenticity of the Docker
      host server. If the value is not specified in the task, the value of environment variable E(DOCKER_TLS_VERIFY)
      will be used instead. If the environment variable is not set, the default value will be used.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a network\n  community.docker.docker_network:\n    name: network_one\n\n-\
  \ name: Remove all but selected list of containers\n  community.docker.docker_network:\n    name: network_one\n\
  \    connected:\n      - container_a\n      - container_b\n      - container_c\n\n- name: Remove a single\
  \ container\n  community.docker.docker_network:\n    name: network_one\n    connected: \"{{ fulllist|difference(['container_a'])\
  \ }}\"\n\n- name: Add a container to a network, leaving existing containers connected\n  community.docker.docker_network:\n\
  \    name: network_one\n    connected:\n      - container_a\n    appends: true\n\n- name: Create a network\
  \ with driver options\n  community.docker.docker_network:\n    name: network_two\n    driver_options:\n\
  \      com.docker.network.bridge.name: net2\n\n- name: Create a network with custom IPAM config\n  community.docker.docker_network:\n\
  \    name: network_three\n    ipam_config:\n      - subnet: 172.23.27.0/24\n        gateway: 172.23.27.2\n\
  \        iprange: 172.23.27.0/26\n        aux_addresses:\n          host1: 172.23.27.3\n          host2:\
  \ 172.23.27.4\n\n- name: Create a network with labels\n  community.docker.docker_network:\n    name:\
  \ network_four\n    labels:\n      key1: value1\n      key2: value2\n\n- name: Create a network with\
  \ IPv6 IPAM config\n  community.docker.docker_network:\n    name: network_ipv6_one\n    enable_ipv6:\
  \ true\n    ipam_config:\n      - subnet: fdd1:ac8c:0557:7ce1::/64\n\n- name: Create a network with\
  \ IPv6 and custom IPv4 IPAM config\n  community.docker.docker_network:\n    name: network_ipv6_two\n\
  \    enable_ipv6: true\n    ipam_config:\n      - subnet: 172.24.27.0/24\n      - subnet: fdd1:ac8c:0557:7ce2::/64\n\
  \n- name: Delete a network, disconnecting all containers\n  community.docker.docker_network:\n    name:\
  \ network_one\n    state: absent\n    force: true\n"
