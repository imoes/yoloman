name: docker_host_info
fqcn: community.docker.docker_host_info
collection: community.docker
short_description: Retrieves facts about docker host and lists of objects of the services.
description: Retrieves facts about a docker host. Essentially returns the output of C(docker system info).
  The module also allows to list object names for containers, images, networks and volumes. It also allows
  to query information on disk usage. The output differs depending on API version of the docker daemon.
  If the docker daemon cannot be contacted or does not meet the API version requirements, the module will
  fail.
options:
  api_version:
    type: str
    default: auto
    aliases:
    - docker_api_version
    description: The version of the Docker API running on the Docker Host. Defaults to the latest version
      of the API supported by this collection and the docker daemon. If the value is not specified in
      the task, the value of environment variable E(DOCKER_API_VERSION) will be used instead. If the environment
      variable is not set, the default value will be used.
  ca_path:
    type: path
    aliases:
    - ca_cert
    - tls_ca_cert
    - cacert_path
    description: Use a CA certificate when performing server verification by providing the path to a CA
      certificate file. If the value is not specified in the task and the environment variable E(DOCKER_CERT_PATH)
      is set, the file C(ca.pem) from the directory specified in the environment variable E(DOCKER_CERT_PATH)
      will be used. This option was called O(ca_cert) and got renamed to O(ca_path) in community.docker
      3.6.0. The old name has been added as an alias and can still be used.
  client_cert:
    type: path
    aliases:
    - tls_client_cert
    - cert_path
    description: Path to the client's TLS certificate file. If the value is not specified in the task
      and the environment variable E(DOCKER_CERT_PATH) is set, the file C(cert.pem) from the directory
      specified in the environment variable E(DOCKER_CERT_PATH) will be used.
  client_key:
    type: path
    aliases:
    - tls_client_key
    - key_path
    description: Path to the client's TLS key file. If the value is not specified in the task and the
      environment variable E(DOCKER_CERT_PATH) is set, the file C(key.pem) from the directory specified
      in the environment variable E(DOCKER_CERT_PATH) will be used.
  containers:
    type: bool
    default: false
    description: Whether to list containers.
  containers_all:
    type: bool
    default: false
    description: By default, only running containers are returned. This corresponds to the C(--all) option
      to C(docker container list).
  containers_filters:
    type: dict
    description: 'A dictionary of filter values used for selecting containers to list. For example, C(until:
      24h). C(label) is a special case of filter which can be a string C(<key>) matching when a label
      is present, a string C(<key>=<value>) matching when a label has a particular value, or a list of
      strings C(<key>)/C(<key>=<value). See L(the docker documentation,https://docs.docker.com/engine/reference/commandline/container_prune/#filtering)
      for more information on possible filters.'
  debug:
    type: bool
    default: false
    description: Debug mode
  disk_usage:
    type: bool
    default: false
    description: Summary information on used disk space by all Docker layers. The output is a sum of images,
      volumes, containers and build cache.
  docker_host:
    type: str
    default: unix:///var/run/docker.sock
    aliases:
    - docker_url
    description: The URL or Unix socket path used to connect to the Docker API. To connect to a remote
      host, provide the TCP connection string. For example, V(tcp://192.0.2.23:2376). If TLS is used to
      encrypt the connection, the module will automatically replace C(tcp) in the connection URL with
      C(https). If the value is not specified in the task, the value of environment variable E(DOCKER_HOST)
      will be used instead. If the environment variable is not set, the default value will be used.
  images:
    type: bool
    default: false
    description: Whether to list images.
  images_filters:
    type: dict
    description: 'A dictionary of filter values used for selecting images to list. For example, C(dangling:
      true). C(label) is a special case of filter which can be a string C(<key>) matching when a label
      is present, a string C(<key>=<value>) matching when a label has a particular value, or a list of
      strings C(<key>)/C(<key>=<value). See L(the docker documentation,https://docs.docker.com/engine/reference/commandline/image_prune/#filtering)
      for more information on possible filters.'
  networks:
    type: bool
    default: false
    description: Whether to list networks.
  networks_filters:
    type: dict
    description: A dictionary of filter values used for selecting networks to list. C(label) is a special
      case of filter which can be a string C(<key>) matching when a label is present, a string C(<key>=<value>)
      matching when a label has a particular value, or a list of strings C(<key>)/C(<key>=<value). See
      L(the docker documentation,https://docs.docker.com/engine/reference/commandline/network_prune/#filtering)
      for more information on possible filters.
  ssl_version:
    type: str
    description: Provide a valid SSL version number. Default value determined by L(SSL Python module,
      https://docs.python.org/3/library/ssl.html). If the value is not specified in the task, the value
      of environment variable E(DOCKER_SSL_VERSION) will be used instead.
  timeout:
    type: int
    default: 60
    description: The maximum amount of time in seconds to wait on a response from the API. If the value
      is not specified in the task, the value of environment variable E(DOCKER_TIMEOUT) will be used instead.
      If the environment variable is not set, the default value will be used.
  tls:
    type: bool
    default: false
    description: Secure the connection to the API by using TLS without verifying the authenticity of the
      Docker host server. Note that if O(validate_certs) is set to V(true) as well, it will take precedence.
      If the value is not specified in the task, the value of environment variable E(DOCKER_TLS) will
      be used instead. If the environment variable is not set, the default value will be used.
  tls_hostname:
    type: str
    description: When verifying the authenticity of the Docker Host server, provide the expected name
      of the server. If the value is not specified in the task, the value of environment variable E(DOCKER_TLS_HOSTNAME)
      will be used instead. If the environment variable is not set, the default value will be used. Note
      that this option had a default value V(localhost) in older versions. It was removed in community.docker
      3.0.0.
  use_ssh_client:
    type: bool
    default: false
    description: For SSH transports, use the C(ssh) CLI tool instead of paramiko.
  validate_certs:
    type: bool
    default: false
    aliases:
    - tls_verify
    description: Secure the connection to the API by using TLS and verifying the authenticity of the Docker
      host server. If the value is not specified in the task, the value of environment variable E(DOCKER_TLS_VERIFY)
      will be used instead. If the environment variable is not set, the default value will be used.
  verbose_output:
    type: bool
    default: false
    description: When set to V(true) and O(networks), O(volumes), O(images), O(containers), or O(disk_usage)
      is set to V(true) then output will contain verbose information about objects matching the full output
      of API method. For details see the documentation of your version of Docker API at U(https://docs.docker.com/engine/api/).
      The verbose output in this module contains only subset of information returned by this module for
      each type of the objects.
  volumes:
    type: bool
    default: false
    description: Whether to list volumes.
  volumes_filters:
    type: dict
    description: A dictionary of filter values used for selecting volumes to list. C(label) is a special
      case of filter which can be a string C(<key>) matching when a label is present, a string C(<key>=<value>)
      matching when a label has a particular value, or a list of strings C(<key>)/C(<key>=<value). See
      L(the docker documentation,https://docs.docker.com/engine/reference/commandline/volume_prune/#filtering)
      for more information on possible filters.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Get info on docker host\n  community.docker.docker_host_info:\n  register: result\n\
  \n- name: Get info on docker host and list images\n  community.docker.docker_host_info:\n    images:\
  \ true\n  register: result\n\n- name: Get info on docker host and list images matching the filter\n\
  \  community.docker.docker_host_info:\n    images: true\n    images_filters:\n      label: \"mylabel\"\
  \n  register: result\n\n- name: Get info on docker host and verbose list images\n  community.docker.docker_host_info:\n\
  \    images: true\n    verbose_output: true\n  register: result\n\n- name: Get info on docker host and\
  \ used disk space\n  community.docker.docker_host_info:\n    disk_usage: true\n  register: result\n\n\
  - name: Get info on docker host and list containers matching the filter\n  community.docker.docker_host_info:\n\
  \    containers: true\n    containers_filters:\n      label:\n        - key1=value1\n        - key2=value2\n\
  \  register: result\n\n- name: Show host information\n  ansible.builtin.debug:\n    var: result.host_info\n\
  \n"
