name: docker_compose_v2
fqcn: community.docker.docker_compose_v2
collection: community.docker
short_description: Manage multi-container Docker applications with Docker Compose CLI plugin
description: Uses Docker Compose to start or shutdown services.
options:
  api_version:
    type: str
    default: auto
    aliases:
    - docker_api_version
    description: The version of the Docker API running on the Docker Host. Defaults to the latest version
      of the API supported by this collection and the docker daemon. If the value is not specified in
      the task, the value of environment variable E(DOCKER_API_VERSION) will be used instead. If the environment
      variable is not set, the default value will be used.
  build:
    type: str
    default: policy
    choices:
    - always
    - never
    - policy
    description: Whether to build images before starting containers. This is used when C(docker compose
      up) is run. V(always) always builds before starting containers. This is equivalent to the C(--build)
      option of C(docker compose up). V(never) never builds before starting containers. This is equivalent
      to the C(--no-build) option of C(docker compose up). V(policy) uses the policy as defined in the
      Compose file.
  ca_path:
    type: path
    aliases:
    - ca_cert
    - tls_ca_cert
    - cacert_path
    description: Use a CA certificate when performing server verification by providing the path to a CA
      certificate file. If the value is not specified in the task and the environment variable E(DOCKER_CERT_PATH)
      is set, the file C(ca.pem) from the directory specified in the environment variable E(DOCKER_CERT_PATH)
      will be used.
  cli_context:
    type: str
    description: The Docker CLI context to use.
  client_cert:
    type: path
    aliases:
    - tls_client_cert
    - cert_path
    description: Path to the client's TLS certificate file. If the value is not specified in the task
      and the environment variable E(DOCKER_CERT_PATH) is set, the file C(cert.pem) from the directory
      specified in the environment variable E(DOCKER_CERT_PATH) will be used.
  client_key:
    type: path
    aliases:
    - tls_client_key
    - key_path
    description: Path to the client's TLS key file. If the value is not specified in the task and the
      environment variable E(DOCKER_CERT_PATH) is set, the file C(key.pem) from the directory specified
      in the environment variable E(DOCKER_CERT_PATH) will be used.
  dependencies:
    type: bool
    default: true
    description: When O(state) is V(present) or V(restarted), specify whether or not to include linked
      services.
  docker_cli:
    type: path
    description: Path to the Docker CLI. If not provided, will search for Docker CLI on the E(PATH).
  docker_host:
    type: str
    default: unix:///var/run/docker.sock
    aliases:
    - docker_url
    description: The URL or Unix socket path used to connect to the Docker API. To connect to a remote
      host, provide the TCP connection string. For example, V(tcp://192.0.2.23:2376). If TLS is used to
      encrypt the connection, the module will automatically replace C(tcp) in the connection URL with
      C(https). If the value is not specified in the task, the value of environment variable E(DOCKER_HOST)
      will be used instead. If the environment variable is not set, the default value will be used.
  env_files:
    type: list
    description: By default environment files are loaded from a C(.env) file located directly under the
      O(project_src) directory. O(env_files) can be used to specify the path of one or multiple custom
      environment files instead. The path is relative to the O(project_src) directory.
  files:
    type: list
    description: List of Compose file names relative to O(project_src) to be used instead of the main
      Compose file (C(compose.yml), C(compose.yaml), C(docker-compose.yml), or C(docker-compose.yaml)).
      Files are loaded and merged in the order given.
  profiles:
    type: list
    description: List of profiles to enable when starting services. Equivalent to C(docker compose --profile).
  project_name:
    type: str
    description: Provide a project name. If not provided, the project name is taken from the basename
      of O(project_src).
  project_src:
    type: path
    required: true
    description: Path to a directory containing a Compose file (C(compose.yml), C(compose.yaml), C(docker-compose.yml),
      or C(docker-compose.yaml)). If O(files) is provided, will look for these files in this directory
      instead.
  pull:
    type: str
    default: policy
    choices:
    - always
    - missing
    - never
    - policy
    description: Whether to pull images before running. This is used when C(docker compose up) is run.
      V(always) ensures that the images are always pulled, even when already present on the Docker daemon.
      V(missing) only pulls them when they are not present on the Docker daemon. V(never) never pulls
      images. If they are not present, the module will fail when trying to create the containers that
      need them. V(policy) use the Compose file's C(pull_policy) defined for the service to figure out
      what to do.
  recreate:
    type: str
    default: auto
    choices:
    - always
    - never
    - auto
    description: By default containers will be recreated when their configuration differs from the service
      definition. Setting to V(never) ignores configuration differences and leaves existing containers
      unchanged. Setting to V(always) forces recreation of all existing containers.
  remove_images:
    type: str
    choices:
    - all
    - local
    description: Use with O(state=absent) to remove all images or only local images.
  remove_orphans:
    type: bool
    default: false
    description: Remove containers for services not defined in the Compose file.
  remove_volumes:
    type: bool
    default: false
    description: Use with O(state=absent) to remove data volumes.
  scale:
    type: dict
    description: Define how to scale services when running C(docker compose up). Provide a dictionary
      of key/value pairs where the key is the name of the service and the value is an integer count for
      the number of containers.
  services:
    type: list
    description: Specifies a subset of services to be targeted.
  state:
    type: str
    default: present
    choices:
    - absent
    - stopped
    - restarted
    - present
    description: Desired state of the project. V(present) is equivalent to running C(docker compose up).
      V(stopped) is equivalent to running C(docker compose stop). V(absent) is equivalent to running C(docker
      compose down). V(restarted) is equivalent to running C(docker compose restart).
  timeout:
    type: int
    description: Timeout in seconds for container shutdown when attached or when containers are already
      running.
  tls:
    type: bool
    default: false
    description: Secure the connection to the API by using TLS without verifying the authenticity of the
      Docker host server. Note that if O(validate_certs) is set to V(true) as well, it will take precedence.
      If the value is not specified in the task, the value of environment variable E(DOCKER_TLS) will
      be used instead. If the environment variable is not set, the default value will be used.
  tls_hostname:
    type: str
    description: When verifying the authenticity of the Docker Host server, provide the expected name
      of the server. If the value is not specified in the task, the value of environment variable E(DOCKER_TLS_HOSTNAME)
      will be used instead. If the environment variable is not set, the default value will be used.
  validate_certs:
    type: bool
    default: false
    aliases:
    - tls_verify
    description: Secure the connection to the API by using TLS and verifying the authenticity of the Docker
      host server. If the value is not specified in the task, the value of environment variable E(DOCKER_TLS_VERIFY)
      will be used instead. If the environment variable is not set, the default value will be used.
writes: true
runtime: starlark
source: translated
examples: "\n# Examples use the django example at https://docs.docker.com/compose/django. Follow it to\
  \ create the\n# flask directory\n\n- name: Run using a project directory\n  hosts: localhost\n  gather_facts:\
  \ false\n  tasks:\n    - name: Tear down existing services\n      community.docker.docker_compose_v2:\n\
  \        project_src: flask\n        state: absent\n\n    - name: Create and start services\n      community.docker.docker_compose_v2:\n\
  \        project_src: flask\n      register: output\n\n    - name: Show results\n      ansible.builtin.debug:\n\
  \        var: output\n\n    - name: Run `docker-compose up` again\n      community.docker.docker_compose_v2:\n\
  \        project_src: flask\n      register: output\n\n    - name: Show results\n      ansible.builtin.debug:\n\
  \        var: output\n\n    - ansible.builtin.assert:\n        that: not output.changed\n\n    - name:\
  \ Stop all services\n      community.docker.docker_compose_v2:\n        project_src: flask\n       \
  \ state: stopped\n      register: output\n\n    - name: Show results\n      ansible.builtin.debug:\n\
  \        var: output\n\n    - name: Verify that web and db services are not running\n      ansible.builtin.assert:\n\
  \        that:\n          - \"not output.services.web.flask_web_1.state.running\"\n          - \"not\
  \ output.services.db.flask_db_1.state.running\"\n\n    - name: Restart services\n      community.docker.docker_compose_v2:\n\
  \        project_src: flask\n        state: restarted\n      register: output\n\n    - name: Show results\n\
  \      ansible.builtin.debug:\n        var: output\n\n    - name: Verify that web and db services are\
  \ running\n      ansible.builtin.assert:\n        that:\n          - \"output.services.web.flask_web_1.state.running\"\
  \n          - \"output.services.db.flask_db_1.state.running\"\n"
