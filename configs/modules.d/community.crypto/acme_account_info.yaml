name: acme_account_info
fqcn: community.crypto.acme_account_info
collection: community.crypto
short_description: Retrieves information on ACME accounts
description: Allows to retrieve information on accounts a CA supporting the L(ACME protocol,https://tools.ietf.org/html/rfc8555),
  such as L(Let's Encrypt,https://letsencrypt.org/). This module only works with the ACME v2 protocol.
options:
  account_key_content:
    type: str
    description: Content of the ACME account RSA or Elliptic Curve key. Mutually exclusive with O(account_key_src).
      Required if O(account_key_src) is not used. B(Warning:) the content will be written into a temporary
      file, which will be deleted by Ansible when the module completes. Since this is an important private
      key — it can be used to change the account key, or to revoke your certificates without knowing their
      private keys —, this might not be acceptable. In case C(cryptography) is used, the content is not
      written into a temporary file. It can still happen that it is written to disk by Ansible in the
      process of moving the module with its argument to the node where it is executed.
  account_key_passphrase:
    type: str
    description: Phassphrase to use to decode the account key. B(Note:) this is not supported by the C(openssl)
      backend, only by the C(cryptography) backend.
  account_key_src:
    type: path
    aliases:
    - account_key
    description: 'Path to a file containing the ACME account RSA or Elliptic Curve key. Private keys can
      be created with the M(community.crypto.openssl_privatekey) or M(community.crypto.openssl_privatekey_pipe)
      modules. If the requisite (cryptography) is not available, keys can also be created directly with
      the C(openssl) command line tool: RSA keys can be created with C(openssl genrsa ...). Elliptic curve
      keys can be created with C(openssl ecparam -genkey ...). Any other tool creating private keys in
      PEM format can be used as well. Mutually exclusive with O(account_key_content). Required if O(account_key_content)
      is not used.'
  account_uri:
    type: str
    description: If specified, assumes that the account URI is as given. If the account key does not match
      this account, or an account with this URI does not exist, the module fails.
  acme_directory:
    type: str
    required: true
    description: 'The ACME directory to use. This is the entry point URL to access the ACME CA server
      API. For safety reasons the default is set to the Let''s Encrypt staging server (for the ACME v1
      protocol). This will create technically correct, but untrusted certificates. For Let''s Encrypt,
      all staging endpoints can be found here: U(https://letsencrypt.org/docs/staging-environment/). For
      Buypass, all endpoints can be found here: U(https://community.buypass.com/t/63d4ay/buypass-go-ssl-endpoints)
      For B(Let''s Encrypt), the production directory URL for ACME v2 is U(https://acme-v02.api.letsencrypt.org/directory).
      For B(Buypass), the production directory URL for ACME v2 and v1 is U(https://api.buypass.com/acme/directory).
      For B(ZeroSSL), the production directory URL for ACME v2 is U(https://acme.zerossl.com/v2/DV90).
      For B(Sectigo), the production directory URL for ACME v2 is U(https://acme-qa.secure.trust-provider.com/v2/DV).
      The notes for this module contain a list of ACME services this module has been tested against.'
  acme_version:
    type: int
    required: true
    choices:
    - 1
    - 2
    description: The ACME version of the endpoint. Must be V(1) for the classic Let's Encrypt and Buypass
      ACME endpoints, or V(2) for standardized ACME v2 endpoints. The value V(1) is deprecated since community.crypto
      2.0.0 and will be removed from community.crypto 3.0.0.
  request_timeout:
    type: int
    default: 10
    description: The time Ansible should wait for a response from the ACME API. This timeout is applied
      to all HTTP(S) requests (HEAD, GET, POST).
  retrieve_orders:
    type: str
    default: ignore
    choices:
    - ignore
    - url_list
    - object_list
    description: Whether to retrieve the list of order URLs or order objects, if provided by the ACME
      server. A value of V(ignore) will not fetch the list of orders. If the value is not V(ignore) and
      the ACME server supports orders, the RV(order_uris) return value is always populated. The RV(orders)
      return value is only returned if this option is set to V(object_list). Currently, Let's Encrypt
      does not return orders, so the RV(orders) result will always be empty.
  select_crypto_backend:
    type: str
    default: auto
    choices:
    - auto
    - cryptography
    - openssl
    description: Determines which crypto backend to use. The default choice is V(auto), which tries to
      use C(cryptography) if available, and falls back to C(openssl). If set to V(openssl), will try to
      use the C(openssl) binary. If set to V(cryptography), will try to use the L(cryptography,https://cryptography.io/)
      library.
  validate_certs:
    type: bool
    default: true
    description: Whether calls to the ACME directory will validate TLS certificates. B(Warning:) Should
      B(only ever) be set to V(false) for testing purposes, for example when testing against a local Pebble
      server.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Check whether an account with the given account key exists\n  community.crypto.acme_account_info:\n\
  \    account_key_src: /etc/pki/cert/private/account.key\n  register: account_data\n- name: Verify that\
  \ account exists\n  ansible.builtin.assert:\n    that:\n      - account_data.exists\n- name: Print account\
  \ URI\n  ansible.builtin.debug:\n    var: account_data.account_uri\n- name: Print account contacts\n\
  \  ansible.builtin.debug:\n    var: account_data.account.contact\n\n- name: Check whether the account\
  \ exists and is accessible with the given account key\n  acme_account_info:\n    account_key_content:\
  \ \"{{ acme_account_key }}\"\n    account_uri: \"{{ acme_account_uri }}\"\n  register: account_data\n\
  - name: Verify that account exists\n  ansible.builtin.assert:\n    that:\n      - account_data.exists\n\
  - name: Print account contacts\n  ansible.builtin.debug:\n    var: account_data.account.contact\n"
