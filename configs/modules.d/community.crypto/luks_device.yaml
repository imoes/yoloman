name: luks_device
fqcn: community.crypto.luks_device
collection: community.crypto
short_description: Manage encrypted (LUKS) devices
description: Module manages L(LUKS,https://en.wikipedia.org/wiki/Linux_Unified_Key_Setup) on given device.
  Supports creating, destroying, opening and closing of LUKS container and adding or removing new keys
  and passphrases.
options:
  allow_discards:
    type: bool
    default: false
    description: Allow discards (also known as TRIM) requests for device. Will only be used when opening
      containers.
  cipher:
    type: str
    description: This option allows the user to define the cipher specification string for the LUKS container.
      Will only be used on container creation. For pre-2.6.10 kernels, use V(aes-plain) as they do not
      understand the new cipher spec strings. To use ESSIV, use V(aes-cbc-essiv:sha256).
  device:
    type: str
    description: Device to work with (for example V(/dev/sda1)). Needed in most cases. Can be omitted
      only when O(state=closed) together with O(name) is provided.
  force_remove_last_key:
    type: bool
    default: false
    description: If set to V(true), allows removing the last key from a container. BEWARE that when the
      last key has been removed from a container, the container can no longer be opened!
  hash:
    type: str
    description: This option allows the user to specify the hash function used in LUKS key setup scheme
      and volume key digest. Will only be used on container creation.
  keyfile:
    type: path
    description: Used to unlock the container. Either a O(keyfile) or a O(passphrase) is needed for most
      of the operations. Parameter value is the path to the keyfile with the passphrase. BEWARE that working
      with keyfiles in plaintext is dangerous. Make sure that they are protected.
  keysize:
    type: int
    description: Sets the key size only if LUKS container does not exist.
  keyslot:
    type: int
    description: Adds the O(keyfile) or O(passphrase) to a specific keyslot when creating a new container
      on O(device). Parameter value is the number of the keyslot. B(Note) that a device of O(type=luks1)
      supports the keyslot numbers V(0)-V(7) and a device of O(type=luks2) supports the keyslot numbers
      V(0)-V(31). In order to use the keyslots V(8)-V(31) when creating a new container, setting O(type)
      to V(luks2) is required.
  label:
    type: str
    description: This option allow the user to create a LUKS2 format container with label support, respectively
      to identify the container by label on later usages. Will only be used on container creation, or
      when O(device) is not specified. This cannot be specified if O(type) is set to V(luks1).
  name:
    type: str
    description: Sets container name when O(state=opened). Can be used instead of O(device) when closing
      the existing container (that is, when O(state=closed)).
  new_keyfile:
    type: path
    description: Adds additional key to given container on O(device). Needs O(keyfile) or O(passphrase)
      option for authorization. LUKS container supports up to 8 keyslots. Parameter value is the path
      to the keyfile with the passphrase. NOTE that adding additional keys is idempotent only since community.crypto
      1.4.0. For older versions, a new keyslot will be used even if another keyslot already exists for
      this keyfile. BEWARE that working with keyfiles in plaintext is dangerous. Make sure that they are
      protected.
  new_keyslot:
    type: int
    description: Adds the additional O(new_keyfile) or O(new_passphrase) to a specific keyslot on the
      given O(device). Parameter value is the number of the keyslot. B(Note) that a device of O(type=luks1)
      supports the keyslot numbers V(0)-V(7) and a device of O(type=luks2) supports the keyslot numbers
      V(0)-V(31).
  new_passphrase:
    type: str
    description: Adds additional passphrase to given container on O(device). Needs O(keyfile) or O(passphrase)
      option for authorization. LUKS container supports up to 8 keyslots. Parameter value is a string
      with the new passphrase. NOTE that adding additional passphrase is idempotent only since community.crypto
      1.4.0. For older versions, a new keyslot will be used even if another keyslot already exists for
      this passphrase.
  passphrase:
    type: str
    description: Used to unlock the container. Either a O(passphrase) or a O(keyfile) is needed for most
      of the operations. Parameter value is a string with the passphrase.
  pbkdf:
    type: dict
    description: This option allows the user to configure the Password-Based Key Derivation Function (PBKDF)
      used. Will only be used on container creation, and when adding keys to an existing container.
  perf_no_read_workqueue:
    type: bool
    default: false
    description: Allows the user to bypass dm-crypt internal workqueue and process read requests synchronously.
      Will only be used when opening containers.
  perf_no_write_workqueue:
    type: bool
    default: false
    description: Allows the user to bypass dm-crypt internal workqueue and process write requests synchronously.
      Will only be used when opening containers.
  perf_same_cpu_crypt:
    type: bool
    default: false
    description: Allows the user to perform encryption using the same CPU that IO was submitted on. The
      default is to use an unbound workqueue so that encryption work is automatically balanced between
      available CPUs. Will only be used when opening containers.
  perf_submit_from_crypt_cpus:
    type: bool
    default: false
    description: Allows the user to disable offloading writes to a separate thread after encryption. There
      are some situations where offloading block write IO operations from the encryption threads to a
      single thread degrades performance significantly. The default is to offload block write IO operations
      to the same thread. Will only be used when opening containers.
  persistent:
    type: bool
    default: false
    description: Allows the user to store options into container's metadata persistently and automatically
      use them next time. Only O(perf_same_cpu_crypt), O(perf_submit_from_crypt_cpus), O(perf_no_read_workqueue),
      O(perf_no_write_workqueue), and O(allow_discards) can be stored persistently. Will only work with
      LUKS2 containers. Will only be used when opening containers.
  remove_keyfile:
    type: path
    description: Removes given key from the container on O(device). Does not remove the keyfile from filesystem.
      Parameter value is the path to the keyfile with the passphrase. NOTE that removing keys is idempotent
      only since community.crypto 1.4.0. For older versions, trying to remove a key which no longer exists
      results in an error. NOTE that to remove the last key from a LUKS container, the O(force_remove_last_key)
      option must be set to V(true). BEWARE that working with keyfiles in plaintext is dangerous. Make
      sure that they are protected.
  remove_keyslot:
    type: int
    description: Removes the key in the given slot on O(device). Needs O(keyfile) or O(passphrase) for
      authorization. B(Note) that a device of O(type=luks1) supports the keyslot numbers V(0)-V(7) and
      a device of O(type=luks2) supports the keyslot numbers V(0)-V(31). B(Note) that the given O(keyfile)
      or O(passphrase) must not be in the slot to be removed.
  remove_passphrase:
    type: str
    description: Removes given passphrase from the container on O(device). Parameter value is a string
      with the passphrase to remove. NOTE that removing passphrases is idempotent only since community.crypto
      1.4.0. For older versions, trying to remove a passphrase which no longer exists results in an error.
      NOTE that to remove the last keyslot from a LUKS container, the O(force_remove_last_key) option
      must be set to V(true).
  sector_size:
    type: int
    description: This option allows the user to specify the sector size (in bytes) used for LUKS2 containers.
      Will only be used on container creation.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - opened
    - closed
    description: Desired state of the LUKS container. Based on its value creates, destroys, opens or closes
      the LUKS container on a given device. V(present) will create LUKS container unless already present.
      Requires O(device) and either O(keyfile) or O(passphrase) options to be provided. V(absent) will
      remove existing LUKS container if it exists. Requires O(device) or O(name) to be specified. V(opened)
      will unlock the LUKS container. If it does not exist it will be created first. Requires O(device)
      and either O(keyfile) or O(passphrase) to be specified. Use the O(name) option to set the name of
      the opened container.  Otherwise the name will be generated automatically and returned as a part
      of the result. V(closed) will lock the LUKS container. However if the container does not exist it
      will be created. Requires O(device) and either O(keyfile) or O(passphrase) options to be provided.
      If container does already exist O(device) or O(name) will suffice.
  type:
    type: str
    choices:
    - luks1
    - luks2
    description: This option allow the user explicit define the format of LUKS container that wants to
      work with. Options are V(luks1) or V(luks2)
  uuid:
    type: str
    description: With this option user can identify the LUKS container by UUID. Will only be used when
      O(device) and O(label) are not specified.
writes: true
runtime: starlark
source: translated
examples: "\n\n- name: Create LUKS container (remains unchanged if it already exists)\n  community.crypto.luks_device:\n\
  \    device: \"/dev/loop0\"\n    state: \"present\"\n    keyfile: \"/vault/keyfile\"\n\n- name: Create\
  \ LUKS container with a passphrase\n  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n  \
  \  state: \"present\"\n    passphrase: \"foo\"\n\n- name: Create LUKS container with specific encryption\n\
  \  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n    state: \"present\"\n    cipher: \"\
  aes\"\n    hash: \"sha256\"\n\n- name: (Create and) open the LUKS container; name it \"mycrypt\"\n \
  \ community.crypto.luks_device:\n    device: \"/dev/loop0\"\n    state: \"opened\"\n    name: \"mycrypt\"\
  \n    keyfile: \"/vault/keyfile\"\n\n- name: Close the existing LUKS container \"mycrypt\"\n  community.crypto.luks_device:\n\
  \    state: \"closed\"\n    name: \"mycrypt\"\n\n- name: Make sure LUKS container exists and is closed\n\
  \  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n    state: \"closed\"\n    keyfile: \"\
  /vault/keyfile\"\n\n- name: Create container if it does not exist and add new key to it\n  community.crypto.luks_device:\n\
  \    device: \"/dev/loop0\"\n    state: \"present\"\n    keyfile: \"/vault/keyfile\"\n    new_keyfile:\
  \ \"/vault/keyfile2\"\n\n- name: Add new key to the LUKS container (container has to exist)\n  community.crypto.luks_device:\n\
  \    device: \"/dev/loop0\"\n    keyfile: \"/vault/keyfile\"\n    new_keyfile: \"/vault/keyfile2\"\n\
  \n- name: Add new passphrase to the LUKS container\n  community.crypto.luks_device:\n    device: \"\
  /dev/loop0\"\n    keyfile: \"/vault/keyfile\"\n    new_passphrase: \"foo\"\n\n- name: Remove existing\
  \ keyfile from the LUKS container\n  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n   \
  \ remove_keyfile: \"/vault/keyfile2\"\n\n- name: Remove existing passphrase from the LUKS container\n\
  \  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n    remove_passphrase: \"foo\"\n\n- name:\
  \ Completely remove the LUKS container and its contents\n  community.crypto.luks_device:\n    device:\
  \ \"/dev/loop0\"\n    state: \"absent\"\n\n- name: Create a container with label\n  community.crypto.luks_device:\n\
  \    device: \"/dev/loop0\"\n    state: \"present\"\n    keyfile: \"/vault/keyfile\"\n    label: personalLabelName\n\
  \n- name: Open the LUKS container based on label without device; name it \"mycrypt\"\n  community.crypto.luks_device:\n\
  \    label: \"personalLabelName\"\n    state: \"opened\"\n    name: \"mycrypt\"\n    keyfile: \"/vault/keyfile\"\
  \n\n- name: Close container based on UUID\n  community.crypto.luks_device:\n    uuid: 03ecd578-fad4-4e6c-9348-842e3e8fa340\n\
  \    state: \"closed\"\n    name: \"mycrypt\"\n\n- name: Create a container using luks2 format\n  community.crypto.luks_device:\n\
  \    device: \"/dev/loop0\"\n    state: \"present\"\n    keyfile: \"/vault/keyfile\"\n    type: luks2\n\
  \n- name: Create a container with key in slot 4\n  community.crypto.luks_device:\n    device: \"/dev/loop0\"\
  \n    state: \"present\"\n    keyfile: \"/vault/keyfile\"\n    keyslot: 4\n\n- name: Add a new key in\
  \ slot 5\n  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n    keyfile: \"/vault/keyfile\"\
  \n    new_keyfile: \"/vault/keyfile\"\n    new_keyslot: 5\n\n- name: Remove the key from slot 4 (given\
  \ keyfile must not be slot 4)\n  community.crypto.luks_device:\n    device: \"/dev/loop0\"\n    keyfile:\
  \ \"/vault/keyfile\"\n    remove_keyslot: 4\n"
