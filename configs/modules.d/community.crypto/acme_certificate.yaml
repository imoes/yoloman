name: acme_certificate
fqcn: community.crypto.acme_certificate
collection: community.crypto
short_description: Create SSL/TLS certificates with the ACME protocol
description: Create and renew SSL/TLS certificates with a CA supporting the L(ACME protocol,https://tools.ietf.org/html/rfc8555),
  such as L(Let's Encrypt,https://letsencrypt.org/) or L(Buypass,https://www.buypass.com/). The current
  implementation supports the V(http-01), V(dns-01) and V(tls-alpn-01) challenges. To use this module,
  it has to be executed twice. Either as two different tasks in the same run or during two runs. Note
  that the output of the first run needs to be recorded and passed to the second run as the module argument
  O(data). Between these two tasks you have to fulfill the required steps for the chosen challenge by
  whatever means necessary. For V(http-01) that means creating the necessary challenge file on the destination
  webserver. For V(dns-01) the necessary dns record has to be created. For V(tls-alpn-01) the necessary
  certificate has to be created and served. It is I(not) the responsibility of this module to perform
  these steps. For details on how to fulfill these challenges, you might have to read through L(the main
  ACME specification,https://tools.ietf.org/html/rfc8555#section-8) and the L(TLS-ALPN-01 specification,https://www.rfc-editor.org/rfc/rfc8737.html#section-3).
  Also, consider the examples provided for this module. The module includes experimental support for IP
  identifiers according to the L(RFC 8738,https://www.rfc-editor.org/rfc/rfc8738.html).
options:
  account_email:
    type: str
    description: The email address associated with this account. It will be used for certificate expiration
      warnings. Note that when O(modify_account) is not set to V(false) and you also used the M(community.crypto.acme_account)
      module to specify more than one contact for your account, this module will update your account and
      restrict it to the (at most one) contact email address specified here.
  account_key_content:
    type: str
    description: Content of the ACME account RSA or Elliptic Curve key. Mutually exclusive with O(account_key_src).
      Required if O(account_key_src) is not used. B(Warning:) the content will be written into a temporary
      file, which will be deleted by Ansible when the module completes. Since this is an important private
      key — it can be used to change the account key, or to revoke your certificates without knowing their
      private keys —, this might not be acceptable. In case C(cryptography) is used, the content is not
      written into a temporary file. It can still happen that it is written to disk by Ansible in the
      process of moving the module with its argument to the node where it is executed.
  account_key_passphrase:
    type: str
    description: Phassphrase to use to decode the account key. B(Note:) this is not supported by the C(openssl)
      backend, only by the C(cryptography) backend.
  account_key_src:
    type: path
    aliases:
    - account_key
    description: 'Path to a file containing the ACME account RSA or Elliptic Curve key. Private keys can
      be created with the M(community.crypto.openssl_privatekey) or M(community.crypto.openssl_privatekey_pipe)
      modules. If the requisite (cryptography) is not available, keys can also be created directly with
      the C(openssl) command line tool: RSA keys can be created with C(openssl genrsa ...). Elliptic curve
      keys can be created with C(openssl ecparam -genkey ...). Any other tool creating private keys in
      PEM format can be used as well. Mutually exclusive with O(account_key_content). Required if O(account_key_content)
      is not used.'
  account_uri:
    type: str
    description: If specified, assumes that the account URI is as given. If the account key does not match
      this account, or an account with this URI does not exist, the module fails.
  acme_directory:
    type: str
    required: true
    description: 'The ACME directory to use. This is the entry point URL to access the ACME CA server
      API. For safety reasons the default is set to the Let''s Encrypt staging server (for the ACME v1
      protocol). This will create technically correct, but untrusted certificates. For Let''s Encrypt,
      all staging endpoints can be found here: U(https://letsencrypt.org/docs/staging-environment/). For
      Buypass, all endpoints can be found here: U(https://community.buypass.com/t/63d4ay/buypass-go-ssl-endpoints)
      For B(Let''s Encrypt), the production directory URL for ACME v2 is U(https://acme-v02.api.letsencrypt.org/directory).
      For B(Buypass), the production directory URL for ACME v2 and v1 is U(https://api.buypass.com/acme/directory).
      For B(ZeroSSL), the production directory URL for ACME v2 is U(https://acme.zerossl.com/v2/DV90).
      For B(Sectigo), the production directory URL for ACME v2 is U(https://acme-qa.secure.trust-provider.com/v2/DV).
      The notes for this module contain a list of ACME services this module has been tested against.'
  acme_version:
    type: int
    required: true
    choices:
    - 1
    - 2
    description: The ACME version of the endpoint. Must be V(1) for the classic Let's Encrypt and Buypass
      ACME endpoints, or V(2) for standardized ACME v2 endpoints. The value V(1) is deprecated since community.crypto
      2.0.0 and will be removed from community.crypto 3.0.0.
  agreement:
    type: str
    description: URI to a terms of service document you agree to when using the ACME v1 service at O(acme_directory).
      Default is latest gathered from O(acme_directory) URL. This option will only be used when O(acme_version)
      is 1.
  chain_dest:
    type: path
    aliases:
    - chain
    description: If specified, the intermediate certificate will be written to this file.
  challenge:
    type: str
    default: http-01
    choices:
    - http-01
    - dns-01
    - tls-alpn-01
    - no challenge
    description: The challenge to be performed. If set to V(no challenge), no challenge will be used.
      This is necessary for some private CAs which use External Account Binding and other means of validating
      certificate assurance. For example, an account could be allowed to issue certificates for C(foo.example.com)
      without any further validation for a certain period of time.
  csr:
    type: path
    aliases:
    - src
    description: 'File containing the CSR for the new certificate. Can be created with M(community.crypto.openssl_csr)
      or C(openssl req ...). The CSR may contain multiple Subject Alternate Names, but each one will lead
      to an individual challenge that must be fulfilled for the CSR to be signed. I(Note): the private
      key used to create the CSR I(must not) be the account key. This is a bad idea from a security point
      of view, and the CA should not accept the CSR. The ACME server should return an error in this case.
      Precisely one of O(csr) or O(csr_content) must be specified.'
  csr_content:
    type: str
    description: 'Content of the CSR for the new certificate. Can be created with M(community.crypto.openssl_csr_pipe)
      or C(openssl req ...). The CSR may contain multiple Subject Alternate Names, but each one will lead
      to an individual challenge that must be fulfilled for the CSR to be signed. I(Note): the private
      key used to create the CSR I(must not) be the account key. This is a bad idea from a security point
      of view, and the CA should not accept the CSR. The ACME server should return an error in this case.
      Precisely one of O(csr) or O(csr_content) must be specified.'
  data:
    type: dict
    description: 'The data to validate ongoing challenges. This must be specified for the second run of
      the module only. The value that must be used here will be provided by a previous use of this module.
      See the examples for more details. Note that for ACME v2, only the C(order_uri) entry of O(data)
      will be used. For ACME v1, O(data) must be non-empty to indicate the second stage is active; all
      needed data will be taken from the CSR. I(Note): the O(data) option was marked as C(no_log) up to
      Ansible 2.5. From Ansible 2.6 on, it is no longer marked this way as it causes error messages to
      be come unusable, and O(data) does not contain any information which can be used without having
      access to the account key or which are not public anyway.'
  deactivate_authzs:
    type: bool
    default: false
    description: Deactivate authentication objects (authz) after issuing a certificate, or when issuing
      the certificate failed. Authentication objects are bound to an account key and remain valid for
      a certain amount of time, and can be used to issue certificates without having to re-authenticate
      the domain. This can be a security concern.
  dest:
    type: path
    aliases:
    - cert
    description: The destination file for the certificate. Required if O(fullchain_dest) is not specified.
  force:
    type: bool
    default: false
    description: Enforces the execution of the challenge and validation, even if an existing certificate
      is still valid for more than O(remaining_days). This is especially helpful when having an updated
      CSR, for example with additional domains for which a new certificate is desired.
  fullchain_dest:
    type: path
    aliases:
    - fullchain
    description: The destination file for the full chain (that is, a certificate followed by chain of
      intermediate certificates). Required if O(dest) is not specified.
  modify_account:
    type: bool
    default: true
    description: Boolean indicating whether the module should create the account if necessary, and update
      its contact data. Set to V(false) if you want to use the M(community.crypto.acme_account) module
      to manage your account instead, and to avoid accidental creation of a new account using an old key
      if you changed the account key with M(community.crypto.acme_account). If set to V(false), O(terms_agreed)
      and O(account_email) are ignored.
  remaining_days:
    type: int
    default: 10
    description: The number of days the certificate must have left being valid. If RV(cert_days) < O(remaining_days),
      then it will be renewed. If the certificate is not renewed, module return values will not include
      RV(challenge_data). To make sure that the certificate is renewed in any case, you can use the O(force)
      option.
  request_timeout:
    type: int
    default: 10
    description: The time Ansible should wait for a response from the ACME API. This timeout is applied
      to all HTTP(S) requests (HEAD, GET, POST).
  retrieve_all_alternates:
    type: bool
    default: false
    description: When set to V(true), will retrieve all alternate trust chains offered by the ACME CA.
      These will not be written to disk, but will be returned together with the main chain as RV(all_chains).
      See the documentation for the RV(all_chains) return value for details.
  select_chain:
    type: list
    description: Allows to specify criteria by which an (alternate) trust chain can be selected. The list
      of criteria will be processed one by one until a chain is found matching a criterium. If such a
      chain is found, it will be used by the module instead of the default chain. If a criterium matches
      multiple chains, the first one matching will be returned. The order is determined by the ordering
      of the C(Link) headers returned by the ACME server and might not be deterministic. Every criterium
      can consist of multiple different conditions, like O(select_chain[].issuer) and O(select_chain[].subject).
      For the criterium to match a chain, all conditions must apply to the same certificate in the chain.
      This option can only be used with the C(cryptography) backend.
  select_crypto_backend:
    type: str
    default: auto
    choices:
    - auto
    - cryptography
    - openssl
    description: Determines which crypto backend to use. The default choice is V(auto), which tries to
      use C(cryptography) if available, and falls back to C(openssl). If set to V(openssl), will try to
      use the C(openssl) binary. If set to V(cryptography), will try to use the L(cryptography,https://cryptography.io/)
      library.
  terms_agreed:
    type: bool
    default: false
    description: Boolean indicating whether you agree to the terms of service document. ACME servers can
      require this to be true. This option will only be used when O(acme_version) is not 1.
  validate_certs:
    type: bool
    default: true
    description: Whether calls to the ACME directory will validate TLS certificates. B(Warning:) Should
      B(only ever) be set to V(false) for testing purposes, for example when testing against a local Pebble
      server.
writes: true
runtime: starlark
source: translated
examples: "\n### Example with HTTP challenge ###\n\n- name: Create a challenge for sample.com using a\
  \ account key from a variable.\n  community.crypto.acme_certificate:\n    account_key_content: \"{{\
  \ account_private_key }}\"\n    csr: /etc/pki/cert/csr/sample.com.csr\n    dest: /etc/httpd/ssl/sample.com.crt\n\
  \  register: sample_com_challenge\n\n# Alternative first step:\n- name: Create a challenge for sample.com\
  \ using a account key from Hashi Vault.\n  community.crypto.acme_certificate:\n    account_key_content:\
  \ >-\n      {{ lookup('community.hashi_vault.hashi_vault', 'secret=secret/account_private_key:value')\
  \ }}\n    csr: /etc/pki/cert/csr/sample.com.csr\n    fullchain_dest: /etc/httpd/ssl/sample.com-fullchain.crt\n\
  \  register: sample_com_challenge\n\n# Alternative first step:\n- name: Create a challenge for sample.com\
  \ using a account key file.\n  community.crypto.acme_certificate:\n    account_key_src: /etc/pki/cert/private/account.key\n\
  \    csr_content: \"{{ lookup('file', '/etc/pki/cert/csr/sample.com.csr') }}\"\n    dest: /etc/httpd/ssl/sample.com.crt\n\
  \    fullchain_dest: /etc/httpd/ssl/sample.com-fullchain.crt\n  register: sample_com_challenge\n\n#\
  \ perform the necessary steps to fulfill the challenge\n# for example:\n#\n# - name: Copy http-01 challenge\
  \ for sample.com\n#   ansible.builtin.copy:\n#     dest: /var/www/html/{{ sample_com_challenge['challenge_data']['sample.com']['http-01']['resource']\
  \ }}\n#     content: \"{{ sample_com_challenge['challenge_data']['sample.com']['http-01']['resource_value']\
  \ }}\"\n#   when: sample_com_challenge is changed and 'sample.com' in sample_com_challenge['challenge_data']\n\
  #\n# Alternative way:\n#\n# - name: Copy http-01 challenges\n#   ansible.builtin.copy:\n#     dest:\
  \ /var/www/{{ item.key }}/{{ item.value['http-01']['resource'] }}\n#     content: \"{{ item.value['http-01']['resource_value']\
  \ }}\"\n#   loop: \"{{ sample_com_challenge.challenge_data | dict2items }}\"\n#   when: sample_com_challenge\
  \ is changed\n\n- name: Let the challenge be validated and retrieve the cert and intermediate certificate\n\
  \  community.crypto.acme_certificate:\n    account_key_src: /etc/pki/cert/private/account.key\n    csr:\
  \ /etc/pki/cert/csr/sample.com.csr\n    dest: /etc/httpd/ssl/sample.com.crt\n    fullchain_dest: /etc/httpd/ssl/sample.com-fullchain.crt\n\
  \    chain_dest: /etc/httpd/ssl/sample.com-intermediate.crt\n    data: \"{{ sample_com_challenge }}\"\
  \n\n### Example with DNS challenge against production ACME server ###\n\n- name: Create a challenge\
  \ for sample.com using a account key file.\n  community.crypto.acme_certificate:\n    account_key_src:\
  \ /etc/pki/cert/private/account.key\n    account_email: myself@sample.com\n    src: /etc/pki/cert/csr/sample.com.csr\n\
  \    cert: /etc/httpd/ssl/sample.com.crt\n    challenge: dns-01\n    acme_directory: https://acme-v01.api.letsencrypt.org/directory\n\
  \    # Renew if the certificate is at least 30 days old\n    remaining_days: 60\n  register: sample_com_challenge\n\
  \n# perform the necessary steps to fulfill the challenge\n# for example:\n#\n# - name: Create DNS record\
  \ for sample.com dns-01 challenge\n#   community.aws.route53:\n#     zone: sample.com\n#     record:\
  \ \"{{ sample_com_challenge.challenge_data['sample.com']['dns-01'].record }}\"\n#     type: TXT\n# \
  \    ttl: 60\n#     state: present\n#     wait: true\n#     # Note: route53 requires TXT entries to\
  \ be enclosed in quotes\n#     value: \"{{ sample_com_challenge.challenge_data['sample.com']['dns-01'].resource_value\
  \ | regex_replace('^(.*)$', '\\\"\\\\1\\\"') }}\"\n#   when: sample_com_challenge is changed and 'sample.com'\
  \ in sample_com_challenge.challenge_data\n#\n# Alternative way:\n#\n# - name: Create DNS records for\
  \ dns-01 challenges\n#   community.aws.route53:\n#     zone: sample.com\n#     record: \"{{ item.key\
  \ }}\"\n#     type: TXT\n#     ttl: 60\n#     state: present\n#     wait: true\n#     # Note: item.value\
  \ is a list of TXT entries, and route53\n#     # requires every entry to be enclosed in quotes\n#  \
  \   value: \"{{ item.value | map('regex_replace', '^(.*)$', '\\\"\\\\1\\\"' ) | list }}\"\n#   loop:\
  \ \"{{ sample_com_challenge.challenge_data_dns | dict2items }}\"\n#   when: sample_com_challenge is\
  \ changed\n\n- name: Let the challenge be validated and retrieve the cert and intermediate certificate\n\
  \  community.crypto.acme_certificate:\n    account_key_src: /etc/pki/cert/private/account.key\n    account_email:\
  \ myself@sample.com\n    src: /etc/pki/cert/csr/sample.com.csr\n    cert: /etc/httpd/ssl/sample.com.crt\n\
  \    fullchain: /etc/httpd/ssl/sample.com-fullchain.crt\n    chain: /etc/httpd/ssl/sample.com-intermediate.crt\n\
  \    challenge: dns-01\n    acme_directory: https://acme-v01.api.letsencrypt.org/directory\n    remaining_days:\
  \ 60\n    data: \"{{ sample_com_challenge }}\"\n  when: sample_com_challenge is changed\n\n# Alternative\
  \ second step:\n- name: Let the challenge be validated and retrieve the cert and intermediate certificate\n\
  \  community.crypto.acme_certificate:\n    account_key_src: /etc/pki/cert/private/account.key\n    account_email:\
  \ myself@sample.com\n    src: /etc/pki/cert/csr/sample.com.csr\n    cert: /etc/httpd/ssl/sample.com.crt\n\
  \    fullchain: /etc/httpd/ssl/sample.com-fullchain.crt\n    chain: /etc/httpd/ssl/sample.com-intermediate.crt\n\
  \    challenge: tls-alpn-01\n    remaining_days: 60\n    data: \"{{ sample_com_challenge }}\"\n    #\
  \ We use Let's Encrypt's ACME v2 endpoint\n    acme_directory: https://acme-v02.api.letsencrypt.org/directory\n\
  \    acme_version: 2\n    # The following makes sure that if a chain with /CN=DST Root CA X3 in its\
  \ issuer is provided\n    # as an alternative, it will be selected. These are the roots cross-signed\
  \ by IdenTrust.\n    # As long as Let's Encrypt provides alternate chains with the cross-signed root(s)\
  \ when\n    # switching to their own ISRG Root X1 root, this will use the chain ending with a cross-signed\n\
  \    # root. This chain is more compatible with older TLS clients.\n    select_chain:\n      - test_certificates:\
  \ last\n        issuer:\n          CN: DST Root CA X3\n          O: Digital Signature Trust Co.\n  when:\
  \ sample_com_challenge is changed\n"
