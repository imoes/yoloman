name: acme_inspect
fqcn: community.crypto.acme_inspect
collection: community.crypto
short_description: Send direct requests to an ACME server
description: Allows to send direct requests to an ACME server with the L(ACME protocol,https://tools.ietf.org/html/rfc8555),
  which is supported by CAs such as L(Let's Encrypt,https://letsencrypt.org/). This module can be used
  to debug failed certificate request attempts, for example when M(community.crypto.acme_certificate)
  fails or encounters a problem which you wish to investigate. The module can also be used to directly
  access features of an ACME servers which are not yet supported by the Ansible ACME modules.
options:
  account_key_content:
    type: str
    description: Content of the ACME account RSA or Elliptic Curve key. Mutually exclusive with O(account_key_src).
      Required if O(account_key_src) is not used. B(Warning:) the content will be written into a temporary
      file, which will be deleted by Ansible when the module completes. Since this is an important private
      key — it can be used to change the account key, or to revoke your certificates without knowing their
      private keys —, this might not be acceptable. In case C(cryptography) is used, the content is not
      written into a temporary file. It can still happen that it is written to disk by Ansible in the
      process of moving the module with its argument to the node where it is executed.
  account_key_passphrase:
    type: str
    description: Phassphrase to use to decode the account key. B(Note:) this is not supported by the C(openssl)
      backend, only by the C(cryptography) backend.
  account_key_src:
    type: path
    aliases:
    - account_key
    description: 'Path to a file containing the ACME account RSA or Elliptic Curve key. Private keys can
      be created with the M(community.crypto.openssl_privatekey) or M(community.crypto.openssl_privatekey_pipe)
      modules. If the requisite (cryptography) is not available, keys can also be created directly with
      the C(openssl) command line tool: RSA keys can be created with C(openssl genrsa ...). Elliptic curve
      keys can be created with C(openssl ecparam -genkey ...). Any other tool creating private keys in
      PEM format can be used as well. Mutually exclusive with O(account_key_content). Required if O(account_key_content)
      is not used.'
  account_uri:
    type: str
    description: If specified, assumes that the account URI is as given. If the account key does not match
      this account, or an account with this URI does not exist, the module fails.
  acme_directory:
    type: str
    required: true
    description: 'The ACME directory to use. This is the entry point URL to access the ACME CA server
      API. For safety reasons the default is set to the Let''s Encrypt staging server (for the ACME v1
      protocol). This will create technically correct, but untrusted certificates. For Let''s Encrypt,
      all staging endpoints can be found here: U(https://letsencrypt.org/docs/staging-environment/). For
      Buypass, all endpoints can be found here: U(https://community.buypass.com/t/63d4ay/buypass-go-ssl-endpoints)
      For B(Let''s Encrypt), the production directory URL for ACME v2 is U(https://acme-v02.api.letsencrypt.org/directory).
      For B(Buypass), the production directory URL for ACME v2 and v1 is U(https://api.buypass.com/acme/directory).
      For B(ZeroSSL), the production directory URL for ACME v2 is U(https://acme.zerossl.com/v2/DV90).
      For B(Sectigo), the production directory URL for ACME v2 is U(https://acme-qa.secure.trust-provider.com/v2/DV).
      The notes for this module contain a list of ACME services this module has been tested against.'
  acme_version:
    type: int
    required: true
    choices:
    - 1
    - 2
    description: The ACME version of the endpoint. Must be V(1) for the classic Let's Encrypt and Buypass
      ACME endpoints, or V(2) for standardized ACME v2 endpoints. The value V(1) is deprecated since community.crypto
      2.0.0 and will be removed from community.crypto 3.0.0.
  content:
    type: str
    description: An encoded JSON object which will be sent as the content if O(method) is V(post). Required
      when O(method) is V(post), and not allowed otherwise.
  fail_on_acme_error:
    type: bool
    default: true
    description: If O(method) is V(post) or V(get), make the module fail in case an ACME error is returned.
  method:
    type: str
    default: get
    choices:
    - get
    - post
    - directory-only
    description: The method to use to access the given URL on the ACME server. The value V(post) executes
      an authenticated POST request. The content must be specified in the O(content) option. The value
      V(get) executes an authenticated POST-as-GET request for ACME v2, and a regular GET request for
      ACME v1. The value V(directory-only) only retrieves the directory, without doing a request.
  request_timeout:
    type: int
    default: 10
    description: The time Ansible should wait for a response from the ACME API. This timeout is applied
      to all HTTP(S) requests (HEAD, GET, POST).
  select_crypto_backend:
    type: str
    default: auto
    choices:
    - auto
    - cryptography
    - openssl
    description: Determines which crypto backend to use. The default choice is V(auto), which tries to
      use C(cryptography) if available, and falls back to C(openssl). If set to V(openssl), will try to
      use the C(openssl) binary. If set to V(cryptography), will try to use the L(cryptography,https://cryptography.io/)
      library.
  url:
    type: str
    description: The URL to send the request to. Must be specified if O(method) is not V(directory-only).
  validate_certs:
    type: bool
    default: true
    description: Whether calls to the ACME directory will validate TLS certificates. B(Warning:) Should
      B(only ever) be set to V(false) for testing purposes, for example when testing against a local Pebble
      server.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Get directory\n  community.crypto.acme_inspect:\n    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n\
  \    acme_version: 2\n    method: directory-only\n  register: directory\n\n- name: Create an account\n\
  \  community.crypto.acme_inspect:\n    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n\
  \    acme_version: 2\n    account_key_src: /etc/pki/cert/private/account.key\n    url: \"{{ directory.newAccount}}\"\
  \n    method: post\n    content: '{\"termsOfServiceAgreed\":true}'\n  register: account_creation\n \
  \ # account_creation.headers.location contains the account URI\n  # if creation was successful\n\n-\
  \ name: Get account information\n  community.crypto.acme_inspect:\n    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n\
  \    acme_version: 2\n    account_key_src: /etc/pki/cert/private/account.key\n    account_uri: \"{{\
  \ account_creation.headers.location }}\"\n    url: \"{{ account_creation.headers.location }}\"\n   \
  \ method: get\n\n- name: Update account contacts\n  community.crypto.acme_inspect:\n    acme_directory:\
  \ https://acme-staging-v02.api.letsencrypt.org/directory\n    acme_version: 2\n    account_key_src:\
  \ /etc/pki/cert/private/account.key\n    account_uri: \"{{ account_creation.headers.location }}\"\n\
  \    url: \"{{ account_creation.headers.location }}\"\n    method: post\n    content: '{{ account_info\
  \ | to_json }}'\n  vars:\n    account_info:\n      # For valid values, see\n      # https://tools.ietf.org/html/rfc8555#section-7.3\n\
  \      contact:\n      - mailto:me@example.com\n\n- name: Create certificate order\n  community.crypto.acme_certificate:\n\
  \    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n    acme_version: 2\n \
  \   account_key_src: /etc/pki/cert/private/account.key\n    account_uri: \"{{ account_creation.headers.location\
  \ }}\"\n    csr: /etc/pki/cert/csr/sample.com.csr\n    fullchain_dest: /etc/httpd/ssl/sample.com-fullchain.crt\n\
  \    challenge: http-01\n  register: certificate_request\n\n# Assume something went wrong. certificate_request.order_uri\
  \ contains\n# the order URI.\n\n- name: Get order information\n  community.crypto.acme_inspect:\n  \
  \  acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n    acme_version: 2\n   \
  \ account_key_src: /etc/pki/cert/private/account.key\n    account_uri: \"{{ account_creation.headers.location\
  \ }}\"\n    url: \"{{ certificate_request.order_uri }}\"\n    method: get\n  register: order\n\n- name:\
  \ Get first authz for order\n  community.crypto.acme_inspect:\n    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n\
  \    acme_version: 2\n    account_key_src: /etc/pki/cert/private/account.key\n    account_uri: \"{{\
  \ account_creation.headers.location }}\"\n    url: \"{{ order.output_json.authorizations[0] }}\"\n \
  \   method: get\n  register: authz\n\n- name: Get HTTP-01 challenge for authz\n  community.crypto.acme_inspect:\n\
  \    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n    acme_version: 2\n \
  \   account_key_src: /etc/pki/cert/private/account.key\n    account_uri: \"{{ account_creation.headers.location\
  \ }}\"\n    url: \"{{ authz.output_json.challenges | selectattr('type', 'equalto', 'http-01') }}\"\n\
  \    method: get\n  register: http01challenge\n\n- name: Activate HTTP-01 challenge manually\n  community.crypto.acme_inspect:\n\
  \    acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory\n    acme_version: 2\n \
  \   account_key_src: /etc/pki/cert/private/account.key\n    account_uri: \"{{ account_creation.headers.location\
  \ }}\"\n    url: \"{{ http01challenge.url }}\"\n    method: post\n    content: '{}'\n"
