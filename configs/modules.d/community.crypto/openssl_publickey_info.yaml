name: openssl_publickey_info
fqcn: community.crypto.openssl_publickey_info
collection: community.crypto
short_description: Provide information for OpenSSL public keys
description: This module allows one to query information on OpenSSL public keys. It uses the cryptography
  python library to interact with OpenSSL.
options:
  content:
    type: str
    description: Content of the public key file. Either O(path) or O(content) must be specified, but not
      both.
  path:
    type: path
    description: Remote absolute path where the public key file is loaded from.
  select_crypto_backend:
    type: str
    default: auto
    choices:
    - auto
    - cryptography
    description: Determines which crypto backend to use. The default choice is V(auto), which tries to
      use C(cryptography) if available. If set to V(cryptography), will try to use the L(cryptography,https://cryptography.io/)
      library.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Generate an OpenSSL private key with the default values (4096 bits, RSA)\n  community.crypto.openssl_privatekey:\n\
  \    path: /etc/ssl/private/ansible.com.pem\n\n- name: Create public key from private key\n  community.crypto.openssl_publickey:\n\
  \    privatekey_path: /etc/ssl/private/ansible.com.pem\n    path: /etc/ssl/ansible.com.pub\n\n- name:\
  \ Get information on public key\n  community.crypto.openssl_publickey_info:\n    path: /etc/ssl/ansible.com.pub\n\
  \  register: result\n\n- name: Dump information\n  ansible.builtin.debug:\n    var: result\n"
