name: package_facts
fqcn: builtin.package_facts
collection: builtin
short_description: Enumerate every package installed on the host (name, version, architecture)
description: 'Enumerate every package installed on the host (name, version, architecture).
  Uses dpkg on Debian/Ubuntu and falls back to rpm on RHEL/Fedora-family systems.
  Takes no parameters — it always returns the full list; filter client-side for a
  specific package. Use this to check whether a desired package is already at the
  right version before deciding to call the write-gated `apt`/`package` module.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.package_facts (with use=apt). Same underlying dpkg query;
  result shape mirrors ansible_facts[''packages''].

  - Chef: the Ohai `packages` plugin (node[''packages'']).

  - Puppet: Facter''s package facts, or `puppet resource package`.

  - Salt: the `pkg.list_pkgs` execution module.

  - Terraform: not applicable — Terraform does not introspect installed packages on
  a running host; package presence is normally asserted, not queried, via a provisioner.'
options: {}
native: true
writes: false
runtime: native
source: agent-registry
