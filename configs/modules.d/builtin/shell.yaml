description: 'Run a command line through a real shell interpreter (pipes, redirects,
  globbing, `$()` substitution, env var expansion all work, exactly like a real shell
  prompt) — the ONE deliberate exception to this agent''s normal "no shell, argv only"
  execution model (see command/raw). **Because of that, this tool has no injection
  protection**: whatever `cmd` contains is interpreted by the shell verbatim. Never
  pass untrusted or externally-influenced text into `cmd` — prefer `command`/`raw`
  (argv, no shell involved) or the agent''s separate whitelisted pipeline tool whenever
  shell syntax isn''t actually needed. Returns rc/stdout/stderr; **a non-zero rc is
  not raised as a tool error** — check data.rc yourself. Cannot verify idempotency
  for an arbitrary shell command, so it always reports changed=true once it actually
  runs; under check_mode (dry_run=true) it does not run at all and reports changed=true
  as a prediction only, matching Ansible''s default of skipping command/shell tasks
  during --check.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.shell. Same cmd/executable/chdir parameter names.

  - Chef: the `bash`/`execute` resources with `user`-supplied shell syntax.

  - Puppet: the `exec` type with `provider => shell`.

  - Salt: the `cmd.run` execution module / state (shell=True equivalent).

  - Terraform: a `null_resource` with a `local-exec`/`remote-exec` provisioner.'
options:
  chdir:
    type: string
    description: Optional working directory to run the command in.
  cmd:
    type: string
    description: Full shell command line, interpreted verbatim by executable, e.g.
      "ps aux | grep nginx | wc -l".
    required: true
  executable:
    type: string
    description: Shell to run cmd through. Default "/bin/sh".
native: true
writes: true
runtime: native
source: agent-registry
