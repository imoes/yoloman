name: yum
fqcn: builtin.yum
collection: builtin
short_description: Ensure one or more RPM packages are present, absent, or upgraded
  to the latest available version, via yum
description: 'Ensure one or more RPM packages are present, absent, or upgraded to
  the latest available version, via yum. Idempotent: queries the rpm database''s current
  status before deciding whether to act. Unit-tested only in this project (no RPM-based
  host in the real verification environment — contrast with apt, this agent''s real-tested
  primary target). Supports check_mode via dry_run=true, with one caveat: for state=latest,
  dry_run against an already-installed package conservatively predicts changed=true,
  since determining whether a newer version is truly available would itself require
  a repository query.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.yum. Same name/state parameter names (name accepts either
  a single package or a list); a focused subset — Ansible''s own module also supports
  enablerepo/disablerepo/update_cache and more, not yet implemented here.

  - Chef: the `yum_package`/`package` resources.

  - Puppet: the `package` type with `provider => yum`.

  - Salt: the `pkg.installed`/`pkg.removed`/`pkg.latest` states.

  - Terraform: not applicable — Terraform does not manage OS packages on a running
  host.'
options:
  name:
    type: list
    description: One or more package names, e.g. ["httpd"] or ["httpd", "curl"].
    required: true
  state:
    type: string
    choices:
    - present
    - absent
    - latest
    description: Desired package state. Default "present".
native: true
writes: true
runtime: native
source: agent-registry
