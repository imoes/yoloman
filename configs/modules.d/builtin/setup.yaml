name: setup
fqcn: builtin.setup
collection: builtin
short_description: 'Gather baseline facts about this host: hostname, kernel release,
  CPU architecture, Linux distribution/version, total memory (MB), and logical CPU
  count'
description: 'Gather baseline facts about this host: hostname, kernel release, CPU
  architecture, Linux distribution/version, total memory (MB), and logical CPU count.
  Takes no parameters. Call this first when reconciling any desired-state description
  against a real machine — it is the starting point for the ''read current state''
  step before planning changes.


  Cross-tool equivalents (use this mapping to translate other formats into agentic-mcp
  calls):

  - Ansible: ansible.builtin.setup / the automatic ''gather_facts'' step at play start.
  Native keys use the yoloman_ prefix (yoloman_hostname, yoloman_kernel, yoloman_architecture,
  yoloman_distribution, yoloman_distribution_version, yoloman_memtotal_mb, yoloman_processor_vcpus);
  the ansible_ keys are also returned as compat aliases for imported Ansible content.

  - Chef: the automatic Ohai run that populates node attributes (node[''hostname''],
  node[''kernel''], node[''platform''], node[''platform_version''], node[''memory''][''total''],
  node[''cpu''][''total'']).

  - Puppet: Facter facts available as top-scope variables ($facts[''networking''][''hostname''],
  $facts[''kernelrelease''], $facts[''os''][''name''], $facts[''os''][''release''][''full''],
  $facts[''memory''][''system''][''total''], $facts[''processors''][''count'']).

  - Salt: grains (grains[''host''], grains[''kernelrelease''], grains[''os''], grains[''osrelease''],
  grains[''mem_total''], grains[''num_cpus'']).

  - Terraform: has no direct remote-facts equivalent (Terraform is declarative and
  provider-driven); the closest analogues are a provider''s computed data source attributes
  or an `external`/`http` data source that shells out to gather machine facts before
  apply.'
options: {}
native: true
writes: false
runtime: native
