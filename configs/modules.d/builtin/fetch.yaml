name: fetch
fqcn: builtin.fetch
collection: builtin
short_description: Read a file's entire contents from this host, returned base64-encoded
description: 'Read a file''s entire contents from this host, returned base64-encoded.
  In real Ansible, fetch copies a file FROM the managed host TO the separate machine
  running Ansible; this agent has no such separate control-node filesystem, so fetch
  and slurp (see that tool) are the same operation here — use whichever name matches
  the task syntax you''re translating from.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.fetch. Same intent (retrieve a file''s content), different
  parameter name (`src` here vs. `dest` being irrelevant since there''s no separate
  destination filesystem to copy into).

  - Chef/Puppet/Salt/Terraform: see slurp''s description — the underlying operation
  (read a live file''s content) is identical.'
options:
  src:
    type: string
    description: File to read, e.g. "/etc/nginx/nginx.conf".
    required: true
native: true
writes: false
runtime: native
source: agent-registry
