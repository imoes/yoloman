name: set_fact
fqcn: builtin.set_fact
collection: builtin
short_description: Set variables for the rest of the run (ansible.builtin.set_fact)
description: 'Set variables for the rest of the run (ansible.builtin.set_fact). Pass
  the facts as free-form key: value parameters (values may reference {{ other_vars
  }}, substituted by the controller first). Read-only with respect to the host — it
  changes only the run''s variable namespace via the returned yoloman_facts. `cacheable`
  is accepted and ignored.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.set_fact.

  - Salt: a `grains.set` (persisted) or a jinja `{% set %}` (transient).

  - Chef: `node.default[''x''] = ...` / `node.run_state`.

  - Puppet: a variable assignment `$x = ...`.'
options:
  cacheable:
    type: bool
    default: false
    description: Persist across runs (accepted, no-op here).
native: true
writes: false
runtime: native
source: agent-registry
