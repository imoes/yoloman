name: hostname
fqcn: builtin.hostname
collection: builtin
short_description: Ensure the system's hostname matches a desired value, using hostnamectl
  (systemd-based Linux, like the rest of this agent)
description: 'Ensure the system''s hostname matches a desired value, using hostnamectl
  (systemd-based Linux, like the rest of this agent). Idempotent — compares the current
  kernel hostname first and only calls hostnamectl when it differs. Supports check_mode
  via dry_run=true.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.hostname. Same name parameter; Ansible supports multiple
  per-distro strategies (systemd/redhat/debian/...), this module only implements the
  systemd (hostnamectl) strategy.

  - Chef: no single built-in resource; typically a `execute` resource wrapping hostnamectl,
  or the community ''hostname'' cookbook.

  - Puppet: no core equivalent; augeasproviders or an `exec` wrapping hostnamectl.

  - Salt: the `network.system` state''s `hostname` parameter, or the `system.set_computer_desc`-style
  execution modules.

  - Terraform: not applicable — Terraform does not manage a running host''s kernel
  state.'
options:
  name:
    type: string
    description: Desired hostname, e.g. "web01.example.com".
    required: true
native: true
writes: true
runtime: native
source: agent-registry
