name: service
fqcn: builtin.service
collection: builtin
short_description: Alias of the systemd module under Ansible's more commonly used
  generic module name
description: Alias of the systemd module under Ansible's more commonly used generic
  module name. ansible.builtin.service dispatches to systemd, sysvinit, upstart, or
  other init systems depending on the target's facts; this agent only targets systemd-based
  Linux, so `service` and `systemd` behave identically here. See the systemd module's
  description for full parameter and cross-tool details.
options:
  enabled:
    type: bool
    default: false
    description: Whether the unit should start at boot. Omit to leave the current
      enabled state untouched.
  name:
    type: string
    description: Unit name, e.g. "nginx" or "nginx.service" (the .service suffix is
      added automatically if omitted).
    required: true
  state:
    type: string
    choices:
    - started
    - stopped
    - restarted
    - reloaded
    description: Desired running state. Omit to only manage "enabled" without touching
      running state.
native: true
writes: true
runtime: native
source: agent-registry
