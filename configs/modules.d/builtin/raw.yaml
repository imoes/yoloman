name: raw
fqcn: builtin.raw
collection: builtin
short_description: Alias of the command module under Ansible's bootstrap-execution
  module name
description: 'Alias of the command module under Ansible''s bootstrap-execution module
  name. Real Ansible''s raw module runs a command over SSH on a target with no Python
  installed yet, bypassing the normal module subsystem — a bootstrapping mechanism
  for otherwise-unmanageable hosts. This agent has no such problem: it is a single
  compiled Go binary with no separate module-transfer step, so raw and command behave
  identically here. See the command module''s description for full parameter and cross-tool
  details.'
options:
  argv:
    type: list
    description: Explicit argument vector, e.g. ["mkdir", "-p", "/opt/my app"] — required
      whenever an argument contains spaces. Mutually exclusive with cmd.
  chdir:
    type: string
    description: Optional working directory to run the command in.
  cmd:
    type: string
    description: Plain command line, split on whitespace (no quoting), e.g. "systemctl
      daemon-reload". Mutually exclusive with argv.
native: true
writes: true
runtime: native
source: agent-registry
