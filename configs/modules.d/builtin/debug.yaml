name: debug
fqcn: builtin.debug
collection: builtin
short_description: Emit a message during a run (ansible.builtin.debug)
description: 'Emit a message during a run (ansible.builtin.debug). `msg` is the text
  to show; {{ vars }} are substituted by the controller before the call, so pass the
  rendered message. Always read-only, never changes host state. Returns {"msg": <text>}.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.debug (msg form).

  - Salt: `test.echo` / a `debug` log statement.

  - Chef: `log ''message''`.

  - Puppet: `notify { ''message'': }`.'
options:
  msg:
    type: string
    description: The message to print (any type; rendered to text).
  var:
    type: string
    description: A variable name to dump — normally rewritten to msg by the translator.
  verbosity:
    type: number
    default: 0
    description: Only show at or above this -v level (accepted; always shown here).
native: true
writes: false
runtime: native
source: agent-registry
