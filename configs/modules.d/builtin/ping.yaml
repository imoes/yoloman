name: ping
fqcn: builtin.ping
collection: builtin
short_description: Trivial connectivity/health check — call it to confirm this agent
  is reachable and responding
description: 'Trivial connectivity/health check — call it to confirm this agent is
  reachable and responding. Takes no parameters, always succeeds, returns {"ping":
  "pong"}.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.ping. Ansible''s real ping also confirms a usable Python
  interpreter on the managed host; this agent has no separate interpreter to verify
  — a successful tool call response is itself the proof.

  - Chef: `knife ssh <host> ''echo pong''`, or simply a successful `chef-client` run.

  - Puppet: `puppet agent --test` completing, or a successful catalog compile.

  - Salt: the `test.ping` execution module.

  - Terraform: not applicable — Terraform has no live-connectivity health-check primitive
  of its own.'
options: {}
native: true
writes: false
runtime: native
source: agent-registry
