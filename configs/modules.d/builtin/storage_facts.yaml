name: storage_facts
fqcn: builtin.storage_facts
collection: builtin
short_description: 'Gather a read-only storage overview of the host: block devices
  (lsblk), LVM physical volumes / volume groups / logical volumes (pvs/vgs/lvs), and
  VDO volumes (vdostats)'
description: 'Gather a read-only storage overview of the host: block devices (lsblk),
  LVM physical volumes / volume groups / logical volumes (pvs/vgs/lvs), and VDO volumes
  (vdostats). Returns {block_devices, lvm, vdo}, each with an `available` flag that
  is false (plus an `error`) when the underlying tool is absent or fails — so it never
  crashes on a host without LVM/VDO. Read-only: always changed=false. Pairs with the
  write-gated community.general lvg/lvol/vdo modules for management, and with zfs_facts/zpool_facts
  for ZFS (not covered here). Use it as the Storage section of the host-management
  page and as an MCP tool.


  Cross-tool equivalents: no single Ansible module covers all three; this aggregates
  what `ansible.builtin.setup`''s device facts, community.general.lvg/lvol, and vdostats
  expose.'
options: {}
native: true
writes: false
runtime: native
source: agent-registry
