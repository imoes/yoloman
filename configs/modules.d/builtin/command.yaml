name: command
fqcn: builtin.command
collection: builtin
short_description: Run an arbitrary command with no shell involved — no pipes, redirects,
  globbing, or variable substitution, exactly like ansible.builtin.command (use the
  agent's separate pipeline tool, not this one, w
description: 'Run an arbitrary command with no shell involved — no pipes, redirects,
  globbing, or variable substitution, exactly like ansible.builtin.command (use the
  agent''s separate pipeline tool, not this one, when you actually need `cmd1 | cmd2`).
  Provide either `cmd` (a plain command line, split on whitespace — no quoting support)
  or the explicit `argv` array (preferred whenever an argument contains spaces or
  special characters). Returns rc/stdout/stderr; **a non-zero rc is not raised as
  a tool error** — check data.rc yourself to determine success. This module cannot
  verify idempotency for an arbitrary command, so it always reports changed=true once
  it actually runs; under check_mode (dry_run=true) it does not run at all and reports
  changed=true as a prediction only, matching Ansible''s default of skipping command/shell
  tasks during --check.


  Cross-tool equivalents:

  - Ansible: ansible.builtin.command (and, for genuinely shell-requiring cases, ansible.builtin.shell
  — not implemented here; use the pipeline tool instead).

  - Chef: the `execute` resource.

  - Puppet: the `exec` type.

  - Salt: the `cmd.run` execution module / `cmd.run` state.

  - Terraform: a `null_resource` with a `local-exec`/`remote-exec` provisioner.'
options:
  argv:
    type: list
    description: Explicit argument vector, e.g. ["mkdir", "-p", "/opt/my app"] — required
      whenever an argument contains spaces. Mutually exclusive with cmd.
  chdir:
    type: string
    description: Optional working directory to run the command in.
  cmd:
    type: string
    description: Plain command line, split on whitespace (no quoting), e.g. "systemctl
      daemon-reload". Mutually exclusive with argv.
native: true
writes: true
runtime: native
source: agent-registry
