description: 'Detect the host''s local virtualization stack(s) and list their guests:
  Proxmox VE (via the `qm list` / `pct list` CLIs — QEMU VMs and LXC containers) and
  libvirt/KVM (via `virsh list --all` — domains). Returns {proxmox:{available,vms,containers},
  libvirt:{available,domains}, hypervisors:[...]}, where each stack''s `available`
  is false (with an `error`) when its CLI is absent — so it never fails on a non-hypervisor
  host. Read-only (changed=false). Pair with the write-gated `qm` / `virsh` modules
  to control a guest. Use it to answer ''is this a Proxmox node or a KVM host, and
  what is running on it''.


  Note: this is LOCAL node management via the on-host CLIs, distinct from the community.general.proxmox_*
  modules which drive a Proxmox cluster remotely over its API.'
options: {}
native: true
writes: false
runtime: native
source: agent-registry
