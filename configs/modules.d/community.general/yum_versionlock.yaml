name: yum_versionlock
fqcn: community.general.yum_versionlock
collection: community.general
short_description: Locks / unlocks a installed package(s) from being updated by yum package manager
description: This module adds installed packages to yum versionlock to prevent the package(s) from being
  updated.
options:
  name:
    type: list
    required: true
    description: Package name or a list of package names with optional version or wildcards. Specifying
      versions is supported since community.general 7.2.0.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: If state is V(present), package(s) will be added to yum versionlock list. If state is
      V(absent), package(s) will be removed from yum versionlock list.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Prevent Apache / httpd from being updated\n  community.general.yum_versionlock:\n\
  \    state: present\n    name:\n    - httpd\n\n- name: Prevent Apache / httpd version 2.4.57-2 from\
  \ being updated\n  community.general.yum_versionlock:\n    state: present\n    name:\n    - httpd-0:2.4.57-2.el9\n\
  \n- name: Prevent multiple packages from being updated\n  community.general.yum_versionlock:\n    state:\
  \ present\n    name:\n    - httpd\n    - nginx\n    - haproxy\n    - curl\n\n- name: Remove lock from\
  \ Apache / httpd to be updated again\n  community.general.yum_versionlock:\n    state: absent\n    name:\
  \ httpd\n"
