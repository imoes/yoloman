name: smartos_image_info
fqcn: community.general.smartos_image_info
collection: community.general
short_description: Get SmartOS image details
description: Retrieve information about all installed images on SmartOS.
options:
  filters:
    type: str
    description: Criteria for selecting image. Can be any value from image manifest and C(published_date),
      C(published), C(source), C(clones), and C(size). More information can be found at U(https://smartos.org/man/1m/imgadm)
      under C(imgadm list).
writes: false
runtime: starlark
source: translated
examples: "\n- name: Return information about all installed images\n  community.general.smartos_image_info:\n\
  \  register: result\n\n- name: Return all private active Linux images\n  community.general.smartos_image_info:\n\
  \    filters: \"os=linux state=active public=false\"\n  register: result\n\n- name: Show, how many clones\
  \ does every image have\n  community.general.smartos_image_info:\n  register: result\n\n- name: Print\
  \ information\n  ansible.builtin.debug:\n    msg: \"{{ result.smartos_images[item]['name'] }}-{{ result.smartos_images[item]['version']\
  \ }}\n         has {{ result.smartos_images[item]['clones'] }} VM(s)\"\n  with_items: \"{{ result.smartos_images.keys()\
  \ | list }}\"\n\n- name: Print information\n  ansible.builtin.debug:\n    msg: \"{{ smartos_images[item]['name']\
  \ }}-{{ smartos_images[item]['version'] }}\n         has {{ smartos_images[item]['clones'] }} VM(s)\"\
  \n  with_items: \"{{ smartos_images.keys() | list }}\"\n"
