name: scaleway_function_namespace_info
fqcn: community.general.scaleway_function_namespace_info
collection: community.general
short_description: Retrieve information on Scaleway Function namespace
description: This module return information about a function namespace on Scaleway account.
options:
  api_timeout:
    type: int
    default: 30
    aliases:
    - timeout
    description: HTTP timeout to Scaleway API in seconds.
  api_token:
    type: str
    required: true
    aliases:
    - oauth_token
    description: Scaleway OAuth token.
  api_url:
    type: str
    default: https://api.scaleway.com
    aliases:
    - base_url
    description: Scaleway API URL.
  name:
    type: str
    required: true
    description: Name of the function namespace.
  project_id:
    type: str
    required: true
    description: Project identifier.
  query_parameters:
    type: dict
    default: {}
    description: List of parameters passed to the query string.
  region:
    type: str
    required: true
    choices:
    - fr-par
    - nl-ams
    - pl-waw
    description: Scaleway region to use (for example C(fr-par)).
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certs of the Scaleway API.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Get a function namespace info\n  community.general.scaleway_function_namespace_info:\n\
  \    project_id: '{{ scw_project }}'\n    region: fr-par\n    name: my-awesome-function-namespace\n\
  \  register: function_namespace_info_task\n"
