name: one_image_info
fqcn: community.general.one_image_info
collection: community.general
short_description: Gather information on OpenNebula images
description: Gather information on OpenNebula images.
options:
  api_password:
    type: str
    description: Password of the user to login into OpenNebula RPC server. If not set then the value of
      the E(ONE_PASSWORD) environment variable is used.
  api_url:
    type: str
    description: URL of the OpenNebula RPC server. It is recommended to use HTTPS so that the username/password
      are not transferred over the network unencrypted. If not set then the value of the E(ONE_URL) environment
      variable is used.
  api_username:
    type: str
    description: Name of the user to login into the OpenNebula RPC server. If not set then the value of
      the E(ONE_USERNAME) environment variable is used.
  ids:
    type: list
    aliases:
    - id
    description: A list of images ids whose facts you want to gather.
  name:
    type: str
    description: A O(name) of the image whose facts will be gathered. If the O(name) begins with V(~)
      the O(name) will be used as regex pattern which restricts the list of images (whose facts will be
      returned) whose names match specified regex. Also, if the O(name) begins with V(~*) case-insensitive
      matching will be performed. See examples for more details.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather facts about all images\n  community.general.one_image_info:\n  register: result\n\
  \n- name: Print all images facts\n  ansible.builtin.debug:\n    msg: result\n\n- name: Gather facts\
  \ about an image using ID\n  community.general.one_image_info:\n    ids:\n      - 123\n\n- name: Gather\
  \ facts about an image using the name\n  community.general.one_image_info:\n    name: 'foo-image'\n\
  \  register: foo_image\n\n- name: Gather facts about all IMAGEs whose name matches regex 'app-image-.*'\n\
  \  community.general.one_image_info:\n    name: '~app-image-.*'\n  register: app_images\n\n- name: Gather\
  \ facts about all IMAGEs whose name matches regex 'foo-image-.*' ignoring cases\n  community.general.one_image_info:\n\
  \    name: '~*foo-image-.*'\n  register: foo_images\n"
