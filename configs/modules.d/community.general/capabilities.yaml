name: capabilities
fqcn: community.general.capabilities
collection: community.general
short_description: Manage Linux capabilities
description: This module manipulates files privileges using the Linux capabilities(7) system.
options:
  capability:
    type: str
    required: true
    aliases:
    - cap
    description: Desired capability to set (with operator and flags, if O(state=present)) or remove (if
      O(state=absent))
  path:
    type: str
    required: true
    aliases:
    - key
    description: Specifies the path to the file to be managed.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether the entry should be present or absent in the file's capabilities.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set cap_sys_chroot+ep on /foo\n  community.general.capabilities:\n    path: /foo\n\
  \    capability: cap_sys_chroot+ep\n    state: present\n\n- name: Remove cap_net_bind_service from /bar\n\
  \  community.general.capabilities:\n    path: /bar\n    capability: cap_net_bind_service\n    state:\
  \ absent\n"
