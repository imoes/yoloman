name: keycloak_user_rolemapping
fqcn: community.general.keycloak_user_rolemapping
collection: community.general
short_description: Allows administration of Keycloak user_rolemapping with the Keycloak API
description: This module allows you to add, remove or modify Keycloak user_rolemapping with the Keycloak
  REST API. It requires access to the REST API via OpenID Connect; the user connecting and the client
  being used must have the requisite access rights. In a default Keycloak installation, admin-cli and
  an admin user would work, as would a separate client definition with the scope tailored to your needs
  and a user having the expected roles. The names of module options are snake_cased versions of the camelCase
  ones found in the Keycloak API and its documentation at U(https://www.keycloak.org/docs-api/8.0/rest-api/index.html).
  Attributes are multi-valued in the Keycloak API. All attributes are lists of individual values and will
  be returned that way by this module. You may pass single values for attributes when calling the module,
  and this will be translated into a list suitable for the API. When updating a user_rolemapping, where
  possible provide the role ID to the module. This removes a lookup to the API to translate the name into
  the role ID.
options:
  auth_client_id:
    type: str
    default: admin-cli
    description: OpenID Connect C(client_id) to authenticate to the API with.
  auth_client_secret:
    type: str
    description: Client Secret to use in conjunction with O(auth_client_id) (if required).
  auth_keycloak_url:
    type: str
    required: true
    aliases:
    - url
    description: URL to the Keycloak instance.
  auth_password:
    type: str
    aliases:
    - password
    description: Password to authenticate for API access with.
  auth_realm:
    type: str
    description: Keycloak realm name to authenticate to for API access.
  auth_username:
    type: str
    aliases:
    - username
    description: Username to authenticate for API access with.
  cid:
    type: str
    description: ID of the client to be mapped. This parameter is not required for updating or deleting
      the rolemapping but providing it will reduce the number of API calls required.
  client_id:
    type: str
    description: Name of the client to be mapped (different than O(cid)). This parameter is required if
      O(cid) is not provided (can be replaced by O(cid) to reduce the number of API calls that must be
      made).
  connection_timeout:
    type: int
    default: 10
    description: Controls the HTTP connections timeout period (in seconds) to Keycloak API.
  http_agent:
    type: str
    default: Ansible
    description: Configures the HTTP User-Agent header.
  realm:
    type: str
    default: master
    description: They Keycloak realm under which this role_representation resides.
  roles:
    type: list
    description: Roles to be mapped to the user.
  service_account_user_client_id:
    type: str
    description: Client ID of the service-account-user to be mapped. This parameter is not required for
      updating or deleting the rolemapping but providing it will reduce the number of API calls required.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the user_rolemapping. On V(present), the user_rolemapping will be created if
      it does not yet exist, or updated with the parameters you provide. On V(absent), the user_rolemapping
      will be removed if it exists.
  target_username:
    type: str
    description: Username of the user roles are mapped to. This parameter is not required (can be replaced
      by uid for less API call).
  token:
    type: str
    description: Authentication token for Keycloak API.
  uid:
    type: str
    description: ID of the user to be mapped. This parameter is not required for updating or deleting
      the rolemapping but providing it will reduce the number of API calls required.
  validate_certs:
    type: bool
    default: true
    description: Verify TLS certificates (do not disable this in production).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Map a client role to a user, authentication with credentials\n  community.general.keycloak_user_rolemapping:\n\
  \    realm: MyCustomRealm\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    state: present\n\
  \    client_id: client1\n    user_id: user1Id\n    roles:\n      - name: role_name1\n        id: role_id1\n\
  \      - name: role_name2\n        id: role_id2\n  delegate_to: localhost\n\n- name: Map a client role\
  \ to a service account user for a client, authentication with credentials\n  community.general.keycloak_user_rolemapping:\n\
  \    realm: MyCustomRealm\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    state: present\n\
  \    client_id: client1\n    service_account_user_client_id: clientIdOfServiceAccount\n    roles:\n\
  \      - name: role_name1\n        id: role_id1\n      - name: role_name2\n        id: role_id2\n  delegate_to:\
  \ localhost\n\n- name: Map a client role to a user, authentication with token\n  community.general.keycloak_user_rolemapping:\n\
  \    realm: MyCustomRealm\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    token: TOKEN\n    state: present\n    client_id: client1\n    target_username: user1\n    roles:\n\
  \      - name: role_name1\n        id: role_id1\n      - name: role_name2\n        id: role_id2\n  delegate_to:\
  \ localhost\n\n- name: Unmap client role from a user\n  community.general.keycloak_user_rolemapping:\n\
  \    realm: MyCustomRealm\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    state: absent\n\
  \    client_id: client1\n    uid: 70e3ae72-96b6-11e6-9056-9737fd4d0764\n    roles:\n      - name: role_name1\n\
  \        id: role_id1\n      - name: role_name2\n        id: role_id2\n  delegate_to: localhost\n"
