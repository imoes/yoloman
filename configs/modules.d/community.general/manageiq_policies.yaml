name: manageiq_policies
fqcn: community.general.manageiq_policies
collection: community.general
short_description: Management of resource policy_profiles in ManageIQ
description: The manageiq_policies module supports adding and deleting policy_profiles in ManageIQ.
options:
  manageiq_connection:
    type: dict
    description: ManageIQ connection configuration information.
  policy_profiles:
    type: list
    description: List of dictionaries, each includes the policy_profile V(name) key. Required if O(state)
      is V(present) or V(absent).
  resource_id:
    type: int
    description: The ID of the resource to which the profile should be [un]assigned. Must be specified
      if O(resource_name) is not set. Both options are mutually exclusive.
  resource_name:
    type: str
    description: The name of the resource to which the profile should be [un]assigned. Must be specified
      if O(resource_id) is not set. Both options are mutually exclusive.
  resource_type:
    type: str
    required: true
    choices:
    - provider
    - host
    - vm
    - blueprint
    - category
    - cluster
    - data store
    - group
    - resource pool
    - service
    - service template
    - template
    - tenant
    - user
    description: The type of the resource to which the profile should be [un]assigned.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: V(absent) - policy_profiles should not exist, V(present) - policy_profiles should exist,
writes: true
runtime: starlark
source: translated
examples: "\n- name: Assign new policy_profile for a provider in ManageIQ\n  community.general.manageiq_policies:\n\
  \    resource_name: 'EngLab'\n    resource_type: 'provider'\n    policy_profiles:\n      - name: openscap\
  \ profile\n    manageiq_connection:\n      url: 'http://127.0.0.1:3000'\n      username: 'admin'\n \
  \     password: 'smartvm'\n      validate_certs: false  # only do this when you trust the network!\n\
  \n- name: Unassign a policy_profile for a provider in ManageIQ\n  community.general.manageiq_policies:\n\
  \    state: absent\n    resource_name: 'EngLab'\n    resource_type: 'provider'\n    policy_profiles:\n\
  \      - name: openscap profile\n    manageiq_connection:\n      url: 'http://127.0.0.1:3000'\n    \
  \  username: 'admin'\n      password: 'smartvm'\n      validate_certs: false  # only do this when you\
  \ trust the network!\n"
