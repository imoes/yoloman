name: hpilo_info
fqcn: community.general.hpilo_info
collection: community.general
short_description: Gather information through an HP iLO interface
description: This module gathers information on a specific system using its HP iLO interface. These information
  includes hardware and network related information useful for provisioning (e.g. macaddress, uuid). This
  module requires the C(hpilo) python module.
options:
  host:
    type: str
    required: true
    description: The HP iLO hostname/address that is linked to the physical system.
  login:
    type: str
    default: Administrator
    description: The login name to authenticate to the HP iLO interface.
  password:
    type: str
    default: admin
    description: The password to authenticate to the HP iLO interface.
  ssl_version:
    type: str
    default: TLSv1
    choices:
    - SSLv3
    - SSLv23
    - TLSv1
    - TLSv1_1
    - TLSv1_2
    description: Change the ssl_version used.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather facts from a HP iLO interface only if the system is an HP server\n  community.general.hpilo_info:\n\
  \    host: YOUR_ILO_ADDRESS\n    login: YOUR_ILO_LOGIN\n    password: YOUR_ILO_PASSWORD\n  when: cmdb_hwmodel.startswith('HP\
  \ ')\n  delegate_to: localhost\n  register: results\n\n- ansible.builtin.fail:\n    msg: 'CMDB serial\
  \ ({{ cmdb_serialno }}) does not match hardware serial ({{ results.hw_system_serial }}) !'\n  when:\
  \ cmdb_serialno != results.hw_system_serial\n"
