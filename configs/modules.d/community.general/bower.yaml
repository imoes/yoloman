name: bower
fqcn: community.general.bower
collection: community.general
short_description: Manage bower packages with bower
description: Manage bower packages with bower
options:
  name:
    type: str
    description: The name of a bower package to install
  offline:
    type: bool
    default: false
    description: Install packages from local cache, if the packages were installed before
  path:
    type: path
    required: true
    description: The base path where to install the bower packages
  production:
    type: bool
    default: false
    description: Install with --production flag
  relative_execpath:
    type: path
    description: Relative path to bower executable from install path
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - latest
    description: The state of the bower package
  version:
    type: str
    description: The version to be installed
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install \"bootstrap\" bower package.\n  community.general.bower:\n    name: bootstrap\n\
  \n- name: Install \"bootstrap\" bower package on version 3.1.1.\n  community.general.bower:\n    name:\
  \ bootstrap\n    version: '3.1.1'\n\n- name: Remove the \"bootstrap\" bower package.\n  community.general.bower:\n\
  \    name: bootstrap\n    state: absent\n\n- name: Install packages based on bower.json.\n  community.general.bower:\n\
  \    path: /app/location\n\n- name: Update packages based on bower.json to their latest version.\n \
  \ community.general.bower:\n    path: /app/location\n    state: latest\n\n# install bower locally and\
  \ run from there\n- npm:\n    path: /app/location\n    name: bower\n    global: false\n- community.general.bower:\n\
  \    path: /app/location\n    relative_execpath: node_modules/.bin\n"
