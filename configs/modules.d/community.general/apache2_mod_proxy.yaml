name: apache2_mod_proxy
fqcn: community.general.apache2_mod_proxy
collection: community.general
short_description: Set and/or get members' attributes of an Apache httpd 2.4 mod_proxy balancer pool
description: Set and/or get members' attributes of an Apache httpd 2.4 mod_proxy balancer pool, using
  HTTP POST and GET requests. The httpd mod_proxy balancer-member status page has to be enabled and accessible,
  as this module relies on parsing this page. This module supports ansible check_mode, and requires BeautifulSoup
  python module.
options:
  balancer_url_suffix:
    type: str
    default: /balancer-manager/
    description: Suffix of the balancer pool url required to access the balancer pool status page (e.g.
      balancer_vhost[:port]/balancer_url_suffix).
  balancer_vhost:
    type: str
    required: true
    description: (ipv4|ipv6|fqdn):port of the Apache httpd 2.4 mod_proxy balancer pool.
  member_host:
    type: str
    description: (ipv4|ipv6|fqdn) of the balancer member to get or to set attributes to. Port number is
      autodetected and should not be specified here. If undefined, apache2_mod_proxy module will return
      a members list of dictionaries of all the current balancer pool members' attributes.
  state:
    type: str
    description: 'Desired state of the member host. (absent|disabled),drained,hot_standby,ignore_errors
      can be simultaneously invoked by separating them with a comma (e.g. state=drained,ignore_errors).
      Accepted state values: ["present", "absent", "enabled", "disabled", "drained", "hot_standby", "ignore_errors"]'
  tls:
    type: bool
    default: false
    description: Use https to access balancer management page.
  validate_certs:
    type: bool
    default: true
    description: Validate ssl/tls certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Get all current balancer pool members attributes\n  community.general.apache2_mod_proxy:\n\
  \    balancer_vhost: 10.0.0.2\n\n- name: Get a specific member attributes\n  community.general.apache2_mod_proxy:\n\
  \    balancer_vhost: myws.mydomain.org\n    balancer_suffix: /lb/\n    member_host: node1.myws.mydomain.org\n\
  \n# Enable all balancer pool members:\n- name: Get attributes\n  community.general.apache2_mod_proxy:\n\
  \    balancer_vhost: '{{ myloadbalancer_host }}'\n  register: result\n\n- name: Enable all balancer\
  \ pool members\n  community.general.apache2_mod_proxy:\n    balancer_vhost: '{{ myloadbalancer_host\
  \ }}'\n    member_host: '{{ item.host }}'\n    state: present\n  with_items: '{{ result.members }}'\n\
  \n# Gracefully disable a member from a loadbalancer node:\n- name: Step 1\n  community.general.apache2_mod_proxy:\n\
  \    balancer_vhost: '{{ vhost_host }}'\n    member_host: '{{ member.host }}'\n    state: drained\n\
  \  delegate_to: myloadbalancernode\n\n- name: Step 2\n  ansible.builtin.wait_for:\n    host: '{{ member.host\
  \ }}'\n    port: '{{ member.port }}'\n    state: drained\n  delegate_to: myloadbalancernode\n\n- name:\
  \ Step 3\n  community.general.apache2_mod_proxy:\n    balancer_vhost: '{{ vhost_host }}'\n    member_host:\
  \ '{{ member.host }}'\n    state: absent\n  delegate_to: myloadbalancernode\n"
