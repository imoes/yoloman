name: hwc_vpc_peering_connect
fqcn: community.general.hwc_vpc_peering_connect
collection: community.general
short_description: Creates a resource of Vpc/PeeringConnect in Huawei Cloud
description: vpc peering management.
options:
  description:
    type: str
    description: The description of vpc peering connection.
  domain:
    type: str
    required: true
    description: The name of the Domain to scope to (Identity v3). Currently only domain names are supported,
      and not domain IDs.
  id:
    type: str
    description: The ID of resource to be managed.
  identity_endpoint:
    type: str
    required: true
    description: The Identity authentication URL.
  local_vpc_id:
    type: str
    required: true
    description: Specifies the ID of local VPC.
  name:
    type: str
    required: true
    description: Specifies the name of the VPC peering connection. The value can contain 1 to 64 characters.
  password:
    type: str
    required: true
    description: The password to login with.
  peering_vpc:
    type: dict
    required: true
    description: Specifies information about the peering VPC.
  project:
    type: str
    required: true
    description: The name of the Tenant (Identity v2) or Project (Identity v3). Currently only project
      names are supported, and not project IDs.
  region:
    type: str
    description: The region to which the project belongs.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the given object should exist in Huawei Cloud.
  timeouts:
    type: dict
    default: {}
    description: The timeouts for each operations.
  user:
    type: str
    required: true
    description: The user name to login with. Currently only user names are supported, and not user IDs.
writes: true
runtime: starlark
source: translated
examples: "\n# create a peering connect\n- name: Create a local vpc\n  hwc_network_vpc:\n    cidr: \"\
  192.168.0.0/16\"\n    name: \"ansible_network_vpc_test_local\"\n  register: vpc1\n- name: Create a peering\
  \ vpc\n  hwc_network_vpc:\n    cidr: \"192.168.0.0/16\"\n    name: \"ansible_network_vpc_test_peering\"\
  \n  register: vpc2\n- name: Create a peering connect\n  community.general.hwc_vpc_peering_connect:\n\
  \    local_vpc_id: \"{{ vpc1.id }}\"\n    name: \"ansible_network_peering_test\"\n    peering_vpc:\n\
  \      vpc_id: \"{{ vpc2.id }}\"\n"
