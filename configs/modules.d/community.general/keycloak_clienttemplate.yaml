name: keycloak_clienttemplate
fqcn: community.general.keycloak_clienttemplate
collection: community.general
short_description: Allows administration of Keycloak client templates via Keycloak API
description: This module allows the administration of Keycloak client templates via the Keycloak REST
  API. It requires access to the REST API via OpenID Connect; the user connecting and the client being
  used must have the requisite access rights. In a default Keycloak installation, admin-cli and an admin
  user would work, as would a separate client definition with the scope tailored to your needs and a user
  having the expected roles. The names of module options are snake_cased versions of the camelCase ones
  found in the Keycloak API and its documentation at U(https://www.keycloak.org/docs-api/8.0/rest-api/index.html)
  The Keycloak API does not always enforce for only sensible settings to be used -- you can set SAML-specific
  settings on an OpenID Connect client for instance and vice versa. Be careful. If you do not specify
  a setting, usually a sensible default is chosen.
options:
  attributes:
    type: dict
    description: A dict of further attributes for this client template. This can contain various configuration
      settings, though in the default installation of Keycloak as of 3.4, none are documented or known,
      so this is usually empty.
  auth_client_id:
    type: str
    default: admin-cli
    description: OpenID Connect C(client_id) to authenticate to the API with.
  auth_client_secret:
    type: str
    description: Client Secret to use in conjunction with O(auth_client_id) (if required).
  auth_keycloak_url:
    type: str
    required: true
    aliases:
    - url
    description: URL to the Keycloak instance.
  auth_password:
    type: str
    aliases:
    - password
    description: Password to authenticate for API access with.
  auth_realm:
    type: str
    description: Keycloak realm name to authenticate to for API access.
  auth_username:
    type: str
    aliases:
    - username
    description: Username to authenticate for API access with.
  connection_timeout:
    type: int
    default: 10
    description: Controls the HTTP connections timeout period (in seconds) to Keycloak API.
  description:
    type: str
    description: Description of the client template in Keycloak.
  full_scope_allowed:
    type: bool
    description: Is the "Full Scope Allowed" feature set for this client template or not. This is 'fullScopeAllowed'
      in the Keycloak REST API.
  http_agent:
    type: str
    default: Ansible
    description: Configures the HTTP User-Agent header.
  id:
    type: str
    description: Id of client template to be worked on. This is usually a UUID.
  name:
    type: str
    description: Name of the client template.
  protocol:
    type: str
    choices:
    - openid-connect
    - saml
    description: Type of client template.
  protocol_mappers:
    type: list
    description: a list of dicts defining protocol mappers for this client template. This is 'protocolMappers'
      in the Keycloak REST API.
  realm:
    type: str
    default: master
    description: Realm this client template is found in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the client template. On V(present), the client template will be created (or
      updated if it exists already). On V(absent), the client template will be removed if it exists
  token:
    type: str
    description: Authentication token for Keycloak API.
  validate_certs:
    type: bool
    default: true
    description: Verify TLS certificates (do not disable this in production).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create or update Keycloak client template (minimal), authentication with credentials\n\
  \  community.general.keycloak_client:\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    realm: master\n\
  \    name: this_is_a_test\n  delegate_to: localhost\n\n- name: Create or update Keycloak client template\
  \ (minimal), authentication with token\n  community.general.keycloak_clienttemplate:\n    auth_client_id:\
  \ admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm: master\n    token:\
  \ TOKEN\n    realm: master\n    name: this_is_a_test\n  delegate_to: localhost\n\n- name: Delete Keycloak\
  \ client template\n  community.general.keycloak_client:\n    auth_client_id: admin-cli\n    auth_keycloak_url:\
  \ https://auth.example.com/auth\n    auth_realm: master\n    auth_username: USERNAME\n    auth_password:\
  \ PASSWORD\n    realm: master\n    state: absent\n    name: test01\n  delegate_to: localhost\n\n- name:\
  \ Create or update Keycloak client template (with a protocol mapper)\n  community.general.keycloak_client:\n\
  \    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm:\
  \ master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    realm: master\n    name: this_is_a_test\n\
  \    protocol_mappers:\n      - config:\n          access.token.claim: true\n          claim.name: \"\
  family_name\"\n          id.token.claim: true\n          jsonType.label: String\n          user.attribute:\
  \ lastName\n          userinfo.token.claim: true\n        consentRequired: true\n        consentText:\
  \ \"${familyName}\"\n        name: family name\n        protocol: openid-connect\n        protocolMapper:\
  \ oidc-usermodel-property-mapper\n    full_scope_allowed: false\n    id: bce6f5e9-d7d3-4955-817e-c5b7f8d65b3f\n\
  \  delegate_to: localhost\n"
