name: apache2_module
fqcn: community.general.apache2_module
collection: community.general
short_description: Enables/disables a module of the Apache2 webserver
description: Enables or disables a specified module of the Apache2 webserver.
options:
  force:
    type: bool
    default: false
    description: Force disabling of default modules and override Debian warnings.
  identifier:
    type: str
    description: Identifier of the module as listed by C(apache2ctl -M). This is optional and usually
      determined automatically by the common convention of appending V(_module) to O(name) as well as
      custom exception for popular modules.
  ignore_configcheck:
    type: bool
    default: false
    description: Ignore configuration checks about inconsistent module configuration. Especially for mpm_*
      modules.
  name:
    type: str
    required: true
    description: Name of the module to enable/disable as given to C(a2enmod/a2dismod).
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Desired state of the module.
  warn_mpm_absent:
    type: bool
    default: true
    description: Control the behavior of the warning process for MPM modules.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Enable the Apache2 module wsgi\n  community.general.apache2_module:\n    state: present\n\
  \    name: wsgi\n\n- name: Disables the Apache2 module wsgi\n  community.general.apache2_module:\n \
  \   state: absent\n    name: wsgi\n\n- name: Disable default modules for Debian\n  community.general.apache2_module:\n\
  \    state: absent\n    name: autoindex\n    force: true\n\n- name: Disable mpm_worker and ignore warnings\
  \ about missing mpm module\n  community.general.apache2_module:\n    state: absent\n    name: mpm_worker\n\
  \    ignore_configcheck: true\n\n- name: Disable mpm_event, enable mpm_prefork and ignore warnings about\
  \ missing mpm module\n  community.general.apache2_module:\n    name: \"{{ item.module }}\"\n    state:\
  \ \"{{ item.state }}\"\n    warn_mpm_absent: false\n    ignore_configcheck: true\n  loop:\n  - module:\
  \ mpm_event\n    state: absent\n  - module: mpm_prefork\n    state: present\n\n- name: Enable dump_io\
  \ module, which is identified as dumpio_module inside apache2\n  community.general.apache2_module:\n\
  \    state: present\n    name: dump_io\n    identifier: dumpio_module\n"
