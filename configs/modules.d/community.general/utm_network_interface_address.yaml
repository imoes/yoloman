name: utm_network_interface_address
fqcn: community.general.utm_network_interface_address
collection: community.general
short_description: Create, update or destroy network/interface_address object
description: Create, update or destroy a network/interface_address object in SOPHOS UTM. This module needs
  to have the REST Ability of the UTM to be activated.
options:
  address:
    type: str
    required: true
    description: The ip4 address of the network/interface_address object.
  address6:
    type: str
    description: The ip6 address of the network/interface_address object.
  comment:
    type: str
    default: ''
    description: An optional comment to add to the object
  headers:
    type: dict
    default: {}
    description: A dictionary of additional headers to be sent to POST and PUT requests. Is needed for
      some modules.
  name:
    type: str
    required: true
    description: The name of the object. Will be used to identify the entry
  resolved:
    type: bool
    description: Whether or not the object is resolved
  resolved6:
    type: bool
    description: Whether or not the object is resolved
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: The desired state of the object. V(present) will create or update an object. V(absent)
      will delete an object if it was present.
  utm_host:
    type: str
    required: true
    description: The REST Endpoint of the Sophos UTM.
  utm_port:
    type: int
    default: 4444
    description: The port of the REST interface.
  utm_protocol:
    type: str
    default: https
    choices:
    - http
    - https
    description: The protocol of the REST Endpoint.
  utm_token:
    type: str
    required: true
    description: The token used to identify at the REST-API. See U(https://www.sophos.com/en-us/medialibrary/PDFs/documentation/UTMonAWS/Sophos-UTM-RESTful-API.pdf?la=en),
      Chapter 2.4.2.
  validate_certs:
    type: bool
    default: true
    description: Whether the REST interface's ssl certificate should be verified or not.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a network interface address\n  utm_proxy_backend:\n    utm_host: sophos.host.name\n\
  \    utm_token: abcdefghijklmno1234\n    name: TestNetworkInterfaceAddress\n    address: 0.0.0.0\n \
  \   state: present\n\n- name: Remove a network interface address\n  network_interface_address:\n   \
  \ utm_host: sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestNetworkInterfaceAddress\n\
  \    address: 0.0.0.0\n    state: absent\n"
