name: rax_dns_record
fqcn: community.general.rax_dns_record
collection: community.general
short_description: Manage DNS records on Rackspace Cloud DNS
description: Manage DNS records on Rackspace Cloud DNS
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  comment:
    type: str
    description: Brief description of the domain. Maximum length of 160 characters
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  data:
    type: str
    required: true
    description: IP address for A/AAAA record, FQDN for CNAME/MX/NS, or text data for SRV/TXT
  domain:
    type: str
    description: Domain name to create the record in. This is an invalid option when type=PTR
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  loadbalancer:
    type: str
    description: Load Balancer ID to create a PTR record for. Only used with type=PTR
  name:
    type: str
    required: true
    description: FQDN record name to create
  overwrite:
    type: bool
    default: true
    description: Add new records if data doesn't match, instead of updating existing record with matching
      name. If there are already multiple records with matching name and overwrite=true, this module will
      fail.
  priority:
    type: int
    description: Required for MX and SRV records, but forbidden for other record types. If specified,
      must be an integer from 0 to 65535.
  region:
    type: str
    description: Region to create an instance in.
  server:
    type: str
    description: Server ID to create a PTR record for. Only used with type=PTR
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  ttl:
    type: int
    default: 3600
    description: Time to live of record in seconds
  type:
    type: str
    required: true
    choices:
    - A
    - AAAA
    - CNAME
    - MX
    - NS
    - SRV
    - TXT
    - PTR
    description: DNS record type
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create DNS Records\n  hosts: all\n  gather_facts: false\n  tasks:\n    - name: Create\
  \ A record\n      local_action:\n        module: rax_dns_record\n        credentials: ~/.raxpub\n  \
  \      domain: example.org\n        name: www.example.org\n        data: \"{{ rax_accessipv4 }}\"\n\
  \        type: A\n      register: a_record\n\n    - name: Create PTR record\n      local_action:\n \
  \       module: rax_dns_record\n        credentials: ~/.raxpub\n        server: \"{{ rax_id }}\"\n \
  \       name: \"{{ inventory_hostname }}\"\n        region: DFW\n      register: ptr_record\n"
