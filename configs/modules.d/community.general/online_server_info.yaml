name: online_server_info
fqcn: community.general.online_server_info
collection: community.general
short_description: Gather information about Online servers
description: Gather information about the servers. U(https://www.online.net/en/dedicated-server)
options:
  api_timeout:
    type: int
    default: 30
    aliases:
    - timeout
    description: HTTP timeout to Online API in seconds.
  api_token:
    type: str
    required: true
    aliases:
    - oauth_token
    description: Online OAuth token.
  api_url:
    type: str
    default: https://api.online.net
    aliases:
    - base_url
    description: Online API URL.
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certs of the Online API.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather Online server information\n  community.general.online_server_info:\n    api_token:\
  \ '0d1627e8-bbf0-44c5-a46f-5c4d3aef033f'\n  register: result\n\n- ansible.builtin.debug:\n    msg: \"\
  {{ result.online_server_info }}\"\n"
