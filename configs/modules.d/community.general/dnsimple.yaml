name: dnsimple
fqcn: community.general.dnsimple
collection: community.general
short_description: Interface with dnsimple.com (a DNS hosting service)
description: 'Manages domains and records via the DNSimple API, see the docs: U(http://developer.dnsimple.com/).'
options:
  account_api_token:
    type: str
    description: Account API token. See O(account_email) for more information.
  account_email:
    type: str
    description: 'Account email. If omitted, the environment variables E(DNSIMPLE_EMAIL) and E(DNSIMPLE_API_TOKEN)
      will be looked for. If those aren''t found, a C(.dnsimple) file will be looked for, see: U(https://github.com/mikemaccana/dnsimple-python#getting-started).
      C(.dnsimple) config files are only supported in dnsimple-python<2.0.0'
  domain:
    type: str
    description: Domain to work with. Can be the domain name (e.g. "mydomain.com") or the numeric ID of
      the domain in DNSimple. If omitted, a list of domains will be returned. If domain is present but
      the domain doesn't exist, it will be created.
  priority:
    type: int
    description: Record priority.
  record:
    type: str
    description: Record to add, if blank a record for the domain will be created, supports the wildcard
      (*).
  record_ids:
    type: list
    description: List of records to ensure they either exist or do not exist.
  sandbox:
    type: bool
    default: false
    description: Use the DNSimple sandbox environment. Requires a dedicated account in the dnsimple sandbox
      environment. Check U(https://developer.dnsimple.com/sandbox/) for more information.
  solo:
    type: bool
    default: false
    description: Whether the record should be the only one for that record type and record name. Only
      use with O(state) is set to V(present) on a record.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: whether the record should exist or not.
  ttl:
    type: int
    default: 3600
    description: The TTL to give the new record in seconds.
  type:
    type: str
    choices:
    - A
    - ALIAS
    - CNAME
    - MX
    - SPF
    - URL
    - TXT
    - NS
    - SRV
    - NAPTR
    - PTR
    - AAAA
    - SSHFP
    - HINFO
    - POOL
    - CAA
    description: The type of DNS record to create.
  value:
    type: str
    description: Record value. Must be specified when trying to ensure a record exists.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Authenticate using email and API token and fetch all domains\n  community.general.dnsimple:\n\
  \    account_email: test@example.com\n    account_api_token: dummyapitoken\n  delegate_to: localhost\n\
  \n- name: Delete a domain\n  community.general.dnsimple:\n    domain: my.com\n    state: absent\n  delegate_to:\
  \ localhost\n\n- name: Create a test.my.com A record to point to 127.0.0.1\n  community.general.dnsimple:\n\
  \    domain: my.com\n    record: test\n    type: A\n    value: 127.0.0.1\n  delegate_to: localhost\n\
  \  register: record\n\n- name: Delete record using record_ids\n  community.general.dnsimple:\n    domain:\
  \ my.com\n    record_ids: '{{ record[\"id\"] }}'\n    state: absent\n  delegate_to: localhost\n\n- name:\
  \ Create a my.com CNAME record to example.com\n  community.general.dnsimple:\n    domain: my.com\n \
  \   record: ''\n    type: CNAME\n    value: example.com\n    state: present\n  delegate_to: localhost\n\
  \n- name: Change TTL value for a record\n  community.general.dnsimple:\n    domain: my.com\n    record:\
  \ ''\n    type: CNAME\n    value: example.com\n    ttl: 600\n    state: present\n  delegate_to: localhost\n\
  \n- name: Delete the record\n  community.general.dnsimple:\n    domain: my.com\n    record: ''\n   \
  \ type: CNAME\n    value: example.com\n    state: absent\n  delegate_to: localhost\n"
