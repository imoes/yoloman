name: consul_acl
fqcn: community.general.consul_acl
collection: community.general
short_description: Manipulate Consul ACL keys and rules
description: Allows the addition, modification and deletion of ACL keys and associated rules in a consul
  cluster via the agent. For more details on using and configuring ACLs, see https://www.consul.io/docs/guides/acl.html.
options:
  host:
    type: str
    default: localhost
    description: host of the consul agent defaults to localhost
  mgmt_token:
    type: str
    required: true
    description: a management token is required to manipulate the acl lists
  name:
    type: str
    description: the name that should be associated with the acl key, this is opaque to Consul
  port:
    type: int
    default: 8500
    description: the port on which the consul agent is running
  rules:
    type: list
    description: rules that should be associated with a given token
  scheme:
    type: str
    default: http
    description: the protocol scheme on which the consul agent is running
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: whether the ACL pair should be present or absent
  token:
    type: str
    description: the token key identifying an ACL rule set. If generated by consul this will be a UUID
  token_type:
    type: str
    default: client
    choices:
    - client
    - management
    description: the type of token that should be created
  validate_certs:
    type: bool
    default: true
    description: whether to verify the tls certificate of the consul agent
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create an ACL with rules\n  community.general.consul_acl:\n    host: consul1.example.com\n\
  \    mgmt_token: some_management_acl\n    name: Foo access\n    rules:\n      - key: \"foo\"\n     \
  \   policy: read\n      - key: \"private/foo\"\n        policy: deny\n\n- name: Create an ACL with a\
  \ specific token\n  community.general.consul_acl:\n    host: consul1.example.com\n    mgmt_token: some_management_acl\n\
  \    name: Foo access\n    token: my-token\n    rules:\n      - key: \"foo\"\n        policy: read\n\
  \n- name: Update the rules associated to an ACL token\n  community.general.consul_acl:\n    host: consul1.example.com\n\
  \    mgmt_token: some_management_acl\n    name: Foo access\n    token: some_client_token\n    rules:\n\
  \      - event: \"bbq\"\n        policy: write\n      - key: \"foo\"\n        policy: read\n      -\
  \ key: \"private\"\n        policy: deny\n      - keyring: write\n      - node: \"hgs4\"\n        policy:\
  \ write\n      - operator: read\n      - query: \"\"\n        policy: write\n      - service: \"consul\"\
  \n        policy: write\n      - session: \"standup\"\n        policy: write\n\n- name: Remove a token\n\
  \  community.general.consul_acl:\n    host: consul1.example.com\n    mgmt_token: some_management_acl\n\
  \    token: 172bd5c8-9fe9-11e4-b1b0-3c15c2c9fd5e\n    state: absent\n"
