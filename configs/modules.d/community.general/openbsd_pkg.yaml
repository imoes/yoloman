name: openbsd_pkg
fqcn: community.general.openbsd_pkg
collection: community.general
short_description: Manage packages on OpenBSD
description: Manage packages on OpenBSD using the pkg tools.
options:
  build:
    type: bool
    default: false
    description: Build the package from source instead of downloading and installing a binary. Requires
      that the port source tree is already installed. Automatically builds and installs the 'sqlports'
      package, if it is not already installed. Mutually exclusive with O(snapshot).
  clean:
    type: bool
    default: false
    description: When updating or removing packages, delete the extra configuration file(s) in the old
      packages which are annotated with @extra in the packaging-list.
  name:
    type: list
    required: true
    description: A name or a list of names of the packages.
  ports_dir:
    type: path
    default: /usr/ports
    description: When used in combination with the O(build) option, allows overriding the default ports
      source directory.
  quick:
    type: bool
    default: false
    description: Replace or delete packages quickly; do not bother with checksums before removing normal
      files.
  snapshot:
    type: bool
    default: false
    description: Force C(%c) and C(%m) to expand to C(snapshots), even on a release kernel. Mutually exclusive
      with O(build).
  state:
    type: str
    default: present
    choices:
    - absent
    - latest
    - present
    - installed
    - removed
    description: V(present) will make sure the package is installed. V(latest) will make sure the latest
      version of the package is installed. V(absent) will make sure the specified package is not installed.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Make sure nmap is installed\n  community.general.openbsd_pkg:\n    name: nmap\n \
  \   state: present\n\n- name: Make sure nmap is the latest version\n  community.general.openbsd_pkg:\n\
  \    name: nmap\n    state: latest\n\n- name: Make sure nmap is not installed\n  community.general.openbsd_pkg:\n\
  \    name: nmap\n    state: absent\n\n- name: Make sure nmap is installed, build it from source if it\
  \ is not\n  community.general.openbsd_pkg:\n    name: nmap\n    state: present\n    build: true\n\n\
  - name: Specify a pkg flavour with '--'\n  community.general.openbsd_pkg:\n    name: vim--no_x11\n \
  \   state: present\n\n- name: Specify the default flavour to avoid ambiguity errors\n  community.general.openbsd_pkg:\n\
  \    name: vim--\n    state: present\n\n- name: Specify a package branch (requires at least OpenBSD\
  \ 6.0)\n  community.general.openbsd_pkg:\n    name: python%3.5\n    state: present\n\n- name: Update\
  \ all packages on the system\n  community.general.openbsd_pkg:\n    name: '*'\n    state: latest\n\n\
  - name: Purge a package and it's configuration files\n  community.general.openbsd_pkg:\n    name: mpd\n\
  \    clean: true\n    state: absent\n\n- name: Quickly remove a package without checking checksums\n\
  \  community.general.openbsd_pkg:\n    name: qt5\n    quick: true\n    state: absent\n"
