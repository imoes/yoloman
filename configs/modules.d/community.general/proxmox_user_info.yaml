name: proxmox_user_info
fqcn: community.general.proxmox_user_info
collection: community.general
short_description: Retrieve information about one or more Proxmox VE users
description: Retrieve information about one or more Proxmox VE users
options:
  api_host:
    type: str
    required: true
    description: Specify the target host of the Proxmox VE cluster.
  api_password:
    type: str
    description: Specify the password to authenticate with. You can use E(PROXMOX_PASSWORD) environment
      variable.
  api_token_id:
    type: str
    description: Specify the token ID. Requires C(proxmoxer>=1.1.0) to work.
  api_token_secret:
    type: str
    description: Specify the token secret. Requires C(proxmoxer>=1.1.0) to work.
  api_user:
    type: str
    required: true
    description: Specify the user to authenticate with.
  domain:
    type: str
    aliases:
    - realm
    description: Restrict results to a specific authentication realm.
  user:
    type: str
    aliases:
    - name
    description: Restrict results to a specific user.
  userid:
    type: str
    description: Restrict results to a specific user ID, which is a concatenation of a user and domain
      parts.
  validate_certs:
    type: bool
    default: false
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
writes: false
runtime: starlark
source: translated
examples: "\n- name: List existing users\n  community.general.proxmox_user_info:\n    api_host: helldorado\n\
  \    api_user: root@pam\n    api_password: \"{{ password | default(omit) }}\"\n    api_token_id: \"\
  {{ token_id | default(omit) }}\"\n    api_token_secret: \"{{ token_secret | default(omit) }}\"\n  register:\
  \ proxmox_users\n\n- name: List existing users in the pve authentication realm\n  community.general.proxmox_user_info:\n\
  \    api_host: helldorado\n    api_user: root@pam\n    api_password: \"{{ password | default(omit) }}\"\
  \n    api_token_id: \"{{ token_id | default(omit) }}\"\n    api_token_secret: \"{{ token_secret | default(omit)\
  \ }}\"\n    domain: pve\n  register: proxmox_users_pve\n\n- name: Retrieve information about admin@pve\n\
  \  community.general.proxmox_user_info:\n    api_host: helldorado\n    api_user: root@pam\n    api_password:\
  \ \"{{ password | default(omit) }}\"\n    api_token_id: \"{{ token_id | default(omit) }}\"\n    api_token_secret:\
  \ \"{{ token_secret | default(omit) }}\"\n    userid: admin@pve\n  register: proxmox_user_admin\n\n\
  - name: Alternative way to retrieve information about admin@pve\n  community.general.proxmox_user_info:\n\
  \    api_host: helldorado\n    api_user: root@pam\n    api_password: \"{{ password | default(omit) }}\"\
  \n    api_token_id: \"{{ token_id | default(omit) }}\"\n    api_token_secret: \"{{ token_secret | default(omit)\
  \ }}\"\n    user: admin\n    domain: pve\n  register: proxmox_user_admin\n"
