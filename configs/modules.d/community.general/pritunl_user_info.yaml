name: pritunl_user_info
fqcn: community.general.pritunl_user_info
collection: community.general
short_description: List Pritunl Users using the Pritunl API
description: A module to list Pritunl users using the Pritunl API.
options:
  organization:
    type: str
    required: true
    aliases:
    - org
    description: The name of the organization the user is part of.
  pritunl_api_secret:
    type: str
    required: true
    description: API Secret found in Administrators > USERNAME > API Secret.
  pritunl_api_token:
    type: str
    required: true
    description: API Token of a Pritunl admin user. It needs to be enabled in Administrators > USERNAME
      > Enable Token Authentication.
  pritunl_url:
    type: str
    required: true
    description: URL and port of the Pritunl server on which the API is enabled.
  user_name:
    type: str
    description: Name of the user to filter on Pritunl.
  user_type:
    type: str
    default: client
    choices:
    - client
    - server
    description: Type of the user O(user_name).
  validate_certs:
    type: bool
    default: true
    description: If certificates should be validated or not. This should never be set to V(false), except
      if you are very sure that your connection to the server can not be subject to a Man In The Middle
      attack.
writes: false
runtime: starlark
source: translated
examples: "\n- name: List all existing users part of the organization MyOrg\n  community.general.pritunl_user_info:\n\
  \    state: list\n    organization: MyOrg\n\n- name: Search for the user named Florian part of the organization\
  \ MyOrg\n  community.general.pritunl_user_info:\n    state: list\n    organization: MyOrg\n    user_name:\
  \ Florian\n"
