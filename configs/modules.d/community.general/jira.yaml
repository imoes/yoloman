name: jira
fqcn: community.general.jira
collection: community.general
short_description: Create and modify issues in a JIRA instance
description: Create and modify issues in a JIRA instance.
options:
  account_id:
    type: str
    description: Sets the account identifier for the assignee when O(operation) is V(create), V(transition),
      or V(edit). Note that JIRA may not allow changing field values on specific transitions or states.
  assignee:
    type: str
    description: Sets the the assignee when O(operation) is V(create), V(transition), or V(edit). Recent
      versions of JIRA no longer accept a user name as a user identifier. In that case, use O(account_id)
      instead. Note that JIRA may not allow changing field values on specific transitions or states.
  attachment:
    type: dict
    description: Information about the attachment being uploaded.
  comment:
    type: str
    description: The comment text to add. Note that JIRA may not allow changing field values on specific
      transitions or states.
  comment_visibility:
    type: dict
    description: Used to specify comment comment visibility. See U(https://developer.atlassian.com/cloud/jira/platform/rest/v2/api-group-issue-comments/#api-rest-api-2-issue-issueidorkey-comment-post)
      for details.
  description:
    type: str
    description: The issue description, where appropriate. Note that JIRA may not allow changing field
      values on specific transitions or states.
  fields:
    type: dict
    default: {}
    description: This is a free-form data structure that can contain arbitrary data. This is passed directly
      to the JIRA REST API (possibly after merging with other required data, as when passed to create).
      See examples for more information, and the JIRA REST API for the structure required for various
      fields. When passed to comment, the data structure is merged at the first level since community.general
      4.6.0. Useful to add JIRA properties for example. Note that JIRA may not allow changing field values
      on specific transitions or states.
  inwardissue:
    type: str
    description: Set issue from which link will be created.
  issue:
    type: str
    aliases:
    - ticket
    description: An existing issue key to operate on.
  issuetype:
    type: str
    description: The issue type, for issue creation.
  jql:
    type: str
    description: Query JIRA in JQL Syntax, e.g. 'CMDB Hostname'='test.example.com'.
  linktype:
    type: str
    description: Set type of link, when action 'link' selected.
  maxresults:
    type: int
    description: Limit the result of O(operation=search). If no value is specified, the default jira limit
      will be used. Used when O(operation=search) only, ignored otherwise.
  operation:
    type: str
    required: true
    choices:
    - attach
    - comment
    - create
    - edit
    - fetch
    - link
    - search
    - transition
    - update
    - worklog
    aliases:
    - command
    description: The operation to perform. V(worklog) was added in community.general 6.5.0.
  outwardissue:
    type: str
    description: Set issue to which link will be created.
  password:
    type: str
    description: The password to log-in with. Must be used with O(username).  Mutually exclusive with
      O(token).
  project:
    type: str
    description: The project for this operation. Required for issue creation.
  status:
    type: str
    description: Only used when O(operation) is V(transition), and a bit of a misnomer, it actually refers
      to the transition name.
  summary:
    type: str
    description: The issue summary, where appropriate. Note that JIRA may not allow changing field values
      on specific transitions or states.
  timeout:
    type: float
    default: 10
    description: Set timeout, in seconds, on requests to JIRA API.
  token:
    type: str
    description: The personal access token to log-in with. Mutually exclusive with O(username) and O(password).
  uri:
    type: str
    required: true
    description: Base URI for the JIRA instance.
  username:
    type: str
    description: The username to log-in with. Must be used with O(password). Mutually exclusive with O(token).
  validate_certs:
    type: bool
    default: true
    description: Require valid SSL certificates (set to V(false) if you would like to use self-signed
      certificates)
writes: true
runtime: starlark
source: translated
examples: "\n# Create a new issue and add a comment to it:\n- name: Create an issue\n  community.general.jira:\n\
  \    uri: '{{ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    project: ANS\n\
  \    operation: create\n    summary: Example Issue\n    description: Created using Ansible\n    issuetype:\
  \ Task\n  args:\n    fields:\n        customfield_13225: \"test\"\n        customfield_12931: {\"value\"\
  : \"Test\"}\n  register: issue\n\n- name: Comment on issue\n  community.general.jira:\n    uri: '{{\
  \ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key\
  \ }}'\n    operation: comment\n    comment: A comment added by Ansible\n\n- name: Comment on issue with\
  \ restricted visibility\n  community.general.jira:\n    uri: '{{ server }}'\n    username: '{{ user\
  \ }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key }}'\n    operation: comment\n    comment:\
  \ A comment added by Ansible\n    comment_visibility:\n      type: role\n      value: Developers\n\n\
  - name: Comment on issue with property to mark it internal\n  community.general.jira:\n    uri: '{{\
  \ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key\
  \ }}'\n    operation: comment\n    comment: A comment added by Ansible\n    fields:\n      properties:\n\
  \        - key: 'sd.public.comment'\n          value:\n            internal: true\n\n# Add an workog\
  \ to an existing issue\n- name: Worklog on issue\n  community.general.jira:\n    uri: '{{ server }}'\n\
  \    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key }}'\n    operation:\
  \ worklog\n    comment: A worklog added by Ansible\n    fields:\n      timeSpentSeconds: 12000\n\n-\
  \ name: Workflow on issue with comment restricted visibility\n  community.general.jira:\n    uri: '{{\
  \ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key\
  \ }}'\n    operation: worklog\n    comment: A worklog added by Ansible\n    comment_visibility:\n  \
  \    type: role\n      value: Developers\n    fields:\n      timeSpentSeconds: 12000\n\n- name: Workflow\
  \ on issue with comment property to mark it internal\n  community.general.jira:\n    uri: '{{ server\
  \ }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key }}'\n \
  \   operation: worklog\n    comment: A worklog added by Ansible\n    fields:\n      properties:\n  \
  \      - key: 'sd.public.comment'\n          value:\n            internal: true\n      timeSpentSeconds:\
  \ 12000\n\n# Assign an existing issue using edit\n- name: Assign an issue using free-form fields\n \
  \ community.general.jira:\n    uri: '{{ server }}'\n    username: '{{ user }}'\n    password: '{{ pass\
  \ }}'\n    issue: '{{ issue.meta.key}}'\n    operation: edit\n    assignee: ssmith\n\n# Create an issue\
  \ with an existing assignee\n- name: Create an assigned issue\n  community.general.jira:\n    uri: '{{\
  \ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    project: ANS\n    operation:\
  \ create\n    summary: Assigned issue\n    description: Created and assigned using Ansible\n    issuetype:\
  \ Task\n    assignee: ssmith\n\n# Edit an issue\n- name: Set the labels on an issue using free-form\
  \ fields\n  community.general.jira:\n    uri: '{{ server }}'\n    username: '{{ user }}'\n    password:\
  \ '{{ pass }}'\n    issue: '{{ issue.meta.key }}'\n    operation: edit\n  args:\n    fields:\n     \
  \   labels:\n          - autocreated\n          - ansible\n\n# Updating a field using operations: add,\
  \ set & remove\n- name: Change the value of a Select dropdown\n  community.general.jira:\n    uri: '{{\
  \ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key\
  \ }}'\n    operation: update\n  args:\n    fields:\n      customfield_12931: [ {'set': {'value': 'Virtual'}}\
  \ ]\n      customfield_13820: [ {'set': {'value':'Manually'}} ]\n  register: cmdb_issue\n  delegate_to:\
  \ localhost\n\n\n# Retrieve metadata for an issue and use it to create an account\n- name: Get an issue\n\
  \  community.general.jira:\n    uri: '{{ server }}'\n    username: '{{ user }}'\n    password: '{{ pass\
  \ }}'\n    project: ANS\n    operation: fetch\n    issue: ANS-63\n  register: issue\n\n# Search for\
  \ an issue\n# You can limit the search for specific fields by adding optional args. Note! It must be\
  \ a dict, hence, lastViewed: null\n- name: Search for an issue\n  community.general.jira:\n    uri:\
  \ '{{ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    project: ANS\n    operation:\
  \ search\n    maxresults: 10\n    jql: project=cmdb AND cf[13225]=\"test\"\n  args:\n    fields:\n \
  \     lastViewed: null\n  register: issue\n\n- name: Create a unix account for the reporter\n  become:\
  \ true\n  user:\n    name: '{{ issue.meta.fields.creator.name }}'\n    comment: '{{ issue.meta.fields.creator.displayName\
  \ }}'\n\n# You can get list of valid linktypes at /rest/api/2/issueLinkType\n# url of your jira installation.\n\
  - name: Create link from HSP-1 to MKY-1\n  community.general.jira:\n    uri: '{{ server }}'\n    username:\
  \ '{{ user }}'\n    password: '{{ pass }}'\n    operation: link\n    linktype: Relates\n    inwardissue:\
  \ HSP-1\n    outwardissue: MKY-1\n\n# Transition an issue\n- name: Resolve the issue\n  community.general.jira:\n\
  \    uri: '{{ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: '{{ issue.meta.key\
  \ }}'\n    operation: transition\n    status: Resolve Issue\n    account_id: 112233445566778899aabbcc\n\
  \    fields:\n      resolution:\n        name: Done\n      description: I am done! This is the last\
  \ description I will ever give you.\n\n# Attach a file to an issue\n- name: Attach a file\n  community.general.jira:\n\
  \    uri: '{{ server }}'\n    username: '{{ user }}'\n    password: '{{ pass }}'\n    issue: HSP-1\n\
  \    operation: attach\n    attachment:\n      filename: topsecretreport.xlsx\n"
