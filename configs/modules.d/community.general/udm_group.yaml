name: udm_group
fqcn: community.general.udm_group
collection: community.general
short_description: Manage of the posix group
description: This module allows to manage user groups on a univention corporate server (UCS). It uses
  the python API of the UCS to create a new object or edit it.
options:
  description:
    type: str
    description: Group description.
  name:
    type: str
    required: true
    description: Name of the posix group.
  ou:
    type: str
    default: ''
    description: LDAP OU, e.g. school for LDAP OU C(ou=school,dc=example,dc=com).
  position:
    type: str
    default: ''
    description: define the whole ldap position of the group, e.g. C(cn=g123m-1A,cn=classes,cn=schueler,cn=groups,ou=schule,dc=example,dc=com).
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the group is present or not.
  subpath:
    type: str
    default: cn=groups
    description: Subpath inside the OU, e.g. C(cn=classes,cn=students,cn=groups).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a POSIX group\n  community.general.udm_group:\n    name: g123m-1A\n\n# Create\
  \ a POSIX group with the exact DN\n# C(cn=g123m-1A,cn=classes,cn=students,cn=groups,ou=school,dc=school,dc=example,dc=com)\n\
  - name: Create a POSIX group with a DN\n  community.general.udm_group:\n    name: g123m-1A\n    subpath:\
  \ 'cn=classes,cn=students,cn=groups'\n    ou: school\n\n# or\n- name: Create a POSIX group with a DN\n\
  \  community.general.udm_group:\n    name: g123m-1A\n    position: 'cn=classes,cn=students,cn=groups,ou=school,dc=school,dc=example,dc=com'\n"
