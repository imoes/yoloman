name: proxmox_domain_info
fqcn: community.general.proxmox_domain_info
collection: community.general
short_description: Retrieve information about one or more Proxmox VE domains
description: Retrieve information about one or more Proxmox VE domains.
options:
  api_host:
    type: str
    required: true
    description: Specify the target host of the Proxmox VE cluster.
  api_password:
    type: str
    description: Specify the password to authenticate with. You can use E(PROXMOX_PASSWORD) environment
      variable.
  api_token_id:
    type: str
    description: Specify the token ID. Requires C(proxmoxer>=1.1.0) to work.
  api_token_secret:
    type: str
    description: Specify the token secret. Requires C(proxmoxer>=1.1.0) to work.
  api_user:
    type: str
    required: true
    description: Specify the user to authenticate with.
  domain:
    type: str
    aliases:
    - realm
    - name
    description: Restrict results to a specific authentication realm.
  validate_certs:
    type: bool
    default: false
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
writes: false
runtime: starlark
source: translated
examples: "\n- name: List existing domains\n  community.general.proxmox_domain_info:\n    api_host: helldorado\n\
  \    api_user: root@pam\n    api_password: \"{{ password | default(omit) }}\"\n    api_token_id: \"\
  {{ token_id | default(omit) }}\"\n    api_token_secret: \"{{ token_secret | default(omit) }}\"\n  register:\
  \ proxmox_domains\n\n- name: Retrieve information about the pve domain\n  community.general.proxmox_domain_info:\n\
  \    api_host: helldorado\n    api_user: root@pam\n    api_password: \"{{ password | default(omit) }}\"\
  \n    api_token_id: \"{{ token_id | default(omit) }}\"\n    api_token_secret: \"{{ token_secret | default(omit)\
  \ }}\"\n    domain: pve\n  register: proxmox_domain_pve\n"
