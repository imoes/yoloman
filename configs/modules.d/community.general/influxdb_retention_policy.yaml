name: influxdb_retention_policy
fqcn: community.general.influxdb_retention_policy
collection: community.general
short_description: Manage InfluxDB retention policies
description: Manage InfluxDB retention policies.
options:
  database_name:
    type: str
    required: true
    description: Name of the database.
  default:
    type: bool
    default: false
    description: Sets the retention policy as default retention policy.
  duration:
    type: str
    description: Determines how long InfluxDB should keep the data. If specified, it should be V(INF)
      or at least one hour. If not specified, V(INF) is assumed. Supports complex duration expressions
      with multiple units. Required only if O(state) is set to V(present).
  hostname:
    type: str
    default: localhost
    description: The hostname or IP address on which InfluxDB server is listening.
  password:
    type: str
    default: root
    aliases:
    - login_password
    description: Password that will be used to authenticate against InfluxDB server.
  path:
    type: str
    default: ''
    description: The path on which InfluxDB server is accessible. Only available when using python-influxdb
      >= 5.1.0.
  policy_name:
    type: str
    required: true
    description: Name of the retention policy.
  port:
    type: int
    default: 8086
    description: The port on which InfluxDB server is listening.
  proxies:
    type: dict
    default: {}
    description: HTTP(S) proxy to use for Requests to connect to InfluxDB server.
  replication:
    type: int
    description: Determines how many independent copies of each point are stored in the cluster. Required
      only if O(state) is set to V(present).
  retries:
    type: int
    default: 3
    description: Number of retries client will try before aborting. V(0) indicates try until success.
      Only available when using python-influxdb >= 4.1.0.
  shard_group_duration:
    type: str
    description: Determines the time range covered by a shard group. If specified it must be at least
      one hour. If none, it's determined by InfluxDB by the rentention policy's duration. Supports complex
      duration expressions with multiple units.
  ssl:
    type: bool
    default: false
    description: Use https instead of http to connect to InfluxDB server.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: State of the retention policy.
  timeout:
    type: int
    description: Number of seconds Requests will wait for client to establish a connection.
  udp_port:
    type: int
    default: 4444
    description: UDP port to connect to InfluxDB server.
  use_udp:
    type: bool
    default: false
    description: Use UDP to connect to InfluxDB server.
  username:
    type: str
    default: root
    aliases:
    - login_username
    description: Username that will be used to authenticate against InfluxDB server.
  validate_certs:
    type: bool
    default: true
    description: If set to V(false), the SSL certificates will not be validated. This should only set
      to V(false) used on personally controlled sites using self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n# Example influxdb_retention_policy command from Ansible Playbooks\n- name: Create 1 hour\
  \ retention policy\n  community.general.influxdb_retention_policy:\n      hostname: \"{{ influxdb_ip_address\
  \ }}\"\n      database_name: \"{{ influxdb_database_name }}\"\n      policy_name: test\n      duration:\
  \ 1h\n      replication: 1\n      ssl: true\n      validate_certs: true\n      state: present\n\n- name:\
  \ Create 1 day retention policy with 1 hour shard group duration\n  community.general.influxdb_retention_policy:\n\
  \      hostname: \"{{ influxdb_ip_address }}\"\n      database_name: \"{{ influxdb_database_name }}\"\
  \n      policy_name: test\n      duration: 1d\n      replication: 1\n      shard_group_duration: 1h\n\
  \      state: present\n\n- name: Create 1 week retention policy with 1 day shard group duration\n  community.general.influxdb_retention_policy:\n\
  \      hostname: \"{{ influxdb_ip_address }}\"\n      database_name: \"{{ influxdb_database_name }}\"\
  \n      policy_name: test\n      duration: 1w\n      replication: 1\n      shard_group_duration: 1d\n\
  \      state: present\n\n- name: Create infinite retention policy with 1 week of shard group duration\n\
  \  community.general.influxdb_retention_policy:\n      hostname: \"{{ influxdb_ip_address }}\"\n   \
  \   database_name: \"{{ influxdb_database_name }}\"\n      policy_name: test\n      duration: INF\n\
  \      replication: 1\n      ssl: false\n      shard_group_duration: 1w\n      state: present\n\n- name:\
  \ Create retention policy with complex durations\n  community.general.influxdb_retention_policy:\n \
  \     hostname: \"{{ influxdb_ip_address }}\"\n      database_name: \"{{ influxdb_database_name }}\"\
  \n      policy_name: test\n      duration: 5d1h30m\n      replication: 1\n      ssl: false\n      shard_group_duration:\
  \ 1d10h30m\n      state: present\n\n- name: Drop retention policy\n  community.general.influxdb_retention_policy:\n\
  \      hostname: \"{{ influxdb_ip_address }}\"\n      database_name: \"{{ influxdb_database_name }}\"\
  \n      policy_name: test\n      state: absent\n"
