name: rundeck_job_executions_info
fqcn: community.general.rundeck_job_executions_info
collection: community.general
short_description: Query executions for a Rundeck job
description: This module gets the list of executions for a specified Rundeck job.
options:
  api_token:
    type: str
    required: true
    description: Rundeck User API Token.
  api_version:
    type: int
    default: 39
    description: Rundeck API version to be used. API version must be at least 14.
  client_cert:
    type: path
    description: PEM formatted certificate chain file to be used for SSL client authentication. This file
      can also include the key as well, and if the key is included, O(client_key) is not required.
  client_key:
    type: path
    description: PEM formatted file that contains your private key to be used for SSL client authentication.
      If O(client_cert) contains both the certificate and key, this option is not required.
  force:
    type: bool
    default: false
    description: If V(yes) do not get a cached copy.
  force_basic_auth:
    type: bool
    default: false
    description: Credentials specified with O(url_username) and O(url_password) should be passed in HTTP
      Header.
  http_agent:
    type: str
    default: ansible-httpget
    description: Header to identify as, generally appears in web server logs.
  job_id:
    type: str
    required: true
    description: The job unique ID.
  max:
    type: int
    default: 20
    description: Max results to return.
  offset:
    type: int
    default: 0
    description: The start point to return the results.
  status:
    type: str
    choices:
    - succeeded
    - failed
    - aborted
    - running
    description: The job status to filter.
  url:
    type: str
    required: true
    description: Rundeck instance URL.
  url_password:
    type: str
    description: The password for use in HTTP basic authentication. If the O(url_username) parameter is
      not specified, the O(url_password) parameter will not be used.
  url_username:
    type: str
    description: The username for use in HTTP basic authentication. This parameter can be used without
      O(url_password) for sites that allow empty passwords
  use_gssapi:
    type: bool
    default: false
    description: Use GSSAPI to perform the authentication, typically this is for Kerberos or Kerberos
      through Negotiate authentication. Requires the Python library L(gssapi,https://github.com/pythongssapi/python-gssapi)
      to be installed. Credentials for GSSAPI can be specified with O(url_username)/O(url_password) or
      with the GSSAPI env var C(KRB5CCNAME) that specified a custom Kerberos credential cache. NTLM authentication
      is B(not) supported even if the GSSAPI mech for NTLM has been installed.
  use_proxy:
    type: bool
    default: true
    description: If V(no), it will not use a proxy, even if one is defined in an environment variable
      on the target hosts.
  validate_certs:
    type: bool
    default: true
    description: If V(no), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Get Rundeck job executions info\n  community.general.rundeck_job_executions_info:\n\
  \    url: \"https://rundeck.example.org\"\n    api_version: 39\n    api_token: \"mytoken\"\n    job_id:\
  \ \"xxxxxxxxxxxxxxxxx\"\n  register: rundeck_job_executions_info\n\n- name: Show Rundeck job executions\
  \ info\n  ansible.builtin.debug:\n    var: rundeck_job_executions_info.executions\n"
