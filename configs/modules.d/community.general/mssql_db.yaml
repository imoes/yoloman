name: mssql_db
fqcn: community.general.mssql_db
collection: community.general
short_description: Add or remove MSSQL databases from a remote host
description: Add or remove MSSQL databases from a remote host.
options:
  autocommit:
    type: bool
    default: false
    description: Automatically commit the change only if the import succeed. Sometimes it is necessary
      to use autocommit=true, since some content can't be changed within a transaction.
  login_host:
    type: str
    required: true
    description: Host running the database
  login_password:
    type: str
    default: ''
    description: The password used to authenticate with
  login_port:
    type: str
    default: '1433'
    description: Port of the MSSQL server. Requires login_host be defined as other than localhost if login_port
      is used
  login_user:
    type: str
    default: ''
    description: The username used to authenticate with
  name:
    type: str
    required: true
    aliases:
    - db
    description: name of the database to add or remove
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - import
    description: The database state
  target:
    type: str
    description: Location, on the remote host, of the dump file to read from or write to. Uncompressed
      SQL files (C(.sql)) files are supported.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a new database with name 'jackdata'\n  community.general.mssql_db:\n    name:\
  \ jackdata\n    state: present\n\n# Copy database dump file to remote host and restore it to database\
  \ 'my_db'\n- name: Copy database dump file to remote host\n  ansible.builtin.copy:\n    src: dump.sql\n\
  \    dest: /tmp\n\n- name: Restore the dump file to database 'my_db'\n  community.general.mssql_db:\n\
  \    name: my_db\n    state: import\n    target: /tmp/dump.sql\n"
