name: django_manage
fqcn: community.general.django_manage
collection: community.general
short_description: Manages a Django application
description: Manages a Django application using the C(manage.py) application frontend to C(django-admin).
  With the O(virtualenv) parameter, all management commands will be executed by the given C(virtualenv)
  installation.
options:
  ack_venv_creation_deprecation:
    type: bool
    description: When a O(virtualenv) is set but the virtual environment does not exist, the current behavior
      is to create a new virtual environment. That behavior is deprecated and if that case happens it
      will generate a deprecation warning. Set this flag to V(true) to suppress the deprecation warning.
      Please note that you will receive no further warning about this being removed until the module will
      start failing in such cases from community.general 9.0.0 on.
  apps:
    type: str
    description: A list of space-delimited apps to target. Used by the V(test) command.
  cache_table:
    type: str
    description: The name of the table used for database-backed caching. Used by the V(createcachetable)
      command.
  clear:
    type: bool
    default: false
    description: Clear the existing files before trying to copy or link the original file. Used only with
      the V(collectstatic) command. The C(--noinput) argument will be added automatically.
  command:
    type: str
    required: true
    description: "The name of the Django management command to run. The commands listed below are built\
      \ in this module and have some basic parameter validation. V(cleanup) - clean up old data from the\
      \ database (deprecated in Django 1.5). This parameter will be removed in community.general 9.0.0.\
      \ Use V(clearsessions) instead.\n V(collectstatic) - Collects the static files into C(STATIC_ROOT).\
      \ V(createcachetable) - Creates the cache tables for use with the database cache backend. V(flush)\
      \ - Removes all data from the database. V(loaddata) - Searches for and loads the contents of the\
      \ named O(fixtures) into the database. V(migrate) - Synchronizes the database state with models\
      \ and migrations. V(syncdb) - Synchronizes the database state with models and migrations (deprecated\
      \ in Django 1.7). This parameter will be removed in community.general 9.0.0. Use V(migrate) instead.\n\
      \ V(test) - Runs tests for all installed apps. V(validate) - Validates all installed models (deprecated\
      \ in Django 1.7). This parameter will be removed in community.general 9.0.0. Use V(check) instead.\n\
      \ Other commands can be entered, but will fail if they are unknown to Django.  Other commands that\
      \ may prompt for user input should be run with the C(--noinput) flag."
  database:
    type: str
    description: The database to target. Used by the V(createcachetable), V(flush), V(loaddata), V(syncdb),
      and V(migrate) commands.
  failfast:
    type: bool
    default: false
    aliases:
    - fail_fast
    description: Fail the command immediately if a test fails. Used by the V(test) command.
  fixtures:
    type: str
    description: A space-delimited list of fixture file names to load in the database. B(Required) by
      the V(loaddata) command.
  link:
    type: bool
    description: Will create links to the files instead of copying them, you can only use this parameter
      with V(collectstatic) command.
  merge:
    type: bool
    description: Will run out-of-order or missing migrations as they are not rollback migrations, you
      can only use this parameter with V(migrate) command.
  project_path:
    type: path
    required: true
    aliases:
    - app_path
    - chdir
    description: The path to the root of the Django application where C(manage.py) lives.
  pythonpath:
    type: path
    aliases:
    - python_path
    description: A directory to add to the Python path. Typically used to include the settings module
      if it is located external to the application directory. This would be equivalent to adding O(pythonpath)'s
      value to the E(PYTHONPATH) environment variable.
  settings:
    type: path
    description: The Python path to the application's settings module, such as V(myapp.settings).
  skip:
    type: bool
    description: Will skip over out-of-order missing migrations, you can only use this parameter with
      V(migrate) command.
  testrunner:
    type: str
    aliases:
    - test_runner
    description: Controls the test runner class that is used to execute tests. This parameter is passed
      as-is to C(manage.py).
  virtualenv:
    type: path
    aliases:
    - virtual_env
    description: An optional path to a C(virtualenv) installation to use while running the manage application.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Run cleanup on the application installed in django_dir\n  community.general.django_manage:\n\
  \    command: cleanup\n    project_path: \"{{ django_dir }}\"\n\n- name: Load the initial_data fixture\
  \ into the application\n  community.general.django_manage:\n    command: loaddata\n    project_path:\
  \ \"{{ django_dir }}\"\n    fixtures: \"{{ initial_data }}\"\n\n- name: Run syncdb on the application\n\
  \  community.general.django_manage:\n    command: syncdb\n    project_path: \"{{ django_dir }}\"\n \
  \   settings: \"{{ settings_app_name }}\"\n    pythonpath: \"{{ settings_dir }}\"\n    virtualenv: \"\
  {{ virtualenv_dir }}\"\n\n- name: Run the SmokeTest test case from the main app. Useful for testing\
  \ deploys\n  community.general.django_manage:\n    command: test\n    project_path: \"{{ django_dir\
  \ }}\"\n    apps: main.SmokeTest\n\n- name: Create an initial superuser\n  community.general.django_manage:\n\
  \    command: \"createsuperuser --noinput --username=admin --email=admin@example.com\"\n    project_path:\
  \ \"{{ django_dir }}\"\n"
