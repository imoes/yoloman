name: rax_mon_notification_plan
fqcn: community.general.rax_mon_notification_plan
collection: community.general
short_description: Create or delete a Rackspace Cloud Monitoring notification plan.
description: Create or delete a Rackspace Cloud Monitoring notification plan by associating existing rax_mon_notifications
  with severity levels. Rackspace monitoring module flow | rax_mon_entity -> rax_mon_check -> rax_mon_notification
  -> *rax_mon_notification_plan* -> rax_mon_alarm
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  critical_state:
    type: list
    description: Notification list to use when the alarm state is CRITICAL. Must be an array of valid
      rax_mon_notification ids.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  label:
    type: str
    required: true
    description: Defines a friendly name for this notification plan. String between 1 and 255 characters
      long.
  ok_state:
    type: list
    description: Notification list to use when the alarm state is OK. Must be an array of valid rax_mon_notification
      ids.
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Ensure that the notification plan with this O(label) exists or does not exist.
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  warning_state:
    type: list
    description: Notification list to use when the alarm state is WARNING. Must be an array of valid rax_mon_notification
      ids.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Example notification plan\n  gather_facts: false\n  hosts: local\n  connection: local\n\
  \  tasks:\n  - name: Establish who gets called when.\n    community.general.rax_mon_notification_plan:\n\
  \      credentials: ~/.rax_pub\n      state: present\n      label: defcon1\n      critical_state:\n\
  \      - \"{{ everyone['notification']['id'] }}\"\n      warning_state:\n      - \"{{ opsfloor['notification']['id']\
  \ }}\"\n    register: defcon1\n"
