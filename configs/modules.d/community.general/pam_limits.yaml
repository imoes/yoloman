name: pam_limits
fqcn: community.general.pam_limits
collection: community.general
short_description: Modify Linux PAM limits
description: The M(community.general.pam_limits) module modifies PAM limits. The default file is V(/etc/security/limits.conf).
  For the full documentation, see C(man 5 limits.conf).
options:
  backup:
    type: bool
    default: false
    description: Create a backup file including the timestamp information so you can get the original
      file back if you somehow clobbered it incorrectly.
  comment:
    type: str
    default: ''
    description: Comment associated with the limit.
  dest:
    type: str
    default: /etc/security/limits.conf
    description: Modify the limits.conf path.
  domain:
    type: str
    required: true
    description: A username, @groupname, wildcard, UID/GID range.
  limit_item:
    type: str
    required: true
    choices:
    - core
    - data
    - fsize
    - memlock
    - nofile
    - rss
    - stack
    - cpu
    - nproc
    - as
    - maxlogins
    - maxsyslogins
    - priority
    - locks
    - sigpending
    - msgqueue
    - nice
    - rtprio
    - chroot
    description: The limit to be set.
  limit_type:
    type: str
    required: true
    choices:
    - hard
    - soft
    - '-'
    description: Limit type, see C(man 5 limits.conf) for an explanation.
  use_max:
    type: bool
    default: false
    description: If set to V(true), the maximal value will be used or conserved. If the specified value
      is superior to the value in the file, file content is replaced with the new value, else content
      is not modified.
  use_min:
    type: bool
    default: false
    description: If set to V(true), the minimal value will be used or conserved. If the specified value
      is inferior to the value in the file, file content is replaced with the new value, else content
      is not modified.
  value:
    type: str
    required: true
    description: The value of the limit. Value must either be V(unlimited), V(infinity) or V(-1), all
      of which indicate no limit, or a limit of 0 or larger. Value must be a number in the range -20 to
      19 inclusive, if O(limit_item) is set to V(nice) or V(priority). Refer to the C(man 5 limits.conf)
      manual pages for more details.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add or modify nofile soft limit for the user joe\n  community.general.pam_limits:\n\
  \    domain: joe\n    limit_type: soft\n    limit_item: nofile\n    value: 64000\n\n- name: Add or modify\
  \ fsize hard limit for the user smith. Keep or set the maximal value\n  community.general.pam_limits:\n\
  \    domain: smith\n    limit_type: hard\n    limit_item: fsize\n    value: 1000000\n    use_max: true\n\
  \n- name: Add or modify memlock, both soft and hard, limit for the user james with a comment\n  community.general.pam_limits:\n\
  \    domain: james\n    limit_type: '-'\n    limit_item: memlock\n    value: unlimited\n    comment:\
  \ unlimited memory lock for james\n\n- name: Add or modify hard nofile limits for wildcard domain\n\
  \  community.general.pam_limits:\n    domain: '*'\n    limit_type: hard\n    limit_item: nofile\n  \
  \  value: 39693561\n"
