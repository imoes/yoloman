name: keycloak_authz_authorization_scope
fqcn: community.general.keycloak_authz_authorization_scope
collection: community.general
short_description: Allows administration of Keycloak client authorization scopes via Keycloak API
description: This module allows the administration of Keycloak client Authorization Scopes via the Keycloak
  REST API. Authorization Scopes are only available if a client has Authorization enabled. This module
  requires access to the REST API via OpenID Connect; the user connecting and the realm being used must
  have the requisite access rights. In a default Keycloak installation, admin-cli and an admin user would
  work, as would a separate realm definition with the scope tailored to your needs and a user having the
  expected roles. The names of module options are snake_cased versions of the camelCase options used by
  Keycloak. The Authorization Services paths and payloads have not officially been documented by the Keycloak
  project. U(https://www.puppeteers.net/blog/keycloak-authorization-services-rest-api-paths-and-payload/)
options:
  auth_client_id:
    type: str
    default: admin-cli
    description: OpenID Connect C(client_id) to authenticate to the API with.
  auth_client_secret:
    type: str
    description: Client Secret to use in conjunction with O(auth_client_id) (if required).
  auth_keycloak_url:
    type: str
    required: true
    aliases:
    - url
    description: URL to the Keycloak instance.
  auth_password:
    type: str
    aliases:
    - password
    description: Password to authenticate for API access with.
  auth_realm:
    type: str
    description: Keycloak realm name to authenticate to for API access.
  auth_username:
    type: str
    aliases:
    - username
    description: Username to authenticate for API access with.
  client_id:
    type: str
    required: true
    description: The C(clientId) of the Keycloak client that should have the authorization scope. This
      is usually a human-readable name of the Keycloak client.
  connection_timeout:
    type: int
    default: 10
    description: Controls the HTTP connections timeout period (in seconds) to Keycloak API.
  display_name:
    type: str
    description: The display name of the authorization scope.
  http_agent:
    type: str
    default: Ansible
    description: Configures the HTTP User-Agent header.
  icon_uri:
    type: str
    description: The icon URI for the authorization scope.
  name:
    type: str
    required: true
    description: Name of the authorization scope to create.
  realm:
    type: str
    required: true
    description: The name of the Keycloak realm the Keycloak client is in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the authorization scope. On V(present), the authorization scope will be created
      (or updated if it exists already). On V(absent), the authorization scope will be removed if it exists.
  token:
    type: str
    description: Authentication token for Keycloak API.
  validate_certs:
    type: bool
    default: true
    description: Verify TLS certificates (do not disable this in production).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Manage Keycloak file:delete authorization scope\n  keycloak_authz_authorization_scope:\n\
  \    name: file:delete\n    state: present\n    display_name: File delete\n    client_id: myclient\n\
  \    realm: myrealm\n    auth_keycloak_url: http://localhost:8080/auth\n    auth_username: keycloak\n\
  \    auth_password: keycloak\n    auth_realm: master\n"
