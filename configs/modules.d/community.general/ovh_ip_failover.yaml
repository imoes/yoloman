name: ovh_ip_failover
fqcn: community.general.ovh_ip_failover
collection: community.general
short_description: Manage OVH IP failover address
description: Manage OVH (French European hosting provider) IP Failover Address. For now, this module can
  only be used to move an ip failover (or failover block) between services
options:
  application_key:
    type: str
    required: true
    description: The applicationKey to use
  application_secret:
    type: str
    required: true
    description: The application secret to use
  consumer_key:
    type: str
    required: true
    description: The consumer key to use
  endpoint:
    type: str
    required: true
    description: The endpoint to use ( for instance ovh-eu)
  name:
    type: str
    required: true
    description: The IP address to manage (can be a single IP like 1.1.1.1 or a block like 1.1.1.1/28
      )
  service:
    type: str
    required: true
    description: The name of the OVH service this IP address should be routed
  timeout:
    type: int
    default: 120
    description: The timeout in seconds used to wait for a task to be completed. Default is 120 seconds.
  wait_completion:
    type: bool
    default: true
    description: If true, the module will wait for the IP address to be moved. If false, exit without
      waiting. The taskId will be returned in module output
  wait_task_completion:
    type: int
    default: 0
    description: If not 0, the module will wait for this task id to be completed. Use wait_task_completion
      if you want to wait for completion of a previously executed task with wait_completion=false. You
      can execute this module repeatedly on a list of failover IPs using wait_completion=false (see examples)
writes: true
runtime: starlark
source: translated
examples: "\n# Route an IP address 1.1.1.1 to the service ns666.ovh.net\n- community.general.ovh_ip_failover:\n\
  \    name: 1.1.1.1\n    service: ns666.ovh.net\n    endpoint: ovh-eu\n    application_key: yourkey\n\
  \    application_secret: yoursecret\n    consumer_key: yourconsumerkey\n- community.general.ovh_ip_failover:\n\
  \    name: 1.1.1.1\n    service: ns666.ovh.net\n    endpoint: ovh-eu\n    wait_completion: false\n \
  \   application_key: yourkey\n    application_secret: yoursecret\n    consumer_key: yourconsumerkey\n\
  \  register: moved\n- community.general.ovh_ip_failover:\n    name: 1.1.1.1\n    service: ns666.ovh.net\n\
  \    endpoint: ovh-eu\n    wait_task_completion: \"{{moved.taskId}}\"\n    application_key: yourkey\n\
  \    application_secret: yoursecret\n    consumer_key: yourconsumerkey\n"
