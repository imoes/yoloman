name: selogin
fqcn: community.general.selogin
collection: community.general
short_description: Manages linux user to SELinux user mapping
description: Manages linux user to SELinux user mapping
options:
  ignore_selinux_state:
    type: bool
    default: false
    description: Run independent of selinux runtime state
  login:
    type: str
    required: true
    description: a Linux user
  reload:
    type: bool
    default: true
    description: Reload SELinux policy after commit.
  selevel:
    type: str
    default: s0
    aliases:
    - serange
    description: MLS/MCS Security Range (MLS/MCS Systems only) SELinux Range for SELinux login mapping
      defaults to the SELinux user record range.
  seuser:
    type: str
    description: SELinux user name
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Desired mapping value.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Modify the default user on the system to the guest_u user\n  community.general.selogin:\n\
  \    login: __default__\n    seuser: guest_u\n    state: present\n\n- name: Assign gijoe user on an\
  \ MLS machine a range and to the staff_u user\n  community.general.selogin:\n    login: gijoe\n    seuser:\
  \ staff_u\n    serange: SystemLow-Secret\n    state: present\n\n- name: Assign all users in the engineering\
  \ group to the staff_u user\n  community.general.selogin:\n    login: '%engineering'\n    seuser: staff_u\n\
  \    state: present\n"
