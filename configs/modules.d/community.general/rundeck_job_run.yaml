name: rundeck_job_run
fqcn: community.general.rundeck_job_run
collection: community.general
short_description: Run a Rundeck job
description: This module runs a Rundeck job specified by ID.
options:
  abort_on_timeout:
    type: bool
    default: false
    description: Send a job abort request if exceeded the O(wait_execution_timeout) specified.
  api_token:
    type: str
    required: true
    description: Rundeck User API Token.
  api_version:
    type: int
    default: 39
    description: Rundeck API version to be used. API version must be at least 14.
  client_cert:
    type: path
    description: PEM formatted certificate chain file to be used for SSL client authentication. This file
      can also include the key as well, and if the key is included, O(client_key) is not required.
  client_key:
    type: path
    description: PEM formatted file that contains your private key to be used for SSL client authentication.
      If O(client_cert) contains both the certificate and key, this option is not required.
  filter_nodes:
    type: str
    description: Filter the nodes where the jobs must run. See U(https://docs.rundeck.com/docs/manual/11-node-filters.html#node-filter-syntax).
  force:
    type: bool
    default: false
    description: If V(yes) do not get a cached copy.
  force_basic_auth:
    type: bool
    default: false
    description: Credentials specified with O(url_username) and O(url_password) should be passed in HTTP
      Header.
  http_agent:
    type: str
    default: ansible-httpget
    description: Header to identify as, generally appears in web server logs.
  job_id:
    type: str
    required: true
    description: The job unique ID.
  job_options:
    type: dict
    description: The job options for the steps. Numeric values must be quoted.
  loglevel:
    type: str
    default: info
    choices:
    - debug
    - verbose
    - info
    - warn
    - error
    description: Log level configuration.
  run_at_time:
    type: str
    description: Schedule the job execution to run at specific date and time. ISO-8601 date and time format
      like V(2021-10-05T15:45:00-03:00).
  url:
    type: str
    required: true
    description: Rundeck instance URL.
  url_password:
    type: str
    description: The password for use in HTTP basic authentication. If the O(url_username) parameter is
      not specified, the O(url_password) parameter will not be used.
  url_username:
    type: str
    description: The username for use in HTTP basic authentication. This parameter can be used without
      O(url_password) for sites that allow empty passwords
  use_gssapi:
    type: bool
    default: false
    description: Use GSSAPI to perform the authentication, typically this is for Kerberos or Kerberos
      through Negotiate authentication. Requires the Python library L(gssapi,https://github.com/pythongssapi/python-gssapi)
      to be installed. Credentials for GSSAPI can be specified with O(url_username)/O(url_password) or
      with the GSSAPI env var C(KRB5CCNAME) that specified a custom Kerberos credential cache. NTLM authentication
      is B(not) supported even if the GSSAPI mech for NTLM has been installed.
  use_proxy:
    type: bool
    default: true
    description: If V(no), it will not use a proxy, even if one is defined in an environment variable
      on the target hosts.
  validate_certs:
    type: bool
    default: true
    description: If V(no), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
  wait_execution:
    type: bool
    default: true
    description: Wait until the job finished the execution.
  wait_execution_delay:
    type: int
    default: 5
    description: Delay, in seconds, between job execution status check requests.
  wait_execution_timeout:
    type: int
    default: 120
    description: Job execution wait timeout in seconds. If the timeout is reached, the job will be aborted.
      Keep in mind that there is a sleep based on O(wait_execution_delay) after each job status check.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Run a Rundeck job\n  community.general.rundeck_job_run:\n    url: \"https://rundeck.example.org\"\
  \n    api_version: 39\n    api_token: \"mytoken\"\n    job_id: \"xxxxxxxxxxxxxxxxx\"\n  register: rundeck_job_run\n\
  \n- name: Show execution info\n  ansible.builtin.debug:\n    var: rundeck_job_run.execution_info\n\n\
  - name: Run a Rundeck job with options\n  community.general.rundeck_job_run:\n    url: \"https://rundeck.example.org\"\
  \n    api_version: 39\n    api_token: \"mytoken\"\n    job_id: \"xxxxxxxxxxxxxxxxx\"\n    job_options:\n\
  \        option_1: \"value_1\"\n        option_2: \"value_3\"\n        option_3: \"value_3\"\n  register:\
  \ rundeck_job_run\n\n- name: Run a Rundeck job with timeout, delay between status check and abort on\
  \ timeout\n  community.general.rundeck_job_run:\n    url: \"https://rundeck.example.org\"\n    api_version:\
  \ 39\n    api_token: \"mytoken\"\n    job_id: \"xxxxxxxxxxxxxxxxx\"\n    wait_execution_timeout: 30\n\
  \    wait_execution_delay: 10\n    abort_on_timeout: true\n  register: rundeck_job_run\n\n- name: Schedule\
  \ a Rundeck job\n  community.general.rundeck_job_run:\n    url: \"https://rundeck.example.org\"\n  \
  \  api_version: 39\n    api_token: \"mytoken\"\n    job_id: \"xxxxxxxxxxxxxxxxx\"\n    run_at_time:\
  \ \"2021-10-05T15:45:00-03:00\"\n  register: rundeck_job_schedule\n\n- name: Fire-and-forget a Rundeck\
  \ job\n  community.general.rundeck_job_run:\n    url: \"https://rundeck.example.org\"\n    api_version:\
  \ 39\n    api_token: \"mytoken\"\n    job_id: \"xxxxxxxxxxxxxxxxx\"\n    wait_execution: false\n  register:\
  \ rundeck_job_run\n"
