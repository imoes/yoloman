name: ipbase_info
fqcn: community.general.ipbase_info
collection: community.general
short_description: Retrieve IP geolocation and other facts of a host's IP address using the ipbase.com
  API
description: Retrieve IP geolocation and other facts of a host's IP address using the ipbase.com API
options:
  apikey:
    type: str
    description: The API key for the request if you need more requests.
  hostname:
    type: bool
    default: false
    description: If the O(hostname) parameter is set to V(true), the API response will contain the hostname
      of the IP.
  ip:
    type: str
    description: The IP you want to get the info for. If not specified the API will detect the IP automatically.
  language:
    type: str
    default: en
    description: An ISO Alpha 2 Language Code for localizing the IP data
writes: false
runtime: starlark
source: translated
examples: "\n- name: \"Get IP geolocation information of the primary outgoing IP\"\n  community.general.ipbase_info:\n\
  \  register: my_ip_info\n\n- name: \"Get IP geolocation information of a specific IP\"\n  community.general.ipbase_info:\n\
  \    ip: \"8.8.8.8\"\n  register: my_ip_info\n\n\n- name: \"Get IP geolocation information of a specific\
  \ IP with all other possible parameters\"\n  community.general.ipbase_info:\n    ip: \"8.8.8.8\"\n \
  \   apikey: \"xxxxxxxxxxxxxxxxxxxxxx\"\n    hostname: true\n    language: \"de\"\n  register: my_ip_info\n\
  \n"
