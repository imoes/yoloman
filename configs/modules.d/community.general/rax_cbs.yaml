name: rax_cbs
fqcn: community.general.rax_cbs
collection: community.general
short_description: Manipulate Rackspace Cloud Block Storage Volumes
description: Manipulate Rackspace Cloud Block Storage Volumes
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  description:
    type: str
    description: Description to give the volume being created.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  image:
    type: str
    description: Image to use for bootable volumes. Can be an C(id), C(human_id) or C(name). This option
      requires C(pyrax>=1.9.3).
  meta:
    type: dict
    default: {}
    description: A hash of metadata to associate with the volume.
  name:
    type: str
    required: true
    description: Name to give the volume being created.
  region:
    type: str
    description: Region to create an instance in.
  size:
    type: int
    default: 100
    description: Size of the volume to create in Gigabytes.
  snapshot_id:
    type: str
    description: The id of the snapshot to create the volume from.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource.
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  volume_type:
    type: str
    default: SATA
    choices:
    - SATA
    - SSD
    description: Type of the volume being created.
  wait:
    type: bool
    default: false
    description: Wait for the volume to be in state C(available) before returning.
  wait_timeout:
    type: int
    default: 300
    description: how long before wait gives up, in seconds.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Build a Block Storage Volume\n  gather_facts: false\n  hosts: local\n  connection:\
  \ local\n  tasks:\n    - name: Storage volume create request\n      local_action:\n        module: rax_cbs\n\
  \        credentials: ~/.raxpub\n        name: my-volume\n        description: My Volume\n        volume_type:\
  \ SSD\n        size: 150\n        region: DFW\n        wait: true\n        state: present\n        meta:\n\
  \          app: my-cool-app\n      register: my_volume\n"
