name: ipa_sudorule
fqcn: community.general.ipa_sudorule
collection: community.general
short_description: Manage FreeIPA sudo rule
description: Add, modify or delete sudo rule within IPA server using IPA API.
options:
  cmd:
    type: list
    description: List of commands assigned to the rule. If an empty list is passed all commands will be
      removed from the rule. If option is omitted commands will not be checked or changed.
  cmdcategory:
    type: str
    choices:
    - all
    description: Command category the rule applies to.
  cmdgroup:
    type: list
    description: List of command groups assigned to the rule. If an empty list is passed all command groups
      will be removed from the rule. If option is omitted command groups will not be checked or changed.
  cn:
    type: str
    required: true
    aliases:
    - name
    description: Canonical name. Can not be changed as it is the unique identifier.
  deny_cmd:
    type: list
    description: List of denied commands assigned to the rule. If an empty list is passed all commands
      will be removed from the rule. If option is omitted commands will not be checked or changed.
  deny_cmdgroup:
    type: list
    description: List of denied command groups assigned to the rule. If an empty list is passed all command
      groups will be removed from the rule. If option is omitted command groups will not be checked or
      changed.
  description:
    type: str
    description: Description of the sudo rule.
  host:
    type: list
    description: List of hosts assigned to the rule. If an empty list is passed all hosts will be removed
      from the rule. If option is omitted hosts will not be checked or changed. Option O(hostcategory)
      must be omitted to assign hosts.
  hostcategory:
    type: str
    choices:
    - all
    description: Host category the rule applies to. If V(all) is passed one must omit O(host) and O(hostgroup).
      Option O(host) and O(hostgroup) must be omitted to assign V(all).
  hostgroup:
    type: list
    description: List of host groups assigned to the rule. If an empty list is passed all host groups
      will be removed from the rule. If option is omitted host groups will not be checked or changed.
      Option O(hostcategory) must be omitted to assign host groups.
  ipa_host:
    type: str
    default: ipa.example.com
    description: IP or hostname of IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_HOST) will be used instead. If both the environment variable E(IPA_HOST)
      and the value are not specified in the task, then DNS will be used to try to discover the FreeIPA
      server. The relevant entry needed in FreeIPA is the C(ipa-ca) entry. If neither the DNS entry, nor
      the environment E(IPA_HOST), nor the value are available in the task, then the default value will
      be used.
  ipa_pass:
    type: str
    description: Password of administrative user. If the value is not specified in the task, the value
      of environment variable E(IPA_PASS) will be used instead. Note that if the C(urllib_gssapi) library
      is available, it is possible to use GSSAPI to authenticate to FreeIPA. If the environment variable
      E(KRB5CCNAME) is available, the module will use this kerberos credentials cache to authenticate
      to the FreeIPA server. If the environment variable E(KRB5_CLIENT_KTNAME) is available, and E(KRB5CCNAME)
      is not; the module will use this kerberos keytab to authenticate. If GSSAPI is not available, the
      usage of O(ipa_pass) is required.
  ipa_port:
    type: int
    default: 443
    description: Port of FreeIPA / IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PORT) will be used instead. If both the environment variable E(IPA_PORT)
      and the value are not specified in the task, then default value is set.
  ipa_prot:
    type: str
    default: https
    choices:
    - http
    - https
    description: Protocol used by IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PROT) will be used instead. If both the environment variable E(IPA_PROT)
      and the value are not specified in the task, then default value is set.
  ipa_timeout:
    type: int
    default: 10
    description: Specifies idle timeout (in seconds) for the connection. For bulk operations, you may
      want to increase this in order to avoid timeout from IPA server. If the value is not specified in
      the task, the value of environment variable E(IPA_TIMEOUT) will be used instead. If both the environment
      variable E(IPA_TIMEOUT) and the value are not specified in the task, then default value is set.
  ipa_user:
    type: str
    default: admin
    description: Administrative account used on IPA server. If the value is not specified in the task,
      the value of environment variable E(IPA_USER) will be used instead. If both the environment variable
      E(IPA_USER) and the value are not specified in the task, then default value is set.
  runasextusers:
    type: list
    description: List of external RunAs users
  runasgroupcategory:
    type: str
    choices:
    - all
    description: RunAs Group category the rule applies to.
  runasusercategory:
    type: str
    choices:
    - all
    description: RunAs User category the rule applies to.
  state:
    type: str
    default: present
    choices:
    - absent
    - disabled
    - enabled
    - present
    description: State to ensure.
  sudoopt:
    type: list
    description: List of options to add to the sudo rule.
  user:
    type: list
    description: List of users assigned to the rule. If an empty list is passed all users will be removed
      from the rule. If option is omitted users will not be checked or changed.
  usercategory:
    type: str
    choices:
    - all
    description: User category the rule applies to.
  usergroup:
    type: list
    description: List of user groups assigned to the rule. If an empty list is passed all user groups
      will be removed from the rule. If option is omitted user groups will not be checked or changed.
  validate_certs:
    type: bool
    default: true
    description: This only applies if O(ipa_prot) is V(https). If set to V(false), the SSL certificates
      will not be validated. This should only set to V(false) used on personally controlled sites using
      self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure sudo rule is present that's allows all every body to execute any command on\
  \ any host without being asked for a password.\n  community.general.ipa_sudorule:\n    name: sudo_all_nopasswd\n\
  \    cmdcategory: all\n    description: Allow to run every command with sudo without password\n    hostcategory:\
  \ all\n    sudoopt:\n    - '!authenticate'\n    usercategory: all\n    ipa_host: ipa.example.com\n \
  \   ipa_user: admin\n    ipa_pass: topsecret\n\n- name: Ensure user group developers can run every command\
  \ on host group db-server as well as on host db01.example.com.\n  community.general.ipa_sudorule:\n\
  \    name: sudo_dev_dbserver\n    description: Allow developers to run every command with sudo on all\
  \ database server\n    cmdcategory: all\n    host:\n    - db01.example.com\n    hostgroup:\n    - db-server\n\
  \    sudoopt:\n    - '!authenticate'\n    usergroup:\n    - developers\n    ipa_host: ipa.example.com\n\
  \    ipa_user: admin\n    ipa_pass: topsecret\n\n- name: Ensure user group operations can run any commands\
  \ that is part of operations-cmdgroup on any host as user root.\n  community.general.ipa_sudorule:\n\
  \    name: sudo_operations_all\n    description: Allow operators to run any commands that is part of\
  \ operations-cmdgroup on any host as user root.\n    cmdgroup:\n    - operations-cmdgroup\n    hostcategory:\
  \ all\n    runasextusers:\n    - root\n    sudoopt:\n    - '!authenticate'\n    usergroup:\n    - operators\n\
  \    ipa_host: ipa.example.com\n    ipa_user: admin\n    ipa_pass: topsecret\n"
