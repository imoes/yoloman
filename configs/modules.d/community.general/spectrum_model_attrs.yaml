name: spectrum_model_attrs
fqcn: community.general.spectrum_model_attrs
collection: community.general
short_description: Enforce a model's attributes in CA Spectrum
description: This module can be used to enforce a model's attributes in CA Spectrum.
options:
  attributes:
    type: list
    required: true
    description: A list of attribute names and values to enforce. All values and parameters are case sensitive
      and must be provided as strings only.
  name:
    type: str
    required: true
    description: Model name.
  type:
    type: str
    required: true
    description: Model type.
  url:
    type: str
    required: true
    description: URL of OneClick server.
  url_password:
    type: str
    required: true
    aliases:
    - password
    description: OneClick password.
  url_username:
    type: str
    required: true
    aliases:
    - username
    description: OneClick username.
  use_proxy:
    type: bool
    default: true
    description: if V(false), it will not use a proxy, even if one is defined in an environment variable
      on the target hosts.
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certificates. Only change this to V(false) if you can guarantee that you
      are talking to the correct endpoint and there is no man-in-the-middle attack happening.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Enforce maintenance mode for modelxyz01 with a note about why\n  community.general.spectrum_model_attrs:\n\
  \    url: \"http://oneclick.url.com\"\n    username: \"{{ oneclick_username }}\"\n    password: \"{{\
  \ oneclick_password }}\"\n    name: \"modelxyz01\"\n    type: \"Host_Device\"\n    validate_certs: true\n\
  \    attributes:\n      - name: \"isManaged\"\n        value: \"false\"\n      - name: \"Notes\"\n \
  \       value: \"MM set on {{ ansible_date_time.iso8601 }} via CO {{ CO }} by {{ tower_user_name | default(ansible_user_id)\
  \ }}\"\n  delegate_to: localhost\n  register: spectrum_model_attrs_status\n"
