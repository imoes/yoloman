name: rax
fqcn: community.general.rax
collection: community.general
short_description: Create / delete an instance in Rackspace Public Cloud
description: creates / deletes a Rackspace Public Cloud instance and optionally waits for it to be 'running'.
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  auto_increment:
    type: bool
    default: true
    description: Whether or not to increment a single number with the name of the created servers. Only
      applicable when used with the O(group) attribute or meta key.
  boot_from_volume:
    type: bool
    default: false
    description: Whether or not to boot the instance from a Cloud Block Storage volume. If V(true) and
      O(image) is specified a new volume will be created at boot time. O(boot_volume_size) is required
      with O(image) to create a new volume at boot time.
  boot_volume:
    type: str
    description: Cloud Block Storage ID or Name to use as the boot volume of the instance
  boot_volume_size:
    type: int
    default: 100
    description: Size of the volume to create in Gigabytes. This is only required with O(image) and O(boot_from_volume).
  boot_volume_terminate:
    type: bool
    default: false
    description: Whether the O(boot_volume) or newly created volume from O(image) will be terminated when
      the server is terminated
  config_drive:
    type: bool
    default: false
    description: Attach read-only configuration drive to server as label config-2
  count:
    type: int
    default: 1
    description: number of instances to launch
  count_offset:
    type: int
    default: 1
    description: number count to start at
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  disk_config:
    type: str
    choices:
    - auto
    - manual
    description: Disk partitioning strategy If not specified it will assume the value V(auto).
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  exact_count:
    type: bool
    default: false
    description: Explicitly ensure an exact count of instances, used with state=active/present. If specified
      as V(true) and O(count) is less than the servers matched, servers will be deleted to match the count.
      If the number of matched servers is fewer than specified in O(count) additional servers will be
      added.
  extra_client_args:
    type: dict
    default: {}
    description: A hash of key/value pairs to be used when creating the cloudservers client. This is considered
      an advanced option, use it wisely and with caution.
  extra_create_args:
    type: dict
    default: {}
    description: A hash of key/value pairs to be used when creating a new server. This is considered an
      advanced option, use it wisely and with caution.
  files:
    type: dict
    default: {}
    description: Files to insert into the instance. remotefilename:localcontent
  flavor:
    type: str
    description: flavor to use for the instance
  group:
    type: str
    description: host group to assign to server, is also used for idempotent operations to ensure a specific
      number of instances
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  image:
    type: str
    description: image to use for the instance. Can be an C(id), C(human_id) or C(name). With O(boot_from_volume),
      a Cloud Block Storage volume will be created with this image
  instance_ids:
    type: list
    description: list of instance ids, currently only used when state='absent' to remove instances
  key_name:
    type: str
    aliases:
    - keypair
    description: key pair to use on the instance
  meta:
    type: dict
    default: {}
    description: A hash of metadata to associate with the instance
  name:
    type: str
    description: Name to give the instance
  networks:
    type: list
    default:
    - public
    - private
    description: The network to attach to the instances. If specified, you must include ALL networks including
      the public and private interfaces. Can be C(id) or C(label).
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  user_data:
    type: str
    description: Data to be uploaded to the servers config drive. This option implies O(config_drive).
      Can be a file path or a string
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  wait:
    type: bool
    default: false
    description: wait for the instance to be in state 'running' before returning
  wait_timeout:
    type: int
    default: 300
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n- name: Build a Cloud Server\n  gather_facts: false\n  tasks:\n    - name: Server build request\n\
  \      local_action:\n        module: rax\n        credentials: ~/.raxpub\n        name: rax-test1\n\
  \        flavor: 5\n        image: b11d9567-e412-4255-96b9-bd63ab23bcfe\n        key_name: my_rackspace_key\n\
  \        files:\n          /root/test.txt: /home/localuser/test.txt\n        wait: true\n        state:\
  \ present\n        networks:\n          - private\n          - public\n      register: rax\n\n- name:\
  \ Build an exact count of cloud servers with incremented names\n  hosts: local\n  gather_facts: false\n\
  \  tasks:\n    - name: Server build requests\n      local_action:\n        module: rax\n        credentials:\
  \ ~/.raxpub\n        name: test%03d.example.org\n        flavor: performance1-1\n        image: ubuntu-1204-lts-precise-pangolin\n\
  \        state: present\n        count: 10\n        count_offset: 10\n        exact_count: true\n  \
  \      group: test\n        wait: true\n      register: rax\n"
