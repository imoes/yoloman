name: jenkins_script
fqcn: community.general.jenkins_script
collection: community.general
short_description: Executes a groovy script in the jenkins instance
description: The C(jenkins_script) module takes a script plus a dict of values to use within the script
  and returns the result of the script being run.
options:
  args:
    type: dict
    description: A dict of key-value pairs used in formatting the script using string.Template (see https://docs.python.org/2/library/string.html#template-strings).
  password:
    type: str
    description: The password to connect to the jenkins server with.
  script:
    type: str
    required: true
    description: The groovy script to be executed. This gets passed as a string Template if args is defined.
  timeout:
    type: int
    default: 10
    description: The request timeout in seconds
  url:
    type: str
    default: http://localhost:8080
    description: The jenkins server to execute the script against. The default is a local jenkins instance
      that is not being proxied through a webserver.
  user:
    type: str
    description: The username to connect to the jenkins server with.
  validate_certs:
    type: bool
    default: true
    description: If set to V(false), the SSL certificates will not be validated. This should only set
      to V(false) used on personally controlled sites using self-signed certificates as it avoids verifying
      the source site.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Obtaining a list of plugins\n  community.general.jenkins_script:\n    script: 'println(Jenkins.instance.pluginManager.plugins)'\n\
  \    user: admin\n    password: admin\n\n- name: Setting master using a variable to hold a more complicate\
  \ script\n  ansible.builtin.set_fact:\n    setmaster_mode: |\n        import jenkins.model.*\n     \
  \   instance = Jenkins.getInstance()\n        instance.setMode(${jenkins_mode})\n        instance.save()\n\
  \n- name: Use the variable as the script\n  community.general.jenkins_script:\n    script: \"{{ setmaster_mode\
  \ }}\"\n    args:\n      jenkins_mode: Node.Mode.EXCLUSIVE\n\n- name: Interacting with an untrusted\
  \ HTTPS connection\n  community.general.jenkins_script:\n    script: \"println(Jenkins.instance.pluginManager.plugins)\"\
  \n    user: admin\n    password: admin\n    url: https://localhost\n    validate_certs: false  # only\
  \ do this when you trust the network!\n"
