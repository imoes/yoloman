name: svr4pkg
fqcn: community.general.svr4pkg
collection: community.general
short_description: Manage Solaris SVR4 packages
description: Manages SVR4 packages on Solaris 10 and 11. These were the native packages on Solaris <=
  10 and are available as a legacy feature in Solaris 11. Note that this is a very basic packaging system.
  It will not enforce dependencies on install or remove.
options:
  category:
    type: bool
    default: false
    description: Install/Remove category instead of a single package.
  name:
    type: str
    required: true
    description: Package name, for example V(SUNWcsr).
  proxy:
    type: str
    description: HTTP[s] proxy to be used if O(src) is a URL.
  response_file:
    type: str
    description: Specifies the location of a response file to be used if package expects input on install.
  src:
    type: str
    description: 'Specifies the location to install the package from. Required when O(state=present).
      Can be any path acceptable to the C(pkgadd) command''s C(-d) option. For example: V(somefile.pkg),
      V(/dir/with/pkgs), V(http:/server/mypkgs.pkg). If using a file or directory, they must already be
      accessible by the host. See the M(ansible.builtin.copy) module for a way to get them there.'
  state:
    type: str
    required: true
    choices:
    - present
    - absent
    description: Whether to install (V(present)), or remove (V(absent)) a package. If the package is to
      be installed, then O(src) is required. The SVR4 package system doesn't provide an upgrade operation.
      You need to uninstall the old, then install the new package.
  zone:
    type: str
    default: all
    choices:
    - current
    - all
    description: Whether to install the package only in the current zone, or install it into all zones.
      The installation into all zones works only if you are working with the global zone.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install a package from an already copied file\n  community.general.svr4pkg:\n   \
  \ name: CSWcommon\n    src: /tmp/cswpkgs.pkg\n    state: present\n\n- name: Install a package directly\
  \ from an http site\n  community.general.svr4pkg:\n    name: CSWpkgutil\n    src: 'http://get.opencsw.org/now'\n\
  \    state: present\n    zone: current\n\n- name: Install a package with a response file\n  community.general.svr4pkg:\n\
  \    name: CSWggrep\n    src: /tmp/third-party.pkg\n    response_file: /tmp/ggrep.response\n    state:\
  \ present\n\n- name: Ensure that a package is not installed\n  community.general.svr4pkg:\n    name:\
  \ SUNWgnome-sound-recorder\n    state: absent\n\n- name: Ensure that a category is not installed\n \
  \ community.general.svr4pkg:\n    name: FIREFOX\n    state: absent\n    category: true\n"
