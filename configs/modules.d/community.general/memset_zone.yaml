name: memset_zone
fqcn: community.general.memset_zone
collection: community.general
short_description: Creates and deletes Memset DNS zones
description: Manage DNS zones in a Memset account.
options:
  api_key:
    type: str
    required: true
    description: The API key obtained from the Memset control panel.
  force:
    type: bool
    default: false
    description: Forces deletion of a zone and all zone domains/zone records it contains.
  name:
    type: str
    required: true
    aliases:
    - nickname
    description: The zone nickname; usually the same as the main domain. Ensure this value has at most
      250 characters.
  state:
    type: str
    required: true
    choices:
    - absent
    - present
    description: Indicates desired state of resource.
  ttl:
    type: int
    default: 0
    choices:
    - 0
    - 300
    - 600
    - 900
    - 1800
    - 3600
    - 7200
    - 10800
    - 21600
    - 43200
    - 86400
    description: The default TTL for all records created in the zone. This must be a valid int from U(https://www.memset.com/apidocs/methods_dns.html#dns.zone_create).
writes: true
runtime: starlark
source: translated
examples: "\n# Create the zone 'test'\n- name: Create zone\n  community.general.memset_zone:\n    name:\
  \ test\n    state: present\n    api_key: 5eb86c9196ab03919abcf03857163741\n    ttl: 300\n  delegate_to:\
  \ localhost\n\n# Force zone deletion\n- name: Force delete zone\n  community.general.memset_zone:\n\
  \    name: test\n    state: absent\n    api_key: 5eb86c9196ab03919abcf03857163741\n    force: true\n\
  \  delegate_to: localhost\n"
