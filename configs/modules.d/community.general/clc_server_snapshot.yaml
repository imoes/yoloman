name: clc_server_snapshot
fqcn: community.general.clc_server_snapshot
collection: community.general
short_description: Create, Delete and Restore server snapshots in CenturyLink Cloud
description: An Ansible module to Create, Delete and Restore server snapshots in CenturyLink Cloud.
options:
  expiration_days:
    type: int
    default: 7
    description: The number of days to keep the server snapshot before it expires.
  server_ids:
    type: list
    required: true
    description: The list of CLC server Ids.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - restore
    description: The state to insure that the provided resources are in.
  wait:
    type: str
    default: 'True'
    description: Whether to wait for the provisioning tasks to finish before returning.
writes: true
runtime: starlark
source: translated
examples: "\n# Note - You must set the CLC_V2_API_USERNAME And CLC_V2_API_PASSWD Environment variables\
  \ before running these examples\n\n- name: Create server snapshot\n  community.general.clc_server_snapshot:\n\
  \    server_ids:\n        - UC1TEST-SVR01\n        - UC1TEST-SVR02\n    expiration_days: 10\n    wait:\
  \ true\n    state: present\n\n- name: Restore server snapshot\n  community.general.clc_server_snapshot:\n\
  \    server_ids:\n        - UC1TEST-SVR01\n        - UC1TEST-SVR02\n    wait: true\n    state: restore\n\
  \n- name: Delete server snapshot\n  community.general.clc_server_snapshot:\n    server_ids:\n      \
  \  - UC1TEST-SVR01\n        - UC1TEST-SVR02\n    wait: true\n    state: absent\n"
