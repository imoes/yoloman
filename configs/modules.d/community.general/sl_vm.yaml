name: sl_vm
fqcn: community.general.sl_vm
collection: community.general
short_description: Create or cancel a virtual instance in SoftLayer
description: Creates or cancels SoftLayer instances. When created, optionally waits for it to be 'running'.
options:
  cpus:
    type: int
    choices:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 56
    description: Count of cpus to be assigned to new virtual instance.
  datacenter:
    type: str
    choices:
    - ams01
    - ams03
    - che01
    - dal01
    - dal05
    - dal06
    - dal09
    - dal10
    - dal12
    - dal13
    - fra02
    - fra04
    - fra05
    - hkg02
    - hou02
    - lon02
    - lon04
    - lon06
    - mel01
    - mex01
    - mil01
    - mon01
    - osl01
    - par01
    - sao01
    - sea01
    - seo01
    - sjc01
    - sjc03
    - sjc04
    - sng01
    - syd01
    - syd04
    - tok02
    - tor01
    - wdc01
    - wdc04
    - wdc06
    - wdc07
    description: Datacenter for the virtual instance to be deployed.
  dedicated:
    type: bool
    default: false
    description: Flag to determine if the instance should be deployed in dedicated space.
  disks:
    type: list
    default:
    - 25
    description: List of disk sizes to be assigned to new virtual instance.
  domain:
    type: str
    description: Domain name to be provided to a virtual instance.
  flavor:
    type: str
    description: Specify which SoftLayer flavor template to use instead of cpus and memory.
  hostname:
    type: str
    description: Hostname to be provided to a virtual instance.
  hourly:
    type: bool
    default: true
    description: Flag to determine if the instance should be hourly billed.
  image_id:
    type: str
    description: Image Template to be used for new virtual instance.
  instance_id:
    type: str
    description: Instance Id of the virtual instance to perform action option.
  local_disk:
    type: bool
    default: true
    description: Flag to determine if local disk should be used for the new instance.
  memory:
    type: int
    choices:
    - 1024
    - 2048
    - 4096
    - 6144
    - 8192
    - 12288
    - 16384
    - 32768
    - 49152
    - 65536
    - 131072
    - 247808
    description: Amount of memory to be assigned to new virtual instance.
  nic_speed:
    type: int
    choices:
    - 10
    - 100
    - 1000
    description: NIC Speed to be assigned to new virtual instance.
  os_code:
    type: str
    description: OS Code to be used for new virtual instance.
  post_uri:
    type: str
    description: URL of a post provisioning script to be loaded and executed on virtual instance.
  private:
    type: bool
    default: false
    description: Flag to determine if the instance should be private only.
  private_vlan:
    type: str
    description: VLAN by its Id to be assigned to the private NIC.
  public_vlan:
    type: str
    description: VLAN by its Id to be assigned to the public NIC.
  ssh_keys:
    type: list
    default: []
    description: List of ssh keys by their Id to be assigned to a virtual instance.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Create, or cancel a virtual instance. Specify V(present) for create, V(absent) to cancel.
  tags:
    type: str
    description: Tag or list of tags to be provided to a virtual instance.
  wait:
    type: bool
    default: true
    description: Flag used to wait for active status before returning.
  wait_time:
    type: int
    default: 600
    description: Time in seconds before wait returns.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Build instance\n  hosts: localhost\n  gather_facts: false\n  tasks:\n  - name: Build\
  \ instance request\n    community.general.sl_vm:\n      hostname: instance-1\n      domain: anydomain.com\n\
  \      datacenter: dal09\n      tags: ansible-module-test\n      hourly: true\n      private: false\n\
  \      dedicated: false\n      local_disk: true\n      cpus: 1\n      memory: 1024\n      disks: [25]\n\
  \      os_code: UBUNTU_LATEST\n      wait: false\n\n- name: Build additional instances\n  hosts: localhost\n\
  \  gather_facts: false\n  tasks:\n  - name: Build instances request\n    community.general.sl_vm:\n\
  \      hostname: \"{{ item.hostname }}\"\n      domain: \"{{ item.domain }}\"\n      datacenter: \"\
  {{ item.datacenter }}\"\n      tags: \"{{ item.tags }}\"\n      hourly: \"{{ item.hourly }}\"\n    \
  \  private: \"{{ item.private }}\"\n      dedicated: \"{{ item.dedicated }}\"\n      local_disk: \"\
  {{ item.local_disk }}\"\n      cpus: \"{{ item.cpus }}\"\n      memory: \"{{ item.memory }}\"\n    \
  \  disks: \"{{ item.disks }}\"\n      os_code: \"{{ item.os_code }}\"\n      ssh_keys: \"{{ item.ssh_keys\
  \ }}\"\n      wait: \"{{ item.wait }}\"\n    with_items:\n      - hostname: instance-2\n        domain:\
  \ anydomain.com\n        datacenter: dal09\n        tags:\n          - ansible-module-test\n       \
  \   - ansible-module-test-replicas\n        hourly: true\n        private: false\n        dedicated:\
  \ false\n        local_disk: true\n        cpus: 1\n        memory: 1024\n        disks:\n         \
  \ - 25\n          - 100\n        os_code: UBUNTU_LATEST\n        ssh_keys: []\n        wait: true\n\
  \      - hostname: instance-3\n        domain: anydomain.com\n        datacenter: dal09\n        tags:\n\
  \          - ansible-module-test\n          - ansible-module-test-replicas\n        hourly: true\n \
  \       private: false\n        dedicated: false\n        local_disk: true\n        cpus: 1\n      \
  \  memory: 1024\n        disks:\n          - 25\n          - 100\n        os_code: UBUNTU_LATEST\n \
  \       ssh_keys: []\n        wait: true\n\n- name: Cancel instances\n  hosts: localhost\n  gather_facts:\
  \ false\n  tasks:\n  - name: Cancel by tag\n    community.general.sl_vm:\n      state: absent\n    \
  \  tags: ansible-module-test\n"
