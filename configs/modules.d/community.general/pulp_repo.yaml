name: pulp_repo
fqcn: community.general.pulp_repo
collection: community.general
short_description: Add or remove Pulp repos from a remote host
description: Add or remove Pulp repos from a remote host. Note, this is for Pulp 2 only.
options:
  add_export_distributor:
    type: bool
    default: false
    description: Whether or not to add the export distributor to new C(rpm) repositories.
  client_cert:
    type: path
    description: PEM formatted certificate chain file to be used for SSL client authentication. This file
      can also include the key as well, and if the key is included, O(client_key) is not required.
  client_key:
    type: path
    description: PEM formatted file that contains your private key to be used for SSL client authentication.
      If O(client_cert) contains both the certificate and key, this option is not required.
  feed:
    type: str
    description: Upstream feed URL to receive updates from.
  feed_ca_cert:
    type: str
    aliases:
    - importer_ssl_ca_cert
    description: CA certificate string used to validate the feed source SSL certificate. This can be the
      file content or the path to the file.
  feed_client_cert:
    type: str
    aliases:
    - importer_ssl_client_cert
    description: Certificate used as the client certificate when synchronizing the repository. This is
      used to communicate authentication information to the feed source. The value to this option must
      be the full path to the certificate. The specified file may be the certificate itself or a single
      file containing both the certificate and private key. This can be the file content or the path to
      the file.
  feed_client_key:
    type: str
    aliases:
    - importer_ssl_client_key
    description: Private key to the certificate specified in O(feed_client_cert), assuming it is not included
      in the certificate file itself. This can be the file content or the path to the file.
  force:
    type: bool
    default: false
    description: If V(yes) do not get a cached copy.
  force_basic_auth:
    type: bool
    default: false
    description: httplib2, the library used by the M(ansible.builtin.uri) module only sends authentication
      information when a webservice responds to an initial request with a 401 status. Since some basic
      auth services do not properly send a 401, logins will fail. This option forces the sending of the
      Basic authentication header upon initial request.
  generate_sqlite:
    type: bool
    default: false
    description: Boolean flag to indicate whether sqlite files should be generated during a repository
      publish.
  http_agent:
    type: str
    default: ansible-httpget
    description: Header to identify as, generally appears in web server logs.
  name:
    type: str
    required: true
    aliases:
    - repo
    description: Name of the repo to add or remove. This correlates to repo-id in Pulp.
  proxy_host:
    type: str
    description: Proxy url setting for the pulp repository importer. This is in the format scheme://host.
  proxy_password:
    type: str
    description: Proxy password for the pulp repository importer.
  proxy_port:
    type: str
    description: Proxy port setting for the pulp repository importer.
  proxy_username:
    type: str
    description: Proxy username for the pulp repository importer.
  publish_distributor:
    type: str
    description: Distributor to use when O(state=publish). The default is to publish all distributors.
  pulp_host:
    type: str
    default: https://127.0.0.1
    description: URL of the pulp server to connect to.
  relative_url:
    type: str
    description: Relative URL for the local repository. It's required when state=present.
  repo_type:
    type: str
    default: rpm
    description: Repo plugin type to use (that is, V(rpm), V(docker)).
  repoview:
    type: bool
    default: false
    description: Whether to generate repoview files for a published repository. Setting this to V(true)
      automatically activates O(generate_sqlite).
  serve_http:
    type: bool
    default: false
    description: Make the repo available over HTTP.
  serve_https:
    type: bool
    default: true
    description: Make the repo available over HTTPS.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - sync
    - publish
    description: The repo state. A state of V(sync) will queue a sync of the repo. This is asynchronous
      but not delayed like a scheduled sync. A state of V(publish) will use the repository's distributor
      to publish the content.
  url:
    type: str
    description: HTTP, HTTPS, or FTP URL in the form (http|https|ftp)://[user[:pass]]@host.domain[:port]/path
  url_password:
    type: str
    description: The password for use in HTTP basic authentication to the pulp API. If the O(url_username)
      parameter is not specified, the O(url_password) parameter will not be used.
  url_username:
    type: str
    description: The username for use in HTTP basic authentication to the pulp API.
  use_gssapi:
    type: bool
    default: false
    description: Use GSSAPI to perform the authentication, typically this is for Kerberos or Kerberos
      through Negotiate authentication. Requires the Python library L(gssapi,https://github.com/pythongssapi/python-gssapi)
      to be installed. Credentials for GSSAPI can be specified with O(url_username)/O(url_password) or
      with the GSSAPI env var C(KRB5CCNAME) that specified a custom Kerberos credential cache. NTLM authentication
      is B(not) supported even if the GSSAPI mech for NTLM has been installed.
  use_proxy:
    type: bool
    default: true
    description: If V(no), it will not use a proxy, even if one is defined in an environment variable
      on the target hosts.
  validate_certs:
    type: bool
    default: true
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
  wait_for_completion:
    type: bool
    default: false
    description: Wait for asynchronous tasks to complete before returning.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a new repo with name 'my_repo'\n  community.general.pulp_repo:\n    name:\
  \ my_repo\n    relative_url: my/repo\n    state: present\n\n- name: Create a repo with a feed and a\
  \ relative URL\n  community.general.pulp_repo:\n    name: my_centos_updates\n    repo_type: rpm\n  \
  \  feed: http://mirror.centos.org/centos/6/updates/x86_64/\n    relative_url: centos/6/updates\n   \
  \ url_username: admin\n    url_password: admin\n    force_basic_auth: true\n    state: present\n\n-\
  \ name: Remove a repo from the pulp server\n  community.general.pulp_repo:\n    name: my_old_repo\n\
  \    repo_type: rpm\n    state: absent\n"
