name: webfaction_db
fqcn: community.general.webfaction_db
collection: community.general
short_description: Add or remove a database on Webfaction
description: Add or remove a database on a Webfaction host. Further documentation at https://github.com/quentinsf/ansible-webfaction.
options:
  login_name:
    type: str
    required: true
    description: The webfaction account to use
  login_password:
    type: str
    required: true
    description: The webfaction password to use
  machine:
    type: str
    description: The machine name to use (optional for accounts with only one machine)
  name:
    type: str
    required: true
    description: The name of the database
  password:
    type: str
    description: The password for the new database user.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the database should exist
  type:
    type: str
    required: true
    choices:
    - mysql
    - postgresql
    description: The type of database to create.
writes: true
runtime: starlark
source: translated
examples: "\n  # This will also create a default DB user with the same\n  # name as the database, and\
  \ the specified password.\n\n  - name: Create a database\n    community.general.webfaction_db:\n   \
  \   name: \"{{webfaction_user}}_db1\"\n      password: mytestsql\n      type: mysql\n      login_name:\
  \ \"{{webfaction_user}}\"\n      login_password: \"{{webfaction_passwd}}\"\n      machine: \"{{webfaction_machine}}\"\
  \n\n  # Note that, for symmetry's sake, deleting a database using\n  # 'state: absent' will also delete\
  \ the matching user.\n\n"
