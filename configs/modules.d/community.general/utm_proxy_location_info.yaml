name: utm_proxy_location_info
fqcn: community.general.utm_proxy_location_info
collection: community.general
short_description: Create, update or destroy reverse_proxy location entry in Sophos UTM
description: Create, update or destroy a reverse_proxy location entry in SOPHOS UTM. This module needs
  to have the REST Ability of the UTM to be activated.
options:
  headers:
    type: dict
    default: {}
    description: A dictionary of additional headers to be sent to POST and PUT requests. Is needed for
      some modules.
  name:
    type: str
    required: true
    description: The name of the object. Will be used to identify the entry
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: The desired state of the object. V(present) will create or update an object. V(absent)
      will delete an object if it was present.
  utm_host:
    type: str
    required: true
    description: The REST Endpoint of the Sophos UTM.
  utm_port:
    type: int
    default: 4444
    description: The port of the REST interface.
  utm_protocol:
    type: str
    default: https
    choices:
    - http
    - https
    description: The protocol of the REST Endpoint.
  utm_token:
    type: str
    required: true
    description: The token used to identify at the REST-API. See U(https://www.sophos.com/en-us/medialibrary/PDFs/documentation/UTMonAWS/Sophos-UTM-RESTful-API.pdf?la=en),
      Chapter 2.4.2.
  validate_certs:
    type: bool
    default: true
    description: Whether the REST interface's ssl certificate should be verified or not.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Remove UTM proxy_location\n  community.general.utm_proxy_location_info:\n    utm_host:\
  \ sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestLocationEntry\n"
