name: scaleway_function_namespace
fqcn: community.general.scaleway_function_namespace
collection: community.general
short_description: Scaleway Function namespace management
description: This module manages function namespaces on Scaleway account.
options:
  api_timeout:
    type: int
    default: 30
    aliases:
    - timeout
    description: HTTP timeout to Scaleway API in seconds.
  api_token:
    type: str
    required: true
    aliases:
    - oauth_token
    description: Scaleway OAuth token.
  api_url:
    type: str
    default: https://api.scaleway.com
    aliases:
    - base_url
    description: Scaleway API URL.
  description:
    type: str
    default: ''
    description: Description of the function namespace.
  environment_variables:
    type: dict
    default: {}
    description: Environment variables of the function namespace. Injected in functions at runtime.
  name:
    type: str
    required: true
    description: Name of the function namespace.
  project_id:
    type: str
    required: true
    description: Project identifier.
  query_parameters:
    type: dict
    default: {}
    description: List of parameters passed to the query string.
  region:
    type: str
    required: true
    choices:
    - fr-par
    - nl-ams
    - pl-waw
    description: Scaleway region to use (for example V(fr-par)).
  secret_environment_variables:
    type: dict
    default: {}
    description: Secret environment variables of the function namespace. Updating those values will not
      output a C(changed) state in Ansible. Injected in functions at runtime.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the function namespace.
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certs of the Scaleway API.
  wait:
    type: bool
    default: true
    description: Wait for the resource to reach its desired state before returning.
  wait_sleep_time:
    type: int
    default: 3
    description: Time to wait before every attempt to check the state of the resource.
  wait_timeout:
    type: int
    default: 300
    description: Time to wait for the resource to reach the expected state.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a function namespace\n  community.general.scaleway_function_namespace:\n \
  \   project_id: '{{ scw_project }}'\n    state: present\n    region: fr-par\n    name: my-awesome-function-namespace\n\
  \    environment_variables:\n      MY_VAR: my_value\n    secret_environment_variables:\n      MY_SECRET_VAR:\
  \ my_secret_value\n  register: function_namespace_creation_task\n\n- name: Make sure function namespace\
  \ is deleted\n  community.general.scaleway_function_namespace:\n    project_id: '{{ scw_project }}'\n\
  \    state: absent\n    region: fr-par\n    name: my-awesome-function-namespace\n"
