name: hwc_vpc_subnet
fqcn: community.general.hwc_vpc_subnet
collection: community.general
short_description: Creates a resource of Vpc/Subnet in Huawei Cloud
description: subnet management.
options:
  availability_zone:
    type: str
    description: Specifies the AZ to which the subnet belongs. Cannot be changed after creating the subnet.
  cidr:
    type: str
    required: true
    description: Specifies the subnet CIDR block. The value must be within the VPC CIDR block and be in
      CIDR format. The subnet mask cannot be greater than 28. Cannot be changed after creating the subnet.
  dhcp_enable:
    type: bool
    description: Specifies whether DHCP is enabled for the subnet. The value can be true (enabled) or
      false(disabled), and default value is true. If this parameter is set to false, newly created ECSs
      cannot obtain IP addresses, and usernames and passwords cannot be injected using Cloud-init.
  dns_address:
    type: list
    description: Specifies the DNS server addresses for subnet. The address in the head will be used first.
  domain:
    type: str
    required: true
    description: The name of the Domain to scope to (Identity v3). Currently only domain names are supported,
      and not domain IDs.
  gateway_ip:
    type: str
    required: true
    description: Specifies the gateway of the subnet. The value must be an IP address in the subnet. Cannot
      be changed after creating the subnet.
  id:
    type: str
    description: The ID of resource to be managed.
  identity_endpoint:
    type: str
    required: true
    description: The Identity authentication URL.
  name:
    type: str
    required: true
    description: Specifies the subnet name. The value is a string of 1 to 64 characters that can contain
      letters, digits, underscores (V(_)), hyphens (V(-)), and periods (V(.)).
  password:
    type: str
    required: true
    description: The password to login with.
  project:
    type: str
    required: true
    description: The name of the Tenant (Identity v2) or Project (Identity v3). Currently only project
      names are supported, and not project IDs.
  region:
    type: str
    description: The region to which the project belongs.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the given object should exist in Huawei Cloud.
  timeouts:
    type: dict
    default: {}
    description: The timeouts for each operations.
  user:
    type: str
    required: true
    description: The user name to login with. Currently only user names are supported, and not user IDs.
  vpc_id:
    type: str
    required: true
    description: Specifies the ID of the VPC to which the subnet belongs. Cannot be changed after creating
      the subnet.
writes: true
runtime: starlark
source: translated
examples: "\n# create subnet\n- name: Create vpc\n  hwc_network_vpc:\n    cidr: \"192.168.100.0/24\"\n\
  \    name: \"ansible_network_vpc_test\"\n  register: vpc\n- name: Create subnet\n  community.general.hwc_vpc_subnet:\n\
  \    vpc_id: \"{{ vpc.id }}\"\n    cidr: \"192.168.100.0/26\"\n    gateway_ip: \"192.168.100.32\"\n\
  \    name: \"ansible_network_subnet_test\"\n    dhcp_enable: true\n"
