name: proxmox_snap
fqcn: community.general.proxmox_snap
collection: community.general
short_description: Snapshot management of instances in Proxmox VE cluster
description: Allows you to create/delete/restore snapshots from instances in Proxmox VE cluster. Supports
  both KVM and LXC, OpenVZ has not been tested, as it is no longer supported on Proxmox VE.
options:
  api_host:
    type: str
    required: true
    description: Specify the target host of the Proxmox VE cluster.
  api_password:
    type: str
    description: Specify the password to authenticate with. You can use E(PROXMOX_PASSWORD) environment
      variable.
  api_token_id:
    type: str
    description: Specify the token ID. Requires C(proxmoxer>=1.1.0) to work.
  api_token_secret:
    type: str
    description: Specify the token secret. Requires C(proxmoxer>=1.1.0) to work.
  api_user:
    type: str
    required: true
    description: Specify the user to authenticate with.
  description:
    type: str
    description: Specify the description for the snapshot. Only used on the configuration web interface.
      This is saved as a comment inside the configuration file.
  force:
    type: bool
    default: false
    description: For removal from config file, even if removing disk snapshot fails.
  hostname:
    type: str
    description: The instance name.
  retention:
    type: int
    default: 0
    description: Remove old snapshots if there are more than O(retention) snapshots. If O(retention) is
      set to V(0), all snapshots will be kept. This is only used when O(state=present) and when an actual
      snapshot is created. If no snapshot is created, all existing snapshots will be kept.
  snapname:
    type: str
    default: ansible_snap
    description: Name of the snapshot that has to be created/deleted/restored.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - rollback
    description: Indicate desired state of the instance snapshot. The V(rollback) value was added in community.general
      4.8.0.
  timeout:
    type: int
    default: 30
    description: Timeout for operations.
  unbind:
    type: bool
    default: false
    description: This option only applies to LXC containers. Allows to snapshot a container even if it
      has configured mountpoints. Temporarily disables all configured mountpoints, takes snapshot, and
      finally restores original configuration. If running, the container will be stopped and restarted
      to apply config changes. Due to restrictions in the Proxmox API this option can only be used authenticating
      as V(root@pam) with O(api_password), API tokens do not work either. See U(https://pve.proxmox.com/pve-docs/api-viewer/#/nodes/{node}/lxc/{vmid}/config)
      (PUT tab) for more details.
  validate_certs:
    type: bool
    default: false
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
  vmid:
    type: str
    description: The instance id. If not set, will be fetched from PromoxAPI based on the hostname.
  vmstate:
    type: bool
    default: false
    description: Snapshot includes RAM.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create new container snapshot\n  community.general.proxmox_snap:\n    api_user: root@pam\n\
  \    api_password: 1q2w3e\n    api_host: node1\n    vmid: 100\n    state: present\n    snapname: pre-updates\n\
  \n- name: Create new container snapshot and keep only the 2 newest snapshots\n  community.general.proxmox_snap:\n\
  \    api_user: root@pam\n    api_password: 1q2w3e\n    api_host: node1\n    vmid: 100\n    state: present\n\
  \    snapname: snapshot-42\n    retention: 2\n\n- name: Create new snapshot for a container with configured\
  \ mountpoints\n  community.general.proxmox_snap:\n    api_user: root@pam\n    api_password: 1q2w3e\n\
  \    api_host: node1\n    vmid: 100\n    state: present\n    unbind: true # requires root@pam+password\
  \ auth, API tokens are not supported\n    snapname: pre-updates\n\n- name: Remove container snapshot\n\
  \  community.general.proxmox_snap:\n    api_user: root@pam\n    api_password: 1q2w3e\n    api_host:\
  \ node1\n    vmid: 100\n    state: absent\n    snapname: pre-updates\n\n- name: Rollback container snapshot\n\
  \  community.general.proxmox_snap:\n    api_user: root@pam\n    api_password: 1q2w3e\n    api_host:\
  \ node1\n    vmid: 100\n    state: rollback\n    snapname: pre-updates\n"
