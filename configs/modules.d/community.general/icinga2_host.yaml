name: icinga2_host
fqcn: community.general.icinga2_host
collection: community.general
short_description: Manage a host in Icinga2
description: Add or remove a host to Icinga2 through the API. See U(https://www.icinga.com/docs/icinga2/latest/doc/12-icinga2-api/)
options:
  check_command:
    type: str
    default: hostalive
    description: The command used to check if the host is alive.
  client_cert:
    type: path
    description: PEM formatted certificate chain file to be used for SSL client authentication. This file
      can also include the key as well, and if the key is included, O(client_key) is not required.
  client_key:
    type: path
    description: PEM formatted file that contains your private key to be used for SSL client authentication.
      If O(client_cert) contains both the certificate and key, this option is not required.
  display_name:
    type: str
    description: The name used to display the host. If not specified, it defaults to the value of the
      O(name) parameter.
  force:
    type: bool
    default: false
    description: If V(yes) do not get a cached copy.
  force_basic_auth:
    type: bool
    default: false
    description: httplib2, the library used by the uri module only sends authentication information when
      a webservice responds to an initial request with a 401 status. Since some basic auth services do
      not properly send a 401, logins will fail. This option forces the sending of the Basic authentication
      header upon initial request.
  http_agent:
    type: str
    default: ansible-httpget
    description: Header to identify as, generally appears in web server logs.
  ip:
    type: str
    description: The IP address of the host. This is no longer required since community.general 8.0.0.
  name:
    type: str
    required: true
    aliases:
    - host
    description: Name used to create / delete the host. This does not need to be the FQDN, but does needs
      to be unique.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Apply feature state.
  template:
    type: str
    description: The template used to define the host. Template cannot be modified after object creation.
  url:
    type: str
    description: HTTP, HTTPS, or FTP URL in the form (http|https|ftp)://[user[:pass]]@host.domain[:port]/path
  url_password:
    type: str
    description: The password for use in HTTP basic authentication. If the O(url_username) parameter is
      not specified, the O(url_password) parameter will not be used.
  url_username:
    type: str
    description: The username for use in HTTP basic authentication. This parameter can be used without
      O(url_password) for sites that allow empty passwords.
  use_gssapi:
    type: bool
    default: false
    description: Use GSSAPI to perform the authentication, typically this is for Kerberos or Kerberos
      through Negotiate authentication. Requires the Python library L(gssapi,https://github.com/pythongssapi/python-gssapi)
      to be installed. Credentials for GSSAPI can be specified with O(url_username)/O(url_password) or
      with the GSSAPI env var C(KRB5CCNAME) that specified a custom Kerberos credential cache. NTLM authentication
      is B(not) supported even if the GSSAPI mech for NTLM has been installed.
  use_proxy:
    type: bool
    default: true
    description: If V(false), it will not use a proxy, even if one is defined in an environment variable
      on the target hosts.
  validate_certs:
    type: bool
    default: true
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
  variables:
    type: dict
    description: Dictionary of variables.
  zone:
    type: str
    description: The zone from where this host should be polled.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add host to icinga\n  community.general.icinga2_host:\n    url: \"https://icinga2.example.com\"\
  \n    url_username: \"ansible\"\n    url_password: \"a_secret\"\n    state: present\n    name: \"{{\
  \ ansible_fqdn }}\"\n    ip: \"{{ ansible_default_ipv4.address }}\"\n    variables:\n      foo: \"bar\"\
  \n  delegate_to: 127.0.0.1\n"
