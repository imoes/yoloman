name: idrac_redfish_command
fqcn: community.general.idrac_redfish_command
collection: community.general
short_description: Manages Out-Of-Band controllers using iDRAC OEM Redfish APIs
description: Builds Redfish URIs locally and sends them to remote OOB controllers to perform an action.
  For use with Dell iDRAC operations that require Redfish OEM extensions.
options:
  auth_token:
    type: str
    description: Security token for authenticating to iDRAC.
  baseuri:
    type: str
    required: true
    description: Base URI of iDRAC.
  category:
    type: str
    required: true
    description: Category to execute on iDRAC.
  command:
    type: list
    required: true
    description: List of commands to execute on iDRAC.
  password:
    type: str
    description: Password for authenticating to iDRAC.
  resource_id:
    type: str
    description: ID of the System, Manager or Chassis to modify.
  timeout:
    type: int
    default: 10
    description: Timeout in seconds for HTTP requests to iDRAC.
  username:
    type: str
    description: Username for authenticating to iDRAC.
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Create BIOS configuration job (schedule BIOS setting update)\n    community.general.idrac_redfish_command:\n\
  \      category: Systems\n      command: CreateBiosConfigJob\n      resource_id: System.Embedded.1\n\
  \      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n"
