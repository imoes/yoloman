name: oneview_datacenter_info
fqcn: community.general.oneview_datacenter_info
collection: community.general
short_description: Retrieve information about the OneView Data Centers
description: Retrieve information about the OneView Data Centers.
options:
  api_version:
    type: int
    description: OneView API Version.
  config:
    type: path
    description: Path to a JSON configuration file containing the OneView client configuration. The configuration
      file is optional and when used should be present in the host running the ansible commands. If the
      file path is not provided, the configuration will be loaded from environment variables. For links
      to example configuration files or how to use the environment variables verify the notes section.
  hostname:
    type: str
    description: IP address or hostname for the appliance.
  image_streamer_hostname:
    type: str
    description: IP address or hostname for the HPE Image Streamer REST API.
  name:
    type: str
    description: Data Center name.
  options:
    type: list
    description: 'Retrieve additional information. Options available: ''visualContent''.'
  params:
    type: dict
    description: 'List of parameters to delimit, filter and sort the list of resources. Parameter keys
      allowed are: C(start): The first item to return, using 0-based indexing. C(count): The number of
      resources to return. C(filter): A general filter/query string to narrow the list of items returned.
      C(sort): The sort order of the returned data set.'
  password:
    type: str
    description: Password for API authentication.
  username:
    type: str
    description: Username for API authentication.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather information about all Data Centers\n  community.general.oneview_datacenter_info:\n\
  \    hostname: 172.16.101.48\n    username: administrator\n    password: my_password\n    api_version:\
  \ 500\n  delegate_to: localhost\n  register: result\n\n- name: Print fetched information about Data\
  \ Centers\n  ansible.builtin.debug:\n    msg: \"{{ result.datacenters }}\"\n\n- name: Gather paginated,\
  \ filtered and sorted information about Data Centers\n  community.general.oneview_datacenter_info:\n\
  \    hostname: 172.16.101.48\n    username: administrator\n    password: my_password\n    api_version:\
  \ 500\n    params:\n      start: 0\n      count: 3\n      sort: 'name:descending'\n      filter: 'state=Unmanaged'\n\
  \  register: result\n\n- name: Print fetched information about paginated, filtered and sorted list of\
  \ Data Centers\n  ansible.builtin.debug:\n    msg: \"{{ result.datacenters }}\"\n\n- name: Gather information\
  \ about a Data Center by name\n  community.general.oneview_datacenter_info:\n    hostname: 172.16.101.48\n\
  \    username: administrator\n    password: my_password\n    api_version: 500\n    name: \"My Data Center\"\
  \n  delegate_to: localhost\n  register: result\n\n- name: Print fetched information about Data Center\
  \ found by name\n  ansible.builtin.debug:\n    msg: \"{{ result.datacenters }}\"\n\n- name: Gather information\
  \ about the Data Center Visual Content\n  community.general.oneview_datacenter_info:\n    hostname:\
  \ 172.16.101.48\n    username: administrator\n    password: my_password\n    api_version: 500\n    name:\
  \ \"My Data Center\"\n    options:\n      - visualContent\n  delegate_to: localhost\n  register: result\n\
  \n- name: Print fetched information about Data Center found by name\n  ansible.builtin.debug:\n    msg:\
  \ \"{{ result.datacenters }}\"\n\n- name: Print fetched information about Data Center Visual Content\n\
  \  ansible.builtin.debug:\n    msg: \"{{ result.datacenter_visual_content }}\"\n"
