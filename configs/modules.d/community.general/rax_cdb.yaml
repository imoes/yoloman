name: rax_cdb
fqcn: community.general.rax_cdb
collection: community.general
short_description: Create/delete or resize a Rackspace Cloud Databases instance
description: creates / deletes or resize a Rackspace Cloud Databases instance and optionally waits for
  it to be 'running'. The name option needs to be unique since it's used to identify the instance.
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  cdb_type:
    type: str
    default: MySQL
    aliases:
    - type
    description: type of instance (i.e. MySQL, MariaDB, Percona)
  cdb_version:
    type: str
    default: '5.6'
    aliases:
    - version
    description: 'version of database (MySQL supports 5.1 and 5.6, MariaDB supports 10, Percona supports
      5.6) The available choices are: V(5.1), V(5.6) and  V(10).'
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  flavor:
    type: int
    default: 1
    description: flavor to use for the instance 1 to 6 (i.e. 512MB to 16GB)
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  name:
    type: str
    required: true
    description: Name of the databases server instance
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  volume:
    type: int
    default: 2
    description: Volume size of the database 1-150GB
  wait:
    type: bool
    default: false
    description: wait for the instance to be in state 'running' before returning
  wait_timeout:
    type: int
    default: 300
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n- name: Build a Cloud Databases\n  gather_facts: false\n  tasks:\n    - name: Server build\
  \ request\n      local_action:\n        module: rax_cdb\n        credentials: ~/.raxpub\n        region:\
  \ IAD\n        name: db-server1\n        flavor: 1\n        volume: 2\n        cdb_type: MySQL\n   \
  \     cdb_version: 5.6\n        wait: true\n        state: present\n      register: rax_db_server\n"
