name: office_365_connector_card
fqcn: community.general.office_365_connector_card
collection: community.general
short_description: Use webhooks to create Connector Card messages within an Office 365 group
description: Creates Connector Card messages through Office 365 Connectors U(https://learn.microsoft.com/en-us/microsoftteams/platform/task-modules-and-cards/cards/cards-reference#connector-card-for-microsoft-365-groups).
options:
  actions:
    type: list
    description: This array of objects will power the action links found at the bottom of the card.
  color:
    type: str
    description: Accent color used for branding or indicating status in the card.
  sections:
    type: list
    description: Contains a list of sections to display in the card. For more information see U(https://learn.microsoft.com/en-us/outlook/actionable-messages/message-card-reference#section-fields).
  summary:
    type: str
    description: A string used for summarizing card content. This will be shown as the message subject.
      This is required if the text parameter isn't populated.
  text:
    type: str
    description: The main text of the card. This will be rendered below the sender information and optional
      title, and above any sections or actions present.
  title:
    type: str
    description: A title for the Connector message. Shown at the top of the message.
  webhook:
    type: str
    required: true
    description: The webhook URL is given to you when you create a new Connector.
writes: true
runtime: starlark
source: translated
