name: pnpm
fqcn: community.general.pnpm
collection: community.general
short_description: Manage node.js packages with pnpm
description: Manage node.js packages with the L(pnpm package manager, https://pnpm.io/).
options:
  alias:
    type: str
    description: Alias of the node.js library.
  dev:
    type: bool
    default: false
    description: Install dependencies in development mode. Pnpm will ignore any regular dependencies in
      C(package.json).
  executable:
    type: path
    description: The executable location for pnpm. The default location it searches for is E(PATH), fails
      if not set.
  global:
    type: bool
    default: false
    description: Install the node.js library globally.
  ignore_scripts:
    type: bool
    default: false
    description: Use the C(--ignore-scripts) flag when installing.
  name:
    type: str
    description: The name of a node.js library to install. All packages in package.json are installed
      if not provided.
  no_optional:
    type: bool
    default: false
    description: Do not install optional packages, equivalent to C(--no-optional).
  optional:
    type: bool
    default: false
    description: Install dependencies in optional mode.
  path:
    type: path
    description: The base path to install the node.js libraries.
  production:
    type: bool
    default: false
    description: Install dependencies in production mode. Pnpm will ignore any dependencies under C(devDependencies)
      in package.json.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - latest
    description: Installation state of the named node.js library. If V(absent) is selected, a name option
      must be provided.
  version:
    type: str
    description: The version of the library to be installed, in semver format.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install \"tailwindcss\" node.js package.\n  community.general.pnpm:\n    name: tailwindcss\n\
  \    path: /app/location\n\n- name: Install \"tailwindcss\" node.js package on version 3.3.2\n  community.general.pnpm:\n\
  \    name: tailwindcss\n    version: 3.3.2\n    path: /app/location\n\n- name: Install \"tailwindcss\"\
  \ node.js package globally.\n  community.general.pnpm:\n    name: tailwindcss\n    global: true\n\n\
  - name: Install \"tailwindcss\" node.js package as dev dependency.\n  community.general.pnpm:\n    name:\
  \ tailwindcss\n    path: /app/location\n    dev: true\n\n- name: Install \"tailwindcss\" node.js package\
  \ as optional dependency.\n  community.general.pnpm:\n    name: tailwindcss\n    path: /app/location\n\
  \    optional: true\n\n- name: Install \"tailwindcss\" node.js package version 0.1.3 as tailwind-1\n\
  \  community.general.pnpm:\n    name: tailwindcss\n    alias: tailwind-1\n    version: 0.1.3\n    path:\
  \ /app/location\n\n- name: Remove the globally-installed package \"tailwindcss\".\n  community.general.pnpm:\n\
  \    name: tailwindcss\n    global: true\n    state: absent\n\n- name: Install packages based on package.json.\n\
  \  community.general.pnpm:\n    path: /app/location\n\n- name: Update all packages in package.json to\
  \ their latest version.\n  community.general.pnpm:\n    path: /app/location\n    state: latest\n"
