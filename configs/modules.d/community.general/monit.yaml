name: monit
fqcn: community.general.monit
collection: community.general
short_description: Manage the state of a program monitored via Monit
description: Manage the state of a program monitored via Monit.
options:
  name:
    type: str
    required: true
    description: The name of the C(monit) program/process to manage.
  state:
    type: str
    required: true
    choices:
    - present
    - started
    - stopped
    - restarted
    - monitored
    - unmonitored
    - reloaded
    description: The state of service.
  timeout:
    type: int
    default: 300
    description: If there are pending actions for the service monitored by monit, then Ansible will check
      for up to this many seconds to verify the requested action has been performed. Ansible will sleep
      for five seconds between each check.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Manage the state of program httpd to be in started state\n  community.general.monit:\n\
  \    name: httpd\n    state: started\n"
