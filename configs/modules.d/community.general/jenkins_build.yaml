name: jenkins_build
fqcn: community.general.jenkins_build
collection: community.general
short_description: Manage jenkins builds
description: Manage Jenkins builds with Jenkins REST API.
options:
  args:
    type: dict
    description: A list of parameters to pass to the build.
  build_number:
    type: int
    description: An integer which specifies a build of a job. Is required to remove a build from the queue.
  detach:
    type: bool
    default: false
    description: Enable detached mode to not wait for the build end.
  name:
    type: str
    required: true
    description: Name of the Jenkins job to build.
  password:
    type: str
    description: Password to authenticate with the Jenkins server.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - stopped
    description: Attribute that specifies if the build is to be created, deleted or stopped. The V(stopped)
      state has been added in community.general 3.3.0.
  time_between_checks:
    type: int
    default: 10
    description: Time in seconds to wait between requests to the Jenkins server. This times must be higher
      than the configured quiet time for the job.
  token:
    type: str
    description: API token used to authenticate with the Jenkins server.
  url:
    type: str
    default: http://localhost:8080
    description: URL of the Jenkins server.
  user:
    type: str
    description: User to authenticate with the Jenkins server.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a jenkins build using basic authentication\n  community.general.jenkins_build:\n\
  \    name: \"test-check\"\n    args:\n      cloud: \"test\"\n      availability_zone: \"test_az\"\n\
  \    state: present\n    user: admin\n    password: asdfg\n    url: http://localhost:8080\n\n- name:\
  \ Stop a running jenkins build anonymously\n  community.general.jenkins_build:\n    name: \"stop-check\"\
  \n    build_number: 3\n    state: stopped\n    url: http://localhost:8080\n\n- name: Delete a jenkins\
  \ build using token authentication\n  community.general.jenkins_build:\n    name: \"delete-experiment\"\
  \n    build_number: 30\n    state: absent\n    user: Jenkins\n    token: abcdefghijklmnopqrstuvwxyz123456\n\
  \    url: http://localhost:8080\n"
