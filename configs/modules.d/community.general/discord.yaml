name: discord
fqcn: community.general.discord
collection: community.general
short_description: Send Discord messages
description: Sends a message to a Discord channel using the Discord webhook API.
options:
  avatar_url:
    type: str
    description: Overrides the default avatar of the webhook.
  content:
    type: str
    description: Content of the message to the Discord channel. At least one of O(content) and O(embeds)
      must be specified.
  embeds:
    type: list
    description: 'Send messages as Embeds to the Discord channel. Embeds can have a colored border, embedded
      images, text fields and more. Allowed parameters are described in the Discord Docs: U(https://discord.com/developers/docs/resources/channel#embed-object)
      At least one of O(content) and O(embeds) must be specified.'
  tts:
    type: bool
    default: false
    description: Set this to V(true) if this is a TTS (Text to Speech) message.
  username:
    type: str
    description: Overrides the default username of the webhook.
  webhook_id:
    type: str
    required: true
    description: 'The webhook ID. Format from Discord webhook URL: C(/webhooks/{webhook.id}/{webhook.token}).'
  webhook_token:
    type: str
    required: true
    description: 'The webhook token. Format from Discord webhook URL: C(/webhooks/{webhook.id}/{webhook.token}).'
writes: true
runtime: starlark
source: translated
examples: "\n- name: Send a message to the Discord channel\n  community.general.discord:\n    webhook_id:\
  \ \"00000\"\n    webhook_token: \"XXXYYY\"\n    content: \"This is a message from ansible\"\n\n- name:\
  \ Send a message to the Discord channel with specific username and avatar\n  community.general.discord:\n\
  \    webhook_id: \"00000\"\n    webhook_token: \"XXXYYY\"\n    content: \"This is a message from ansible\"\
  \n    username: Ansible\n    avatar_url: \"https://docs.ansible.com/ansible/latest/_static/images/logo_invert.png\"\
  \n\n- name: Send a embedded message to the Discord channel\n  community.general.discord:\n    webhook_id:\
  \ \"00000\"\n    webhook_token: \"XXXYYY\"\n    embeds:\n      - title: \"Embedded message\"\n     \
  \   description: \"This is an embedded message\"\n        footer:\n          text: \"Author: Ansible\"\
  \n        image:\n          url: \"https://docs.ansible.com/ansible/latest/_static/images/logo_invert.png\"\
  \n\n- name: Send two embedded messages\n  community.general.discord:\n    webhook_id: \"00000\"\n  \
  \  webhook_token: \"XXXYYY\"\n    embeds:\n      - title: \"First message\"\n        description: \"\
  This is my first embedded message\"\n        footer:\n          text: \"Author: Ansible\"\n        image:\n\
  \          url: \"https://docs.ansible.com/ansible/latest/_static/images/logo_invert.png\"\n      -\
  \ title: \"Second message\"\n        description: \"This is my first second message\"\n        footer:\n\
  \          text: \"Author: Ansible\"\n          icon_url: \"https://docs.ansible.com/ansible/latest/_static/images/logo_invert.png\"\
  \n        fields:\n          - name: \"Field 1\"\n            value: \"Value of my first field\"\n \
  \         - name: \"Field 2\"\n            value: \"Value of my second field\"\n        timestamp: \"\
  {{ ansible_date_time.iso8601 }}\"\n"
