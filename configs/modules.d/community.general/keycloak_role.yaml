name: keycloak_role
fqcn: community.general.keycloak_role
collection: community.general
short_description: Allows administration of Keycloak roles via Keycloak API
description: This module allows you to add, remove or modify Keycloak roles via the Keycloak REST API.
  It requires access to the REST API via OpenID Connect; the user connecting and the client being used
  must have the requisite access rights. In a default Keycloak installation, admin-cli and an admin user
  would work, as would a separate client definition with the scope tailored to your needs and a user having
  the expected roles. The names of module options are snake_cased versions of the camelCase ones found
  in the Keycloak API and its documentation at U(https://www.keycloak.org/docs-api/8.0/rest-api/index.html).
  Attributes are multi-valued in the Keycloak API. All attributes are lists of individual values and will
  be returned that way by this module. You may pass single values for attributes when calling the module,
  and this will be translated into a list suitable for the API.
options:
  attributes:
    type: dict
    description: A dict of key/value pairs to set as custom attributes for the role. Values may be single
      values (e.g. a string) or a list of strings.
  auth_client_id:
    type: str
    default: admin-cli
    description: OpenID Connect C(client_id) to authenticate to the API with.
  auth_client_secret:
    type: str
    description: Client Secret to use in conjunction with O(auth_client_id) (if required).
  auth_keycloak_url:
    type: str
    required: true
    aliases:
    - url
    description: URL to the Keycloak instance.
  auth_password:
    type: str
    aliases:
    - password
    description: Password to authenticate for API access with.
  auth_realm:
    type: str
    description: Keycloak realm name to authenticate to for API access.
  auth_username:
    type: str
    aliases:
    - username
    description: Username to authenticate for API access with.
  client_id:
    type: str
    description: If the role is a client role, the client id under which it resides. If this parameter
      is absent, the role is considered a realm role.
  composite:
    type: bool
    default: false
    description: If V(true), the role is a composition of other realm and/or client role.
  composites:
    type: list
    default: []
    description: List of roles to include to the composite realm role. If the composite role is a client
      role, the C(clientId) (not ID of the client) must be specified.
  connection_timeout:
    type: int
    default: 10
    description: Controls the HTTP connections timeout period (in seconds) to Keycloak API.
  description:
    type: str
    description: The role description.
  http_agent:
    type: str
    default: Ansible
    description: Configures the HTTP User-Agent header.
  name:
    type: str
    required: true
    description: Name of the role. This parameter is required.
  realm:
    type: str
    default: master
    description: The Keycloak realm under which this role resides.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the role. On V(present), the role will be created if it does not yet exist,
      or updated with the parameters you provide. On V(absent), the role will be removed if it exists.
  token:
    type: str
    description: Authentication token for Keycloak API.
  validate_certs:
    type: bool
    default: true
    description: Verify TLS certificates (do not disable this in production).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a Keycloak realm role, authentication with credentials\n  community.general.keycloak_role:\n\
  \    name: my-new-kc-role\n    realm: MyCustomRealm\n    state: present\n    auth_client_id: admin-cli\n\
  \    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm: master\n    auth_username: USERNAME\n\
  \    auth_password: PASSWORD\n  delegate_to: localhost\n\n- name: Create a Keycloak realm role, authentication\
  \ with token\n  community.general.keycloak_role:\n    name: my-new-kc-role\n    realm: MyCustomRealm\n\
  \    state: present\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    token: TOKEN\n  delegate_to: localhost\n\n- name: Create a Keycloak client role\n  community.general.keycloak_role:\n\
  \    name: my-new-kc-role\n    realm: MyCustomRealm\n    client_id: MyClient\n    state: present\n \
  \   auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm:\
  \ master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n  delegate_to: localhost\n\n- name:\
  \ Delete a Keycloak role\n  community.general.keycloak_role:\n    name: my-role-for-deletion\n    state:\
  \ absent\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm:\
  \ master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n  delegate_to: localhost\n\n- name:\
  \ Create a keycloak role with some custom attributes\n  community.general.keycloak_role:\n    auth_client_id:\
  \ admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm: master\n    auth_username:\
  \ USERNAME\n    auth_password: PASSWORD\n    name: my-new-role\n    attributes:\n        attrib1: value1\n\
  \        attrib2: value2\n        attrib3:\n            - with\n            - numerous\n           \
  \ - individual\n            - list\n            - items\n  delegate_to: localhost\n"
