name: profitbricks_nic
fqcn: community.general.profitbricks_nic
collection: community.general
short_description: Create or Remove a NIC
description: This module allows you to create or restore a volume snapshot. This module has a dependency
  on profitbricks >= 1.0.0
options:
  datacenter:
    type: str
    required: true
    description: The datacenter in which to operate.
  lan:
    type: str
    description: The LAN to place the NIC on. You can pass a LAN that doesn't exist and it will be created.
      Required on create.
  name:
    type: str
    description: The name or ID of the NIC. This is only required on deletes, but not on create. If not
      specified, it defaults to a value based on UUID4.
  server:
    type: str
    required: true
    description: The server name or ID.
  state:
    type: str
    default: present
    description: 'Indicate desired state of the resource The available choices are: V(present), V(absent).'
  subscription_password:
    type: str
    required: true
    description: THe ProfitBricks password. Overrides the PB_PASSWORD environment variable.
  subscription_user:
    type: str
    required: true
    description: The ProfitBricks username. Overrides the PB_SUBSCRIPTION_ID environment variable.
  wait:
    type: bool
    default: true
    description: wait for the operation to complete before returning
  wait_timeout:
    type: int
    default: 600
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a NIC\n  community.general.profitbricks_nic:\n    datacenter: Tardis One\n\
  \    server: node002\n    lan: 2\n    wait_timeout: 500\n    state: present\n\n- name: Remove a NIC\n\
  \  community.general.profitbricks_nic:\n    datacenter: Tardis One\n    server: node002\n    name: 7341c2454f\n\
  \    wait_timeout: 500\n    state: absent\n"
