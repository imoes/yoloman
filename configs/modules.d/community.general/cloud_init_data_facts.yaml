name: cloud_init_data_facts
fqcn: community.general.cloud_init_data_facts
collection: community.general
short_description: Retrieve facts of cloud-init
description: Gathers facts by reading the status.json and result.json of cloud-init.
options:
  filter:
    type: str
    choices:
    - status
    - result
    description: Filter facts
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather all facts of cloud init\n  community.general.cloud_init_data_facts:\n  register:\
  \ result\n\n- ansible.builtin.debug:\n    var: result\n\n- name: Wait for cloud init to finish\n  community.general.cloud_init_data_facts:\n\
  \    filter: status\n  register: res\n  until: \"res.cloud_init_data_facts.status.v1.stage is defined\
  \ and not res.cloud_init_data_facts.status.v1.stage\"\n  retries: 50\n  delay: 5\n"
