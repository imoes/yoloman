name: lxc_container
fqcn: community.general.lxc_container
collection: community.general
short_description: Manage LXC Containers
description: Management of LXC containers.
options:
  archive:
    type: bool
    default: false
    description: Create an archive of a container. This will create a tarball of the running container.
  archive_compression:
    type: str
    default: gzip
    choices:
    - gzip
    - bzip2
    - none
    description: Type of compression to use when creating an archive of a running container.
  archive_path:
    type: path
    description: Path the save the archived container. If the path does not exist the archive method will
      attempt to create it.
  backing_store:
    type: str
    default: dir
    choices:
    - dir
    - lvm
    - loop
    - btrfs
    - overlayfs
    - zfs
    description: Backend storage type for the container.
  clone_name:
    type: str
    description: Name of the new cloned server. This is only used when state is clone.
  clone_snapshot:
    type: bool
    default: false
    description: Create a snapshot a container when cloning. This is not supported by all container storage
      backends. Enabling this may fail if the backing store does not support snapshots.
  config:
    type: path
    description: Path to the LXC configuration file.
  container_command:
    type: str
    description: Run a command within a container.
  container_config:
    type: list
    description: A list of C(key=value) options to use when configuring a container.
  container_log:
    type: bool
    default: false
    description: Enable a container log for host actions to the container.
  container_log_level:
    type: str
    default: INFO
    choices:
    - Info
    - info
    - INFO
    - Error
    - error
    - ERROR
    - Debug
    - debug
    - DEBUG
    description: Set the log level for a container where O(container_log) was set.
  directory:
    type: path
    description: Place rootfs directory under DIR.
  fs_size:
    type: str
    default: 5G
    description: File system Size.
  fs_type:
    type: str
    default: ext4
    description: Create fstype TYPE.
  lv_name:
    type: str
    description: Name of the logical volume, defaults to the container name. If not specified, it defaults
      to C($CONTAINER_NAME).
  lxc_path:
    type: path
    description: Place container under E(PATH).
  name:
    type: str
    required: true
    description: Name of a container.
  state:
    type: str
    default: started
    choices:
    - started
    - stopped
    - restarted
    - absent
    - frozen
    - clone
    description: Define the state of a container. If you clone a container using O(clone_name) the newly
      cloned container created in a stopped state. The running container will be stopped while the clone
      operation is happening and upon completion of the clone the original container state will be restored.
  template:
    type: str
    default: ubuntu
    description: Name of the template to use within an LXC create.
  template_options:
    type: str
    description: Template options when building the container.
  thinpool:
    type: str
    description: Use LVM thin pool called TP.
  vg_name:
    type: str
    default: lxc
    description: If backend store is lvm, specify the name of the volume group.
  zfs_root:
    type: str
    description: Create zfs under given zfsroot.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a started container\n  community.general.lxc_container:\n    name: test-container-started\n\
  \    container_log: true\n    template: ubuntu\n    state: started\n    template_options: --release\
  \ trusty\n\n- name: Create a stopped container\n  community.general.lxc_container:\n    name: test-container-stopped\n\
  \    container_log: true\n    template: ubuntu\n    state: stopped\n    template_options: --release\
  \ trusty\n\n- name: Create a frozen container\n  community.general.lxc_container:\n    name: test-container-frozen\n\
  \    container_log: true\n    template: ubuntu\n    state: frozen\n    template_options: --release trusty\n\
  \    container_command: |\n      echo 'hello world.' | tee /opt/started-frozen\n\n# Create filesystem\
  \ container, configure it, and archive it, and start it.\n- name: Create filesystem container\n  community.general.lxc_container:\n\
  \    name: test-container-config\n    backing_store: dir\n    container_log: true\n    template: ubuntu\n\
  \    state: started\n    archive: true\n    archive_compression: none\n    container_config:\n     \
  \ - \"lxc.aa_profile=unconfined\"\n      - \"lxc.cgroup.devices.allow=a *:* rmw\"\n    template_options:\
  \ --release trusty\n\n# Create an lvm container, run a complex command in it, add additional\n# configuration\
  \ to it, create an archive of it, and finally leave the container\n# in a frozen state. The container\
  \ archive will be compressed using bzip2\n- name: Create a frozen lvm container\n  community.general.lxc_container:\n\
  \    name: test-container-lvm\n    container_log: true\n    template: ubuntu\n    state: frozen\n  \
  \  backing_store: lvm\n    template_options: --release trusty\n    container_command: |\n      apt-get\
  \ update\n      apt-get install -y vim lxc-dev\n      echo 'hello world.' | tee /opt/started\n     \
  \ if [[ -f \"/opt/started\" ]]; then\n          echo 'hello world.' | tee /opt/found-started\n     \
  \ fi\n    container_config:\n      - \"lxc.aa_profile=unconfined\"\n      - \"lxc.cgroup.devices.allow=a\
  \ *:* rmw\"\n    archive: true\n    archive_compression: bzip2\n  register: lvm_container_info\n\n-\
  \ name: Debug info on container \"test-container-lvm\"\n  ansible.builtin.debug:\n    var: lvm_container_info\n\
  \n- name: Run a command in a container and ensure its in a \"stopped\" state.\n  community.general.lxc_container:\n\
  \    name: test-container-started\n    state: stopped\n    container_command: |\n      echo 'hello world.'\
  \ | tee /opt/stopped\n\n- name: Run a command in a container and ensure its it in a \"frozen\" state.\n\
  \  community.general.lxc_container:\n    name: test-container-stopped\n    state: frozen\n    container_command:\
  \ |\n      echo 'hello world.' | tee /opt/frozen\n\n- name: Start a container\n  community.general.lxc_container:\n\
  \    name: test-container-stopped\n    state: started\n\n- name: Run a command in a container and then\
  \ restart it\n  community.general.lxc_container:\n    name: test-container-started\n    state: restarted\n\
  \    container_command: |\n      echo 'hello world.' | tee /opt/restarted\n\n- name: Run a complex command\
  \ within a \"running\" container\n  community.general.lxc_container:\n    name: test-container-started\n\
  \    container_command: |\n      apt-get update\n      apt-get install -y curl wget vim apache2\n  \
  \    echo 'hello world.' | tee /opt/started\n      if [[ -f \"/opt/started\" ]]; then\n          echo\
  \ 'hello world.' | tee /opt/found-started\n      fi\n\n# Create an archive of an existing container,\
  \ save the archive to a defined\n# path and then destroy it.\n- name: Archive container\n  community.general.lxc_container:\n\
  \    name: test-container-started\n    state: absent\n    archive: true\n    archive_path: /opt/archives\n\
  \n# Create a container using overlayfs, create an archive of it, create a\n# snapshot clone of the container\
  \ and and finally leave the container\n# in a frozen state. The container archive will be compressed\
  \ using gzip.\n- name: Create an overlayfs container archive and clone it\n  community.general.lxc_container:\n\
  \    name: test-container-overlayfs\n    container_log: true\n    template: ubuntu\n    state: started\n\
  \    backing_store: overlayfs\n    template_options: --release trusty\n    clone_snapshot: true\n  \
  \  clone_name: test-container-overlayfs-clone-snapshot\n    archive: true\n    archive_compression:\
  \ gzip\n  register: clone_container_info\n\n- name: Debug info on container \"test-container\"\n  ansible.builtin.debug:\n\
  \    var: clone_container_info\n\n- name: Clone a container using snapshot\n  community.general.lxc_container:\n\
  \    name: test-container-overlayfs-clone-snapshot\n    backing_store: overlayfs\n    clone_name: test-container-overlayfs-clone-snapshot2\n\
  \    clone_snapshot: true\n\n- name: Create a new container and clone it\n  community.general.lxc_container:\n\
  \    name: test-container-new-archive\n    backing_store: dir\n    clone_name: test-container-new-archive-clone\n\
  \n- name: Archive and clone a container then destroy it\n  community.general.lxc_container:\n    name:\
  \ test-container-new-archive\n    state: absent\n    clone_name: test-container-new-archive-destroyed-clone\n\
  \    archive: true\n    archive_compression: gzip\n\n- name: Start a cloned container.\n  community.general.lxc_container:\n\
  \    name: test-container-new-archive-destroyed-clone\n    state: started\n\n- name: Destroy a container\n\
  \  community.general.lxc_container:\n    name: '{{ item }}'\n    state: absent\n  with_items:\n    -\
  \ test-container-stopped\n    - test-container-started\n    - test-container-frozen\n    - test-container-lvm\n\
  \    - test-container-config\n    - test-container-overlayfs\n    - test-container-overlayfs-clone\n\
  \    - test-container-overlayfs-clone-snapshot\n    - test-container-overlayfs-clone-snapshot2\n   \
  \ - test-container-new-archive\n    - test-container-new-archive-clone\n    - test-container-new-archive-destroyed-clone\n"
