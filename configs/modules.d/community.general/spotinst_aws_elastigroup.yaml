name: spotinst_aws_elastigroup
fqcn: community.general.spotinst_aws_elastigroup
collection: community.general
short_description: Create, update or delete Spotinst AWS Elastigroups
description: Can create, update, or delete Spotinst AWS Elastigroups Launch configuration is part of the
  elastigroup configuration, so no additional modules are necessary for handling the launch configuration.
  You will have to have a credentials file in this location - <home>/.spotinst/credentials The credentials
  file must contain a row that looks like this token = <YOUR TOKEN> Full documentation available at https://help.spotinst.com/hc/en-us/articles/115003530285-Ansible-
options:
  account_id:
    type: str
    description: Optional parameter that allows to set an account-id inside the module configuration.
      By default this is retrieved from the credentials path.
  availability_vs_cost:
    type: str
    required: true
    description: 'The strategy orientation. The choices available are: V(availabilityOriented), V(costOriented),
      V(balanced).'
  availability_zones:
    type: list
    required: true
    description: A list of hash/dictionaries of Availability Zones that are configured in the elastigroup;
      '[{"key":"value", "key":"value"}]'; keys allowed are name (String), subnet_id (String), placement_group_name
      (String),
  block_device_mappings:
    type: list
    description: A list of hash/dictionaries of Block Device Mappings for elastigroup instances; You can
      specify virtual devices and EBS volumes.; '[{"key":"value", "key":"value"}]'; keys allowed are device_name
      (List of Strings), virtual_name (String), no_device (String), ebs (Object, expects the following
      keys- delete_on_termination(Boolean), encrypted(Boolean), iops (Integer), snapshot_id(Integer),
      volume_type(String), volume_size(Integer))
  chef:
    type: dict
    description: The Chef integration configuration.; Expects the following keys - chef_server (String),
      organization (String), user (String), pem_key (String), chef_version (String)
  credentials_path:
    type: path
    default: ~/.spotinst/credentials
    description: Optional parameter that allows to set a non-default credentials path.
  do_not_update:
    type: list
    default: []
    description: TODO document.
  down_scaling_policies:
    type: list
    description: A list of hash/dictionaries of scaling policies to configure in the elastigroup; '[{"key":"value",
      "key":"value"}]'; keys allowed are - policy_name (String, required), namespace (String, required),
      metric_name (String, required), dimensions ((List of Objects), Keys allowed are name (String, required)
      and value (String)), statistic (String, required), evaluation_periods (String, required), period
      (String, required), threshold (String, required), cooldown (String, required), unit (String, required),
      operator (String, required), action_type (String, required), adjustment (String), max_target_capacity
      (String), target (String), maximum (String), minimum (String)
  draining_timeout:
    type: int
    description: Time for instance to be drained from incoming requests and deregistered from ELB before
      termination.
  ebs_optimized:
    type: bool
    description: Enable EBS optimization for supported instances which are not enabled by default.; Note
      - additional charges will be applied.
  ebs_volume_pool:
    type: list
    description: A list of hash/dictionaries of EBS devices to reattach to the elastigroup when available;
      '[{"key":"value", "key":"value"}]'; keys allowed are - volume_ids (List of Strings), device_name
      (String)
  ecs:
    type: dict
    description: The ECS integration configuration.; Expects the following key - cluster_name (String)
  elastic_beanstalk:
    type: dict
    description: Placeholder parameter for future implementation of Elastic Beanstalk configurations.
  elastic_ips:
    type: list
    description: List of ElasticIps Allocation Ids (example V(eipalloc-9d4e16f8)) to associate to the
      group instances
  fallback_to_od:
    type: bool
    description: In case of no spots available, Elastigroup will launch an On-demand instance instead
  health_check_grace_period:
    type: int
    description: The amount of time, in seconds, after the instance has launched to start and check its
      health. If not specified, it defaults to V(300).
  health_check_type:
    type: str
    description: 'The service to use for the health check. The choices available are: V(ELB), V(HCS),
      V(TARGET_GROUP), V(MLB), V(EC2).'
  health_check_unhealthy_duration_before_replacement:
    type: int
    description: Minimal mount of time instance should be unhealthy for us to consider it unhealthy.
  iam_role_arn:
    type: str
    description: The instance profile iamRole arn Only use iam_role_arn, or iam_role_name
  iam_role_name:
    type: str
    description: The instance profile iamRole name Only use iam_role_arn, or iam_role_name
  id:
    type: str
    description: The group id if it already exists and you want to update, or delete it. This will not
      work unless the uniqueness_by field is set to id. When this is set, and the uniqueness_by field
      is set, the group will either be updated or deleted, but not created.
  image_id:
    type: str
    required: true
    description: The image Id used to launch the instance.; In case of conflict between Instance type
      and image type, an error will be returned
  key_pair:
    type: str
    description: Specify a Key Pair to attach to the instances
  kubernetes:
    type: dict
    description: The Kubernetes integration configuration. Expects the following keys - api_server (String),
      token (String)
  lifetime_period:
    type: int
    description: Lifetime period
  load_balancers:
    type: list
    description: List of classic ELB names
  max_size:
    type: int
    required: true
    description: The upper limit number of instances that you can scale up to
  mesosphere:
    type: dict
    description: The Mesosphere integration configuration. Expects the following key - api_server (String)
  min_size:
    type: int
    required: true
    description: The lower limit number of instances that you can scale down to
  monitoring:
    type: str
    description: Describes whether instance Enhanced Monitoring is enabled
  multai_load_balancers:
    type: list
    description: Configuration parameters for Multai load balancers.
  multai_token:
    type: str
    description: Token used for Multai configuration.
  name:
    type: str
    required: true
    description: Unique name for elastigroup to be created, updated or deleted
  network_interfaces:
    type: list
    description: A list of hash/dictionaries of network interfaces to add to the elastigroup; '[{"key":"value",
      "key":"value"}]'; keys allowed are - description (String), device_index (Integer), secondary_private_ip_address_count
      (Integer), associate_public_ip_address (Boolean), delete_on_termination (Boolean), groups (List
      of Strings), network_interface_id (String), private_ip_address (String), subnet_id (String), associate_ipv6_address
      (Boolean), private_ip_addresses (List of Objects, Keys are privateIpAddress (String, required) and
      primary (Boolean))
  on_demand_count:
    type: int
    description: Required if risk is not set Number of on demand instances to launch. All other instances
      will be spot instances.; Either set this parameter or the risk parameter
  on_demand_instance_type:
    type: str
    description: On-demand instance type that will be provisioned
  opsworks:
    type: dict
    description: The elastigroup OpsWorks integration configuration.; Expects the following key - layer_id
      (String)
  persistence:
    type: dict
    description: The Stateful elastigroup configuration.; Accepts the following keys - should_persist_root_device
      (Boolean), should_persist_block_devices (Boolean), should_persist_private_ip (Boolean)
  product:
    type: str
    required: true
    description: 'Operation system type. Available choices are: V(Linux/UNIX), V(SUSE Linux), V(Windows),
      V(Linux/UNIX (Amazon VPC)), V(SUSE Linux (Amazon VPC)).'
  rancher:
    type: dict
    description: The Rancher integration configuration.; Expects the following keys - version (String),
      access_key (String), secret_key (String), master_host (String)
  right_scale:
    type: dict
    description: The Rightscale integration configuration.; Expects the following keys - account_id (String),
      refresh_token (String)
  risk:
    type: int
    description: Required if on demand is not set. The percentage of Spot instances to launch (0 - 100).
  roll_config:
    type: dict
    description: Roll configuration.; If you would like the group to roll after updating, please use this
      feature. Accepts the following keys - batch_size_percentage(Integer, Required), grace_period - (Integer,
      Required), health_check_type(String, Optional)
  scheduled_tasks:
    type: list
    description: A list of hash/dictionaries of scheduled tasks to configure in the elastigroup; '[{"key":"value",
      "key":"value"}]'; keys allowed are - adjustment (Integer), scale_target_capacity (Integer), scale_min_capacity
      (Integer), scale_max_capacity (Integer), adjustment_percentage (Integer), batch_size_percentage
      (Integer), cron_expression (String), frequency (String), grace_period (Integer), task_type (String,
      required), is_enabled (Boolean)
  security_group_ids:
    type: list
    required: true
    description: One or more security group IDs. ; In case of update it will override the existing Security
      Group with the new given array
  shutdown_script:
    type: str
    description: The Base64-encoded shutdown script that executes prior to instance termination. Encode
      before setting.
  signals:
    type: list
    description: A list of hash/dictionaries of signals to configure in the elastigroup; keys allowed
      are - name (String, required), timeout (Integer)
  spin_up_time:
    type: int
    description: Spin up time, in seconds, for the instance
  spot_instance_types:
    type: list
    required: true
    description: Spot instance type that will be provisioned.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Create or delete the elastigroup
  tags:
    type: list
    description: A list of tags to configure in the elastigroup. Please specify list of keys and values
      (key colon value);
  target:
    type: int
    required: true
    description: The number of instances to launch
  target_group_arns:
    type: list
    description: List of target group arns instances should be registered to
  target_tracking_policies:
    type: list
    description: A list of hash/dictionaries of target tracking policies to configure in the elastigroup;
      '[{"key":"value", "key":"value"}]'; keys allowed are - policy_name (String, required), namespace
      (String, required), source (String, required), metric_name (String, required), statistic (String,
      required), unit (String, required), cooldown (String, required), target (String, required)
  tenancy:
    type: str
    description: 'Dedicated vs shared tenancy. The available choices are: V(default), V(dedicated).'
  terminate_at_end_of_billing_hour:
    type: bool
    description: Terminate at the end of billing hour
  token:
    type: str
    description: 'A Personal API Access Token issued by Spotinst. When not specified, the module will
      try to obtain it, in that order, from: environment variable E(SPOTINST_TOKEN), or from the credentials
      path.'
  uniqueness_by:
    type: str
    default: name
    choices:
    - id
    - name
    description: If your group names are not unique, you may use this feature to update or delete a specific
      group. Whenever this property is set, you must set a group_id in order to update or delete a group,
      otherwise a group will be created.
  unit:
    type: str
    description: 'The capacity unit to launch instances by. The available choices are: V(instance), V(weight).'
  up_scaling_policies:
    type: list
    description: A list of hash/dictionaries of scaling policies to configure in the elastigroup; '[{"key":"value",
      "key":"value"}]'; keys allowed are - policy_name (String, required), namespace (String, required),
      metric_name (String, required), dimensions (List of Objects, Keys allowed are name (String, required)
      and value (String)), statistic (String, required) evaluation_periods (String, required), period
      (String, required), threshold (String, required), cooldown (String, required), unit (String, required),
      operator (String, required), action_type (String, required), adjustment (String), min_target_capacity
      (String), target (String), maximum (String), minimum (String)
  user_data:
    type: str
    description: Base64-encoded MIME user data. Encode before setting the value.
  utilize_reserved_instances:
    type: bool
    description: In case of any available Reserved Instances, Elastigroup will utilize your reservations
      before purchasing Spot instances.
  wait_for_instances:
    type: bool
    default: false
    description: Whether or not the elastigroup creation / update actions should wait for the instances
      to spin
  wait_timeout:
    type: int
    description: How long the module should wait for instances before failing the action.; Only works
      if wait_for_instances is True.
writes: true
runtime: starlark
source: translated
examples: "\n# Basic configuration YAML example\n\n- hosts: localhost\n  tasks:\n    - name: Create elastigroup\n\
  \      community.general.spotinst_aws_elastigroup:\n          state: present\n          risk: 100\n\
  \          availability_vs_cost: balanced\n          availability_zones:\n            - name: us-west-2a\n\
  \              subnet_id: subnet-2b68a15c\n          image_id: ami-f173cc91\n          key_pair: spotinst-oregon\n\
  \          max_size: 15\n          min_size: 0\n          target: 0\n          unit: instance\n    \
  \      monitoring: true\n          name: ansible-group\n          on_demand_instance_type: c3.large\n\
  \          product: Linux/UNIX\n          load_balancers:\n            - test-lb-1\n          security_group_ids:\n\
  \            - sg-8f4b8fe9\n          spot_instance_types:\n            - c3.large\n          do_not_update:\n\
  \            - image_id\n            - target\n      register: result\n    - ansible.builtin.debug:\
  \ var=result\n\n# In this example, we create an elastigroup and wait 600 seconds to retrieve the instances,\
  \ and use their private ips\n\n- hosts: localhost\n  tasks:\n    - name: Create elastigroup\n      community.general.spotinst_aws_elastigroup:\n\
  \          state: present\n          account_id: act-1a9dd2b\n          risk: 100\n          availability_vs_cost:\
  \ balanced\n          availability_zones:\n            - name: us-west-2a\n              subnet_id:\
  \ subnet-2b68a15c\n          tags:\n            - Environment: someEnvValue\n            - OtherTagKey:\
  \ otherValue\n          image_id: ami-f173cc91\n          key_pair: spotinst-oregon\n          max_size:\
  \ 5\n          min_size: 0\n          target: 0\n          unit: instance\n          monitoring: true\n\
  \          name: ansible-group-tal\n          on_demand_instance_type: c3.large\n          product:\
  \ Linux/UNIX\n          security_group_ids:\n            - sg-8f4b8fe9\n          block_device_mappings:\n\
  \            - device_name: '/dev/sda1'\n              ebs:\n                volume_size: 100\n    \
  \            volume_type: gp2\n          spot_instance_types:\n            - c3.large\n          do_not_update:\n\
  \            - image_id\n          wait_for_instances: true\n          wait_timeout: 600\n      register:\
  \ result\n\n    - name: Store private ips to file\n      ansible.builtin.shell: echo {{ item.private_ip\
  \ }}\\n >> list-of-private-ips\n      with_items: \"{{ result.instances }}\"\n    - ansible.builtin.debug:\
  \ var=result\n\n# In this example, we create an elastigroup with multiple block device mappings, tags,\
  \ and also an account id\n# In organizations with more than one account, it is required to specify an\
  \ account_id\n\n- hosts: localhost\n  tasks:\n    - name: Create elastigroup\n      community.general.spotinst_aws_elastigroup:\n\
  \          state: present\n          account_id: act-1a9dd2b\n          risk: 100\n          availability_vs_cost:\
  \ balanced\n          availability_zones:\n            - name: us-west-2a\n              subnet_id:\
  \ subnet-2b68a15c\n          tags:\n            - Environment: someEnvValue\n            - OtherTagKey:\
  \ otherValue\n          image_id: ami-f173cc91\n          key_pair: spotinst-oregon\n          max_size:\
  \ 5\n          min_size: 0\n          target: 0\n          unit: instance\n          monitoring: true\n\
  \          name: ansible-group-tal\n          on_demand_instance_type: c3.large\n          product:\
  \ Linux/UNIX\n          security_group_ids:\n            - sg-8f4b8fe9\n          block_device_mappings:\n\
  \            - device_name: '/dev/xvda'\n              ebs:\n                volume_size: 60\n     \
  \           volume_type: gp2\n            - device_name: '/dev/xvdb'\n              ebs:\n         \
  \       volume_size: 120\n                volume_type: gp2\n          spot_instance_types:\n       \
  \     - c3.large\n          do_not_update:\n            - image_id\n          wait_for_instances: true\n\
  \          wait_timeout: 600\n      register: result\n\n    - name: Store private ips to file\n    \
  \  ansible.builtin.shell: echo {{ item.private_ip }}\\n >> list-of-private-ips\n      with_items: \"\
  {{ result.instances }}\"\n    - ansible.builtin.debug: var=result\n\n# In this example we have set up\
  \ block device mapping with ephemeral devices\n\n- hosts: localhost\n  tasks:\n    - name: Create elastigroup\n\
  \      community.general.spotinst_aws_elastigroup:\n          state: present\n          risk: 100\n\
  \          availability_vs_cost: balanced\n          availability_zones:\n            - name: us-west-2a\n\
  \              subnet_id: subnet-2b68a15c\n          image_id: ami-f173cc91\n          key_pair: spotinst-oregon\n\
  \          max_size: 15\n          min_size: 0\n          target: 0\n          unit: instance\n    \
  \      block_device_mappings:\n            - device_name: '/dev/xvda'\n              virtual_name: ephemeral0\n\
  \            - device_name: '/dev/xvdb/'\n              virtual_name: ephemeral1\n          monitoring:\
  \ true\n          name: ansible-group\n          on_demand_instance_type: c3.large\n          product:\
  \ Linux/UNIX\n          load_balancers:\n            - test-lb-1\n          security_group_ids:\n  \
  \          - sg-8f4b8fe9\n          spot_instance_types:\n            - c3.large\n          do_not_update:\n\
  \            - image_id\n            - target\n      register: result\n    - ansible.builtin.debug:\
  \ var=result\n\n# In this example we create a basic group configuration with a network interface defined.\n\
  # Each network interface must have a device index\n\n- hosts: localhost\n  tasks:\n    - name: Create\
  \ elastigroup\n      community.general.spotinst_aws_elastigroup:\n          state: present\n       \
  \   risk: 100\n          availability_vs_cost: balanced\n          network_interfaces:\n           \
  \ - associate_public_ip_address: true\n              device_index: 0\n          availability_zones:\n\
  \            - name: us-west-2a\n              subnet_id: subnet-2b68a15c\n          image_id: ami-f173cc91\n\
  \          key_pair: spotinst-oregon\n          max_size: 15\n          min_size: 0\n          target:\
  \ 0\n          unit: instance\n          monitoring: true\n          name: ansible-group\n         \
  \ on_demand_instance_type: c3.large\n          product: Linux/UNIX\n          load_balancers:\n    \
  \        - test-lb-1\n          security_group_ids:\n            - sg-8f4b8fe9\n          spot_instance_types:\n\
  \            - c3.large\n          do_not_update:\n            - image_id\n            - target\n  \
  \    register: result\n    - ansible.builtin.debug: var=result\n\n\n# In this example we create a basic\
  \ group configuration with a target tracking scaling policy defined\n\n- hosts: localhost\n  tasks:\n\
  \    - name: Create elastigroup\n      community.general.spotinst_aws_elastigroup:\n          account_id:\
  \ act-92d45673\n          state: present\n          risk: 100\n          availability_vs_cost: balanced\n\
  \          availability_zones:\n            - name: us-west-2a\n              subnet_id: subnet-79da021e\n\
  \          image_id: ami-f173cc91\n          fallback_to_od: true\n          tags:\n            - Creator:\
  \ ValueOfCreatorTag\n            - Environment: ValueOfEnvironmentTag\n          key_pair: spotinst-labs-oregon\n\
  \          max_size: 10\n          min_size: 0\n          target: 2\n          unit: instance\n    \
  \      monitoring: true\n          name: ansible-group-1\n          on_demand_instance_type: c3.large\n\
  \          product: Linux/UNIX\n          security_group_ids:\n            - sg-46cdc13d\n         \
  \ spot_instance_types:\n            - c3.large\n          target_tracking_policies:\n            - policy_name:\
  \ target-tracking-1\n              namespace: AWS/EC2\n              metric_name: CPUUtilization\n \
  \             statistic: average\n              unit: percent\n              target: 50\n          \
  \    cooldown: 120\n          do_not_update:\n            - image_id\n      register: result\n    -\
  \ ansible.builtin.debug: var=result\n"
