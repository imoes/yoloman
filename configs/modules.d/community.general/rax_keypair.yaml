name: rax_keypair
fqcn: community.general.rax_keypair
collection: community.general
short_description: Create a keypair for use with Rackspace Cloud Servers
description: Create a keypair for use with Rackspace Cloud Servers
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  name:
    type: str
    required: true
    description: Name of keypair
  public_key:
    type: str
    description: Public Key string to upload. Can be a file path or string
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a keypair\n  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name:\
  \ Keypair request\n      local_action:\n        module: rax_keypair\n        credentials: ~/.raxpub\n\
  \        name: my_keypair\n        region: DFW\n      register: keypair\n    - name: Create local public\
  \ key\n      local_action:\n        module: copy\n        content: \"{{ keypair.keypair.public_key }}\"\
  \n        dest: \"{{ inventory_dir }}/{{ keypair.keypair.name }}.pub\"\n    - name: Create local private\
  \ key\n      local_action:\n        module: copy\n        content: \"{{ keypair.keypair.private_key\
  \ }}\"\n        dest: \"{{ inventory_dir }}/{{ keypair.keypair.name }}\"\n\n- name: Create a keypair\n\
  \  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Keypair request\n      local_action:\n\
  \        module: rax_keypair\n        credentials: ~/.raxpub\n        name: my_keypair\n        public_key:\
  \ \"{{ lookup('file', 'authorized_keys/id_rsa.pub') }}\"\n        region: DFW\n      register: keypair\n"
