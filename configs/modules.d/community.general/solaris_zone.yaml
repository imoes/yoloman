name: solaris_zone
fqcn: community.general.solaris_zone
collection: community.general
short_description: Manage Solaris zones
description: Create, start, stop and delete Solaris zones. This module does not currently allow changing
  of options for a zone that is already been created.
options:
  attach_options:
    type: str
    default: ''
    description: Extra options to the zoneadm attach command. For example, this can be used to specify
      whether a minimum or full update of packages is required and if any packages need to be deleted.
      For valid values, see zoneadm(1M)
  config:
    type: str
    default: ''
    description: The zonecfg configuration commands for this zone. See zonecfg(1M) for the valid options
      and syntax. Typically this is a list of options separated by semi-colons or new lines, e.g. "set
      auto-boot=true;add net;set physical=bge0;set address=10.1.1.1;end"
  create_options:
    type: str
    default: ''
    description: Extra options to the zonecfg(1M) create command.
  install_options:
    type: str
    default: ''
    description: Extra options to the zoneadm(1M) install command. To automate Solaris 11 zone creation,
      use this to specify the profile XML file, e.g. install_options="-c sc_profile.xml"
  name:
    type: str
    required: true
    description: Zone name. A zone name must be unique name. A zone name must begin with an alphanumeric
      character. The name can contain alphanumeric characters, underscores V(_), hyphens V(-), and periods
      V(.). The name cannot be longer than 64 characters.
  path:
    type: str
    description: The path where the zone will be created. This is required when the zone is created, but
      not used otherwise.
  root_password:
    type: str
    description: The password hash for the root account. If not specified, the zone's root account will
      not have a password.
  sparse:
    type: bool
    default: false
    description: Whether to create a sparse (V(true)) or whole root (V(false)) zone.
  state:
    type: str
    default: present
    choices:
    - absent
    - attached
    - configured
    - detached
    - installed
    - present
    - running
    - started
    - stopped
    description: V(present), configure and install the zone. V(installed), synonym for V(present). V(running),
      if the zone already exists, boot it, otherwise, configure and install the zone first, then boot
      it. V(started), synonym for V(running). V(stopped), shutdown a zone. V(absent), destroy the zone.
      V(configured), configure the ready so that it's to be attached. V(attached), attach a zone, but
      do not boot it. V(detached), shutdown and detach a zone
  timeout:
    type: int
    default: 600
    description: Timeout, in seconds, for zone to boot.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create and install a zone, but don't boot it\n  community.general.solaris_zone:\n\
  \    name: zone1\n    state: present\n    path: /zones/zone1\n    sparse: true\n    root_password: Be9oX7OSwWoU.\n\
  \    config: 'set autoboot=true; add net; set physical=bge0; set address=10.1.1.1; end'\n\n- name: Create\
  \ and install a zone and boot it\n  community.general.solaris_zone:\n    name: zone1\n    state: running\n\
  \    path: /zones/zone1\n    root_password: Be9oX7OSwWoU.\n    config: 'set autoboot=true; add net;\
  \ set physical=bge0; set address=10.1.1.1; end'\n\n- name: Boot an already installed zone\n  community.general.solaris_zone:\n\
  \    name: zone1\n    state: running\n\n- name: Stop a zone\n  community.general.solaris_zone:\n   \
  \ name: zone1\n    state: stopped\n\n- name: Destroy a zone\n  community.general.solaris_zone:\n   \
  \ name: zone1\n    state: absent\n\n- name: Detach a zone\n  community.general.solaris_zone:\n    name:\
  \ zone1\n    state: detached\n\n- name: Configure a zone, ready to be attached\n  community.general.solaris_zone:\n\
  \    name: zone1\n    state: configured\n    path: /zones/zone1\n    root_password: Be9oX7OSwWoU.\n\
  \    config: 'set autoboot=true; add net; set physical=bge0; set address=10.1.1.1; end'\n\n- name: Attach\
  \ zone1\n  community.general.solaris_zone:\n    name: zone1\n    state: attached\n    attach_options:\
  \ -u\n"
