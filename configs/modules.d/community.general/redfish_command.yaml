name: redfish_command
fqcn: community.general.redfish_command
collection: community.general
short_description: Manages Out-Of-Band controllers using Redfish APIs
description: Builds Redfish URIs locally and sends them to remote OOB controllers to perform an action.
  Manages OOB controller ex. reboot, log management. Manages OOB controller users ex. add, remove, update.
  Manages system power ex. on, off, graceful and forced reboot.
options:
  account_properties:
    type: dict
    default: {}
    description: Properties of account service to update.
  account_types:
    type: list
    aliases:
    - account_accounttypes
    description: Array of account types to apply to a user account.
  auth_token:
    type: str
    description: Security token for authenticating to OOB controller.
  baseuri:
    type: str
    required: true
    description: Base URI of OOB controller.
  bios_attributes:
    type: dict
    description: BIOS attributes that needs to be verified in the given server.
  boot_next:
    type: str
    description: BootNext target when bootdevice is "UefiBootNext".
  boot_override_mode:
    type: str
    choices:
    - Legacy
    - UEFI
    description: Boot mode when using an override.
  bootdevice:
    type: str
    description: Boot device when setting boot configuration.
  category:
    type: str
    required: true
    description: Category to execute on OOB controller.
  command:
    type: list
    required: true
    description: List of commands to execute on OOB controller.
  id:
    type: str
    aliases:
    - account_id
    description: ID of account to delete/modify. Can also be used in account creation to work around vendor
      issues where the ID of the new user is required in the POST request.
  new_password:
    type: str
    aliases:
    - account_password
    description: New password of account to add/modify.
  new_username:
    type: str
    aliases:
    - account_username
    description: Username of account to add/delete/modify.
  oem_account_types:
    type: list
    aliases:
    - account_oemaccounttypes
    description: Array of OEM account types to apply to a user account.
  password:
    type: str
    description: Password for authenticating to OOB controller.
  resource_id:
    type: str
    description: ID of the System, Manager or Chassis to modify.
  roleid:
    type: str
    aliases:
    - account_roleid
    description: Role of account to add/modify.
  session_uri:
    type: str
    description: URI of the session resource.
  strip_etag_quotes:
    type: bool
    default: false
    description: Removes surrounding quotes of etag used in C(If-Match) header of C(PATCH) requests. Only
      use this option to resolve bad vendor implementation where C(If-Match) only matches the unquoted
      etag string.
  timeout:
    type: int
    description: Timeout in seconds for HTTP requests to OOB controller. The default value for this param
      is C(10) but that is being deprecated and it will be replaced with C(60) in community.general 9.0.0.
  uefi_target:
    type: str
    description: UEFI boot target when bootdevice is "UefiTarget".
  update_apply_time:
    type: str
    choices:
    - Immediate
    - OnReset
    - AtMaintenanceWindowStart
    - InMaintenanceWindowOnReset
    - OnStartUpdateRequest
    description: Time when to apply the update.
  update_creds:
    type: dict
    description: Credentials for retrieving the update image.
  update_handle:
    type: str
    description: Handle to check the status of an update in progress.
  update_image_file:
    type: path
    description: Filename, with optional path, of the image for the update.
  update_image_uri:
    type: str
    description: URI of the image for the update.
  update_oem_params:
    type: dict
    description: Properties for HTTP Multipart Push Updates.
  update_protocol:
    type: str
    description: Protocol for the update.
  update_targets:
    type: list
    default: []
    description: List of target resource URIs to apply the update to.
  update_username:
    type: str
    aliases:
    - account_updatename
    description: New user name for updating account_username.
  username:
    type: str
    description: Username for authenticating to OOB controller.
  virtual_media:
    type: dict
    description: Options for VirtualMedia commands.
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Restart system power gracefully\n    community.general.redfish_command:\n     \
  \ category: Systems\n      command: PowerGracefulRestart\n      resource_id: 437XR1138R2\n      baseuri:\
  \ \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password }}\"\n\n  - name:\
  \ Turn system power off\n    community.general.redfish_command:\n      category: Systems\n      command:\
  \ PowerForceOff\n      resource_id: 437XR1138R2\n\n  - name: Restart system power forcefully\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: PowerForceRestart\n      resource_id: 437XR1138R2\n\n  - name:\
  \ Shutdown system power gracefully\n    community.general.redfish_command:\n      category: Systems\n\
  \      command: PowerGracefulShutdown\n      resource_id: 437XR1138R2\n\n  - name: Turn system power\
  \ on\n    community.general.redfish_command:\n      category: Systems\n      command: PowerOn\n    \
  \  resource_id: 437XR1138R2\n\n  - name: Reboot system power\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: PowerReboot\n      resource_id: 437XR1138R2\n\n  - name: Set\
  \ one-time boot device to {{ bootdevice }}\n    community.general.redfish_command:\n      category:\
  \ Systems\n      command: SetOneTimeBoot\n      resource_id: 437XR1138R2\n      bootdevice: \"{{ bootdevice\
  \ }}\"\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n\n  - name: Set one-time boot device to UefiTarget of \"/0x31/0x33/0x01/0x01\"\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: SetOneTimeBoot\n      resource_id: 437XR1138R2\n      bootdevice:\
  \ \"UefiTarget\"\n      uefi_target: \"/0x31/0x33/0x01/0x01\"\n      baseuri: \"{{ baseuri }}\"\n  \
  \    username: \"{{ username }}\"\n      password: \"{{ password }}\"\n\n  - name: Set one-time boot\
  \ device to BootNext target of \"Boot0001\"\n    community.general.redfish_command:\n      category:\
  \ Systems\n      command: SetOneTimeBoot\n      resource_id: 437XR1138R2\n      bootdevice: \"UefiBootNext\"\
  \n      boot_next: \"Boot0001\"\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\
  \n      password: \"{{ password }}\"\n\n  - name: Set persistent boot device override\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: EnableContinuousBootOverride\n      resource_id: 437XR1138R2\n\
  \      bootdevice: \"{{ bootdevice }}\"\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username\
  \ }}\"\n      password: \"{{ password }}\"\n\n  - name: Set one-time boot to BiosSetup\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: SetOneTimeBoot\n      boot_next: BiosSetup\n      boot_override_mode:\
  \ Legacy\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{\
  \ password }}\"\n\n  - name: Disable persistent boot device override\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: DisableBootOverride\n\n  - name: Set system indicator LED to\
  \ blink using security token for auth\n    community.general.redfish_command:\n      category: Systems\n\
  \      command: IndicatorLedBlink\n      resource_id: 437XR1138R2\n      baseuri: \"{{ baseuri }}\"\n\
  \      auth_token: \"{{ result.session.token }}\"\n\n  - name: Add user\n    community.general.redfish_command:\n\
  \      category: Accounts\n      command: AddUser\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      new_username: \"{{ new_username }}\"\
  \n      new_password: \"{{ new_password }}\"\n      roleid: \"{{ roleid }}\"\n\n  - name: Add user with\
  \ specified account types\n    community.general.redfish_command:\n      category: Accounts\n      command:\
  \ AddUser\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"\
  {{ password }}\"\n      new_username: \"{{ new_username }}\"\n      new_password: \"{{ new_password\
  \ }}\"\n      roleid: \"{{ roleid }}\"\n      account_types:\n      - Redfish\n      - WebUI\n\n  -\
  \ name: Add user using new option aliases\n    community.general.redfish_command:\n      category: Accounts\n\
  \      command: AddUser\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n    \
  \  password: \"{{ password }}\"\n      account_username: \"{{ account_username }}\"\n      account_password:\
  \ \"{{ account_password }}\"\n      account_roleid: \"{{ account_roleid }}\"\n\n  - name: Delete user\n\
  \    community.general.redfish_command:\n      category: Accounts\n      command: DeleteUser\n     \
  \ baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password }}\"\
  \n      account_username: \"{{ account_username }}\"\n\n  - name: Disable user\n    community.general.redfish_command:\n\
  \      category: Accounts\n      command: DisableUser\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      account_username: \"{{ account_username\
  \ }}\"\n\n  - name: Enable user\n    community.general.redfish_command:\n      category: Accounts\n\
  \      command: EnableUser\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n \
  \     password: \"{{ password }}\"\n      account_username: \"{{ account_username }}\"\n\n  - name:\
  \ Add and enable user\n    community.general.redfish_command:\n      category: Accounts\n      command:\
  \ AddUser,EnableUser\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n      new_username: \"{{ new_username }}\"\n      new_password: \"{{ new_password\
  \ }}\"\n      roleid: \"{{ roleid }}\"\n\n  - name: Update user password\n    community.general.redfish_command:\n\
  \      category: Accounts\n      command: UpdateUserPassword\n      baseuri: \"{{ baseuri }}\"\n   \
  \   username: \"{{ username }}\"\n      password: \"{{ password }}\"\n      account_username: \"{{ account_username\
  \ }}\"\n      account_password: \"{{ account_password }}\"\n\n  - name: Update user role\n    community.general.redfish_command:\n\
  \      category: Accounts\n      command: UpdateUserRole\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      account_username: \"{{ account_username\
  \ }}\"\n      roleid: \"{{ roleid }}\"\n\n  - name: Update user name\n    community.general.redfish_command:\n\
  \      category: Accounts\n      command: UpdateUserName\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      account_username: \"{{ account_username\
  \ }}\"\n      account_updatename: \"{{ account_updatename }}\"\n\n  - name: Update user name\n    community.general.redfish_command:\n\
  \      category: Accounts\n      command: UpdateUserName\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      account_username: \"{{ account_username\
  \ }}\"\n      update_username: \"{{ update_username }}\"\n\n  - name: Update AccountService properties\n\
  \    community.general.redfish_command:\n      category: Accounts\n      command: UpdateAccountServiceProperties\n\
  \      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n      account_properties:\n        AccountLockoutThreshold: 5\n        AccountLockoutDuration:\
  \ 600\n\n  - name: Clear Manager Logs with a timeout of 20 seconds\n    community.general.redfish_command:\n\
  \      category: Manager\n      command: ClearLogs\n      resource_id: BMC\n      baseuri: \"{{ baseuri\
  \ }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password }}\"\n      timeout: 20\n\n\
  \  - name: Create session\n    community.general.redfish_command:\n      category: Sessions\n      command:\
  \ CreateSession\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n    register: result\n\n  - name: Set chassis indicator LED to blink using security\
  \ token for auth\n    community.general.redfish_command:\n      category: Chassis\n      command: IndicatorLedBlink\n\
  \      resource_id: 1U\n      baseuri: \"{{ baseuri }}\"\n      auth_token: \"{{ result.session.token\
  \ }}\"\n\n  - name: Delete session using security token created by CreateSesssion above\n    community.general.redfish_command:\n\
  \      category: Sessions\n      command: DeleteSession\n      baseuri: \"{{ baseuri }}\"\n      auth_token:\
  \ \"{{ result.session.token }}\"\n      session_uri: \"{{ result.session.uri }}\"\n\n  - name: Clear\
  \ Sessions\n    community.general.redfish_command:\n      category: Sessions\n      command: ClearSessions\n\
  \      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n\n  - name: Simple update\n    community.general.redfish_command:\n      category: Update\n\
  \      command: SimpleUpdate\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n\
  \      password: \"{{ password }}\"\n      update_image_uri: https://example.com/myupdate.img\n\n  -\
  \ name: Simple update with additional options\n    community.general.redfish_command:\n      category:\
  \ Update\n      command: SimpleUpdate\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username\
  \ }}\"\n      password: \"{{ password }}\"\n      update_image_uri: //example.com/myupdate.img\n   \
  \   update_protocol: FTP\n      update_targets:\n        - /redfish/v1/UpdateService/FirmwareInventory/BMC\n\
  \      update_creds:\n        username: operator\n        password: supersecretpwd\n\n  - name: Multipart\
  \ HTTP push update; timeout is 600 seconds to allow for a\n      large image transfer\n    community.general.redfish_command:\n\
  \      category: Update\n      command: MultipartHTTPPushUpdate\n      baseuri: \"{{ baseuri }}\"\n\
  \      username: \"{{ username }}\"\n      password: \"{{ password }}\"\n      timeout: 600\n      update_image_file:\
  \ ~/images/myupdate.img\n\n  - name: Multipart HTTP push with additional options; timeout is 600 seconds\n\
  \      to allow for a large image transfer\n    community.general.redfish_command:\n      category:\
  \ Update\n      command: MultipartHTTPPushUpdate\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      timeout: 600\n      update_image_file:\
  \ ~/images/myupdate.img\n      update_targets:\n        - /redfish/v1/UpdateService/FirmwareInventory/BMC\n\
  \      update_oem_params:\n        PreserveConfiguration: false\n\n  - name: Perform requested operations\
  \ to continue the update\n    community.general.redfish_command:\n      category: Update\n      command:\
  \ PerformRequestedOperations\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n\
  \      password: \"{{ password }}\"\n      update_handle: /redfish/v1/TaskService/TaskMonitors/735\n\
  \n  - name: Insert Virtual Media\n    community.general.redfish_command:\n      category: Systems\n\
  \      command: VirtualMediaInsert\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username\
  \ }}\"\n      password: \"{{ password }}\"\n      virtual_media:\n        image_url: 'http://example.com/images/SomeLinux-current.iso'\n\
  \        media_types:\n          - CD\n          - DVD\n      resource_id: 1\n\n  - name: Insert Virtual\
  \ Media\n    community.general.redfish_command:\n      category: Manager\n      command: VirtualMediaInsert\n\
  \      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n      virtual_media:\n        image_url: 'http://example.com/images/SomeLinux-current.iso'\n\
  \        media_types:\n          - CD\n          - DVD\n      resource_id: BMC\n\n  - name: Eject Virtual\
  \ Media\n    community.general.redfish_command:\n      category: Systems\n      command: VirtualMediaEject\n\
  \      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n      virtual_media:\n        image_url: 'http://example.com/images/SomeLinux-current.iso'\n\
  \      resource_id: 1\n\n  - name: Eject Virtual Media\n    community.general.redfish_command:\n   \
  \   category: Manager\n      command: VirtualMediaEject\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      virtual_media:\n        image_url: 'http://example.com/images/SomeLinux-current.iso'\n\
  \      resource_id: BMC\n\n  - name: Restart manager power gracefully\n    community.general.redfish_command:\n\
  \      category: Manager\n      command: GracefulRestart\n      resource_id: BMC\n      baseuri: \"\
  {{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password }}\"\n\n  - name:\
  \ Restart manager power gracefully\n    community.general.redfish_command:\n      category: Manager\n\
  \      command: PowerGracefulRestart\n      resource_id: BMC\n\n  - name: Turn manager power off\n \
  \   community.general.redfish_command:\n      category: Manager\n      command: PowerForceOff\n    \
  \  resource_id: BMC\n\n  - name: Restart manager power forcefully\n    community.general.redfish_command:\n\
  \      category: Manager\n      command: PowerForceRestart\n      resource_id: BMC\n\n  - name: Shutdown\
  \ manager power gracefully\n    community.general.redfish_command:\n      category: Manager\n      command:\
  \ PowerGracefulShutdown\n      resource_id: BMC\n\n  - name: Turn manager power on\n    community.general.redfish_command:\n\
  \      category: Manager\n      command: PowerOn\n      resource_id: BMC\n\n  - name: Reboot manager\
  \ power\n    community.general.redfish_command:\n      category: Manager\n      command: PowerReboot\n\
  \      resource_id: BMC\n\n  - name: Verify BIOS attributes\n    community.general.redfish_command:\n\
  \      category: Systems\n      command: VerifyBiosAttributes\n      baseuri: \"{{ baseuri }}\"\n  \
  \    username: \"{{ username }}\"\n      password: \"{{ password }}\"\n      bios_attributes:\n    \
  \    SubNumaClustering: \"Disabled\"\n        WorkloadProfile: \"Virtualization-MaxPerformance\"\n"
