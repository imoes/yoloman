name: serverless
fqcn: community.general.serverless
collection: community.general
short_description: Manages a Serverless Framework project
description: Provides support for managing Serverless Framework (U(https://serverless.com/)) project deployments
  and stacks.
options:
  deploy:
    type: bool
    default: true
    description: Whether or not to deploy artifacts after building them. When this option is V(false)
      all the functions will be built, but no stack update will be run to send them out. This is mostly
      useful for generating artifacts to be stored/deployed elsewhere.
  force:
    type: bool
    default: false
    description: Whether or not to force full deployment, equivalent to serverless C(--force) option.
  region:
    type: str
    default: ''
    description: AWS region to deploy the service to. This parameter defaults to V(us-east-1).
  serverless_bin_path:
    type: path
    description: The path of a serverless framework binary relative to the 'service_path' eg. node_module/.bin/serverless
  service_path:
    type: path
    required: true
    description: The path to the root of the Serverless Service to be operated on.
  stage:
    type: str
    default: ''
    description: The name of the serverless framework project stage to deploy to. This uses the serverless
      framework default "dev".
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Goal state of given stage/project.
  verbose:
    type: bool
    default: false
    description: Shows all stack events during deployment, and display any Stack Output.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Basic deploy of a service\n  community.general.serverless:\n    service_path: '{{\
  \ project_dir }}'\n    state: present\n\n- name: Deploy a project, then pull its resource list back\
  \ into Ansible\n  community.general.serverless:\n    stage: dev\n    region: us-east-1\n    service_path:\
  \ '{{ project_dir }}'\n  register: sls\n\n# The cloudformation stack is always named the same as the\
  \ full service, so the\n# cloudformation_info module can get a full list of the stack resources, as\n\
  # well as stack events and outputs\n- cloudformation_info:\n    region: us-east-1\n    stack_name: '{{\
  \ sls.service_name }}'\n    stack_resources: true\n\n- name: Deploy a project using a locally installed\
  \ serverless binary\n  community.general.serverless:\n    stage: dev\n    region: us-east-1\n    service_path:\
  \ '{{ project_dir }}'\n    serverless_bin_path: node_modules/.bin/serverless\n"
