name: matrix
fqcn: community.general.matrix
collection: community.general
short_description: Send notifications to matrix
description: This module sends html formatted notifications to matrix rooms.
options:
  hs_url:
    type: str
    required: true
    description: URL of the homeserver, where the CS-API is reachable
  msg_html:
    type: str
    required: true
    description: HTML form of the message to send to matrix
  msg_plain:
    type: str
    required: true
    description: Plain text form of the message to send to matrix, usually markdown
  password:
    type: str
    description: The password to log in with
  room_id:
    type: str
    required: true
    description: ID of the room to send the notification to
  token:
    type: str
    description: Authentication token for the API call. If provided, user_id and password are not required
  user_id:
    type: str
    description: The user id of the user
writes: true
runtime: starlark
source: translated
examples: "\n- name: Send matrix notification with token\n  community.general.matrix:\n    msg_plain:\
  \ \"**hello world**\"\n    msg_html: \"<b>hello world</b>\"\n    room_id: \"!12345678:server.tld\"\n\
  \    hs_url: \"https://matrix.org\"\n    token: \"{{ matrix_auth_token }}\"\n\n- name: Send matrix notification\
  \ with user_id and password\n  community.general.matrix:\n    msg_plain: \"**hello world**\"\n    msg_html:\
  \ \"<b>hello world</b>\"\n    room_id: \"!12345678:server.tld\"\n    hs_url: \"https://matrix.org\"\n\
  \    user_id: \"ansible_notification_bot\"\n    password: \"{{ matrix_auth_password }}\"\n"
