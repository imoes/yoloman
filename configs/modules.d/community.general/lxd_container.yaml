name: lxd_container
fqcn: community.general.lxd_container
collection: community.general
short_description: Manage LXD instances
description: Management of LXD containers and virtual machines.
options:
  architecture:
    type: str
    description: The architecture for the instance (for example V(x86_64) or V(i686)). See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/instances/instance_get).
  client_cert:
    type: path
    aliases:
    - cert_file
    description: The client certificate file path. If not specified, it defaults to C(${HOME}/.config/lxc/client.crt).
  client_key:
    type: path
    aliases:
    - key_file
    description: The client certificate key file path. If not specified, it defaults to C(${HOME}/.config/lxc/client.key).
  config:
    type: dict
    description: 'The config for the instance (for example V({"limits.cpu": "2"})). See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/instances/instance_get).
      If the instance already exists and its "config" values in metadata obtained from the LXD API U(https://documentation.ubuntu.com/lxd/en/latest/api/#/instances/instance_get)
      are different, then this module tries to apply the configurations U(https://documentation.ubuntu.com/lxd/en/latest/api/#/instances/instance_put).
      The keys starting with C(volatile.) are ignored for this comparison when O(ignore_volatile_options=true).'
  devices:
    type: dict
    description: 'The devices for the instance (for example V({ "rootfs": { "path": "/dev/kvm", "type":
      "unix-char" }})). See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/instances/instance_get).'
  ephemeral:
    type: bool
    description: Whether or not the instance is ephemeral (for example V(true) or V(false)). See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/instances/instance_get).
  force_stop:
    type: bool
    default: false
    description: If this is V(true), the C(lxd_container) forces to stop the instance when it stops or
      restarts the instance.
  ignore_volatile_options:
    type: bool
    default: false
    description: If set to V(true), options starting with C(volatile.) are ignored. As a result, they
      are reapplied for each execution. This default behavior can be changed by setting this option to
      V(false). The default value changed from V(true) to V(false) in community.general 6.0.0.
  name:
    type: str
    required: true
    description: Name of an instance.
  profiles:
    type: list
    description: Profile to be used by the instance.
  project:
    type: str
    description: Project of an instance. See U(https://documentation.ubuntu.com/lxd/en/latest/projects/).
  snap_url:
    type: str
    default: unix:/var/snap/lxd/common/lxd/unix.socket
    description: The unix domain socket path when LXD is installed by snap package manager.
  source:
    type: dict
    description: 'The source for the instance (for example V({ "type": "image", "mode": "pull", "server":
      "https://images.linuxcontainers.org", "protocol": "lxd", "alias": "ubuntu/xenial/amd64" })). See
      U(https://documentation.ubuntu.com/lxd/en/latest/api/) for complete API documentation. Note that
      C(protocol) accepts two choices: V(lxd) or V(simplestreams).'
  state:
    type: str
    default: started
    choices:
    - started
    - stopped
    - restarted
    - absent
    - frozen
    description: Define the state of an instance.
  target:
    type: str
    description: For cluster deployments. Will attempt to create an instance on a target node. If the
      instance exists elsewhere in a cluster, then it will not be replaced or moved. The name should respond
      to same name of the node you see in C(lxc cluster list).
  timeout:
    type: int
    default: 30
    description: A timeout for changing the state of the instance. This is also used as a timeout for
      waiting until IPv4 addresses are set to the all network interfaces in the instance after starting
      or restarting.
  trust_password:
    type: str
    description: 'The client trusted password. You need to set this password on the LXD server before
      running this module using the following command: C(lxc config set core.trust_password <some random
      password>). See U(https://www.stgraber.org/2016/04/18/lxd-api-direct-interaction/). If trust_password
      is set, this module send a request for authentication before sending any requests.'
  type:
    type: str
    default: container
    choices:
    - container
    - virtual-machine
    description: Instance type can be either V(virtual-machine) or V(container).
  url:
    type: str
    default: unix:/var/lib/lxd/unix.socket
    description: The unix domain socket path or the https URL for the LXD server.
  wait_for_container:
    type: bool
    default: false
    description: If set to V(true), the tasks will wait till the task reports a success status when performing
      container operations.
  wait_for_ipv4_addresses:
    type: bool
    default: false
    description: If this is V(true), the C(lxd_container) waits until IPv4 addresses are set to the all
      network interfaces in the instance after starting or restarting.
writes: true
runtime: starlark
source: translated
examples: "\n# An example for creating a Ubuntu container and install python\n- hosts: localhost\n  connection:\
  \ local\n  tasks:\n    - name: Create a started container\n      community.general.lxd_container:\n\
  \        name: mycontainer\n        ignore_volatile_options: true\n        state: started\n        source:\n\
  \          type: image\n          mode: pull\n          server: https://images.linuxcontainers.org\n\
  \          protocol: lxd # if you get a 404, try setting protocol: simplestreams\n          alias: ubuntu/xenial/amd64\n\
  \        profiles: [\"default\"]\n        wait_for_ipv4_addresses: true\n        timeout: 600\n\n  \
  \  - name: Check python is installed in container\n      delegate_to: mycontainer\n      ansible.builtin.raw:\
  \ dpkg -s python\n      register: python_install_check\n      failed_when: python_install_check.rc not\
  \ in [0, 1]\n      changed_when: false\n\n    - name: Install python in container\n      delegate_to:\
  \ mycontainer\n      ansible.builtin.raw: apt-get install -y python\n      when: python_install_check.rc\
  \ == 1\n\n# An example for creating an Ubuntu 14.04 container using an image fingerprint.\n# This requires\
  \ changing 'server' and 'protocol' key values, replacing the\n# 'alias' key with with 'fingerprint'\
  \ and supplying an appropriate value that\n# matches the container image you wish to use.\n- hosts:\
  \ localhost\n  connection: local\n  tasks:\n    - name: Create a started container\n      community.general.lxd_container:\n\
  \        name: mycontainer\n        ignore_volatile_options: true\n        state: started\n        source:\n\
  \          type: image\n          mode: pull\n          # Provides current (and older) Ubuntu images\
  \ with listed fingerprints\n          server: https://cloud-images.ubuntu.com/releases\n          #\
  \ Protocol used by 'ubuntu' remote (as shown by 'lxc remote list')\n          protocol: simplestreams\n\
  \          # This provides an Ubuntu 14.04 LTS amd64 image from 20150814.\n          fingerprint: e9a8bdfab6dc\n\
  \        profiles: [\"default\"]\n        wait_for_ipv4_addresses: true\n        timeout: 600\n\n# An\
  \ example for creating container in project other than default\n- hosts: localhost\n  connection: local\n\
  \  tasks:\n    - name: Create a started container in project mytestproject\n      community.general.lxd_container:\n\
  \        name: mycontainer\n        project: mytestproject\n        ignore_volatile_options: true\n\
  \        state: started\n        source:\n          protocol: simplestreams\n          type: image\n\
  \          mode: pull\n          server: https://images.linuxcontainers.org\n          alias: ubuntu/20.04/cloud\n\
  \        profiles: [\"default\"]\n        wait_for_ipv4_addresses: true\n        timeout: 600\n\n# An\
  \ example for deleting a container\n- hosts: localhost\n  connection: local\n  tasks:\n    - name: Delete\
  \ a container\n      community.general.lxd_container:\n        name: mycontainer\n        state: absent\n\
  \        type: container\n\n# An example for restarting a container\n- hosts: localhost\n  connection:\
  \ local\n  tasks:\n    - name: Restart a container\n      community.general.lxd_container:\n       \
  \ name: mycontainer\n        state: restarted\n        type: container\n\n# An example for restarting\
  \ a container using https to connect to the LXD server\n- hosts: localhost\n  connection: local\n  tasks:\n\
  \    - name: Restart a container\n      community.general.lxd_container:\n        url: https://127.0.0.1:8443\n\
  \        # These client_cert and client_key values are equal to the default values.\n        #client_cert:\
  \ \"{{ lookup('env', 'HOME') }}/.config/lxc/client.crt\"\n        #client_key: \"{{ lookup('env', 'HOME')\
  \ }}/.config/lxc/client.key\"\n        trust_password: mypassword\n        name: mycontainer\n     \
  \   state: restarted\n\n# Note your container must be in the inventory for the below example.\n#\n#\
  \ [containers]\n# mycontainer ansible_connection=lxd\n#\n- hosts:\n    - mycontainer\n  tasks:\n   \
  \ - name: Copy /etc/hosts in the created container to localhost with name \"mycontainer-hosts\"\n  \
  \    ansible.builtin.fetch:\n        src: /etc/hosts\n        dest: /tmp/mycontainer-hosts\n       \
  \ flat: true\n\n# An example for LXD cluster deployments. This example will create two new container\
  \ on specific\n# nodes - 'node01' and 'node02'. In 'target:', 'node01' and 'node02' are names of LXD\
  \ cluster\n# members that LXD cluster recognizes, not ansible inventory names, see: 'lxc cluster list'.\n\
  # LXD API calls can be made to any LXD member, in this example, we send API requests to\n#'node01.example.com',\
  \ which matches ansible inventory name.\n- hosts: node01.example.com\n  tasks:\n    - name: Create LXD\
  \ container\n      community.general.lxd_container:\n        name: new-container-1\n        ignore_volatile_options:\
  \ true\n        state: started\n        source:\n          type: image\n          mode: pull\n     \
  \     alias: ubuntu/xenial/amd64\n        target: node01\n\n    - name: Create container on another\
  \ node\n      community.general.lxd_container:\n        name: new-container-2\n        ignore_volatile_options:\
  \ true\n        state: started\n        source:\n          type: image\n          mode: pull\n     \
  \     alias: ubuntu/xenial/amd64\n        target: node02\n\n# An example for creating a virtual machine\n\
  - hosts: localhost\n  connection: local\n  tasks:\n    - name: Create container on another node\n  \
  \    community.general.lxd_container:\n        name: new-vm-1\n        type: virtual-machine\n     \
  \   state: started\n        ignore_volatile_options: true\n        wait_for_ipv4_addresses: true\n \
  \       profiles: [\"default\"]\n        source:\n          protocol: simplestreams\n          type:\
  \ image\n          mode: pull\n          server: https://images.linuxcontainers.org\n          alias:\
  \ debian/11\n        timeout: 600\n"
