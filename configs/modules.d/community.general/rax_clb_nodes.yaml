name: rax_clb_nodes
fqcn: community.general.rax_clb_nodes
collection: community.general
short_description: Add, modify and remove nodes from a Rackspace Cloud Load Balancer
description: Adds, modifies and removes nodes from a Rackspace Cloud Load Balancer
options:
  address:
    type: str
    description: IP address or domain name of the node
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  condition:
    type: str
    choices:
    - enabled
    - disabled
    - draining
    description: Condition for the node, which determines its role within the load balancer
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  load_balancer_id:
    type: int
    required: true
    description: Load balancer id
  node_id:
    type: int
    description: Node id
  port:
    type: int
    description: Port number of the load balanced service on the node
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the node
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  type:
    type: str
    choices:
    - primary
    - secondary
    description: Type of node
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  virtualenv:
    type: path
    description: Virtualenv to execute this module in
  wait:
    type: bool
    default: false
    description: Wait for the load balancer to become active before returning
  wait_timeout:
    type: int
    default: 30
    description: How long to wait before giving up and returning an error
  weight:
    type: int
    description: Weight of node
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add a new node to the load balancer\n  local_action:\n    module: rax_clb_nodes\n\
  \    load_balancer_id: 71\n    address: 10.2.2.3\n    port: 80\n    condition: enabled\n    type: primary\n\
  \    wait: true\n    credentials: /path/to/credentials\n\n- name: Drain connections from a node\n  local_action:\n\
  \    module: rax_clb_nodes\n    load_balancer_id: 71\n    node_id: 410\n    condition: draining\n  \
  \  wait: true\n    credentials: /path/to/credentials\n\n- name: Remove a node from the load balancer\n\
  \  local_action:\n    module: rax_clb_nodes\n    load_balancer_id: 71\n    node_id: 410\n    state:\
  \ absent\n    wait: true\n    credentials: /path/to/credentials\n"
