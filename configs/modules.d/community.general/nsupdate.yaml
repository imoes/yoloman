name: nsupdate
fqcn: community.general.nsupdate
collection: community.general
short_description: Manage DNS records
description: Create, update and remove DNS records using DDNS updates
options:
  key_algorithm:
    type: str
    default: hmac-md5
    choices:
    - HMAC-MD5.SIG-ALG.REG.INT
    - hmac-md5
    - hmac-sha1
    - hmac-sha224
    - hmac-sha256
    - hmac-sha384
    - hmac-sha512
    description: Specify key algorithm used by O(key_secret).
  key_name:
    type: str
    description: Use TSIG key name to authenticate against DNS O(server)
  key_secret:
    type: str
    description: Use TSIG key secret, associated with O(key_name), to authenticate against O(server)
  port:
    type: int
    default: 53
    description: Use this TCP port when connecting to O(server).
  protocol:
    type: str
    default: tcp
    choices:
    - tcp
    - udp
    description: Sets the transport protocol (TCP or UDP). TCP is the recommended and a more robust option.
  record:
    type: str
    required: true
    description: Sets the DNS record to modify. When zone is omitted this has to be absolute (ending with
      a dot).
  server:
    type: str
    required: true
    description: Apply DNS modification on this server, specified by IPv4 or IPv6 address.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Manage DNS record.
  ttl:
    type: int
    default: 3600
    description: Sets the record TTL.
  type:
    type: str
    default: A
    description: Sets the record type.
  value:
    type: list
    description: Sets the record value.
  zone:
    type: str
    description: DNS record will be modified on this O(zone). When omitted DNS will be queried to attempt
      finding the correct zone.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add or modify ansible.example.org A to 192.168.1.1\"\n  community.general.nsupdate:\n\
  \    key_name: \"nsupdate\"\n    key_secret: \"+bFQtBCta7j2vWkjPkAFtgA==\"\n    server: \"10.1.1.1\"\
  \n    zone: \"example.org\"\n    record: \"ansible\"\n    value: \"192.168.1.1\"\n\n- name: Add or modify\
  \ ansible.example.org A to 192.168.1.1, 192.168.1.2 and 192.168.1.3\"\n  community.general.nsupdate:\n\
  \    key_name: \"nsupdate\"\n    key_secret: \"+bFQtBCta7j2vWkjPkAFtgA==\"\n    server: \"10.1.1.1\"\
  \n    zone: \"example.org\"\n    record: \"ansible\"\n    value: [\"192.168.1.1\", \"192.168.1.2\",\
  \ \"192.168.1.3\"]\n\n- name: Remove puppet.example.org CNAME\n  community.general.nsupdate:\n    key_name:\
  \ \"nsupdate\"\n    key_secret: \"+bFQtBCta7j2vWkjPkAFtgA==\"\n    server: \"10.1.1.1\"\n    zone: \"\
  example.org\"\n    record: \"puppet\"\n    type: \"CNAME\"\n    state: absent\n\n- name: Add 1.1.168.192.in-addr.arpa.\
  \ PTR for ansible.example.org\n  community.general.nsupdate:\n    key_name: \"nsupdate\"\n    key_secret:\
  \ \"+bFQtBCta7j2vWkjPkAFtgA==\"\n    server: \"10.1.1.1\"\n    record: \"1.1.168.192.in-addr.arpa.\"\
  \n    type: \"PTR\"\n    value: \"ansible.example.org.\"\n    state: present\n\n- name: Remove 1.1.168.192.in-addr.arpa.\
  \ PTR\n  community.general.nsupdate:\n    key_name: \"nsupdate\"\n    key_secret: \"+bFQtBCta7j2vWkjPkAFtgA==\"\
  \n    server: \"10.1.1.1\"\n    record: \"1.1.168.192.in-addr.arpa.\"\n    type: \"PTR\"\n    state:\
  \ absent\n"
