name: gandi_livedns
fqcn: community.general.gandi_livedns
collection: community.general
short_description: Manage Gandi LiveDNS records
description: 'Manages DNS records by the Gandi LiveDNS API, see the docs: U(https://doc.livedns.gandi.net/).'
options:
  api_key:
    type: str
    required: true
    description: Account API token.
  domain:
    type: str
    required: true
    description: The name of the Domain to work with (for example, "example.com").
  record:
    type: str
    required: true
    description: Record to add.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether the record(s) should exist or not.
  ttl:
    type: int
    description: The TTL to give the new record. Required when O(state=present).
  type:
    type: str
    required: true
    description: The type of DNS record to create.
  values:
    type: list
    description: The record values. Required when O(state=present).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a test A record to point to 127.0.0.1 in the my.com domain\n  community.general.gandi_livedns:\n\
  \    domain: my.com\n    record: test\n    type: A\n    values:\n    - 127.0.0.1\n    ttl: 7200\n  \
  \  api_key: dummyapitoken\n  register: record\n\n- name: Create a mail CNAME record to www.my.com domain\n\
  \  community.general.gandi_livedns:\n    domain: my.com\n    type: CNAME\n    record: mail\n    values:\n\
  \    - www\n    ttl: 7200\n    api_key: dummyapitoken\n    state: present\n\n- name: Change its TTL\n\
  \  community.general.gandi_livedns:\n    domain: my.com\n    type: CNAME\n    record: mail\n    values:\n\
  \    - www\n    ttl: 10800\n    api_key: dummyapitoken\n    state: present\n\n- name: Delete the record\n\
  \  community.general.gandi_livedns:\n    domain: my.com\n    type: CNAME\n    record: mail\n    api_key:\
  \ dummyapitoken\n    state: absent\n"
