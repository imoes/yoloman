name: copr
fqcn: community.general.copr
collection: community.general
short_description: Manage one of the Copr repositories
description: This module can enable, disable or remove the specified repository.
options:
  chroot:
    type: str
    description: The name of the chroot that you want to enable/disable/remove in the project, for example
      V(epel-7-x86_64). Default chroot is determined by the operating system, version of the operating
      system, and architecture on which the module is run.
  host:
    type: str
    default: copr.fedorainfracloud.org
    description: The Copr host to work with.
  name:
    type: str
    required: true
    description: Copr directory name, for example C(@copr/copr-dev).
  protocol:
    type: str
    default: https
    description: This indicate which protocol to use with the host.
  state:
    type: str
    default: enabled
    choices:
    - absent
    - enabled
    - disabled
    description: Whether to set this project as V(enabled), V(disabled), or V(absent).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Enable project Test of the user schlupov\n  community.general.copr:\n    host: copr.fedorainfracloud.org\n\
  \    state: enabled\n    name: schlupov/Test\n    chroot: fedora-31-x86_64\n\n- name: Remove project\
  \ integration_tests of the group copr\n  community.general.copr:\n    state: absent\n    name: '@copr/integration_tests'\n"
