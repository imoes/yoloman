name: iptables_state
fqcn: community.general.iptables_state
collection: community.general
short_description: Save iptables state into a file or restore it from a file
description: C(iptables) is used to set up, maintain, and inspect the tables of IP packet filter rules
  in the Linux kernel. This module handles the saving and/or loading of rules. This is the same as the
  behaviour of the C(iptables-save) and C(iptables-restore) (or C(ip6tables-save) and C(ip6tables-restore)
  for IPv6) commands which this module uses internally. Modifying the state of the firewall remotely may
  lead to loose access to the host in case of mistake in new ruleset. This module embeds a rollback feature
  to avoid this, by telling the host to restore previous rules if a cookie is still there after a given
  delay, and all this time telling the controller to try to remove this cookie on the host through a new
  connection.
options:
  counters:
    type: bool
    default: false
    description: Save or restore the values of all packet and byte counters. When V(true), the module
      is not idempotent.
  ip_version:
    type: str
    default: ipv4
    choices:
    - ipv4
    - ipv6
    description: Which version of the IP protocol this module should apply to.
  modprobe:
    type: path
    description: Specify the path to the C(modprobe) program internally used by iptables related commands
      to load kernel modules. By default, V(/proc/sys/kernel/modprobe) is inspected to determine the executable's
      path.
  noflush:
    type: bool
    default: false
    description: For O(state=restored), ignored otherwise. If V(false), restoring iptables rules from
      a file flushes (deletes) all previous contents of the respective table(s). If V(true), the previous
      rules are left untouched (but policies are updated anyway, for all built-in chains).
  path:
    type: path
    required: true
    description: The file the iptables state should be saved to. The file the iptables state should be
      restored from.
  state:
    type: str
    required: true
    choices:
    - saved
    - restored
    description: Whether the firewall state should be saved (into a file) or restored (from a file).
  table:
    type: str
    choices:
    - filter
    - nat
    - mangle
    - raw
    - security
    description: When O(state=restored), restore only the named table even if the input file contains
      other tables. Fail if the named table is not declared in the file. When O(state=saved), restrict
      output to the specified table. If not specified, output includes all active tables.
  wait:
    type: int
    description: Wait N seconds for the xtables lock to prevent instant failure in case multiple instances
      of the program are running concurrently.
writes: true
runtime: starlark
source: translated
examples: "\n# This will apply to all loaded/active IPv4 tables.\n- name: Save current state of the firewall\
  \ in system file\n  community.general.iptables_state:\n    state: saved\n    path: /etc/sysconfig/iptables\n\
  \n# This will apply only to IPv6 filter table.\n- name: save current state of the firewall in system\
  \ file\n  community.general.iptables_state:\n    ip_version: ipv6\n    table: filter\n    state: saved\n\
  \    path: /etc/iptables/rules.v6\n\n# This will load a state from a file, with a rollback in case of\
  \ access loss\n- name: restore firewall state from a file\n  community.general.iptables_state:\n   \
  \ state: restored\n    path: /run/iptables.apply\n  async: \"{{ ansible_timeout }}\"\n  poll: 0\n\n\
  # This will load new rules by appending them to the current ones\n- name: restore firewall state from\
  \ a file\n  community.general.iptables_state:\n    state: restored\n    path: /run/iptables.apply\n\
  \    noflush: true\n  async: \"{{ ansible_timeout }}\"\n  poll: 0\n\n# This will only retrieve information\n\
  - name: get current state of the firewall\n  community.general.iptables_state:\n    state: saved\n \
  \   path: /tmp/iptables\n  check_mode: true\n  changed_when: false\n  register: iptables_state\n\n-\
  \ name: show current state of the firewall\n  ansible.builtin.debug:\n    var: iptables_state.initial_state\n"
