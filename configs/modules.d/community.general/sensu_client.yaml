name: sensu_client
fqcn: community.general.sensu_client
collection: community.general
short_description: Manages Sensu client configuration
description: 'Manages Sensu client configuration. For more information, refer to the Sensu documentation:
  U(https://sensuapp.org/docs/latest/reference/clients.html)'
options:
  address:
    type: str
    description: An address to help identify and reach the client. This is only informational, usually
      an IP address or hostname. If not specified it defaults to non-loopback IPv4 address as determined
      by Ruby Socket.ip_address_list (provided by Sensu).
  chef:
    type: dict
    description: The chef definition scope, used to configure the Sensu Enterprise Chef integration (Sensu
      Enterprise users only).
  deregister:
    type: bool
    description: If a deregistration event should be created upon Sensu client process stop. Default is
      V(false).
  deregistration:
    type: dict
    description: The deregistration definition scope, used to configure automated Sensu client de-registration.
  ec2:
    type: dict
    description: The ec2 definition scope, used to configure the Sensu Enterprise AWS EC2 integration
      (Sensu Enterprise users only).
  keepalive:
    type: dict
    description: The keepalive definition scope, used to configure Sensu client keepalives behavior (e.g.
      keepalive thresholds, etc).
  keepalives:
    type: bool
    default: true
    description: If Sensu should monitor keepalives for this client.
  name:
    type: str
    description: A unique name for the client. The name cannot contain special characters or spaces. If
      not specified, it defaults to the system hostname as determined by Ruby Socket.gethostname (provided
      by Sensu).
  puppet:
    type: dict
    description: The puppet definition scope, used to configure the Sensu Enterprise Puppet integration
      (Sensu Enterprise users only).
  redact:
    type: list
    description: Client definition attributes to redact (values) when logging and sending client keepalives.
  registration:
    type: dict
    description: The registration definition scope, used to configure Sensu registration event handlers.
  safe_mode:
    type: bool
    default: false
    description: If safe mode is enabled for the client. Safe mode requires local check definitions in
      order to accept a check request and execute the check.
  servicenow:
    type: dict
    description: The servicenow definition scope, used to configure the Sensu Enterprise ServiceNow integration
      (Sensu Enterprise users only).
  socket:
    type: dict
    description: The socket definition scope, used to configure the Sensu client socket.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the client should be present or not
  subscriptions:
    type: list
    description: An array of client subscriptions, a list of roles and/or responsibilities assigned to
      the system (e.g. webserver). These subscriptions determine which monitoring checks are executed
      by the client, as check requests are sent to subscriptions. The subscriptions array items must be
      strings.
writes: true
runtime: starlark
source: translated
examples: "\n# Minimum possible configuration\n- name: Configure Sensu client\n  community.general.sensu_client:\n\
  \    subscriptions:\n      - default\n\n# With customization\n- name: Configure Sensu client\n  community.general.sensu_client:\n\
  \    name: \"{{ ansible_fqdn }}\"\n    address: \"{{ ansible_default_ipv4['address'] }}\"\n    subscriptions:\n\
  \      - default\n      - webserver\n    redact:\n      - password\n    socket:\n      bind: 127.0.0.1\n\
  \      port: 3030\n    keepalive:\n      thresholds:\n        warning: 180\n        critical: 300\n\
  \      handlers:\n        - email\n      custom:\n        - broadcast: irc\n      occurrences: 3\n \
  \ register: client\n  notify:\n    - Restart sensu-client\n\n- name: Secure Sensu client configuration\
  \ file\n  ansible.builtin.file:\n    path: \"{{ client['file'] }}\"\n    owner: \"sensu\"\n    group:\
  \ \"sensu\"\n    mode: \"0600\"\n\n- name: Delete the Sensu client configuration\n  community.general.sensu_client:\n\
  \    state: \"absent\"\n"
