name: utm_proxy_auth_profile
fqcn: community.general.utm_proxy_auth_profile
collection: community.general
short_description: Create, update or destroy reverse_proxy auth_profile entry in Sophos UTM
description: Create, update or destroy a reverse_proxy auth_profile entry in SOPHOS UTM. This module needs
  to have the REST Ability of the UTM to be activated.
options:
  aaa:
    type: list
    required: true
    description: List of references to utm_aaa objects (allowed users or groups)
  backend_mode:
    type: str
    default: None
    choices:
    - Basic
    - None
    description: Specifies if the backend server needs authentication ([Basic|None])
  backend_strip_basic_auth:
    type: bool
    default: true
    description: Should the login data be stripped when proxying the request to the backend host
  backend_user_prefix:
    type: str
    default: ''
    description: Prefix string to prepend to the username for backend authentication
  backend_user_suffix:
    type: str
    default: ''
    description: Suffix string to append to the username for backend authentication
  basic_prompt:
    type: str
    required: true
    description: The message in the basic authentication prompt
  comment:
    type: str
    default: ''
    description: Optional comment string
  frontend_cookie:
    type: str
    description: Frontend cookie name
  frontend_cookie_secret:
    type: str
    description: Frontend cookie secret
  frontend_form:
    type: str
    description: Frontend authentication form name
  frontend_form_template:
    type: str
    default: ''
    description: Frontend authentication form template
  frontend_login:
    type: str
    description: Frontend login name
  frontend_logout:
    type: str
    description: Frontend logout name
  frontend_mode:
    type: str
    default: Basic
    choices:
    - Basic
    - Form
    description: Frontend authentication mode (Form|Basic)
  frontend_realm:
    type: str
    description: Frontend authentication realm
  frontend_session_allow_persistency:
    type: bool
    default: false
    description: Allow session persistency
  frontend_session_lifetime:
    type: int
    required: true
    description: session lifetime
  frontend_session_lifetime_limited:
    type: bool
    default: true
    description: Specifies if limitation of session lifetime is active
  frontend_session_lifetime_scope:
    type: str
    default: hours
    choices:
    - days
    - hours
    - minutes
    description: scope for frontend_session_lifetime (days|hours|minutes)
  frontend_session_timeout:
    type: int
    required: true
    description: session timeout
  frontend_session_timeout_enabled:
    type: bool
    default: true
    description: Specifies if session timeout is active
  frontend_session_timeout_scope:
    type: str
    default: minutes
    choices:
    - days
    - hours
    - minutes
    description: scope for frontend_session_timeout (days|hours|minutes)
  headers:
    type: dict
    default: {}
    description: A dictionary of additional headers to be sent to POST and PUT requests. Is needed for
      some modules.
  logout_delegation_urls:
    type: list
    default: []
    description: List of logout URLs that logouts are delegated to
  logout_mode:
    type: str
    default: None
    choices:
    - None
    - Delegation
    description: Mode of logout (None|Delegation)
  name:
    type: str
    required: true
    description: The name of the object. Will be used to identify the entry
  redirect_to_requested_url:
    type: bool
    default: false
    description: Should a redirect to the requested URL be made
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: The desired state of the object. V(present) will create or update an object. V(absent)
      will delete an object if it was present.
  utm_host:
    type: str
    required: true
    description: The REST Endpoint of the Sophos UTM.
  utm_port:
    type: int
    default: 4444
    description: The port of the REST interface.
  utm_protocol:
    type: str
    default: https
    choices:
    - http
    - https
    description: The protocol of the REST Endpoint.
  utm_token:
    type: str
    required: true
    description: The token used to identify at the REST-API. See U(https://www.sophos.com/en-us/medialibrary/PDFs/documentation/UTMonAWS/Sophos-UTM-RESTful-API.pdf?la=en),
      Chapter 2.4.2.
  validate_certs:
    type: bool
    default: true
    description: Whether the REST interface's ssl certificate should be verified or not.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create UTM proxy_auth_profile\n  community.general.utm_proxy_auth_profile:\n    utm_host:\
  \ sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestAuthProfileEntry\n    aaa: [REF_OBJECT_STRING,REF_ANOTHEROBJECT_STRING]\n\
  \    basic_prompt: \"Authentication required: Please login\"\n    frontend_session_lifetime: 1\n   \
  \ frontend_session_timeout: 1\n    state: present\n\n- name: Remove UTM proxy_auth_profile\n  community.general.utm_proxy_auth_profile:\n\
  \    utm_host: sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestAuthProfileEntry\n\
  \    state: absent\n\n- name: Read UTM proxy_auth_profile\n  community.general.utm_proxy_auth_profile:\n\
  \    utm_host: sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestAuthProfileEntry\n\
  \    state: info\n\n"
