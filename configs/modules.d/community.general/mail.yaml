name: mail
fqcn: community.general.mail
collection: community.general
short_description: Send an email
description: This module is useful for sending emails from playbooks. One may wonder why automate sending
  emails?  In complex environments there are from time to time processes that cannot be automated, either
  because you lack the authority to make it so, or because not everyone agrees to a common approach. If
  you cannot automate a specific step, but the step is non-blocking, sending out an email to the responsible
  party to make them perform their part of the bargain is an elegant way to put the responsibility in
  someone else's lap. Of course sending out a mail can be equally useful as a way to notify one or more
  people in a team that a specific action has been (successfully) taken.
options:
  attach:
    type: list
    default: []
    description: A list of pathnames of files to attach to the message. Attached files will have their
      content-type set to C(application/octet-stream).
  bcc:
    type: list
    default: []
    description: The email-address(es) the mail is being 'blind' copied to. This is a list, which may
      contain address and phrase portions.
  body:
    type: str
    description: The body of the email being sent.
  cc:
    type: list
    default: []
    description: The email-address(es) the mail is being copied to. This is a list, which may contain
      address and phrase portions.
  charset:
    type: str
    default: utf-8
    description: The character set of email being sent.
  ehlohost:
    type: str
    description: Allows for manual specification of host for EHLO.
  headers:
    type: list
    default: []
    description: A list of headers which should be added to the message. Each individual header is specified
      as C(header=value) (see example below).
  host:
    type: str
    default: localhost
    description: The mail server.
  message_id_domain:
    type: str
    default: ansible
    description: The domain name to use for the L(Message-ID header, https://en.wikipedia.org/wiki/Message-ID).
      Note that this is only available on Python 3+. On Python 2, this value will be ignored.
  password:
    type: str
    description: If SMTP requires password.
  port:
    type: int
    default: 25
    description: The mail server port. This must be a valid integer between 1 and 65534
  secure:
    type: str
    default: try
    choices:
    - always
    - never
    - starttls
    - try
    description: If V(always), the connection will only send email if the connection is Encrypted. If
      the server doesn't accept the encrypted connection it will fail. If V(try), the connection will
      attempt to setup a secure SSL/TLS session, before trying to send. If V(never), the connection will
      not attempt to setup a secure SSL/TLS session, before sending If V(starttls), the connection will
      try to upgrade to a secure SSL/TLS connection, before sending. If it is unable to do so it will
      fail.
  sender:
    type: str
    default: root
    aliases:
    - from
    description: The email-address the mail is sent from. May contain address and phrase.
  subject:
    type: str
    required: true
    aliases:
    - msg
    description: The subject of the email being sent.
  subtype:
    type: str
    default: plain
    choices:
    - html
    - plain
    description: The minor mime type, can be either V(plain) or V(html). The major type is always V(text).
  timeout:
    type: int
    default: 20
    description: Sets the timeout in seconds for connection attempts.
  to:
    type: list
    default: root
    aliases:
    - recipients
    description: The email-address(es) the mail is being sent to. This is a list, which may contain address
      and phrase portions.
  username:
    type: str
    description: If SMTP requires username.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Example playbook sending mail to root\n  community.general.mail:\n    subject: System\
  \ {{ ansible_hostname }} has been successfully provisioned.\n  delegate_to: localhost\n\n- name: Sending\
  \ an e-mail using Gmail SMTP servers\n  community.general.mail:\n    host: smtp.gmail.com\n    port:\
  \ 587\n    username: username@gmail.com\n    password: mysecret\n    to: John Smith <john.smith@example.com>\n\
  \    subject: Ansible-report\n    body: System {{ ansible_hostname }} has been successfully provisioned.\n\
  \  delegate_to: localhost\n\n- name: Send e-mail to a bunch of users, attaching files\n  community.general.mail:\n\
  \    host: 127.0.0.1\n    port: 2025\n    subject: Ansible-report\n    body: Hello, this is an e-mail.\
  \ I hope you like it ;-)\n    from: jane@example.net (Jane Jolie)\n    to:\n    - John Doe <j.d@example.org>\n\
  \    - Suzie Something <sue@example.com>\n    cc: Charlie Root <root@localhost>\n    attach:\n    -\
  \ /etc/group\n    - /tmp/avatar2.png\n    headers:\n    - Reply-To=john@example.com\n    - X-Special=\"\
  Something or other\"\n    charset: us-ascii\n  delegate_to: localhost\n\n- name: Sending an e-mail using\
  \ the remote machine, not the Ansible controller node\n  community.general.mail:\n    host: localhost\n\
  \    port: 25\n    to: John Smith <john.smith@example.com>\n    subject: Ansible-report\n    body: System\
  \ {{ ansible_hostname }} has been successfully provisioned.\n\n- name: Sending an e-mail using Legacy\
  \ SSL to the remote machine\n  community.general.mail:\n    host: localhost\n    port: 25\n    to: John\
  \ Smith <john.smith@example.com>\n    subject: Ansible-report\n    body: System {{ ansible_hostname\
  \ }} has been successfully provisioned.\n    secure: always\n\n- name: Sending an e-mail using StartTLS\
  \ to the remote machine\n  community.general.mail:\n    host: localhost\n    port: 25\n    to: John\
  \ Smith <john.smith@example.com>\n    subject: Ansible-report\n    body: System {{ ansible_hostname\
  \ }} has been successfully provisioned.\n    secure: starttls\n\n- name: Sending an e-mail using StartTLS,\
  \ remote server, custom EHLO, and timeout of 10 seconds\n  community.general.mail:\n    host: some.smtp.host.tld\n\
  \    port: 25\n    timeout: 10\n    ehlohost: my-resolvable-hostname.tld\n    to: John Smith <john.smith@example.com>\n\
  \    subject: Ansible-report\n    body: System {{ ansible_hostname }} has been successfully provisioned.\n\
  \    secure: starttls\n"
