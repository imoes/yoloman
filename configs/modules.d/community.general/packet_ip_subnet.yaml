name: packet_ip_subnet
fqcn: community.general.packet_ip_subnet
collection: community.general
short_description: Assign IP subnet to a bare metal server
description: Assign or unassign IPv4 or IPv6 subnets to or from a device in the Packet host. IPv4 subnets
  must come from already reserved block. IPv6 subnets must come from publicly routable /56 block from
  your project. See U(https://support.packet.com/kb/articles/elastic-ips) for more info on IP block reservation.
options:
  auth_token:
    type: str
    description: Packet API token. You can also supply it in environment variable E(PACKET_API_TOKEN).
  cidr:
    type: str
    required: true
    aliases:
    - name
    description: IPv4 or IPv6 subnet which you want to manage. It must come from a reserved block for
      your project in the Packet Host.
  device_count:
    type: int
    default: 100
    description: The number of devices to retrieve from the project. The max allowed value is 1000. See
      U(https://www.packet.com/developers/api/#retrieve-all-devices-of-a-project) for more info.
  device_id:
    type: str
    description: UUID of a device to/from which to assign/remove a subnet.
  hostname:
    type: str
    description: A hostname of a device to/from which to assign/remove a subnet.
  project_id:
    type: str
    description: UUID of a project of the device to/from which to assign/remove a subnet.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Desired state of the IP subnet on the specified device. With O(state=present), you must
      specify either O(hostname) or O(device_id). Subnet with given CIDR will then be assigned to the
      specified device. With O(state=absent), you can specify either O(hostname) or O(device_id). The
      subnet will be removed from specified devices. If you leave both O(hostname) and O(device_id) empty,
      the subnet will be removed from any device it's assigned to.
writes: true
runtime: starlark
source: translated
examples: "\n# All the examples assume that you have your Packet API token in env var PACKET_API_TOKEN.\n\
  # You can also pass it to the auth_token parameter of the module instead.\n\n- name: Create 1 device\
  \ and assign an arbitrary public IPv4 subnet to it\n  hosts: localhost\n  tasks:\n\n  - packet_device:\n\
  \      project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n      hostnames: myserver\n      operating_system:\
  \ ubuntu_16_04\n      plan: baremetal_0\n      facility: sjc1\n      state: active\n\n# Pick an IPv4\
  \ address from a block allocated to your project.\n\n  - community.general.packet_ip_subnet:\n     \
  \ project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n      hostname: myserver\n      cidr: \"147.75.201.78/32\"\
  \n\n# Release IP address 147.75.201.78\n\n- name: Unassign IP address from any device in your project\n\
  \  hosts: localhost\n  tasks:\n  - community.general.packet_ip_subnet:\n      project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n\
  \      cidr: \"147.75.201.78/32\"\n      state: absent\n"
