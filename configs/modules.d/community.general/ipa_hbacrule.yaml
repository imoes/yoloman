name: ipa_hbacrule
fqcn: community.general.ipa_hbacrule
collection: community.general
short_description: Manage FreeIPA HBAC rule
description: Add, modify or delete an IPA HBAC rule using IPA API.
options:
  cn:
    type: str
    required: true
    aliases:
    - name
    description: Canonical name. Can not be changed as it is the unique identifier.
  description:
    type: str
    description: Description
  host:
    type: list
    description: List of host names to assign. If an empty list is passed all hosts will be removed from
      the rule. If option is omitted hosts will not be checked or changed.
  hostcategory:
    type: str
    choices:
    - all
    description: Host category
  hostgroup:
    type: list
    description: List of hostgroup names to assign. If an empty list is passed all hostgroups will be
      removed. from the rule If option is omitted hostgroups will not be checked or changed.
  ipa_host:
    type: str
    default: ipa.example.com
    description: IP or hostname of IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_HOST) will be used instead. If both the environment variable E(IPA_HOST)
      and the value are not specified in the task, then DNS will be used to try to discover the FreeIPA
      server. The relevant entry needed in FreeIPA is the C(ipa-ca) entry. If neither the DNS entry, nor
      the environment E(IPA_HOST), nor the value are available in the task, then the default value will
      be used.
  ipa_pass:
    type: str
    description: Password of administrative user. If the value is not specified in the task, the value
      of environment variable E(IPA_PASS) will be used instead. Note that if the C(urllib_gssapi) library
      is available, it is possible to use GSSAPI to authenticate to FreeIPA. If the environment variable
      E(KRB5CCNAME) is available, the module will use this kerberos credentials cache to authenticate
      to the FreeIPA server. If the environment variable E(KRB5_CLIENT_KTNAME) is available, and E(KRB5CCNAME)
      is not; the module will use this kerberos keytab to authenticate. If GSSAPI is not available, the
      usage of O(ipa_pass) is required.
  ipa_port:
    type: int
    default: 443
    description: Port of FreeIPA / IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PORT) will be used instead. If both the environment variable E(IPA_PORT)
      and the value are not specified in the task, then default value is set.
  ipa_prot:
    type: str
    default: https
    choices:
    - http
    - https
    description: Protocol used by IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PROT) will be used instead. If both the environment variable E(IPA_PROT)
      and the value are not specified in the task, then default value is set.
  ipa_timeout:
    type: int
    default: 10
    description: Specifies idle timeout (in seconds) for the connection. For bulk operations, you may
      want to increase this in order to avoid timeout from IPA server. If the value is not specified in
      the task, the value of environment variable E(IPA_TIMEOUT) will be used instead. If both the environment
      variable E(IPA_TIMEOUT) and the value are not specified in the task, then default value is set.
  ipa_user:
    type: str
    default: admin
    description: Administrative account used on IPA server. If the value is not specified in the task,
      the value of environment variable E(IPA_USER) will be used instead. If both the environment variable
      E(IPA_USER) and the value are not specified in the task, then default value is set.
  service:
    type: list
    description: List of service names to assign. If an empty list is passed all services will be removed
      from the rule. If option is omitted services will not be checked or changed.
  servicecategory:
    type: str
    choices:
    - all
    description: Service category
  servicegroup:
    type: list
    description: List of service group names to assign. If an empty list is passed all assigned service
      groups will be removed from the rule. If option is omitted service groups will not be checked or
      changed.
  sourcehost:
    type: list
    description: List of source host names to assign. If an empty list if passed all assigned source hosts
      will be removed from the rule. If option is omitted source hosts will not be checked or changed.
  sourcehostcategory:
    type: str
    choices:
    - all
    description: Source host category
  sourcehostgroup:
    type: list
    description: List of source host group names to assign. If an empty list if passed all assigned source
      host groups will be removed from the rule. If option is omitted source host groups will not be checked
      or changed.
  state:
    type: str
    default: present
    choices:
    - absent
    - disabled
    - enabled
    - present
    description: State to ensure
  user:
    type: list
    description: List of user names to assign. If an empty list if passed all assigned users will be removed
      from the rule. If option is omitted users will not be checked or changed.
  usercategory:
    type: str
    choices:
    - all
    description: User category
  usergroup:
    type: list
    description: List of user group names to assign. If an empty list if passed all assigned user groups
      will be removed from the rule. If option is omitted user groups will not be checked or changed.
  validate_certs:
    type: bool
    default: true
    description: This only applies if O(ipa_prot) is V(https). If set to V(false), the SSL certificates
      will not be validated. This should only set to V(false) used on personally controlled sites using
      self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure rule to allow all users to access any host from any host\n  community.general.ipa_hbacrule:\n\
  \    name: allow_all\n    description: Allow all users to access any host from any host\n    hostcategory:\
  \ all\n    servicecategory: all\n    usercategory: all\n    state: present\n    ipa_host: ipa.example.com\n\
  \    ipa_user: admin\n    ipa_pass: topsecret\n\n- name: Ensure rule with certain limitations\n  community.general.ipa_hbacrule:\n\
  \    name: allow_all_developers_access_to_db\n    description: Allow all developers to access any database\
  \ from any host\n    hostgroup:\n    - db-server\n    usergroup:\n    - developers\n    state: present\n\
  \    ipa_host: ipa.example.com\n    ipa_user: admin\n    ipa_pass: topsecret\n\n- name: Ensure rule\
  \ is absent\n  community.general.ipa_hbacrule:\n    name: rule_to_be_deleted\n    state: absent\n  \
  \  ipa_host: ipa.example.com\n    ipa_user: admin\n    ipa_pass: topsecret\n"
