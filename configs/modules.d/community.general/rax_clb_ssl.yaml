name: rax_clb_ssl
fqcn: community.general.rax_clb_ssl
collection: community.general
short_description: Manage SSL termination for a Rackspace Cloud Load Balancer
description: Set up, reconfigure, or remove SSL termination for an existing load balancer.
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  certificate:
    type: str
    description: The public SSL certificates as a string in PEM format.
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  enabled:
    type: bool
    default: true
    description: If set to "false", temporarily disable SSL termination without discarding existing credentials.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  https_redirect:
    type: bool
    description: If "true", the load balancer will redirect HTTP traffic to HTTPS. Requires "secure_traffic_only"
      to be true. Incurs an implicit wait if SSL termination is also applied or removed.
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  intermediate_certificate:
    type: str
    description: One or more intermediate certificate authorities as a string in PEM format, concatenated
      into a single string.
  loadbalancer:
    type: str
    required: true
    description: Name or ID of the load balancer on which to manage SSL termination.
  private_key:
    type: str
    description: The private SSL key as a string in PEM format.
  region:
    type: str
    description: Region to create an instance in.
  secure_port:
    type: int
    default: 443
    description: The port to listen for secure traffic.
  secure_traffic_only:
    type: bool
    default: false
    description: If "true", the load balancer will *only* accept secure traffic.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: If set to "present", SSL termination will be added to this load balancer. If "absent",
      SSL termination will be removed instead.
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  wait:
    type: bool
    default: false
    description: Wait for the balancer to be in state "running" before turning.
  wait_timeout:
    type: int
    default: 300
    description: How long before "wait" gives up, in seconds.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Enable SSL termination on a load balancer\n  community.general.rax_clb_ssl:\n   \
  \ loadbalancer: the_loadbalancer\n    state: present\n    private_key: \"{{ lookup('file', 'credentials/server.key'\
  \ ) }}\"\n    certificate: \"{{ lookup('file', 'credentials/server.crt' ) }}\"\n    intermediate_certificate:\
  \ \"{{ lookup('file', 'credentials/trust-chain.crt') }}\"\n    secure_traffic_only: true\n    wait:\
  \ true\n\n- name: Disable SSL termination\n  community.general.rax_clb_ssl:\n    loadbalancer: \"{{\
  \ registered_lb.balancer.id }}\"\n    state: absent\n    wait: true\n"
