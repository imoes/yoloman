name: oneview_ethernet_network
fqcn: community.general.oneview_ethernet_network
collection: community.general
short_description: Manage OneView Ethernet Network resources
description: Provides an interface to manage Ethernet Network resources. Can create, update, or delete.
options:
  api_version:
    type: int
    description: OneView API Version.
  config:
    type: path
    description: Path to a JSON configuration file containing the OneView client configuration. The configuration
      file is optional and when used should be present in the host running the ansible commands. If the
      file path is not provided, the configuration will be loaded from environment variables. For links
      to example configuration files or how to use the environment variables verify the notes section.
  data:
    type: dict
    required: true
    description: List with Ethernet Network properties.
  hostname:
    type: str
    description: IP address or hostname for the appliance.
  image_streamer_hostname:
    type: str
    description: IP address or hostname for the HPE Image Streamer REST API.
  password:
    type: str
    description: Password for API authentication.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - default_bandwidth_reset
    description: Indicates the desired state for the Ethernet Network resource. - V(present) will ensure
      data properties are compliant with OneView. - V(absent) will remove the resource from OneView, if
      it exists. - V(default_bandwidth_reset) will reset the network connection template to the default.
  username:
    type: str
    description: Username for API authentication.
  validate_etag:
    type: bool
    default: true
    description: When the ETag Validation is enabled, the request will be conditionally processed only
      if the current ETag for the resource matches the ETag provided in the data.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure that the Ethernet Network is present using the default configuration\n  community.general.oneview_ethernet_network:\n\
  \    config: '/etc/oneview/oneview_config.json'\n    state: present\n    data:\n      name: 'Test Ethernet\
  \ Network'\n      vlanId: '201'\n  delegate_to: localhost\n\n- name: Update the Ethernet Network changing\
  \ bandwidth and purpose\n  community.general.oneview_ethernet_network:\n    config: '/etc/oneview/oneview_config.json'\n\
  \    state: present\n    data:\n      name: 'Test Ethernet Network'\n      purpose: Management\n   \
  \   bandwidth:\n          maximumBandwidth: 3000\n          typicalBandwidth: 2000\n  delegate_to: localhost\n\
  \n- name: Ensure that the Ethernet Network is present with name 'Renamed Ethernet Network'\n  community.general.oneview_ethernet_network:\n\
  \    config: '/etc/oneview/oneview_config.json'\n    state: present\n    data:\n      name: 'Test Ethernet\
  \ Network'\n      newName: 'Renamed Ethernet Network'\n  delegate_to: localhost\n\n- name: Ensure that\
  \ the Ethernet Network is absent\n  community.general.oneview_ethernet_network:\n    config: '/etc/oneview/oneview_config.json'\n\
  \    state: absent\n    data:\n      name: 'New Ethernet Network'\n  delegate_to: localhost\n\n- name:\
  \ Create Ethernet networks in bulk\n  community.general.oneview_ethernet_network:\n    config: '/etc/oneview/oneview_config.json'\n\
  \    state: present\n    data:\n      vlanIdRange: '1-10,15,17'\n      purpose: General\n      namePrefix:\
  \ TestNetwork\n      smartLink: false\n      privateNetwork: false\n      bandwidth:\n        maximumBandwidth:\
  \ 10000\n        typicalBandwidth: 2000\n  delegate_to: localhost\n\n- name: Reset to the default network\
  \ connection template\n  community.general.oneview_ethernet_network:\n    config: '/etc/oneview/oneview_config.json'\n\
  \    state: default_bandwidth_reset\n    data:\n      name: 'Test Ethernet Network'\n  delegate_to:\
  \ localhost\n"
