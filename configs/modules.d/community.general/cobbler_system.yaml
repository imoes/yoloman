name: cobbler_system
fqcn: community.general.cobbler_system
collection: community.general
short_description: Manage system objects in Cobbler
description: Add, modify or remove systems in Cobbler
options:
  host:
    type: str
    default: 127.0.0.1
    description: The name or IP address of the Cobbler system.
  interfaces:
    type: dict
    description: A list of dictionaries containing interface options.
  name:
    type: str
    description: The system name to manage.
  password:
    type: str
    description: The password to log in to Cobbler.
  port:
    type: int
    description: Port number to be used for REST connection. The default value depends on parameter O(use_ssl).
  properties:
    type: dict
    description: A dictionary with system properties.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    - query
    description: Whether the system should be present, absent or a query is made.
  sync:
    type: bool
    default: false
    description: Sync on changes. Concurrently syncing Cobbler is bound to fail.
  use_ssl:
    type: bool
    default: true
    description: If V(false), an HTTP connection will be used instead of the default HTTPS connection.
  username:
    type: str
    default: cobbler
    description: The username to log in to Cobbler.
  validate_certs:
    type: bool
    default: true
    description: If V(false), SSL certificates will not be validated. This should only set to V(false)
      when used on personally controlled sites using self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure the system exists in Cobbler\n  community.general.cobbler_system:\n    host:\
  \ cobbler01\n    username: cobbler\n    password: MySuperSecureP4sswOrd\n    name: myhost\n    properties:\n\
  \      profile: CentOS6-x86_64\n      name_servers: [ 2.3.4.5, 3.4.5.6 ]\n      name_servers_search:\
  \ foo.com, bar.com\n    interfaces:\n      eth0:\n        macaddress: 00:01:02:03:04:05\n        ipaddress:\
  \ 1.2.3.4\n  delegate_to: localhost\n\n- name: Enable network boot in Cobbler\n  community.general.cobbler_system:\n\
  \    host: bdsol-aci-cobbler-01\n    username: cobbler\n    password: ins3965!\n    name: bdsol-aci51-apic1.cisco.com\n\
  \    properties:\n      netboot_enabled: true\n    state: present\n  delegate_to: localhost\n\n- name:\
  \ Query all systems in Cobbler\n  community.general.cobbler_system:\n    host: cobbler01\n    username:\
  \ cobbler\n    password: MySuperSecureP4sswOrd\n    state: query\n  register: cobbler_systems\n  delegate_to:\
  \ localhost\n\n- name: Query a specific system in Cobbler\n  community.general.cobbler_system:\n   \
  \ host: cobbler01\n    username: cobbler\n    password: MySuperSecureP4sswOrd\n    name: '{{ inventory_hostname\
  \ }}'\n    state: query\n  register: cobbler_properties\n  delegate_to: localhost\n\n- name: Ensure\
  \ the system does not exist in Cobbler\n  community.general.cobbler_system:\n    host: cobbler01\n \
  \   username: cobbler\n    password: MySuperSecureP4sswOrd\n    name: myhost\n    state: absent\n  delegate_to:\
  \ localhost\n"
