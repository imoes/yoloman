name: pagerduty_alert
fqcn: community.general.pagerduty_alert
collection: community.general
short_description: Trigger, acknowledge or resolve PagerDuty incidents
description: This module will let you trigger, acknowledge or resolve a PagerDuty incident by sending
  events
options:
  api_key:
    type: str
    description: The pagerduty API key (readonly access), generated on the pagerduty site. Required if
      O(api_version=v1).
  api_version:
    type: str
    default: v1
    choices:
    - v1
    - v2
    description: The API version we want to use to run the module. V1 is more limited with option we can
      provide to trigger incident. V2 has more variables for example, O(severity), O(source), O(custom_details),
      etc.
  client:
    type: str
    description: The name of the monitoring client that is triggering this event.
  client_url:
    type: str
    description: The URL of the monitoring client that is triggering this event.
  component:
    type: str
    description: Component of the source machine that is responsible for the event, for example C(mysql)
      or C(eth0).
  custom_details:
    type: dict
    description: Additional details about the event and affected system. A dictionary with custom keys
      and values.
  desc:
    type: str
    default: Created via Ansible
    description: For O(state=triggered) - Required. Short description of the problem that led to this
      trigger. This field (or a truncated version) will be used when generating phone calls, SMS messages
      and alert emails. It will also appear on the incidents tables in the PagerDuty UI. The maximum length
      is 1024 characters. For O(state=acknowledged) or O(state=resolved) - Text that will appear in the
      incident's log associated with this event.
  incident_class:
    type: str
    description: The class/type of the event, for example C(ping failure) or C(cpu load).
  incident_key:
    type: str
    description: Identifies the incident to which this O(state) should be applied. For O(state=triggered)
      - If there's no open (i.e. unresolved) incident with this key, a new one will be created. If there's
      already an open incident with a matching key, this event will be appended to that incident's log.
      The event key provides an easy way to 'de-dup' problem reports. If no O(incident_key) is provided,
      then it will be generated by PagerDuty. For O(state=acknowledged) or O(state=resolved) - This should
      be the incident_key you received back when the incident was first opened by a trigger event. Acknowledge
      events referencing resolved or nonexistent incidents will be discarded.
  integration_key:
    type: str
    description: The GUID of one of your 'Generic API' services. This is the 'integration key' listed
      on a 'Integrations' tab of PagerDuty service.
  link_text:
    type: str
    description: A short description of the link_url.
  link_url:
    type: str
    description: Relevant link url to the alert. For example, the website or the job link.
  name:
    type: str
    description: PagerDuty unique subdomain. Obsolete. It is not used with PagerDuty REST v2 API.
  service_id:
    type: str
    description: ID of PagerDuty service when incidents will be triggered, acknowledged or resolved. Required
      if O(api_version=v1).
  service_key:
    type: str
    description: The GUID of one of your 'Generic API' services. Obsolete. Please use O(integration_key).
  severity:
    type: str
    default: critical
    choices:
    - critical
    - warning
    - error
    - info
    description: The perceived severity of the status the event is describing with respect to the affected
      system. Required in case of O(state=trigger) and O(api_version=v2).
  source:
    type: str
    description: The unique location of the affected system, preferably a hostname or FQDN. Required in
      case of O(state=trigger) and O(api_version=v2).
  state:
    type: str
    required: true
    choices:
    - triggered
    - acknowledged
    - resolved
    description: Type of event to be sent.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Trigger an incident with just the basic options\n  community.general.pagerduty_alert:\n\
  \    name: companyabc\n    integration_key: xxx\n    api_key: yourapikey\n    service_id: PDservice\n\
  \    state: triggered\n    desc: problem that led to this trigger\n\n- name: Trigger an incident with\
  \ more options\n  community.general.pagerduty_alert:\n    integration_key: xxx\n    api_key: yourapikey\n\
  \    service_id: PDservice\n    state: triggered\n    desc: problem that led to this trigger\n    incident_key:\
  \ somekey\n    client: Sample Monitoring Service\n    client_url: http://service.example.com\n\n- name:\
  \ Acknowledge an incident based on incident_key\n  community.general.pagerduty_alert:\n    integration_key:\
  \ xxx\n    api_key: yourapikey\n    service_id: PDservice\n    state: acknowledged\n    incident_key:\
  \ somekey\n    desc: \"some text for incident's log\"\n\n- name: Resolve an incident based on incident_key\n\
  \  community.general.pagerduty_alert:\n    integration_key: xxx\n    api_key: yourapikey\n    service_id:\
  \ PDservice\n    state: resolved\n    incident_key: somekey\n    desc: \"some text for incident's log\"\
  \n\n- name: Trigger an v2 incident with just the basic options\n  community.general.pagerduty_alert:\n\
  \    integration_key: xxx\n    api_version: v2\n    source: My Ansible Script\n    state: triggered\n\
  \    desc: problem that led to this trigger\n\n- name: Trigger an v2 incident with more options\n  community.general.pagerduty_alert:\n\
  \    integration_key: xxx\n    api_version: v2\n    source: My Ansible Script\n    state: triggered\n\
  \    desc: problem that led to this trigger\n    incident_key: somekey\n    client: Sample Monitoring\
  \ Service\n    client_url: http://service.example.com\n    component: mysql\n    incident_class: ping\
  \ failure\n    link_url: https://pagerduty.com\n    link_text: PagerDuty\n\n- name: Acknowledge an incident\
  \ based on incident_key using v2\n  community.general.pagerduty_alert:\n    api_version: v2\n    integration_key:\
  \ xxx\n    incident_key: somekey\n    state: acknowledged\n\n- name: Resolve an incident based on incident_key\n\
  \  community.general.pagerduty_alert:\n    api_version: v2\n    integration_key: xxx\n    incident_key:\
  \ somekey\n    state: resolved\n"
