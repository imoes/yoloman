name: one_service
fqcn: community.general.one_service
collection: community.general
short_description: Deploy and manage OpenNebula services
description: Manage OpenNebula services
options:
  api_password:
    type: str
    description: Password of the user to login into OpenNebula OneFlow API server. If not set then the
      value of the E(ONEFLOW_PASSWORD) environment variable is used.
  api_url:
    type: str
    description: URL of the OpenNebula OneFlow API server. It is recommended to use HTTPS so that the
      username/password are not transferred over the network unencrypted. If not set then the value of
      the E(ONEFLOW_URL) environment variable is used.
  api_username:
    type: str
    description: Name of the user to login into the OpenNebula OneFlow API server. If not set then the
      value of the E(ONEFLOW_USERNAME) environment variable is used.
  cardinality:
    type: int
    description: Number of VMs for the specified role.
  custom_attrs:
    type: dict
    default: {}
    description: Dictionary of key/value custom attributes which will be used when instantiating a new
      service.
  force:
    type: bool
    default: false
    description: Force the new cardinality even if it is outside the limits.
  group_id:
    type: int
    description: ID of the group which will be set as the group of the service.
  mode:
    type: str
    description: Set permission mode of a service instance in octet format, for example V(0600) to give
      owner C(use) and C(manage) and nothing to group and others.
  owner_id:
    type: int
    description: ID of the user which will be set as the owner of the service.
  role:
    type: str
    description: Name of the role whose cardinality should be changed.
  service_id:
    type: int
    description: ID of a service instance that you would like to manage.
  service_name:
    type: str
    description: Name of a service instance that you would like to manage.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: V(present) - instantiate a service from a template specified with O(template_id) or O(template_name).
      V(absent) - terminate an instance of a service specified with O(template_id) or O(template_name).
  template_id:
    type: int
    description: ID of a service template to use to create a new instance of a service.
  template_name:
    type: str
    description: Name of service template to use to create a new instance of a service.
  unique:
    type: bool
    default: false
    description: Setting O(unique=true) will make sure that there is only one service instance running
      with a name set with O(service_name) when instantiating a service from a template specified with
      O(template_id) or O(template_name). Check examples below.
  wait:
    type: bool
    default: false
    description: Wait for the instance to reach RUNNING state after DEPLOYING or COOLDOWN state after
      SCALING.
  wait_timeout:
    type: int
    default: 300
    description: How long before wait gives up, in seconds.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Instantiate a new service\n  community.general.one_service:\n    template_id: 90\n\
  \  register: result\n\n- name: Print service properties\n  ansible.builtin.debug:\n    msg: result\n\
  \n- name: Instantiate a new service with specified service_name, service group and mode\n  community.general.one_service:\n\
  \    template_name: 'app1_template'\n    service_name: 'app1'\n    group_id: 1\n    mode: '660'\n\n\
  - name: Instantiate a new service with template_id and pass custom_attrs dict\n  community.general.one_service:\n\
  \    template_id: 90\n    custom_attrs:\n      public_network_id: 21\n      private_network_id: 26\n\
  \n- name: Instantiate a new service 'foo' if the service doesn't already exist, otherwise do nothing\n\
  \  community.general.one_service:\n    template_id: 53\n    service_name: 'foo'\n    unique: true\n\n\
  - name: Delete a service by ID\n  community.general.one_service:\n    service_id: 153\n    state: absent\n\
  \n- name: Get service info\n  community.general.one_service:\n    service_id: 153\n  register: service_info\n\
  \n- name: Change service owner, group and mode\n  community.general.one_service:\n    service_name:\
  \ 'app2'\n    owner_id: 34\n    group_id: 113\n    mode: '600'\n\n- name: Instantiate service and wait\
  \ for it to become RUNNING\n  community.general.one_service:\n    template_id: 43\n    service_name:\
  \ 'foo1'\n\n- name: Wait service to become RUNNING\n  community.general.one_service:\n    service_id:\
  \ 112\n    wait: true\n\n- name: Change role cardinality\n  community.general.one_service:\n    service_id:\
  \ 153\n    role: bar\n    cardinality: 5\n\n- name: Change role cardinality and wait for it to be applied\n\
  \  community.general.one_service:\n    service_id: 112\n    role: foo\n    cardinality: 7\n    wait:\
  \ true\n"
