name: svc
fqcn: community.general.svc
collection: community.general
short_description: Manage daemontools services
description: Controls daemontools services on remote hosts using the svc utility.
options:
  downed:
    type: bool
    description: Should a 'down' file exist or not, if it exists it disables auto startup. Defaults to
      no. Downed does not imply stopped.
  enabled:
    type: bool
    description: Whether the service is enabled or not, if disabled it also implies stopped. Take note
      that a service can be enabled and downed (no auto restart).
  name:
    type: str
    required: true
    description: Name of the service to manage.
  service_dir:
    type: str
    default: /service
    description: Directory svscan watches for services
  service_src:
    type: str
    default: /etc/service
    description: Directory where services are defined, the source of symlinks to service_dir.
  state:
    type: str
    choices:
    - killed
    - once
    - reloaded
    - restarted
    - started
    - stopped
    description: V(started)/V(stopped) are idempotent actions that will not run commands unless necessary.  V(restarted)
      will always bounce the svc (svc -t) and V(killed) will always bounce the svc (svc -k). V(reloaded)
      will send a sigusr1 (svc -1). V(once) will run a normally downed svc once (svc -o), not really an
      idempotent operation.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Start svc dnscache, if not running\n  community.general.svc:\n    name: dnscache\n\
  \    state: started\n\n- name: Stop svc dnscache, if running\n  community.general.svc:\n    name: dnscache\n\
  \    state: stopped\n\n- name: Kill svc dnscache, in all cases\n  community.general.svc:\n    name:\
  \ dnscache\n    state: killed\n\n- name: Restart svc dnscache, in all cases\n  community.general.svc:\n\
  \    name: dnscache\n    state: restarted\n\n- name: Reload svc dnscache, in all cases\n  community.general.svc:\n\
  \    name: dnscache\n    state: reloaded\n\n- name: Using alternative svc directory location\n  community.general.svc:\n\
  \    name: dnscache\n    state: reloaded\n    service_dir: /var/service\n"
