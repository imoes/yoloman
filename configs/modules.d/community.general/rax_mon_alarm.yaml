name: rax_mon_alarm
fqcn: community.general.rax_mon_alarm
collection: community.general
short_description: Create or delete a Rackspace Cloud Monitoring alarm
description: Create or delete a Rackspace Cloud Monitoring alarm that associates an existing rax_mon_entity,
  rax_mon_check, and rax_mon_notification_plan with criteria that specify what conditions will trigger
  which levels of notifications. Rackspace monitoring module flow | rax_mon_entity -> rax_mon_check ->
  rax_mon_notification -> rax_mon_notification_plan -> *rax_mon_alarm*
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  check_id:
    type: str
    required: true
    description: ID of the check that should be alerted on. May be acquired by registering the value of
      a rax_mon_check task.
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  criteria:
    type: str
    description: Alarm DSL that describes alerting conditions and their output states. Must be between
      1 and 16384 characters long. See http://docs.rackspace.com/cm/api/v1.0/cm-devguide/content/alerts-language.html
      for a reference on the alerting language.
  disabled:
    type: bool
    default: false
    description: If yes, create this alarm, but leave it in an inactive state. Defaults to no.
  entity_id:
    type: str
    required: true
    description: ID of the entity this alarm is attached to. May be acquired by registering the value
      of a rax_mon_entity task.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  label:
    type: str
    required: true
    description: Friendly name for this alarm, used to achieve idempotence. Must be a String between 1
      and 255 characters long.
  metadata:
    type: dict
    description: Arbitrary key/value pairs to accompany the alarm. Must be a hash of String keys and values
      between 1 and 255 characters long.
  notification_plan_id:
    type: str
    required: true
    description: ID of the notification plan to trigger if this alarm fires. May be acquired by registering
      the value of a rax_mon_notification_plan task.
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Ensure that the alarm with this O(label) exists or does not exist.
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Alarm example\n  gather_facts: false\n  hosts: local\n  connection: local\n  tasks:\n\
  \  - name: Ensure that a specific alarm exists.\n    community.general.rax_mon_alarm:\n      credentials:\
  \ ~/.rax_pub\n      state: present\n      label: uhoh\n      entity_id: \"{{ the_entity['entity']['id']\
  \ }}\"\n      check_id: \"{{ the_check['check']['id'] }}\"\n      notification_plan_id: \"{{ defcon1['notification_plan']['id']\
  \ }}\"\n      criteria: >\n        if (rate(metric['average']) > 10) {\n          return new AlarmStatus(WARNING);\n\
  \        }\n        return new AlarmStatus(OK);\n    register: the_alarm\n"
