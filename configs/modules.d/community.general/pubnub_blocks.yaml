name: pubnub_blocks
fqcn: community.general.pubnub_blocks
collection: community.general
short_description: PubNub blocks management module
description: 'This module allows Ansible to interface with the PubNub BLOCKS infrastructure by providing
  the following operations: create / remove, start / stop and rename for blocks and create / modify /
  remove for event handlers.'
options:
  account:
    type: str
    default: ''
    description: Name of PubNub account for from which O(application) will be used to manage blocks. User's
      account will be used if value not set or empty.
  application:
    type: str
    required: true
    description: Name of target PubNub application for which blocks configuration on specific O(keyset)
      will be done.
  cache:
    type: dict
    default: {}
    description: 'In case if single play use blocks management module few times it is preferred to enabled
      ''caching'' by making previous module to share gathered artifacts and pass them to this parameter.

      '
  changes:
    type: dict
    default: {}
    description: 'List of fields which should be changed by block itself (doesn''t affect any event handlers).
      Possible options for change is: O(name).'
  description:
    type: str
    description: Short block description which will be later visible on admin.pubnub.com. Used only if
      block doesn't exists and won't change description for existing block.
  email:
    type: str
    default: ''
    description: Email from account for which new session should be started. Not required if O(cache)
      contains result of previous module call (in same play).
  event_handlers:
    type: list
    default: []
    description: 'List of event handlers which should be updated for specified block O(name). Each entry
      for new event handler should contain: C(name), C(src), C(channels), C(event). C(name) used as event
      handler name which can be used later to make changes to it. C(src) is full path to file with event
      handler code. C(channels) is name of channel from which event handler is waiting for events. C(event)
      is type of event which is able to trigger event handler: C(js-before-publish), C(js-after-publish),
      C(js-after-presence). Each entry for existing handlers should contain C(name) (so target handler
      can be identified). Rest parameters (C(src), C(channels) and C(event)) can be added if changes required
      for them. It is possible to rename event handler by adding C(changes) key to event handler payload
      and pass dictionary, which will contain single key C(name), where new name should be passed. To
      remove particular event handler it is possible to set C(state) for it to C(absent) and it will be
      removed.'
  keyset:
    type: str
    required: true
    description: Name of application's keys set which is bound to managed blocks.
  name:
    type: str
    required: true
    description: Name of managed block which will be later visible on admin.pubnub.com.
  password:
    type: str
    default: ''
    description: Password which match to account to which specified O(email) belong. Not required if O(cache)
      contains result of previous module call (in same play).
  state:
    type: str
    default: present
    choices:
    - started
    - stopped
    - present
    - absent
    description: Intended block state after event handlers creation / update process will be completed.
  validate_certs:
    type: bool
    default: true
    description: This key allow to try skip certificates check when performing REST API calls. Sometimes
      host may have issues with certificates on it and this will cause problems to call PubNub REST API.
      If check should be ignored V(false) should be passed to this parameter.
writes: true
runtime: starlark
source: translated
examples: "\n# Event handler create example.\n- name: Create single event handler\n  community.general.pubnub_blocks:\n\
  \    email: '{{ email }}'\n    password: '{{ password }}'\n    application: '{{ app_name }}'\n    keyset:\
  \ '{{ keyset_name }}'\n    name: '{{ block_name }}'\n    event_handlers:\n      -\n        src: '{{\
  \ path_to_handler_source }}'\n        name: '{{ handler_name }}'\n        event: 'js-before-publish'\n\
  \        channels: '{{ handler_channel }}'\n\n# Change event handler trigger event type.\n- name: Change\
  \ event handler 'event'\n  community.general.pubnub_blocks:\n    email: '{{ email }}'\n    password:\
  \ '{{ password }}'\n    application: '{{ app_name }}'\n    keyset: '{{ keyset_name }}'\n    name: '{{\
  \ block_name }}'\n    event_handlers:\n      -\n        name: '{{ handler_name }}'\n        event: 'js-after-publish'\n\
  \n# Stop block and event handlers.\n- name: Stopping block\n  community.general.pubnub_blocks:\n   \
  \ email: '{{ email }}'\n    password: '{{ password }}'\n    application: '{{ app_name }}'\n    keyset:\
  \ '{{ keyset_name }}'\n    name: '{{ block_name }}'\n    state: stop\n\n# Multiple module calls with\
  \ cached result passing\n- name: Create '{{ block_name }}' block\n  register: module_cache\n  community.general.pubnub_blocks:\n\
  \    email: '{{ email }}'\n    password: '{{ password }}'\n    application: '{{ app_name }}'\n    keyset:\
  \ '{{ keyset_name }}'\n    name: '{{ block_name }}'\n    state: present\n- name: Add '{{ event_handler_1_name\
  \ }}' handler to '{{ block_name }}'\n  register: module_cache\n  community.general.pubnub_blocks:\n\
  \    cache: '{{ module_cache }}'\n    application: '{{ app_name }}'\n    keyset: '{{ keyset_name }}'\n\
  \    name: '{{ block_name }}'\n    state: present\n    event_handlers:\n      -\n        src: '{{ path_to_handler_1_source\
  \ }}'\n        name: '{{ event_handler_1_name }}'\n        channels: '{{ event_handler_1_channel }}'\n\
  \        event: 'js-before-publish'\n- name: Add '{{ event_handler_2_name }}' handler to '{{ block_name\
  \ }}'\n  register: module_cache\n  community.general.pubnub_blocks:\n    cache: '{{ module_cache }}'\n\
  \    application: '{{ app_name }}'\n    keyset: '{{ keyset_name }}'\n    name: '{{ block_name }}'\n\
  \    state: present\n    event_handlers:\n      -\n        src: '{{ path_to_handler_2_source }}'\n \
  \       name: '{{ event_handler_2_name }}'\n        channels: '{{ event_handler_2_channel }}'\n    \
  \    event: 'js-before-publish'\n- name: Start '{{ block_name }}' block\n  register: module_cache\n\
  \  community.general.pubnub_blocks:\n    cache: '{{ module_cache }}'\n    application: '{{ app_name\
  \ }}'\n    keyset: '{{ keyset_name }}'\n    name: '{{ block_name }}'\n    state: started\n"
