name: spectrum_device
fqcn: community.general.spectrum_device
collection: community.general
short_description: Creates/deletes devices in CA Spectrum
description: This module allows you to create and delete devices in CA Spectrum U(https://www.ca.com/us/products/ca-spectrum.html).
  Tested on CA Spectrum 9.4.2, 10.1.1 and 10.2.1
options:
  agentport:
    type: int
    default: 161
    description: UDP port used for SNMP discovery.
  community:
    type: str
    required: true
    description: SNMP community used for device discovery. Required when O(state=present).
  device:
    type: str
    required: true
    aliases:
    - host
    - name
    description: IP address of the device. If a hostname is given, it will be resolved to the IP address.
  landscape:
    type: str
    required: true
    description: Landscape handle of the SpectroServer to which add or remove the device.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: On V(present) creates the device when it does not exist. On V(absent) removes the device
      when it exists.
  url:
    type: str
    required: true
    aliases:
    - oneclick_url
    description: HTTP, HTTPS URL of the Oneclick server in the form V((http|https\)://host.domain[:port]).
  url_password:
    type: str
    required: true
    aliases:
    - oneclick_password
    description: Oneclick user password.
  url_username:
    type: str
    required: true
    aliases:
    - oneclick_user
    description: Oneclick user name.
  use_proxy:
    type: bool
    default: true
    description: if V(false), it will not use a proxy, even if one is defined in an environment variable
      on the target hosts.
  validate_certs:
    type: bool
    default: true
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add device to CA Spectrum\n  local_action:\n    module: spectrum_device\n    device:\
  \ '{{ ansible_host }}'\n    community: secret\n    landscape: '0x100000'\n    oneclick_url: http://oneclick.example.com:8080\n\
  \    oneclick_user: username\n    oneclick_password: password\n    state: present\n\n\n- name: Remove\
  \ device from CA Spectrum\n  local_action:\n    module: spectrum_device\n    device: '{{ ansible_host\
  \ }}'\n    landscape: '{{ landscape_handle }}'\n    oneclick_url: http://oneclick.example.com:8080\n\
  \    oneclick_user: username\n    oneclick_password: password\n    use_proxy: false\n    state: absent\n"
