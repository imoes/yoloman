name: nginx_status_info
fqcn: community.general.nginx_status_info
collection: community.general
short_description: Retrieve information on nginx status
description: Gathers information from nginx from an URL having C(stub_status) enabled.
options:
  timeout:
    type: int
    default: 10
    description: HTTP connection timeout in seconds.
  url:
    type: str
    required: true
    description: URL of the nginx status.
writes: false
runtime: starlark
source: translated
examples: "\n# Gather status info from nginx on localhost\n- name: Get current http stats\n  community.general.nginx_status_info:\n\
  \    url: http://localhost/nginx_status\n  register: result\n\n# Gather status info from nginx on localhost\
  \ with a custom timeout of 20 seconds\n- name: Get current http stats\n  community.general.nginx_status_info:\n\
  \    url: http://localhost/nginx_status\n    timeout: 20\n  register: result\n"
