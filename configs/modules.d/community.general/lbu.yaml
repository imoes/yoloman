name: lbu
fqcn: community.general.lbu
collection: community.general
short_description: Local Backup Utility for Alpine Linux
description: Manage Local Backup Utility of Alpine Linux in run-from-RAM mode
options:
  commit:
    type: bool
    description: Control whether to commit changed files.
  exclude:
    type: list
    description: List of paths to exclude.
  include:
    type: list
    description: List of paths to include.
writes: true
runtime: starlark
source: translated
examples: "\n# Commit changed files (if any)\n- name: Commit\n  community.general.lbu:\n    commit: true\n\
  \n# Exclude path and commit\n- name: Exclude directory\n  community.general.lbu:\n    commit: true\n\
  \    exclude:\n    - /etc/opt\n\n# Include paths without committing\n- name: Include file and directory\n\
  \  community.general.lbu:\n    include:\n    - /root/.ssh/authorized_keys\n    - /var/lib/misc\n"
