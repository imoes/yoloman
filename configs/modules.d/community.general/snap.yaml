name: snap
fqcn: community.general.snap
collection: community.general
short_description: Manages snaps
description: Manages snaps packages.
options:
  channel:
    type: str
    description: Define which release of a snap is installed and tracked for updates. This option can
      only be specified if there is a single snap in the task. If not passed, the C(snap) command will
      default to V(stable). If the value passed does not contain the C(track), it will default to C(latest).
      For example, if V(edge) is passed, the module will assume the channel to be V(latest/edge). See
      U(https://snapcraft.io/docs/channels) for more details about snap channels.
  classic:
    type: bool
    default: false
    description: Confinement policy. The classic confinement allows a snap to have the same level of access
      to the system as "classic" packages, like those managed by APT. This option corresponds to the C(--classic)
      argument. This option can only be specified if there is a single snap in the task.
  dangerous:
    type: bool
    default: false
    description: Install the given snap file even if there are no pre-acknowledged signatures for it,
      meaning it was not verified and could be dangerous.
  name:
    type: list
    required: true
    description: 'Name of the snaps to be installed. Any named snap accepted by the C(snap) command is
      valid. Notice that snap files might require O(dangerous=true) to ignore the error "cannot find signatures
      with metadata for snap".

      '
  options:
    type: list
    description: Set options with pattern C(key=value) or C(snap:key=value). If a snap name is given,
      the option will be applied to that snap only. If the snap name is omitted, the options will be applied
      to all snaps listed in O(name). Options will only be applied to active snaps.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    - enabled
    - disabled
    description: 'Desired state of the package. When O(state=present) the module will use C(snap install)
      if the snap is not installed, and C(snap refresh) if it is installed but from a different channel.

      '
writes: true
runtime: starlark
source: translated
examples: "\n# Install \"foo\" and \"bar\" snap\n- name: Install foo\n  community.general.snap:\n    name:\n\
  \      - foo\n      - bar\n\n# Install \"foo\" snap with options par1=A and par2=B\n- name: Install\
  \ \"foo\" with options\n  community.general.snap:\n    name:\n      - foo\n    options:\n      - par1=A\n\
  \      - par2=B\n\n# Install \"foo\" and \"bar\" snaps with common option com=A and specific options\
  \ fooPar=X and barPar=Y\n- name: Install \"foo\" and \"bar\" with options\n  community.general.snap:\n\
  \    name:\n      - foo\n      - bar\n    options:\n      - com=A\n      - foo:fooPar=X\n      - bar:barPar=Y\n\
  \n# Remove \"foo\" snap\n- name: Remove foo\n  community.general.snap:\n    name: foo\n    state: absent\n\
  \n# Install a snap with classic confinement\n- name: Install \"foo\" with option --classic\n  community.general.snap:\n\
  \    name: foo\n    classic: true\n\n# Install a snap with from a specific channel\n- name: Install\
  \ \"foo\" with option --channel=latest/edge\n  community.general.snap:\n    name: foo\n    channel:\
  \ latest/edge\n"
