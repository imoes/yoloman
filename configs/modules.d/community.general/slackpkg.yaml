name: slackpkg
fqcn: community.general.slackpkg
collection: community.general
short_description: Package manager for Slackware >= 12.2
description: Manage binary packages for Slackware using 'slackpkg' which is available in versions after
  12.2.
options:
  name:
    type: list
    required: true
    aliases:
    - pkg
    description: name of package to install/remove
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - latest
    - installed
    - removed
    description: State of the package, you can use V(installed) as an alias for V(present) and V(removed)
      as one for V(absent).
  update_cache:
    type: bool
    default: false
    description: update the package database first
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install package foo\n  community.general.slackpkg:\n    name: foo\n    state: present\n\
  \n- name: Remove packages foo and bar\n  community.general.slackpkg:\n    name: foo,bar\n    state:\
  \ absent\n\n- name: Make sure that it is the most updated package\n  community.general.slackpkg:\n \
  \   name: foo\n    state: latest\n"
