name: proxmox_tasks_info
fqcn: community.general.proxmox_tasks_info
collection: community.general
short_description: Retrieve information about one or more Proxmox VE tasks
description: Retrieve information about one or more Proxmox VE tasks.
options:
  api_host:
    type: str
    required: true
    description: Specify the target host of the Proxmox VE cluster.
  api_password:
    type: str
    description: Specify the password to authenticate with. You can use E(PROXMOX_PASSWORD) environment
      variable.
  api_token_id:
    type: str
    description: Specify the token ID. Requires C(proxmoxer>=1.1.0) to work.
  api_token_secret:
    type: str
    description: Specify the token secret. Requires C(proxmoxer>=1.1.0) to work.
  api_user:
    type: str
    required: true
    description: Specify the user to authenticate with.
  node:
    type: str
    required: true
    description: Node where to get tasks.
  task:
    type: str
    aliases:
    - upid
    - name
    description: Return specific task.
  validate_certs:
    type: bool
    default: false
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
writes: false
runtime: starlark
source: translated
examples: "\n- name: List tasks on node01\n  community.general.proxmox_tasks_info:\n    api_host: proxmoxhost\n\
  \    api_user: root@pam\n    api_password: '{{ password | default(omit) }}'\n    api_token_id: '{{ token_id\
  \ | default(omit) }}'\n    api_token_secret: '{{ token_secret | default(omit) }}'\n    node: node01\n\
  \  register: result\n\n- name: Retrieve information about specific tasks on node01\n  community.general.proxmox_tasks_info:\n\
  \    api_host: proxmoxhost\n    api_user: root@pam\n    api_password: '{{ password | default(omit) }}'\n\
  \    api_token_id: '{{ token_id | default(omit) }}'\n    api_token_secret: '{{ token_secret | default(omit)\
  \ }}'\n    task: 'UPID:node01:00003263:16167ACE:621EE230:srvreload:networking:root@pam:'\n    node:\
  \ node01\n  register: proxmox_tasks\n"
