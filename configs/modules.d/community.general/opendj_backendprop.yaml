name: opendj_backendprop
fqcn: community.general.opendj_backendprop
collection: community.general
short_description: Will update the backend configuration of OpenDJ via the dsconfig set-backend-prop command
description: This module will update settings for OpenDJ with the command set-backend-prop. It will check
  first via de get-backend-prop if configuration needs to be applied.
options:
  backend:
    type: str
    required: true
    description: The name of the backend on which the property needs to be updated.
  hostname:
    type: str
    required: true
    description: The hostname of the OpenDJ server.
  name:
    type: str
    required: true
    description: The configuration setting to update.
  opendj_bindir:
    type: path
    default: /opt/opendj/bin
    description: The path to the bin directory of OpenDJ.
  password:
    type: str
    description: The password for the cn=Directory Manager user. Either password or passwordfile is needed.
  passwordfile:
    type: path
    description: Location to the password file which holds the password for the cn=Directory Manager user.
      Either password or passwordfile is needed.
  port:
    type: str
    required: true
    description: The Admin port on which the OpenDJ instance is available.
  state:
    type: str
    default: present
    description: If configuration needs to be added/updated
  username:
    type: str
    default: cn=Directory Manager
    description: The username to connect to.
  value:
    type: str
    required: true
    description: The value for the configuration item.
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Add or update OpenDJ backend properties\n    action: opendj_backendprop\n     \
  \       hostname=localhost\n            port=4444\n            username=\"cn=Directory Manager\"\n \
  \           password=password\n            backend=userRoot\n            name=index-entry-limit\n  \
  \          value=5000\n"
