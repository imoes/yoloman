name: gitlab_project
fqcn: community.general.gitlab_project
collection: community.general
short_description: Creates/updates/deletes GitLab Projects
description: When the project does not exist in GitLab, it will be created. When the project does exists
  and O(state=absent), the project will be deleted. When changes are made to the project, the project
  will be updated.
options:
  allow_merge_on_skipped_pipeline:
    type: bool
    description: Allow merge when skipped pipelines exist.
  api_job_token:
    type: str
    description: GitLab CI job token for logging in.
  api_oauth_token:
    type: str
    description: GitLab OAuth token for logging in.
  api_password:
    type: str
    description: The password to use for authentication against the API.
  api_token:
    type: str
    description: GitLab access token with API permissions.
  api_url:
    type: str
    description: The resolvable endpoint for the API.
  api_username:
    type: str
    description: The username to use for authentication against the API.
  avatar_path:
    type: path
    description: Absolute path image to configure avatar. File size should not exceed 200 kb. This option
      is only used on creation, not for updates.
  builds_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that repository CI/CD is allowed only to project members. V(disabled)
      means that repository CI/CD is disabled. V(enabled) means that repository CI/CD is enabled.
  ca_path:
    type: str
    description: The CA certificates bundle to use to verify GitLab server certificate.
  ci_config_path:
    type: str
    description: Custom path to the CI configuration file for this project.
  container_registry_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that container registry is allowed only to project members. V(disabled)
      means that container registry is disabled. V(enabled) means that container registry is enabled.
  default_branch:
    type: str
    description: The default branch name for this project. For project creation, this option requires
      O(initialize_with_readme=true). For project update, the branch must exist. Supports project's default
      branch update since community.general 8.0.0.
  description:
    type: str
    description: An description for the project.
  environments_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that deployment to environment is allowed only to project members. V(disabled)
      means that deployment to environment is disabled. V(enabled) means that deployment to environment
      is enabled.
  feature_flags_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that feature rollout is allowed only to project members. V(disabled)
      means that feature rollout is disabled. V(enabled) means that feature rollout is enabled.
  forking_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that repository forks is allowed only to project members. V(disabled)
      means that repository forks are disabled. V(enabled) means that repository forks are enabled.
  group:
    type: str
    description: Id or the full path of the group of which this projects belongs to.
  import_url:
    type: str
    description: Git repository which will be imported into gitlab. GitLab server needs read access to
      this git repository.
  infrastructure_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that configuring infrastructure is allowed only to project members.
      V(disabled) means that configuring infrastructure is disabled. V(enabled) means that configuring
      infrastructure is enabled.
  initialize_with_readme:
    type: bool
    default: false
    description: Will initialize the project with a default C(README.md). Is only used when the project
      is created, and ignored otherwise.
  issues_enabled:
    type: bool
    default: true
    description: Whether you want to create issues or not. Possible values are true and false.
  lfs_enabled:
    type: bool
    default: false
    description: Enable Git large file systems to manages large files such as audio, video, and graphics
      files.
  merge_method:
    type: str
    default: merge
    choices:
    - ff
    - merge
    - rebase_merge
    description: What requirements are placed upon merges. Possible values are V(merge), V(rebase_merge)
      merge commit with semi-linear history, V(ff) fast-forward merges only.
  merge_requests_enabled:
    type: bool
    default: true
    description: If merge requests can be made or not. Possible values are true and false.
  monitor_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that monitoring health is allowed only to project members. V(disabled)
      means that monitoring health is disabled. V(enabled) means that monitoring health is enabled.
  name:
    type: str
    required: true
    description: The name of the project.
  only_allow_merge_if_all_discussions_are_resolved:
    type: bool
    description: All discussions on a merge request (MR) have to be resolved.
  only_allow_merge_if_pipeline_succeeds:
    type: bool
    description: Only allow merges if pipeline succeeded.
  packages_enabled:
    type: bool
    description: Enable GitLab package repository.
  path:
    type: str
    description: The path of the project you want to create, this will be server_url/<group>/path. If
      not supplied, name will be used.
  releases_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that accessing release is allowed only to project members. V(disabled)
      means that accessing release is disabled. V(enabled) means that accessing release is enabled.
  remove_source_branch_after_merge:
    type: bool
    description: Remove the source branch after merge.
  security_and_compliance_access_level:
    type: str
    choices:
    - private
    - disabled
    - enabled
    description: V(private) means that accessing security and complicance tab is allowed only to project
      members. V(disabled) means that accessing security and complicance tab is disabled. V(enabled) means
      that accessing security and complicance tab is enabled.
  shared_runners_enabled:
    type: bool
    description: Enable shared runners for this project.
  snippets_enabled:
    type: bool
    default: true
    description: If creating snippets should be available or not.
  squash_option:
    type: str
    choices:
    - never
    - always
    - default_off
    - default_on
    description: Squash commits when merging.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Create or delete project. Possible values are present and absent.
  topics:
    type: list
    description: A topic or list of topics to be assigned to a project. It is compatible with old GitLab
      server releases (versions before 14, correspond to C(tag_list)).
  username:
    type: str
    description: Used to create a personal project under a user's name.
  validate_certs:
    type: bool
    default: true
    description: Whether or not to validate SSL certs when supplying a HTTPS endpoint.
  visibility:
    type: str
    default: private
    choices:
    - private
    - internal
    - public
    aliases:
    - visibility_level
    description: V(private) Project access must be granted explicitly for each user. V(internal) The project
      can be cloned by any logged in user. V(public) The project can be cloned without any authentication.
  wiki_enabled:
    type: bool
    default: true
    description: If an wiki for this project should be available or not.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create GitLab Project\n  community.general.gitlab_project:\n    api_url: https://gitlab.example.com/\n\
  \    api_token: \"{{ api_token }}\"\n    name: my_first_project\n    group: \"10481470\"\n\n- name:\
  \ Delete GitLab Project\n  community.general.gitlab_project:\n    api_url: https://gitlab.example.com/\n\
  \    api_token: \"{{ access_token }}\"\n    name: my_first_project\n    state: absent\n  delegate_to:\
  \ localhost\n\n- name: Create GitLab Project in group Ansible\n  community.general.gitlab_project:\n\
  \    api_url: https://gitlab.example.com/\n    validate_certs: true\n    api_username: dj-wasabi\n \
  \   api_password: \"MySecretPassword\"\n    name: my_first_project\n    group: ansible\n    issues_enabled:\
  \ false\n    merge_method: rebase_merge\n    wiki_enabled: true\n    snippets_enabled: true\n    import_url:\
  \ http://git.example.com/example/lab.git\n    initialize_with_readme: true\n    state: present\n  delegate_to:\
  \ localhost\n\n- name: get the initial root password\n  ansible.builtin.shell: |\n    grep 'Password:'\
  \ /etc/gitlab/initial_root_password | sed -e 's/Password\\: \\(.*\\)/\\1/'\n  register: initial_root_password\n\
  \n- name: Create a GitLab Project using a username/password via oauth_token\n  community.general.gitlab_project:\n\
  \    api_url: https://gitlab.example.com/\n    api_username: root\n    api_password: \"{{ initial_root_password\
  \ }}\"\n    name: my_second_project\n    group: \"10481470\"\n"
