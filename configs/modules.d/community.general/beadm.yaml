name: beadm
fqcn: community.general.beadm
collection: community.general
short_description: Manage ZFS boot environments on FreeBSD/Solaris/illumos systems
description: Create, delete or activate ZFS boot environments. Mount and unmount ZFS boot environments.
options:
  description:
    type: str
    description: Associate a description with a new boot environment. This option is available only on
      Solarish platforms.
  force:
    type: bool
    default: false
    description: Specifies if the unmount should be forced.
  mountpoint:
    type: path
    description: Path where to mount the ZFS boot environment.
  name:
    type: str
    required: true
    aliases:
    - be
    description: ZFS boot environment name.
  options:
    type: str
    description: Create the datasets for new BE with specific ZFS properties. Multiple options can be
      specified. This option is available only on Solarish platforms.
  snapshot:
    type: str
    description: If specified, the new boot environment will be cloned from the given snapshot or inactive
      boot environment.
  state:
    type: str
    default: present
    choices:
    - absent
    - activated
    - mounted
    - present
    - unmounted
    description: Create or delete ZFS boot environment.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create ZFS boot environment\n  community.general.beadm:\n    name: upgrade-be\n \
  \   state: present\n\n- name: Create ZFS boot environment from existing inactive boot environment\n\
  \  community.general.beadm:\n    name: upgrade-be\n    snapshot: be@old\n    state: present\n\n- name:\
  \ Create ZFS boot environment with compression enabled and description \"upgrade\"\n  community.general.beadm:\n\
  \    name: upgrade-be\n    options: \"compression=on\"\n    description: upgrade\n    state: present\n\
  \n- name: Delete ZFS boot environment\n  community.general.beadm:\n    name: old-be\n    state: absent\n\
  \n- name: Mount ZFS boot environment on /tmp/be\n  community.general.beadm:\n    name: BE\n    mountpoint:\
  \ /tmp/be\n    state: mounted\n\n- name: Unmount ZFS boot environment\n  community.general.beadm:\n\
  \    name: BE\n    state: unmounted\n\n- name: Activate ZFS boot environment\n  community.general.beadm:\n\
  \    name: upgrade-be\n    state: activated\n"
