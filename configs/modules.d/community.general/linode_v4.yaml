name: linode_v4
fqcn: community.general.linode_v4
collection: community.general
short_description: Manage instances on the Linode cloud
description: Manage instances on the Linode cloud.
options:
  access_token:
    type: str
    required: true
    description: The Linode API v4 access token. It may also be specified by exposing the E(LINODE_ACCESS_TOKEN)
      environment variable. See U(https://www.linode.com/docs/api#access-and-authentication).
  authorized_keys:
    type: list
    description: A list of SSH public key parts to deploy for the root user.
  group:
    type: str
    description: The group that the instance should be marked under. Please note, that group labelling
      is deprecated but still supported. The encouraged method for marking instances is to use tags.
  image:
    type: str
    description: The image of the instance. This is a required parameter only when creating Linode instances.
      See U(https://www.linode.com/docs/api/images/).
  label:
    type: str
    required: true
    description: The instance label. This label is used as the main determiner for idempotence for the
      module and is therefore mandatory.
  private_ip:
    type: bool
    default: false
    description: If V(true), the created Linode will have private networking enabled and assigned a private
      IPv4 address.
  region:
    type: str
    description: The region of the instance. This is a required parameter only when creating Linode instances.
      See U(https://www.linode.com/docs/api/regions/).
  root_pass:
    type: str
    description: The password for the root user. If not specified, one will be generated. This generated
      password will be available in the task success JSON.
  stackscript_data:
    type: dict
    description: An object containing arguments to any User Defined Fields present in the StackScript
      used when creating the instance. Only valid when a stackscript_id is provided. See U(https://www.linode.com/docs/api/stackscripts/).
  stackscript_id:
    type: int
    description: The numeric ID of the StackScript to use when creating the instance. See U(https://www.linode.com/docs/api/stackscripts/).
  state:
    type: str
    required: true
    choices:
    - present
    - absent
    description: The desired instance state.
  tags:
    type: list
    description: The tags that the instance should be marked under. See U(https://www.linode.com/docs/api/tags/).
  type:
    type: str
    description: The type of the instance. This is a required parameter only when creating Linode instances.
      See U(https://www.linode.com/docs/api/linode-types/).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a new Linode.\n  community.general.linode_v4:\n    label: new-linode\n   \
  \ type: g6-nanode-1\n    region: eu-west\n    image: linode/debian9\n    root_pass: passw0rd\n    authorized_keys:\n\
  \      - \"ssh-rsa ...\"\n    stackscript_id: 1337\n    stackscript_data:\n      variable: value\n \
  \   state: present\n\n- name: Delete that new Linode.\n  community.general.linode_v4:\n    label: new-linode\n\
  \    state: absent\n"
