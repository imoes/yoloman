name: campfire
fqcn: community.general.campfire
collection: community.general
short_description: Send a message to Campfire
description: Send a message to Campfire. Messages with newlines will result in a "Paste" message being
  sent.
options:
  msg:
    type: str
    required: true
    description: The message body.
  notify:
    type: str
    choices:
    - 56k
    - bell
    - bezos
    - bueller
    - clowntown
    - cottoneyejoe
    - crickets
    - dadgummit
    - dangerzone
    - danielsan
    - deeper
    - drama
    - greatjob
    - greyjoy
    - guarantee
    - heygirl
    - horn
    - horror
    - inconceivable
    - live
    - loggins
    - makeitso
    - noooo
    - nyan
    - ohmy
    - ohyeah
    - pushit
    - rimshot
    - rollout
    - rumble
    - sax
    - secret
    - sexyback
    - story
    - tada
    - tmyk
    - trololo
    - trombone
    - unix
    - vuvuzela
    - what
    - whoomp
    - yeah
    - yodel
    description: Send a notification sound before the message.
  room:
    type: str
    required: true
    description: Room number to which the message should be sent.
  subscription:
    type: str
    required: true
    description: The subscription name to use.
  token:
    type: str
    required: true
    description: API token.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Send a message to Campfire\n  community.general.campfire:\n    subscription: foo\n\
  \    token: 12345\n    room: 123\n    msg: Task completed.\n\n- name: Send a message to Campfire\n \
  \ community.general.campfire:\n    subscription: foo\n    token: 12345\n    room: 123\n    notify: loggins\n\
  \    msg: Task completed ... with feeling.\n"
