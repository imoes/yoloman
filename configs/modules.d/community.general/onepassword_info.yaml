name: onepassword_info
fqcn: community.general.onepassword_info
collection: community.general
short_description: Gather items from 1Password
description: M(community.general.onepassword_info) wraps the C(op) command line utility to fetch data
  about one or more 1Password items. A fatal error occurs if any of the items being searched for can not
  be found. Recommend using with the C(no_log) option to avoid logging the values of the secrets being
  retrieved.
options:
  auto_login:
    type: dict
    description: A dictionary containing authentication details. If this is set, M(community.general.onepassword_info)
      will attempt to sign in to 1Password automatically. Without this option, you must have already logged
      in via the 1Password CLI before running Ansible. It is B(highly) recommended to store 1Password
      credentials in an Ansible Vault. Ensure that the key used to encrypt the Ansible Vault is equal
      to or greater in strength than the 1Password master password.
  cli_path:
    type: path
    default: op
    description: Used to specify the exact path to the C(op) command line interface
  search_terms:
    type: list
    required: true
    description: A list of one or more search terms. Each search term can either be a simple string or
      it can be a dictionary for more control. When passing a simple string, O(search_terms[].field) is
      assumed to be V(password). When passing a dictionary, the following fields are available.
writes: false
runtime: starlark
source: translated
examples: "\n# Gather secrets from 1Password, assuming there is a 'password' field:\n- name: Get a password\n\
  \  community.general.onepassword_info:\n    search_terms: My 1Password item\n  delegate_to: localhost\n\
  \  register: my_1password_item\n  no_log: true         # Don't want to log the secrets to the console!\n\
  \n# Gather secrets from 1Password, with more advanced search terms:\n- name: Get a password\n  community.general.onepassword_info:\n\
  \    search_terms:\n      - name:    My 1Password item\n        field:   Custom field name       # optional,\
  \ defaults to 'password'\n        section: Custom section name     # optional, defaults to 'None'\n\
  \        vault:   Name of the vault       # optional, only necessary if there is more than 1 Vault available\n\
  \  delegate_to: localhost\n  register: my_1password_item\n  no_log: true                           #\
  \ Don't want to log the secrets to the console!\n\n# Gather secrets combining simple and advanced search\
  \ terms to retrieve two items, one of which we fetch two\n# fields. In the first 'password' is fetched,\
  \ as a field name is not specified (default behaviour) and in the\n# second, 'Custom field name' is\
  \ fetched, as that is specified explicitly.\n- name: Get a password\n  community.general.onepassword_info:\n\
  \    search_terms:\n      - My 1Password item                # 'name' is optional when passing a simple\
  \ string...\n      - name: My Other 1Password item    # ...but it can also be set for consistency\n\
  \      - name:    My 1Password item\n        field:   Custom field name       # optional, defaults to\
  \ 'password'\n        section: Custom section name     # optional, defaults to 'None'\n        vault:\
  \   Name of the vault       # optional, only necessary if there is more than 1 Vault available\n   \
  \   - name: A 1Password item with document attachment\n  delegate_to: localhost\n  register: my_1password_item\n\
  \  no_log: true                           # Don't want to log the secrets to the console!\n\n- name:\
  \ Debug a password (for example)\n  ansible.builtin.debug:\n    msg: \"{{ my_1password_item['onepassword']['My\
  \ 1Password item'] }}\"\n"
