name: lldp
fqcn: community.general.lldp
collection: community.general
short_description: Get details reported by lldp
description: Reads data out of lldpctl
options: {}
writes: true
runtime: starlark
source: translated
examples: "\n# Retrieve switch/port information\n - name: Gather information from lldp\n   community.general.lldp:\n\
  \n - name: Print each switch/port\n   ansible.builtin.debug:\n    msg: \"{{ lldp[item]['chassis']['name']\
  \ }} / {{ lldp[item]['port']['ifname'] }}\"\n   with_items: \"{{ lldp.keys() }}\"\n\n# TASK: [Print\
  \ each switch/port] ***********************************************************\n# ok: [10.13.0.22]\
  \ => (item=eth2) => {\"item\": \"eth2\", \"msg\": \"switch1.example.com / Gi0/24\"}\n# ok: [10.13.0.22]\
  \ => (item=eth1) => {\"item\": \"eth1\", \"msg\": \"switch2.example.com / Gi0/3\"}\n# ok: [10.13.0.22]\
  \ => (item=eth0) => {\"item\": \"eth0\", \"msg\": \"switch3.example.com / Gi0/3\"}\n\n"
