name: gitlab_project_members
fqcn: community.general.gitlab_project_members
collection: community.general
short_description: Manage project members on GitLab Server
description: This module allows to add and remove members to/from a project, or change a member's access
  level in a project on GitLab.
options:
  access_level:
    type: str
    choices:
    - guest
    - reporter
    - developer
    - maintainer
    description: The access level for the user. Required if O(state=present), user state is set to present.
  api_job_token:
    type: str
    description: GitLab CI job token for logging in.
  api_oauth_token:
    type: str
    description: GitLab OAuth token for logging in.
  api_password:
    type: str
    description: The password to use for authentication against the API.
  api_token:
    type: str
    description: GitLab access token with API permissions.
  api_url:
    type: str
    description: The resolvable endpoint for the API.
  api_username:
    type: str
    description: The username to use for authentication against the API.
  ca_path:
    type: str
    description: The CA certificates bundle to use to verify GitLab server certificate.
  gitlab_user:
    type: list
    description: A username or a list of usernames to add to/remove from the GitLab project. Mutually
      exclusive with O(gitlab_users_access).
  gitlab_users_access:
    type: list
    description: Provide a list of user to access level mappings. Every dictionary in this list specifies
      a user (by username) and the access level the user should have. Mutually exclusive with O(gitlab_user)
      and O(access_level). Use together with O(purge_users) to remove all users not specified here from
      the project.
  project:
    type: str
    required: true
    description: The name (or full path) of the GitLab project the member is added to/removed from.
  purge_users:
    type: list
    choices:
    - guest
    - reporter
    - developer
    - maintainer
    description: Adds/remove users of the given access_level to match the given O(gitlab_user)/O(gitlab_users_access)
      list. If omitted do not purge orphaned members. Is only used when O(state=present).
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the member in the project. On V(present), it adds a user to a GitLab project.
      On V(absent), it removes a user from a GitLab project.
  validate_certs:
    type: bool
    default: true
    description: Whether or not to validate SSL certs when supplying a HTTPS endpoint.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add a user to a GitLab Project\n  community.general.gitlab_project_members:\n   \
  \ api_url: 'https://gitlab.example.com'\n    api_token: 'Your-Private-Token'\n    validate_certs: true\n\
  \    project: projectname\n    gitlab_user: username\n    access_level: developer\n    state: present\n\
  \n- name: Remove a user from a GitLab project\n  community.general.gitlab_project_members:\n    api_url:\
  \ 'https://gitlab.example.com'\n    api_token: 'Your-Private-Token'\n    project: projectname\n    gitlab_user:\
  \ username\n    state: absent\n\n- name: Add a list of Users to A GitLab project\n  community.general.gitlab_project_members:\n\
  \    api_url: 'https://gitlab.example.com'\n    api_token: 'Your-Private-Token'\n    gitlab_project:\
  \ projectname\n    gitlab_user:\n      - user1\n      - user2\n    access_level: developer\n    state:\
  \ present\n\n- name: Add a list of Users with Dedicated Access Levels to A GitLab project\n  community.general.gitlab_project_members:\n\
  \    api_url: 'https://gitlab.example.com'\n    api_token: 'Your-Private-Token'\n    project: projectname\n\
  \    gitlab_users_access:\n      - name: user1\n        access_level: developer\n      - name: user2\n\
  \        access_level: maintainer\n    state: present\n\n- name: Add a user, remove all others which\
  \ might be on this access level\n  community.general.gitlab_project_members:\n    api_url: 'https://gitlab.example.com'\n\
  \    api_token: 'Your-Private-Token'\n    project: projectname\n    gitlab_user: username\n    access_level:\
  \ developer\n    purge_users: developer\n    state: present\n\n- name: Remove a list of Users with Dedicated\
  \ Access Levels to A GitLab project\n  community.general.gitlab_project_members:\n    api_url: 'https://gitlab.example.com'\n\
  \    api_token: 'Your-Private-Token'\n    project: projectname\n    gitlab_users_access:\n      - name:\
  \ user1\n        access_level: developer\n      - name: user2\n        access_level: maintainer\n  \
  \  state: absent\n"
