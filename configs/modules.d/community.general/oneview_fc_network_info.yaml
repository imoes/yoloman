name: oneview_fc_network_info
fqcn: community.general.oneview_fc_network_info
collection: community.general
short_description: Retrieve the information about one or more of the OneView Fibre Channel Networks
description: Retrieve the information about one or more of the Fibre Channel Networks from OneView.
options:
  api_version:
    type: int
    description: OneView API Version.
  config:
    type: path
    description: Path to a JSON configuration file containing the OneView client configuration. The configuration
      file is optional and when used should be present in the host running the ansible commands. If the
      file path is not provided, the configuration will be loaded from environment variables. For links
      to example configuration files or how to use the environment variables verify the notes section.
  hostname:
    type: str
    description: IP address or hostname for the appliance.
  image_streamer_hostname:
    type: str
    description: IP address or hostname for the HPE Image Streamer REST API.
  name:
    type: str
    description: Fibre Channel Network name.
  params:
    type: dict
    description: 'List of parameters to delimit, filter and sort the list of resources. Parameter keys
      allowed are: C(start): The first item to return, using 0-based indexing. C(count): The number of
      resources to return. C(filter): A general filter/query string to narrow the list of items returned.
      C(sort): The sort order of the returned data set.'
  password:
    type: str
    description: Password for API authentication.
  username:
    type: str
    description: Username for API authentication.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather information about all Fibre Channel Networks\n  community.general.oneview_fc_network_info:\n\
  \    config: /etc/oneview/oneview_config.json\n  delegate_to: localhost\n  register: result\n\n- name:\
  \ Print fetched information about Fibre Channel Networks\n  ansible.builtin.debug:\n    msg: \"{{ result.fc_networks\
  \ }}\"\n\n- name: Gather paginated, filtered and sorted information about Fibre Channel Networks\n \
  \ community.general.oneview_fc_network_info:\n    config: /etc/oneview/oneview_config.json\n    params:\n\
  \      start: 1\n      count: 3\n      sort: 'name:descending'\n      filter: 'fabricType=FabricAttach'\n\
  \  delegate_to: localhost\n  register: result\n\n- name: Print fetched information about paginated,\
  \ filtered and sorted list of Fibre Channel Networks\n  ansible.builtin.debug:\n    msg: \"{{ result.fc_networks\
  \ }}\"\n\n- name: Gather information about a Fibre Channel Network by name\n  community.general.oneview_fc_network_info:\n\
  \    config: /etc/oneview/oneview_config.json\n    name: network name\n  delegate_to: localhost\n  register:\
  \ result\n\n- name: Print fetched information about Fibre Channel Network found by name\n  ansible.builtin.debug:\n\
  \    msg: \"{{ result.fc_networks }}\"\n"
