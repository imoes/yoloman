name: aix_inittab
fqcn: community.general.aix_inittab
collection: community.general
short_description: Manages the inittab on AIX
description: Manages the inittab on AIX.
options:
  action:
    type: str
    choices:
    - boot
    - bootwait
    - hold
    - initdefault
    - 'off'
    - once
    - ondemand
    - powerfail
    - powerwait
    - respawn
    - sysinit
    - wait
    description: Action what the init has to do with this entry.
  command:
    type: str
    required: true
    description: What command has to run.
  insertafter:
    type: str
    description: After which inittabline should the new entry inserted.
  name:
    type: str
    required: true
    aliases:
    - service
    description: Name of the inittab entry.
  runlevel:
    type: str
    required: true
    description: Runlevel of the entry.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether the entry should be present or absent in the inittab file.
writes: true
runtime: starlark
source: translated
examples: "\n# Add service startmyservice to the inittab, directly after service existingservice.\n- name:\
  \ Add startmyservice to inittab\n  community.general.aix_inittab:\n    name: startmyservice\n    runlevel:\
  \ 4\n    action: once\n    command: echo hello\n    insertafter: existingservice\n    state: present\n\
  \  become: true\n\n# Change inittab entry startmyservice to runlevel \"2\" and processaction \"wait\"\
  .\n- name: Change startmyservice to inittab\n  community.general.aix_inittab:\n    name: startmyservice\n\
  \    runlevel: 2\n    action: wait\n    command: echo hello\n    state: present\n  become: true\n\n\
  - name: Remove startmyservice from inittab\n  community.general.aix_inittab:\n    name: startmyservice\n\
  \    runlevel: 2\n    action: wait\n    command: echo hello\n    state: absent\n  become: true\n"
