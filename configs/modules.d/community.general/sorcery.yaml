name: sorcery
fqcn: community.general.sorcery
collection: community.general
short_description: Package manager for Source Mage GNU/Linux
description: Manages "spells" on Source Mage GNU/Linux using I(sorcery) toolchain
options:
  cache_valid_time:
    type: int
    default: 0
    description: Time in seconds to invalidate grimoire collection on update. Especially useful for SCM
      and rsync grimoires. Makes sense only in pair with O(update_cache).
  depends:
    type: str
    description: Comma-separated list of _optional_ dependencies to build a spell (or make sure it is
      built) with; use V(+)/V(-) in front of dependency to turn it on/off (V(+) is optional though). This
      option is ignored if O(name) parameter is equal to V(*) or contains more than one spell. Providers
      must be supplied in the form recognized by Sorcery, for example 'V(openssl(SSL\))'.
  name:
    type: list
    aliases:
    - spell
    - grimoire
    description: Name of the spell or grimoire. Multiple names can be given, separated by commas. Special
      value V(*) in conjunction with states V(latest) or V(rebuild) will update or rebuild the whole system
      respectively The alias O(grimoire) was added in community.general 7.3.0.
  repository:
    type: str
    description: Repository location. If specified, O(name) represents grimoire(s) instead of spell(s).
      Special value V(*) will pull grimoire from the official location. Only single item in O(name) in
      conjunction with V(*) can be used. O(state=absent) must be used with a special value V(*).
  state:
    type: str
    default: present
    choices:
    - present
    - latest
    - absent
    - cast
    - dispelled
    - rebuild
    description: Whether to cast, dispel or rebuild a package. State V(cast) is an equivalent of V(present),
      not V(latest). State V(rebuild) implies cast of all specified spells, not only those existed before.
  update:
    type: bool
    default: false
    description: Whether or not to update sorcery scripts at the very first stage.
  update_cache:
    type: bool
    default: false
    aliases:
    - update_codex
    description: Whether or not to update grimoire collection before casting spells.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Make sure spell foo is installed\n  community.general.sorcery:\n    spell: foo\n\
  \    state: present\n\n- name: Make sure spells foo, bar and baz are removed\n  community.general.sorcery:\n\
  \    spell: foo,bar,baz\n    state: absent\n\n- name: Make sure spell foo with dependencies bar and\
  \ baz is installed\n  community.general.sorcery:\n    spell: foo\n    depends: bar,baz\n    state: present\n\
  \n- name: Make sure spell foo with bar and without baz dependencies is installed\n  community.general.sorcery:\n\
  \    spell: foo\n    depends: +bar,-baz\n    state: present\n\n- name: Make sure spell foo with libressl\
  \ (providing SSL) dependency is installed\n  community.general.sorcery:\n    spell: foo\n    depends:\
  \ libressl(SSL)\n    state: present\n\n- name: Make sure spells with/without required dependencies (if\
  \ any) are installed\n  community.general.sorcery:\n    name: \"{{ item.spell }}\"\n    depends: \"\
  {{ item.depends | default(None) }}\"\n    state: present\n  loop:\n    - { spell: 'vifm', depends: '+file,-gtk+2'\
  \ }\n    - { spell: 'fwknop', depends: 'gpgme' }\n    - { spell: 'pv,tnftp,tor' }\n\n- name: Install\
  \ the latest version of spell foo using regular glossary\n  community.general.sorcery:\n    name: foo\n\
  \    state: latest\n\n- name: Rebuild spell foo\n  community.general.sorcery:\n    spell: foo\n    state:\
  \ rebuild\n\n- name: Rebuild the whole system, but update Sorcery and Codex first\n  community.general.sorcery:\n\
  \    spell: '*'\n    state: rebuild\n    update: true\n    update_cache: true\n\n- name: Refresh the\
  \ grimoire collection if it is 1 day old using native sorcerous alias\n  community.general.sorcery:\n\
  \    update_codex: true\n    cache_valid_time: 86400\n\n- name: Make sure stable grimoire is present\n\
  \  community.general.sorcery:\n    name: stable\n    repository: '*'\n    state: present\n\n- name:\
  \ Make sure binary and stable-rc grimoires are removed\n  community.general.sorcery:\n    grimoire:\
  \ binary,stable-rc\n    repository: '*'\n    state: absent\n\n- name: Make sure games grimoire is pulled\
  \ from rsync\n  community.general.sorcery:\n    grimoire: games\n    repository: \"rsync://download.sourcemage.org::codex/games\"\
  \n    state: present\n\n- name: Make sure a specific branch of stable grimoire is pulled from git\n\
  \  community.general.sorcery:\n    grimoire: stable.git\n    repository: \"git://download.sourcemage.org/smgl/grimoire.git:stable.git:stable-0.62\"\
  \n    state: present\n\n- name: Update only Sorcery itself\n  community.general.sorcery:\n    update:\
  \ true\n"
