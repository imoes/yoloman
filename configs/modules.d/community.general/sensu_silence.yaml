name: sensu_silence
fqcn: community.general.sensu_silence
collection: community.general
short_description: Manage Sensu silence entries
description: Create and clear (delete) a silence entries via the Sensu API for subscriptions and checks.
options:
  check:
    type: str
    description: Specifies the check which the silence entry applies to.
  creator:
    type: str
    description: Specifies the entity responsible for this entry.
  expire:
    type: int
    description: If specified, the silence entry will be automatically cleared after this number of seconds.
  expire_on_resolve:
    type: bool
    description: If specified as true, the silence entry will be automatically cleared once the condition
      it is silencing is resolved.
  reason:
    type: str
    description: If specified, this free-form string is used to provide context or rationale for the reason
      this silence entry was created.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Specifies to create or clear (delete) a silence entry via the Sensu API
  subscription:
    type: str
    required: true
    description: Specifies the subscription which the silence entry applies to. To create a silence entry
      for a client prepend C(client:) to client name. Example - C(client:server1.example.dev)
  url:
    type: str
    default: http://127.0.01:4567
    description: Specifies the URL of the Sensu monitoring host server.
writes: true
runtime: starlark
source: translated
examples: "\n# Silence ALL checks for a given client\n- name: Silence server1.example.dev\n  community.general.sensu_silence:\n\
  \    subscription: client:server1.example.dev\n    creator: \"{{ ansible_user_id }}\"\n    reason: Performing\
  \ maintenance\n\n# Silence specific check for a client\n- name: Silence CPU_Usage check for server1.example.dev\n\
  \  community.general.sensu_silence:\n    subscription: client:server1.example.dev\n    check: CPU_Usage\n\
  \    creator: \"{{ ansible_user_id }}\"\n    reason: Investigation alert issue\n\n# Silence multiple\
  \ clients from a dict\n  silence:\n    server1.example.dev:\n      reason: 'Deployment in progress'\n\
  \    server2.example.dev:\n      reason: 'Deployment in progress'\n\n- name: Silence several clients\
  \ from a dict\n  community.general.sensu_silence:\n    subscription: \"client:{{ item.key }}\"\n   \
  \ reason: \"{{ item.value.reason }}\"\n    creator: \"{{ ansible_user_id }}\"\n  with_dict: \"{{ silence\
  \ }}\"\n"
