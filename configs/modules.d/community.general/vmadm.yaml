name: vmadm
fqcn: community.general.vmadm
collection: community.general
short_description: Manage SmartOS virtual machines and zones
description: Manage SmartOS virtual machines through vmadm(1M).
options:
  archive_on_delete:
    type: bool
    description: When enabled, the zone dataset will be mounted on C(/zones/archive) upon removal.
  autoboot:
    type: bool
    description: Whether or not a VM is booted when the system is rebooted.
  boot:
    type: str
    description: Set the boot order for KVM VMs.
  brand:
    type: str
    default: joyent
    choices:
    - joyent
    - joyent-minimal
    - lx
    - kvm
    - bhyve
    description: Type of virtual machine. The V(bhyve) option was added in community.general 0.2.0.
  cpu_cap:
    type: int
    description: Sets a limit on the amount of CPU time that can be used by a VM. Use V(0) for no cap.
  cpu_shares:
    type: int
    description: Sets a limit on the number of fair share scheduler (FSS) CPU shares for a VM. This limit
      is relative to all other VMs on the system.
  cpu_type:
    type: str
    default: qemu64
    choices:
    - qemu64
    - host
    description: Control the type of virtual CPU exposed to KVM VMs.
  customer_metadata:
    type: dict
    description: Metadata to be set and associated with this VM, this contain customer modifiable keys.
  delegate_dataset:
    type: bool
    description: Whether to delegate a ZFS dataset to an OS VM.
  disk_driver:
    type: str
    description: Default value for a virtual disk model for KVM guests.
  disks:
    type: list
    description: A list of disks to add, valid properties are documented in vmadm(1M).
  dns_domain:
    type: str
    description: Domain value for C(/etc/hosts).
  docker:
    type: bool
    description: Docker images need this flag enabled along with the O(brand) set to C(lx).
  filesystems:
    type: list
    description: Mount additional filesystems into an OS VM.
  firewall_enabled:
    type: bool
    description: Enables the firewall, allowing fwadm(1M) rules to be applied.
  force:
    type: bool
    description: Force a particular action (i.e. stop or delete a VM).
  fs_allowed:
    type: str
    description: Comma separated list of filesystem types this zone is allowed to mount.
  hostname:
    type: str
    description: Zone/VM hostname.
  image_uuid:
    type: str
    description: Image UUID.
  indestructible_delegated:
    type: bool
    description: Adds an C(@indestructible) snapshot to delegated datasets.
  indestructible_zoneroot:
    type: bool
    description: Adds an C(@indestructible) snapshot to zoneroot.
  internal_metadata:
    type: dict
    description: Metadata to be set and associated with this VM, this contains operator generated keys.
  internal_metadata_namespace:
    type: str
    description: List of namespaces to be set as C(internal_metadata-only); these namespaces will come
      from O(internal_metadata) rather than O(customer_metadata).
  kernel_version:
    type: str
    description: Kernel version to emulate for LX VMs.
  limit_priv:
    type: str
    description: Set (comma separated) list of privileges the zone is allowed to use.
  maintain_resolvers:
    type: bool
    description: Resolvers in C(/etc/resolv.conf) will be updated when updating the O(resolvers) property.
  max_locked_memory:
    type: int
    description: Total amount of memory (in MiBs) on the host that can be locked by this VM.
  max_lwps:
    type: int
    description: Maximum number of lightweight processes this VM is allowed to have running.
  max_physical_memory:
    type: int
    description: Maximum amount of memory (in MiBs) on the host that the VM is allowed to use.
  max_swap:
    type: int
    description: Maximum amount of virtual memory (in MiBs) the VM is allowed to use.
  mdata_exec_timeout:
    type: int
    description: Timeout in seconds (or 0 to disable) for the C(svc:/smartdc/mdata:execute) service that
      runs user-scripts in the zone.
  name:
    type: str
    aliases:
    - alias
    description: Name of the VM. vmadm(1M) uses this as an optional name.
  nic_driver:
    type: str
    description: Default value for a virtual NIC model for KVM guests.
  nics:
    type: list
    description: A list of nics to add, valid properties are documented in vmadm(1M).
  nowait:
    type: bool
    description: Consider the provisioning complete when the VM first starts, rather than when the VM
      has rebooted.
  qemu_extra_opts:
    type: str
    description: Additional qemu cmdline arguments for KVM guests.
  qemu_opts:
    type: str
    description: Additional qemu arguments for KVM guests. This overwrites the default arguments provided
      by vmadm(1M) and should only be used for debugging.
  quota:
    type: int
    description: Quota on zone filesystems (in MiBs).
  ram:
    type: int
    description: Amount of virtual RAM for a KVM guest (in MiBs).
  resolvers:
    type: list
    description: List of resolvers to be put into C(/etc/resolv.conf).
  routes:
    type: dict
    description: Dictionary that maps destinations to gateways, these will be set as static routes in
      the VM.
  spice_opts:
    type: str
    description: Addition options for SPICE-enabled KVM VMs.
  spice_password:
    type: str
    description: Password required to connect to SPICE. By default no password is set. Please note this
      can be read from the Global Zone.
  state:
    type: str
    default: running
    choices:
    - present
    - running
    - absent
    - deleted
    - stopped
    - created
    - restarted
    - rebooted
    description: States for the VM to be in. Please note that V(present), V(stopped) and V(restarted)
      operate on a VM that is currently provisioned. V(present) means that the VM will be created if it
      was absent, and that it will be in a running state. V(absent) will shutdown the zone before removing
      it. V(stopped) means the zone will be created if it does not exist already, before shutting it down.
  tmpfs:
    type: int
    description: Amount of memory (in MiBs) that will be available in the VM for the C(/tmp) filesystem.
  uuid:
    type: str
    description: UUID of the VM. Can either be a full UUID or V(*) for all VMs.
  vcpus:
    type: int
    description: Number of virtual CPUs for a KVM guest.
  vga:
    type: str
    description: Specify VGA emulation used by KVM VMs.
  virtio_txburst:
    type: int
    description: Number of packets that can be sent in a single flush of the tx queue of virtio NICs.
  virtio_txtimer:
    type: int
    description: Timeout (in nanoseconds) for the TX timer of virtio NICs.
  vnc_password:
    type: str
    description: Password required to connect to VNC. By default no password is set. Please note this
      can be read from the Global Zone.
  vnc_port:
    type: int
    description: TCP port to listen of the VNC server. Or set V(0) for random, or V(-1) to disable.
  zfs_data_compression:
    type: str
    description: Specifies compression algorithm used for this VMs data dataset. This option only has
      effect on delegated datasets.
  zfs_data_recsize:
    type: int
    description: Suggested block size (power of 2) for files in the delegated dataset's filesystem.
  zfs_filesystem_limit:
    type: int
    description: Maximum number of filesystems the VM can have.
  zfs_io_priority:
    type: int
    description: IO throttle priority value relative to other VMs.
  zfs_root_compression:
    type: str
    description: Specifies compression algorithm used for this VMs root dataset. This option only has
      effect on the zoneroot dataset.
  zfs_root_recsize:
    type: int
    description: Suggested block size (power of 2) for files in the zoneroot dataset's filesystem.
  zfs_snapshot_limit:
    type: int
    description: Number of snapshots the VM can have.
  zpool:
    type: str
    description: ZFS pool the VM's zone dataset will be created in.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create SmartOS zone\n  community.general.vmadm:\n    brand: joyent\n    state: present\n\
  \    alias: fw_zone\n    image_uuid: 95f265b8-96b2-11e6-9597-972f3af4b6d5\n    firewall_enabled: true\n\
  \    indestructible_zoneroot: true\n    nics:\n      - nic_tag: admin\n        ip: dhcp\n        primary:\
  \ true\n    internal_metadata:\n      root_pw: 'secret'\n    quota: 1\n\n- name: Delete a zone\n  community.general.vmadm:\n\
  \    alias: test_zone\n    state: deleted\n\n- name: Stop all zones\n  community.general.vmadm:\n  \
  \  uuid: '*'\n    state: stopped\n"
