name: uptimerobot
fqcn: community.general.uptimerobot
collection: community.general
short_description: Pause and start Uptime Robot monitoring
description: This module will let you start and pause Uptime Robot Monitoring
options:
  apikey:
    type: str
    required: true
    description: Uptime Robot API key.
  monitorid:
    type: str
    required: true
    description: ID of the monitor to check.
  state:
    type: str
    required: true
    choices:
    - started
    - paused
    description: Define whether or not the monitor should be running or paused.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Pause the monitor with an ID of 12345\n  community.general.uptimerobot:\n    monitorid:\
  \ 12345\n    apikey: 12345-1234512345\n    state: paused\n\n- name: Start the monitor with an ID of\
  \ 12345\n  community.general.uptimerobot:\n    monitorid: 12345\n    apikey: 12345-1234512345\n    state:\
  \ started\n"
