name: snmp_facts
fqcn: community.general.snmp_facts
collection: community.general
short_description: Retrieve facts for a device using SNMP
description: Retrieve facts for a device using SNMP, the facts will be inserted to the ansible_facts key.
options:
  authkey:
    type: str
    description: Authentication key. Required O(version=v3).
  community:
    type: str
    description: The SNMP community string, required if O(version) is V(v2) or V(v2c).
  host:
    type: str
    required: true
    description: Set to target SNMP server (normally C({{ inventory_hostname }})).
  integrity:
    type: str
    choices:
    - md5
    - sha
    description: Hashing algorithm. Required if O(version=v3).
  level:
    type: str
    choices:
    - authNoPriv
    - authPriv
    description: Authentication level. Required if O(version=v3).
  privacy:
    type: str
    choices:
    - aes
    - des
    description: Encryption algorithm. Required if O(level=authPriv).
  privkey:
    type: str
    description: Encryption key. Required if O(level=authPriv).
  retries:
    type: int
    description: Maximum number of request retries, 0 retries means just a single request.
  timeout:
    type: int
    description: Response timeout in seconds.
  username:
    type: str
    description: Username for SNMPv3. Required if O(version=v3).
  version:
    type: str
    required: true
    choices:
    - v2
    - v2c
    - v3
    description: SNMP Version to use, V(v2), V(v2c) or V(v3).
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather facts with SNMP version 2\n  community.general.snmp_facts:\n    host: '{{\
  \ inventory_hostname }}'\n    version: v2c\n    community: public\n  delegate_to: local\n\n- name: Gather\
  \ facts using SNMP version 3\n  community.general.snmp_facts:\n    host: '{{ inventory_hostname }}'\n\
  \    version: v3\n    level: authPriv\n    integrity: sha\n    privacy: aes\n    username: snmp-user\n\
  \    authkey: abc12345\n    privkey: def6789\n  delegate_to: localhost\n"
