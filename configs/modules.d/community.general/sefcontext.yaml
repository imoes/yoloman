name: sefcontext
fqcn: community.general.sefcontext
collection: community.general
short_description: Manages SELinux file context mapping definitions
description: Manages SELinux file context mapping definitions. Similar to the C(semanage fcontext) command.
options:
  ftype:
    type: str
    default: a
    choices:
    - a
    - b
    - c
    - d
    - f
    - l
    - p
    - s
    description: 'The file type that should have SELinux contexts applied. The following file type options
      are available: V(a) for all files, V(b) for block devices, V(c) for character devices, V(d) for
      directories, V(f) for regular files, V(l) for symbolic links, V(p) for named pipes, V(s) for socket
      files.'
  ignore_selinux_state:
    type: bool
    default: false
    description: Useful for scenarios (chrooted environment) that you can't get the real SELinux state.
  reload:
    type: bool
    default: true
    description: Reload SELinux policy after commit. Note that this does not apply SELinux file contexts
      to existing files.
  selevel:
    type: str
    aliases:
    - serange
    description: SELinux range for the specified O(target). Defaults to V(s0) for new file contexts and
      to existing value when modifying file contexts.
  setype:
    type: str
    description: SELinux type for the specified O(target).
  seuser:
    type: str
    description: SELinux user for the specified O(target). Defaults to V(system_u) for new file contexts
      and to existing value when modifying file contexts.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether the SELinux file context must be V(absent) or V(present). Specifying V(absent)
      without either O(setype) or O(substitute) deletes both SELinux type or path substitution mappings
      that match O(target).
  substitute:
    type: str
    aliases:
    - equal
    description: Path to use to substitute file context(s) for the specified O(target). The context labeling
      for the O(target) subtree is made equivalent to this path. This is also referred to as SELinux file
      context equivalence and it implements the C(equal) functionality of the SELinux management tools.
  target:
    type: str
    required: true
    aliases:
    - path
    description: Target path (expression).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Allow apache to modify files in /srv/git_repos\n  community.general.sefcontext:\n\
  \    target: '/srv/git_repos(/.*)?'\n    setype: httpd_sys_rw_content_t\n    state: present\n\n- name:\
  \ Substitute file contexts for path /srv/containers with /var/lib/containers\n  community.general.sefcontext:\n\
  \    target: /srv/containers\n    substitute: /var/lib/containers\n    state: present\n\n- name: Delete\
  \ file context path substitution for /srv/containers\n  community.general.sefcontext:\n    target: /srv/containers\n\
  \    substitute: /var/lib/containers\n    state: absent\n\n- name: Delete any file context mappings\
  \ for path /srv/git\n  community.general.sefcontext:\n    target: /srv/git\n    state: absent\n\n- name:\
  \ Apply new SELinux file context to filesystem\n  ansible.builtin.command: restorecon -irv /srv/git_repos\n"
