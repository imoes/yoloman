name: oneview_logical_interconnect_group
fqcn: community.general.oneview_logical_interconnect_group
collection: community.general
short_description: Manage OneView Logical Interconnect Group resources
description: Provides an interface to manage Logical Interconnect Group resources. Can create, update,
  or delete.
options:
  api_version:
    type: int
    description: OneView API Version.
  config:
    type: path
    description: Path to a JSON configuration file containing the OneView client configuration. The configuration
      file is optional and when used should be present in the host running the ansible commands. If the
      file path is not provided, the configuration will be loaded from environment variables. For links
      to example configuration files or how to use the environment variables verify the notes section.
  data:
    type: dict
    required: true
    description: List with the Logical Interconnect Group properties.
  hostname:
    type: str
    description: IP address or hostname for the appliance.
  image_streamer_hostname:
    type: str
    description: IP address or hostname for the HPE Image Streamer REST API.
  password:
    type: str
    description: Password for API authentication.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Indicates the desired state for the Logical Interconnect Group resource. V(absent) will
      remove the resource from OneView, if it exists. V(present) will ensure data properties are compliant
      with OneView.
  username:
    type: str
    description: Username for API authentication.
  validate_etag:
    type: bool
    default: true
    description: When the ETag Validation is enabled, the request will be conditionally processed only
      if the current ETag for the resource matches the ETag provided in the data.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure that the Logical Interconnect Group is present\n  community.general.oneview_logical_interconnect_group:\n\
  \    config: /etc/oneview/oneview_config.json\n    state: present\n    data:\n      name: Test Logical\
  \ Interconnect Group\n      uplinkSets: []\n      enclosureType: C7000\n      interconnectMapTemplate:\n\
  \        interconnectMapEntryTemplates:\n          - logicalDownlinkUri: ~\n            logicalLocation:\n\
  \                locationEntries:\n                    - relativeValue: 1\n                      type:\
  \ Bay\n                    - relativeValue: 1\n                      type: Enclosure\n            permittedInterconnectTypeName:\
  \ HP VC Flex-10/10D Module\n            # Alternatively you can inform permittedInterconnectTypeUri\n\
  \  delegate_to: localhost\n\n- name: Ensure that the Logical Interconnect Group has the specified scopes\n\
  \  community.general.oneview_logical_interconnect_group:\n    config: /etc/oneview/oneview_config.json\n\
  \    state: present\n    data:\n      name: Test Logical Interconnect Group\n      scopeUris:\n    \
  \    - /rest/scopes/00SC123456\n        - /rest/scopes/01SC123456\n  delegate_to: localhost\n\n- name:\
  \ Ensure that the Logical Interconnect Group is present with name 'Test'\n  community.general.oneview_logical_interconnect_group:\n\
  \    config: /etc/oneview/oneview_config.json\n    state: present\n    data:\n      name: New Logical\
  \ Interconnect Group\n      newName: Test\n  delegate_to: localhost\n\n- name: Ensure that the Logical\
  \ Interconnect Group is absent\n  community.general.oneview_logical_interconnect_group:\n    config:\
  \ /etc/oneview/oneview_config.json\n    state: absent\n    data:\n      name: New Logical Interconnect\
  \ Group\n  delegate_to: localhost\n"
