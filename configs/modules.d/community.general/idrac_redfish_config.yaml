name: idrac_redfish_config
fqcn: community.general.idrac_redfish_config
collection: community.general
short_description: Manages servers through iDRAC using Dell Redfish APIs
description: For use with Dell iDRAC operations that require Redfish OEM extensions Builds Redfish URIs
  locally and sends them to remote iDRAC controllers to set or update a configuration attribute.
options:
  auth_token:
    type: str
    description: Security token for authenticating to iDRAC.
  baseuri:
    type: str
    required: true
    description: Base URI of iDRAC.
  category:
    type: str
    required: true
    description: Category to execute on iDRAC.
  command:
    type: list
    required: true
    description: List of commands to execute on iDRAC. V(SetManagerAttributes), V(SetLifecycleControllerAttributes)
      and V(SetSystemAttributes) are mutually exclusive commands when O(category) is V(Manager).
  manager_attributes:
    type: dict
    default: {}
    description: Dictionary of iDRAC attribute name and value pairs to update.
  password:
    type: str
    description: Password for authenticating to iDRAC.
  resource_id:
    type: str
    description: ID of the System, Manager or Chassis to modify.
  timeout:
    type: int
    default: 10
    description: Timeout in seconds for HTTP requests to iDRAC.
  username:
    type: str
    description: Username for authenticating to iDRAC.
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Enable NTP and set NTP server and Time zone attributes in iDRAC\n    community.general.idrac_redfish_config:\n\
  \      category: Manager\n      command: SetManagerAttributes\n      resource_id: iDRAC.Embedded.1\n\
  \      manager_attributes:\n        NTPConfigGroup.1.NTPEnable: \"Enabled\"\n        NTPConfigGroup.1.NTP1:\
  \ \"{{ ntpserver1 }}\"\n        Time.1.Timezone: \"{{ timezone }}\"\n      baseuri: \"{{ baseuri }}\"\
  \n      username: \"{{ username}}\"\n      password: \"{{ password }}\"\n\n  - name: Enable Syslog and\
  \ set Syslog servers in iDRAC\n    community.general.idrac_redfish_config:\n      category: Manager\n\
  \      command: SetManagerAttributes\n      resource_id: iDRAC.Embedded.1\n      manager_attributes:\n\
  \        SysLog.1.SysLogEnable: \"Enabled\"\n        SysLog.1.Server1: \"{{ syslog_server1 }}\"\n  \
  \      SysLog.1.Server2: \"{{ syslog_server2 }}\"\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username}}\"\n      password: \"{{ password }}\"\n\n  - name: Configure SNMP community string,\
  \ port, protocol and trap format\n    community.general.idrac_redfish_config:\n      category: Manager\n\
  \      command: SetManagerAttributes\n      resource_id: iDRAC.Embedded.1\n      manager_attributes:\n\
  \        SNMP.1.AgentEnable: \"Enabled\"\n        SNMP.1.AgentCommunity: \"public_community_string\"\
  \n        SNMP.1.TrapFormat: \"SNMPv1\"\n        SNMP.1.SNMPProtocol: \"All\"\n        SNMP.1.DiscoveryPort:\
  \ 161\n        SNMP.1.AlertPort: 162\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username}}\"\
  \n      password: \"{{ password }}\"\n\n  - name: Enable CSIOR\n    community.general.idrac_redfish_config:\n\
  \      category: Manager\n      command: SetLifecycleControllerAttributes\n      resource_id: iDRAC.Embedded.1\n\
  \      manager_attributes:\n        LCAttributes.1.CollectSystemInventoryOnRestart: \"Enabled\"\n  \
  \    baseuri: \"{{ baseuri }}\"\n      username: \"{{ username}}\"\n      password: \"{{ password }}\"\
  \n\n  - name: Set Power Supply Redundancy Policy to A/B Grid Redundant\n    community.general.idrac_redfish_config:\n\
  \      category: Manager\n      command: SetSystemAttributes\n      resource_id: iDRAC.Embedded.1\n\
  \      manager_attributes:\n        ServerPwr.1.PSRedPolicy: \"A/B Grid Redundant\"\n      baseuri:\
  \ \"{{ baseuri }}\"\n      username: \"{{ username}}\"\n      password: \"{{ password }}\"\n"
