name: irc
fqcn: community.general.irc
collection: community.general
short_description: Send a message to an IRC channel or a nick
description: Send a message to an IRC channel or a nick. This is a very simplistic implementation.
options:
  channel:
    type: str
    description: Channel name.  One of nick_to or channel needs to be set.  When both are set, the message
      will be sent to both of them.
  color:
    type: str
    default: none
    choices:
    - none
    - white
    - black
    - blue
    - green
    - red
    - brown
    - purple
    - orange
    - yellow
    - light_green
    - teal
    - light_cyan
    - light_blue
    - pink
    - gray
    - light_gray
    aliases:
    - colour
    description: Text color for the message.
  key:
    type: str
    description: Channel key
  msg:
    type: str
    required: true
    description: The message body.
  nick:
    type: str
    default: ansible
    description: Nickname to send the message from. May be shortened, depending on server's NICKLEN setting.
  nick_to:
    type: list
    description: A list of nicknames to send the message to. One of nick_to or channel needs to be set.  When
      both are defined, the message will be sent to both of them.
  part:
    type: bool
    default: true
    description: Designates whether user should part from channel after sending message or not. Useful
      for when using a faux bot and not wanting join/parts between messages.
  passwd:
    type: str
    description: Server password
  port:
    type: int
    default: 6667
    description: IRC server port number
  server:
    type: str
    default: localhost
    description: IRC server name/address
  style:
    type: str
    default: none
    choices:
    - bold
    - underline
    - reverse
    - italic
    - none
    description: Text style for the message. Note italic does not work on some clients
  timeout:
    type: int
    default: 30
    description: Timeout to use while waiting for successful registration and join messages, this is to
      prevent an endless loop
  topic:
    type: str
    description: Set the channel topic
  use_tls:
    type: bool
    default: false
    aliases:
    - use_ssl
    description: Designates whether TLS/SSL should be used when connecting to the IRC server O(use_tls)
      is available since community.general 8.1.0, before the option was exlusively called O(use_ssl).
      The latter is now an alias of O(use_tls). B(Note:) for security reasons, you should always set O(use_tls=true)
      and O(validate_certs=true) whenever possible.
  validate_certs:
    type: bool
    default: false
    description: If set to V(false), the SSL certificates will not be validated. This should always be
      set to V(true). Using V(false) is unsafe and should only be done if the network between between
      Ansible and the IRC server is known to be safe. B(Note:) for security reasons, you should always
      set O(use_tls=true) and O(validate_certs=true) whenever possible.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Send a message to an IRC channel from nick ansible\n  community.general.irc:\n  \
  \  server: irc.example.net\n    use_tls: true\n    validate_certs: true\n    channel: #t1\n    msg:\
  \ Hello world\n\n- name: Send a message to an IRC channel\n  local_action:\n    module: irc\n    port:\
  \ 6669\n    server: irc.example.net\n    use_tls: true\n    validate_certs: true\n    channel: #t1\n\
  \    msg: 'All finished at {{ ansible_date_time.iso8601 }}'\n    color: red\n    nick: ansibleIRC\n\n\
  - name: Send a message to an IRC channel\n  local_action:\n    module: irc\n    port: 6669\n    server:\
  \ irc.example.net\n    use_tls: true\n    validate_certs: true\n    channel: #t1\n    nick_to:\n   \
  \   - nick1\n      - nick2\n    msg: 'All finished at {{ ansible_date_time.iso8601 }}'\n    color: red\n\
  \    nick: ansibleIRC\n"
