name: ovh_monthly_billing
fqcn: community.general.ovh_monthly_billing
collection: community.general
short_description: Manage OVH monthly billing
description: Enable monthly billing on OVH cloud instances (be aware OVH does not allow to disable it).
options:
  application_key:
    type: str
    description: The applicationKey to use
  application_secret:
    type: str
    description: The application secret to use
  consumer_key:
    type: str
    description: The consumer key to use
  endpoint:
    type: str
    description: The endpoint to use (for instance ovh-eu)
  instance_id:
    type: str
    required: true
    description: ID of the instance, get it with U(https://api.ovh.com/console/#/cloud/project/%7BserviceName%7D/instance#GET)
  project_id:
    type: str
    required: true
    description: ID of the project, get it with U(https://api.ovh.com/console/#/cloud/project#GET)
writes: true
runtime: starlark
source: translated
examples: "\n- name: Basic usage, using auth from /etc/ovh.conf\n  community.general.ovh_monthly_billing:\n\
  \    project_id: 0c727a20aa144485b70c44dee9123b46\n    instance_id: 8fa89ad2-8f08-4220-9fa4-9695ea23e948\n\
  \n# Get openstack cloud ID and instance ID, OVH use them in its API\n- name: Get openstack cloud ID\
  \ and instance ID\n  os_server_info:\n    cloud: myProjectName\n    region_name: myRegionName\n    server:\
  \ myServerName\n  register: openstack_servers\n\n- name: Use IDs\n  community.general.ovh_monthly_billing:\n\
  \    project_id: \"{{ openstack_servers.0.tenant_id }}\"\n    instance_id: \"{{ openstack_servers.0.id\
  \ }}\"\n    application_key: yourkey\n    application_secret: yoursecret\n    consumer_key: yourconsumerkey\n"
