name: homebrew_tap
fqcn: community.general.homebrew_tap
collection: community.general
short_description: Tap a Homebrew repository
description: Tap external Homebrew repositories.
options:
  name:
    type: list
    required: true
    aliases:
    - tap
    description: The GitHub user/organization repository to tap.
  path:
    type: path
    default: /usr/local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin
    description: A V(:) separated list of paths to search for C(brew) executable.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: state of the repository.
  url:
    type: str
    description: The optional git URL of the repository to tap. The URL is not assumed to be on GitHub,
      and the protocol doesn't have to be HTTP. Any location and protocol that git can handle is fine.
      O(name) option may not be a list of multiple taps (but a single tap instead) when this option is
      provided.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Tap a Homebrew repository, state present\n  community.general.homebrew_tap:\n   \
  \ name: homebrew/dupes\n\n- name: Tap a Homebrew repository, state absent\n  community.general.homebrew_tap:\n\
  \    name: homebrew/dupes\n    state: absent\n\n- name: Tap a Homebrew repository, state present\n \
  \ community.general.homebrew_tap:\n    name: homebrew/dupes,homebrew/science\n    state: present\n\n\
  - name: Tap a Homebrew repository using url, state present\n  community.general.homebrew_tap:\n    name:\
  \ telemachus/brew\n    url: 'https://bitbucket.org/telemachus/brew'\n"
