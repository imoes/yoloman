name: xenserver_facts
fqcn: community.general.xenserver_facts
collection: community.general
short_description: Get facts reported on xenserver
description: Reads data out of XenAPI, can be used instead of multiple xe commands.
options: {}
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather facts from xenserver\n  community.general.xenserver_facts:\n\n- name: Print\
  \ running VMs\n  ansible.builtin.debug:\n    msg: \"{{ item }}\"\n  with_items: \"{{ xs_vms.keys() }}\"\
  \n  when: xs_vms[item]['power_state'] == \"Running\"\n\n# Which will print:\n#\n# TASK: [Print running\
  \ VMs] ***********************************************************\n# skipping: [10.13.0.22] => (item=CentOS\
  \ 4.7 (32-bit))\n# ok: [10.13.0.22] => (item=Control domain on host: 10.0.13.22) => {\n#     \"item\"\
  : \"Control domain on host: 10.0.13.22\",\n#     \"msg\": \"Control domain on host: 10.0.13.22\"\n#\
  \ }\n"
