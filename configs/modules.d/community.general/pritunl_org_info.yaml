name: pritunl_org_info
fqcn: community.general.pritunl_org_info
collection: community.general
short_description: List Pritunl Organizations using the Pritunl API
description: A module to list Pritunl organizations using the Pritunl API.
options:
  organization:
    type: str
    aliases:
    - org
    description: Name of the Pritunl organization to search for. If none provided, the module will return
      all Pritunl organizations.
  pritunl_api_secret:
    type: str
    required: true
    description: API Secret found in Administrators > USERNAME > API Secret.
  pritunl_api_token:
    type: str
    required: true
    description: API Token of a Pritunl admin user. It needs to be enabled in Administrators > USERNAME
      > Enable Token Authentication.
  pritunl_url:
    type: str
    required: true
    description: URL and port of the Pritunl server on which the API is enabled.
  validate_certs:
    type: bool
    default: true
    description: If certificates should be validated or not. This should never be set to V(false), except
      if you are very sure that your connection to the server can not be subject to a Man In The Middle
      attack.
writes: false
runtime: starlark
source: translated
examples: "\n- name: List all existing Pritunl organizations\n  community.general.pritunl_org_info:\n\n\
  - name: Search for an organization named MyOrg\n  community.general.pritunl_user_info:\n    organization:\
  \ MyOrg\n"
