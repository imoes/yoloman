name: gitlab_label
fqcn: community.general.gitlab_label
collection: community.general
short_description: Creates/updates/deletes GitLab Labels belonging to project or group.
description: When a label does not exist, it will be created. When a label does exist, its value will
  be updated when the values are different. Labels can be purged.
options:
  api_job_token:
    type: str
    description: GitLab CI job token for logging in.
  api_oauth_token:
    type: str
    description: GitLab OAuth token for logging in.
  api_password:
    type: str
    description: The password to use for authentication against the API.
  api_token:
    type: str
    description: GitLab access token with API permissions.
  api_url:
    type: str
    description: The resolvable endpoint for the API.
  api_username:
    type: str
    description: The username to use for authentication against the API.
  ca_path:
    type: str
    description: The CA certificates bundle to use to verify GitLab server certificate.
  group:
    type: str
    description: The path of the group.  Either this or O(project) is required.
  labels:
    type: list
    default: []
    description: A list of dictionaries that represents gitlab project's or group's labels.
  project:
    type: str
    description: The path and name of the project.  Either this or O(group) is required.
  purge:
    type: bool
    default: false
    description: When set to V(true), delete all labels which are not mentioned in the task.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Create or delete project or group label.
  validate_certs:
    type: bool
    default: true
    description: Whether or not to validate SSL certs when supplying a HTTPS endpoint.
writes: true
runtime: starlark
source: translated
examples: "\n# same project's task can be executed for group\n- name: Create one Label\n  community.general.gitlab_label:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    project: \"group1/project1\"\
  \n    labels:\n      - name: label_one\n        color: \"#123456\"\n    state: present\n\n- name: Create\
  \ many group labels\n  community.general.gitlab_label:\n    api_url: https://gitlab.com\n    api_token:\
  \ secret_access_token\n    group: \"group1\"\n    labels:\n      - name: label_one\n        color: \"\
  #123456\"\n        description: this is a label\n        priority: 20\n      - name: label_two\n   \
  \     color: \"#554422\"\n    state: present\n\n- name: Create many project labels\n  community.general.gitlab_label:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    project: \"group1/project1\"\
  \n    labels:\n      - name: label_one\n        color: \"#123456\"\n        description: this is a label\n\
  \        priority: 20\n      - name: label_two\n        color: \"#554422\"\n    state: present\n\n-\
  \ name: Set or update some labels\n  community.general.gitlab_label:\n    api_url: https://gitlab.com\n\
  \    api_token: secret_access_token\n    project: \"group1/project1\"\n    labels:\n      - name: label_one\n\
  \        color: \"#224488\"\n    state: present\n\n- name: Add label in check mode\n  community.general.gitlab_label:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    project: \"group1/project1\"\
  \n    labels:\n      - name: label_one\n        color: \"#224488\"\n    check_mode: true\n\n- name:\
  \ Delete Label\n  community.general.gitlab_label:\n    api_url: https://gitlab.com\n    api_token: secret_access_token\n\
  \    project: \"group1/project1\"\n    labels:\n      - name: label_one\n    state: absent\n\n- name:\
  \ Change Label name\n  community.general.gitlab_label:\n    api_url: https://gitlab.com\n    api_token:\
  \ secret_access_token\n    project: \"group1/project1\"\n    labels:\n      - name: label_one\n    \
  \    new_name: label_two\n    state: absent\n\n- name: Purge all labels\n  community.general.gitlab_label:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    project: \"group1/project1\"\
  \n    purge: true\n\n- name: Delete many labels\n  community.general.gitlab_label:\n    api_url: https://gitlab.com\n\
  \    api_token: secret_access_token\n    project: \"group1/project1\"\n    state: absent\n    labels:\n\
  \      - name: label-abc123\n      - name: label-two\n"
