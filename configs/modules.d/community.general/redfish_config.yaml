name: redfish_config
fqcn: community.general.redfish_config
collection: community.general
short_description: Manages Out-Of-Band controllers using Redfish APIs
description: Builds Redfish URIs locally and sends them to remote OOB controllers to set or update a configuration
  attribute. Manages BIOS configuration settings. Manages OOB controller configuration settings.
options:
  auth_token:
    type: str
    description: Security token for authenticating to OOB controller.
  baseuri:
    type: str
    required: true
    description: Base URI of OOB controller.
  bios_attributes:
    type: dict
    default: {}
    description: Dictionary of BIOS attributes to update.
  boot_order:
    type: list
    default: []
    description: List of BootOptionReference strings specifying the BootOrder.
  category:
    type: str
    required: true
    description: Category to execute on OOB controller.
  command:
    type: list
    required: true
    description: List of commands to execute on OOB controller.
  hostinterface_config:
    type: dict
    default: {}
    description: Setting dict of HostInterface on OOB controller.
  hostinterface_id:
    type: str
    description: Redfish HostInterface instance ID if multiple HostInterfaces are present.
  network_protocols:
    type: dict
    default: {}
    description: Setting dict of manager services to update.
  nic_addr:
    type: str
    default: 'null'
    description: EthernetInterface Address string on OOB controller.
  nic_config:
    type: dict
    default: {}
    description: Setting dict of EthernetInterface on OOB controller.
  password:
    type: str
    description: Password for authenticating to OOB controller.
  resource_id:
    type: str
    description: ID of the System, Manager or Chassis to modify.
  secure_boot_enable:
    type: bool
    default: true
    description: Setting parameter to enable or disable SecureBoot.
  sessions_config:
    type: dict
    default: {}
    description: Setting dict of Sessions.
  storage_subsystem_id:
    type: str
    default: ''
    description: Id of the Storage Subsystem on which the volume is to be created.
  strip_etag_quotes:
    type: bool
    default: false
    description: Removes surrounding quotes of etag used in C(If-Match) header of C(PATCH) requests. Only
      use this option to resolve bad vendor implementation where C(If-Match) only matches the unquoted
      etag string.
  timeout:
    type: int
    description: Timeout in seconds for HTTP requests to OOB controller. The default value for this param
      is C(10) but that is being deprecated and it will be replaced with C(60) in community.general 9.0.0.
  username:
    type: str
    description: Username for authenticating to OOB controller.
  volume_details:
    type: dict
    default: {}
    description: Setting dict of volume to be created.
  volume_ids:
    type: list
    default: []
    description: List of IDs of volumes to be deleted.
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Set BootMode to UEFI\n    community.general.redfish_config:\n      category: Systems\n\
  \      command: SetBiosAttributes\n      resource_id: 437XR1138R2\n      bios_attributes:\n        BootMode:\
  \ \"Uefi\"\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"\
  {{ password }}\"\n\n  - name: Set multiple BootMode attributes\n    community.general.redfish_config:\n\
  \      category: Systems\n      command: SetBiosAttributes\n      resource_id: 437XR1138R2\n      bios_attributes:\n\
  \        BootMode: \"Bios\"\n        OneTimeBootMode: \"Enabled\"\n        BootSeqRetry: \"Enabled\"\
  \n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n\n  - name: Enable PXE Boot for NIC1\n    community.general.redfish_config:\n      category:\
  \ Systems\n      command: SetBiosAttributes\n      resource_id: 437XR1138R2\n      bios_attributes:\n\
  \        PxeDev1EnDis: Enabled\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\
  \n      password: \"{{ password }}\"\n\n  - name: Set BIOS default settings with a timeout of 20 seconds\n\
  \    community.general.redfish_config:\n      category: Systems\n      command: SetBiosDefaultSettings\n\
  \      resource_id: 437XR1138R2\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\
  \n      password: \"{{ password }}\"\n      timeout: 20\n\n  - name: Set boot order\n    community.general.redfish_config:\n\
  \      category: Systems\n      command: SetBootOrder\n      boot_order:\n        - Boot0002\n     \
  \   - Boot0001\n        - Boot0000\n        - Boot0003\n        - Boot0004\n      baseuri: \"{{ baseuri\
  \ }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password }}\"\n\n  - name: Set boot\
  \ order to the default\n    community.general.redfish_config:\n      category: Systems\n      command:\
  \ SetDefaultBootOrder\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n\n  - name: Set Manager Network Protocols\n    community.general.redfish_config:\n\
  \      category: Manager\n      command: SetNetworkProtocols\n      network_protocols:\n        SNMP:\n\
  \          ProtocolEnabled: true\n          Port: 161\n        HTTP:\n          ProtocolEnabled: false\n\
  \          Port: 8080\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n\n  - name: Set Manager NIC\n    community.general.redfish_config:\n      category:\
  \ Manager\n      command: SetManagerNic\n      nic_config:\n        DHCPv4:\n          DHCPEnabled:\
  \ false\n        IPv4StaticAddresses:\n          Address: 192.168.1.3\n          Gateway: 192.168.1.1\n\
  \          SubnetMask: 255.255.255.0\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username\
  \ }}\"\n      password: \"{{ password }}\"\n\n  - name: Disable Host Interface\n    community.general.redfish_config:\n\
  \      category: Manager\n      command: SetHostInterface\n      hostinterface_config:\n        InterfaceEnabled:\
  \ false\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{\
  \ password }}\"\n\n  - name: Enable Host Interface for HostInterface resource ID '2'\n    community.general.redfish_config:\n\
  \      category: Manager\n      command: SetHostInterface\n      hostinterface_config:\n        InterfaceEnabled:\
  \ true\n      hostinterface_id: \"2\"\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username\
  \ }}\"\n      password: \"{{ password }}\"\n\n  - name: Set SessionService Session Timeout to 30 minutes\n\
  \    community.general.redfish_config:\n      category: Sessions\n      command: SetSessionService\n\
  \      sessions_config:\n        SessionTimeout: 1800\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n\n  - name: Enable SecureBoot\n    community.general.redfish_config:\n\
  \      category: Systems\n      command: EnableSecureBoot\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n\n  - name: Set SecureBoot\n    community.general.redfish_config:\n\
  \      category: Systems\n      command: SetSecureBoot\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      secure_boot_enable: True\n\n  - name:\
  \ Delete All Volumes\n    community.general.redfish_config:\n      category: Systems\n      command:\
  \ DeleteVolumes\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n      storage_subsystem_id: \"DExxxxxx\"\n      volume_ids: [\"volume1\", \"volume2\"\
  ]\n\n  - name: Create Volume\n    community.general.redfish_config:\n      category: Systems\n     \
  \ command: CreateVolume\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n    \
  \  password: \"{{ password }}\"\n      storage_subsystem_id: \"DExxxxxx\"\n      volume_details:\n \
  \       Name: \"MR Volume\"\n        RAIDType: \"RAID0\"\n        Drives:\n          - \"/redfish/v1/Systems/1/Storage/DE00B000/Drives/1\"\
  \n"
