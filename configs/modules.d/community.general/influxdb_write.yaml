name: influxdb_write
fqcn: community.general.influxdb_write
collection: community.general
short_description: Write data points into InfluxDB
description: Write data points into InfluxDB.
options:
  data_points:
    type: list
    required: true
    description: Data points as dict to write into the database.
  database_name:
    type: str
    required: true
    description: Name of the database.
  hostname:
    type: str
    default: localhost
    description: The hostname or IP address on which InfluxDB server is listening.
  password:
    type: str
    default: root
    aliases:
    - login_password
    description: Password that will be used to authenticate against InfluxDB server.
  path:
    type: str
    default: ''
    description: The path on which InfluxDB server is accessible. Only available when using python-influxdb
      >= 5.1.0.
  port:
    type: int
    default: 8086
    description: The port on which InfluxDB server is listening.
  proxies:
    type: dict
    default: {}
    description: HTTP(S) proxy to use for Requests to connect to InfluxDB server.
  retries:
    type: int
    default: 3
    description: Number of retries client will try before aborting. V(0) indicates try until success.
      Only available when using python-influxdb >= 4.1.0.
  ssl:
    type: bool
    default: false
    description: Use https instead of http to connect to InfluxDB server.
  timeout:
    type: int
    description: Number of seconds Requests will wait for client to establish a connection.
  udp_port:
    type: int
    default: 4444
    description: UDP port to connect to InfluxDB server.
  use_udp:
    type: bool
    default: false
    description: Use UDP to connect to InfluxDB server.
  username:
    type: str
    default: root
    aliases:
    - login_username
    description: Username that will be used to authenticate against InfluxDB server.
  validate_certs:
    type: bool
    default: true
    description: If set to V(false), the SSL certificates will not be validated. This should only set
      to V(false) used on personally controlled sites using self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Write points into database\n  community.general.influxdb_write:\n      hostname:\
  \ \"{{influxdb_ip_address}}\"\n      database_name: \"{{influxdb_database_name}}\"\n      data_points:\n\
  \        - measurement: connections\n          tags:\n            host: server01\n            region:\
  \ us-west\n          time: \"{{ ansible_date_time.iso8601 }}\"\n          fields:\n            value:\
  \ 2000\n        - measurement: connections\n          tags:\n            host: server02\n          \
  \  region: us-east\n          time: \"{{ ansible_date_time.iso8601 }}\"\n          fields:\n       \
  \     value: 3000\n"
