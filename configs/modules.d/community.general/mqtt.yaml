name: mqtt
fqcn: community.general.mqtt
collection: community.general
short_description: Publish a message on an MQTT topic for the IoT
description: Publish a message on an MQTT topic.
options:
  ca_cert:
    type: path
    aliases:
    - ca_certs
    description: The path to the Certificate Authority certificate files that are to be treated as trusted
      by this client. If this is the only option given then the client will operate in a similar manner
      to a web browser. That is to say it will require the broker to have a certificate signed by the
      Certificate Authorities in ca_certs and will communicate using TLS v1, but will not attempt any
      form of authentication. This provides basic network encryption but may not be sufficient depending
      on how the broker is configured.
  client_cert:
    type: path
    aliases:
    - certfile
    description: The path pointing to the PEM encoded client certificate. If this is not None it will
      be used as client information for TLS based authentication. Support for this feature is broker dependent.
  client_id:
    type: str
    description: MQTT client identifier If not specified, a value C(hostname + pid) will be used.
  client_key:
    type: path
    aliases:
    - keyfile
    description: The path pointing to the PEM encoded client private key. If this is not None it will
      be used as client information for TLS based authentication. Support for this feature is broker dependent.
  password:
    type: str
    description: Password for O(username) to authenticate against the broker.
  payload:
    type: str
    required: true
    description: Payload. The special string V("None") may be used to send a NULL (that is, empty) payload
      which is useful to simply notify with the O(topic) or to clear previously retained messages.
  port:
    type: int
    default: 1883
    description: MQTT broker port number
  qos:
    type: str
    default: '0'
    choices:
    - '0'
    - '1'
    - '2'
    description: QoS (Quality of Service)
  retain:
    type: bool
    default: false
    description: Setting this flag causes the broker to retain (i.e. keep) the message so that applications
      that subsequently subscribe to the topic can received the last retained message immediately.
  server:
    type: str
    default: localhost
    description: MQTT broker address/name
  tls_version:
    type: str
    choices:
    - tlsv1.1
    - tlsv1.2
    description: Specifies the version of the SSL/TLS protocol to be used. By default (if the python version
      supports it) the highest TLS version is detected. If unavailable, TLS v1 is used.
  topic:
    type: str
    required: true
    description: MQTT topic name
  username:
    type: str
    description: Username to authenticate against the broker.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Publish a message on an MQTT topic\n  community.general.mqtt:\n    topic: 'service/ansible/{{\
  \ ansible_hostname }}'\n    payload: 'Hello at {{ ansible_date_time.iso8601 }}'\n    qos: 0\n    retain:\
  \ false\n    client_id: ans001\n  delegate_to: localhost\n"
