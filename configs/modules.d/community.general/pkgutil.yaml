name: pkgutil
fqcn: community.general.pkgutil
collection: community.general
short_description: OpenCSW package management on Solaris
description: This module installs, updates and removes packages from the OpenCSW project for Solaris.
  Unlike the M(community.general.svr4pkg) module, it will resolve and download dependencies. See U(https://www.opencsw.org/)
  for more information about the project.
options:
  force:
    type: bool
    default: false
    description: To allow the update process to downgrade packages to match what is present in the repository,
      set this to V(true). This is useful for rolling back to stable from testing, or similar operations.
  name:
    type: list
    required: true
    aliases:
    - pkg
    description: The name of the package. When using O(state=latest), this can be V('*'), which updates
      all installed packages managed by pkgutil.
  site:
    type: str
    description: The repository path to install the package from. Its global definition is in C(/etc/opt/csw/pkgutil.conf).
  state:
    type: str
    required: true
    choices:
    - absent
    - installed
    - latest
    - present
    - removed
    description: Whether to install (V(present)/V(installed)), or remove (V(absent)/V(removed)) packages.
      The upgrade (V(latest)) operation will update/install the packages to the latest version available.
  update_catalog:
    type: bool
    default: false
    description: If you always want to refresh your catalog from the mirror, even when it's not stale,
      set this to V(true).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install a package\n  community.general.pkgutil:\n    name: CSWcommon\n    state:\
  \ present\n\n- name: Install a package from a specific repository\n  community.general.pkgutil:\n  \
  \  name: CSWnrpe\n    site: ftp://myinternal.repo/opencsw/kiel\n    state: latest\n\n- name: Remove\
  \ a package\n  community.general.pkgutil:\n    name: CSWtop\n    state: absent\n\n- name: Install several\
  \ packages\n  community.general.pkgutil:\n    name:\n    - CSWsudo\n    - CSWtop\n    state: present\n\
  \n- name: Update all packages\n  community.general.pkgutil:\n    name: '*'\n    state: latest\n\n- name:\
  \ Update all packages and force versions to match latest in catalog\n  community.general.pkgutil:\n\
  \    name: '*'\n    state: latest\n    force: true\n"
