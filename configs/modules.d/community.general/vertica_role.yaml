name: vertica_role
fqcn: community.general.vertica_role
collection: community.general
short_description: Adds or removes Vertica database roles and assigns roles to them
description: Adds or removes Vertica database role and, optionally, assign other roles.
options:
  assigned_roles:
    type: str
    aliases:
    - assigned_role
    description: Comma separated list of roles to assign to the role.
  cluster:
    type: str
    default: localhost
    description: Name of the Vertica cluster.
  db:
    type: str
    description: Name of the Vertica database.
  login_password:
    type: str
    description: The password used to authenticate with.
  login_user:
    type: str
    default: dbadmin
    description: The username used to authenticate with.
  port:
    type: str
    default: '5433'
    description: Vertica cluster port to connect to.
  role:
    type: str
    required: true
    aliases:
    - name
    description: Name of the role to add or remove.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether to create V(present), drop V(absent) or lock V(locked) a role.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Creating a new vertica role\n  community.general.vertica_role: name=role_name db=db_name\
  \ state=present\n\n- name: Creating a new vertica role with other role assigned\n  community.general.vertica_role:\
  \ name=role_name assigned_role=other_role_name state=present\n"
