name: ipa_role
fqcn: community.general.ipa_role
collection: community.general
short_description: Manage FreeIPA role
description: Add, modify and delete a role within FreeIPA server using FreeIPA API.
options:
  cn:
    type: str
    required: true
    aliases:
    - name
    description: Role name. Can not be changed as it is the unique identifier.
  description:
    type: str
    description: A description of this role-group.
  group:
    type: list
    description: List of group names assign to this role. If an empty list is passed all assigned groups
      will be unassigned from the role. If option is omitted groups will not be checked or changed. If
      option is passed all assigned groups that are not passed will be unassigned from the role.
  host:
    type: list
    description: List of host names to assign. If an empty list is passed all assigned hosts will be unassigned
      from the role. If option is omitted hosts will not be checked or changed. If option is passed all
      assigned hosts that are not passed will be unassigned from the role.
  hostgroup:
    type: list
    description: List of host group names to assign. If an empty list is passed all assigned host groups
      will be removed from the role. If option is omitted host groups will not be checked or changed.
      If option is passed all assigned hostgroups that are not passed will be unassigned from the role.
  ipa_host:
    type: str
    default: ipa.example.com
    description: IP or hostname of IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_HOST) will be used instead. If both the environment variable E(IPA_HOST)
      and the value are not specified in the task, then DNS will be used to try to discover the FreeIPA
      server. The relevant entry needed in FreeIPA is the C(ipa-ca) entry. If neither the DNS entry, nor
      the environment E(IPA_HOST), nor the value are available in the task, then the default value will
      be used.
  ipa_pass:
    type: str
    description: Password of administrative user. If the value is not specified in the task, the value
      of environment variable E(IPA_PASS) will be used instead. Note that if the C(urllib_gssapi) library
      is available, it is possible to use GSSAPI to authenticate to FreeIPA. If the environment variable
      E(KRB5CCNAME) is available, the module will use this kerberos credentials cache to authenticate
      to the FreeIPA server. If the environment variable E(KRB5_CLIENT_KTNAME) is available, and E(KRB5CCNAME)
      is not; the module will use this kerberos keytab to authenticate. If GSSAPI is not available, the
      usage of O(ipa_pass) is required.
  ipa_port:
    type: int
    default: 443
    description: Port of FreeIPA / IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PORT) will be used instead. If both the environment variable E(IPA_PORT)
      and the value are not specified in the task, then default value is set.
  ipa_prot:
    type: str
    default: https
    choices:
    - http
    - https
    description: Protocol used by IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PROT) will be used instead. If both the environment variable E(IPA_PROT)
      and the value are not specified in the task, then default value is set.
  ipa_timeout:
    type: int
    default: 10
    description: Specifies idle timeout (in seconds) for the connection. For bulk operations, you may
      want to increase this in order to avoid timeout from IPA server. If the value is not specified in
      the task, the value of environment variable E(IPA_TIMEOUT) will be used instead. If both the environment
      variable E(IPA_TIMEOUT) and the value are not specified in the task, then default value is set.
  ipa_user:
    type: str
    default: admin
    description: Administrative account used on IPA server. If the value is not specified in the task,
      the value of environment variable E(IPA_USER) will be used instead. If both the environment variable
      E(IPA_USER) and the value are not specified in the task, then default value is set.
  privilege:
    type: list
    description: List of privileges granted to the role. If an empty list is passed all assigned privileges
      will be removed. If option is omitted privileges will not be checked or changed. If option is passed
      all assigned privileges that are not passed will be removed.
  service:
    type: list
    description: List of service names to assign. If an empty list is passed all assigned services will
      be removed from the role. If option is omitted services will not be checked or changed. If option
      is passed all assigned services that are not passed will be removed from the role.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: State to ensure.
  user:
    type: list
    description: List of user names to assign. If an empty list is passed all assigned users will be removed
      from the role. If option is omitted users will not be checked or changed.
  validate_certs:
    type: bool
    default: true
    description: This only applies if O(ipa_prot) is V(https). If set to V(false), the SSL certificates
      will not be validated. This should only set to V(false) used on personally controlled sites using
      self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure role is present\n  community.general.ipa_role:\n    name: dba\n    description:\
  \ Database Administrators\n    state: present\n    user:\n    - pinky\n    - brain\n    ipa_host: ipa.example.com\n\
  \    ipa_user: admin\n    ipa_pass: topsecret\n\n- name: Ensure role with certain details\n  community.general.ipa_role:\n\
  \    name: another-role\n    description: Just another role\n    group:\n    - editors\n    host:\n\
  \    - host01.example.com\n    hostgroup:\n    - hostgroup01\n    privilege:\n    - Group Administrators\n\
  \    - User Administrators\n    service:\n    - service01\n\n- name: Ensure role is absent\n  community.general.ipa_role:\n\
  \    name: dba\n    state: absent\n    ipa_host: ipa.example.com\n    ipa_user: admin\n    ipa_pass:\
  \ topsecret\n"
