name: cronvar
fqcn: community.general.cronvar
collection: community.general
short_description: Manage variables in crontabs
description: Use this module to manage crontab variables. This module allows you to create, update, or
  delete cron variable definitions.
options:
  backup:
    type: bool
    default: false
    description: If set, create a backup of the crontab before it is modified. The location of the backup
      is returned in the C(backup) variable by this module.
  cron_file:
    type: str
    description: If specified, uses this file instead of an individual user's crontab. Without a leading
      V(/), this is assumed to be in C(/etc/cron.d). With a leading V(/), this is taken as absolute.
  insertafter:
    type: str
    description: If specified, the variable will be inserted after the variable specified. Used with O(state=present).
  insertbefore:
    type: str
    description: Used with O(state=present). If specified, the variable will be inserted just before the
      variable specified.
  name:
    type: str
    required: true
    description: Name of the crontab variable.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether to ensure that the variable is present or absent.
  user:
    type: str
    description: The specific user whose crontab should be modified. This parameter defaults to V(root)
      when unset.
  value:
    type: str
    description: The value to set this variable to. Required if O(state=present).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure entry like \"EMAIL=doug@ansibmod.con.com\" exists\n  community.general.cronvar:\n\
  \    name: EMAIL\n    value: doug@ansibmod.con.com\n\n- name: Ensure a variable does not exist. This\
  \ may remove any variable named \"LEGACY\"\n  community.general.cronvar:\n    name: LEGACY\n    state:\
  \ absent\n\n- name: Add a variable to a file under /etc/cron.d\n  community.general.cronvar:\n    name:\
  \ LOGFILE\n    value: /var/log/yum-autoupdate.log\n    user: root\n    cron_file: ansible_yum-autoupdate\n"
