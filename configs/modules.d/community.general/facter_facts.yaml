name: facter_facts
fqcn: community.general.facter_facts
collection: community.general
short_description: Runs the discovery program C(facter) on the remote system and return Ansible facts
description: Runs the C(facter) discovery program (U(https://github.com/puppetlabs/facter)) on the remote
  system, returning Ansible facts from the JSON data that can be useful for inventory purposes.
options:
  arguments:
    type: list
    description: Specifies arguments for facter.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Execute facter no arguments\n  community.general.facter_facts:\n\n- name: Execute\
  \ facter with arguments\n  community.general.facter_facts:\n    arguments:\n        - -p\n        -\
  \ system_uptime\n        - timezone\n        - is_virtual\n"
