name: ldap_search
fqcn: community.general.ldap_search
collection: community.general
short_description: Search for entries in a LDAP server
description: Return the results of an LDAP search.
options:
  attrs:
    type: list
    description: A list of attributes for limiting the result. Use an actual list or a comma-separated
      string.
  base64_attributes:
    type: list
    description: If provided, all attribute values returned that are listed in this option will be Base64
      encoded. If the special value V(*) appears in this list, all attributes will be Base64 encoded.
      All other attribute values will be converted to UTF-8 strings. If they contain binary data, please
      note that invalid UTF-8 bytes will be omitted.
  bind_dn:
    type: str
    description: A DN to bind with. If this is omitted, we'll try a SASL bind with the EXTERNAL mechanism
      as default. If this is blank, we'll use an anonymous bind.
  bind_pw:
    type: str
    default: ''
    description: The password to use with O(bind_dn).
  ca_path:
    type: path
    description: Set the path to PEM file with CA certs.
  client_cert:
    type: path
    description: PEM formatted certificate chain file to be used for SSL client authentication. Required
      if O(client_key) is defined.
  client_key:
    type: path
    description: PEM formatted file that contains your private key to be used for SSL client authentication.
      Required if O(client_cert) is defined.
  dn:
    type: str
    required: true
    description: The LDAP DN to search in.
  filter:
    type: str
    default: (objectClass=*)
    description: Used for filtering the LDAP search result.
  page_size:
    type: int
    default: 0
    description: The page size when performing a simple paged result search (RFC 2696). This setting can
      be tuned to reduce issues with timeouts and server limits. Setting the page size to V(0) (default)
      disables paged searching.
  referrals_chasing:
    type: str
    default: anonymous
    choices:
    - disabled
    - anonymous
    description: Set the referrals chasing behavior. V(anonymous) follow referrals anonymously. This is
      the default behavior. V(disabled) disable referrals chasing. This sets C(OPT_REFERRALS) to off.
  sasl_class:
    type: str
    default: external
    choices:
    - external
    - gssapi
    description: The class to use for SASL authentication.
  schema:
    type: bool
    default: false
    description: Set to V(true) to return the full attribute schema of entries, not their attribute values.
      Overrides O(attrs) when provided.
  scope:
    type: str
    default: base
    choices:
    - base
    - onelevel
    - subordinate
    - children
    description: The LDAP scope to use.
  server_uri:
    type: str
    default: ldapi:///
    description: The O(server_uri) parameter may be a comma- or whitespace-separated list of URIs containing
      only the schema, the host, and the port fields. The default value lets the underlying LDAP client
      library look for a UNIX domain socket in its default location. Note that when using multiple URIs
      you cannot determine to which URI your client gets connected. For URIs containing additional fields,
      particularly when using commas, behavior is undefined.
  start_tls:
    type: bool
    default: false
    description: If true, we'll use the START_TLS LDAP extension.
  validate_certs:
    type: bool
    default: true
    description: If set to V(false), SSL certificates will not be validated. This should only be used
      on sites using self-signed certificates.
  xorder_discovery:
    type: str
    default: auto
    choices:
    - enable
    - auto
    - disable
    description: Set the behavior on how to process Xordered DNs. V(enable) will perform a C(ONELEVEL)
      search below the superior RDN to find the matching DN. V(disable) will always use the DN unmodified
      (as passed by the O(dn) parameter). V(auto) will only perform a search if the first RDN does not
      contain an index number (C({x})).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Return all entries within the 'groups' organizational unit.\n  community.general.ldap_search:\n\
  \    dn: \"ou=groups,dc=example,dc=com\"\n  register: ldap_groups\n\n- name: Return GIDs for all groups\n\
  \  community.general.ldap_search:\n    dn: \"ou=groups,dc=example,dc=com\"\n    scope: \"onelevel\"\n\
  \    attrs:\n      - \"gidNumber\"\n  register: ldap_group_gids\n"
