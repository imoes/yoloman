name: nagios
fqcn: community.general.nagios
collection: community.general
short_description: Perform common tasks in Nagios related to downtime and notifications
description: 'The C(nagios) module has two basic functions: scheduling downtime and toggling alerts for
  services or hosts. The C(nagios) module is not idempotent. All actions require the O(host) parameter
  to be given explicitly. In playbooks you can use the C({{inventory_hostname}}) variable to refer to
  the host the playbook is currently running on. You can specify multiple services at once by separating
  them with commas, .e.g. O(services=httpd,nfs,puppet). When specifying what service to handle there is
  a special service value, O(host), which will handle alerts/downtime/acknowledge for the I(host itself),
  for example O(services=host). This keyword may not be given with other services at the same time. B(Setting
  alerts/downtime/acknowledge for a host does not affect alerts/downtime/acknowledge for any of the services
  running on it.) To schedule downtime for all services on particular host use keyword "all", for example
  O(services=all).'
options:
  action:
    type: str
    required: true
    choices:
    - downtime
    - delete_downtime
    - enable_alerts
    - disable_alerts
    - silence
    - unsilence
    - silence_nagios
    - unsilence_nagios
    - command
    - servicegroup_service_downtime
    - servicegroup_host_downtime
    - acknowledge
    - forced_check
    description: Action to take. servicegroup options were added in 2.0. delete_downtime options were
      added in 2.2. The V(acknowledge) and V(forced_check) actions were added in community.general 1.2.0.
  author:
    type: str
    default: Ansible
    description: Author to leave downtime comments as. Only used when O(action) is V(downtime) or V(acknowledge).
  cmdfile:
    type: str
    description: Path to the nagios I(command file) (FIFO pipe). Only required if auto-detection fails.
  command:
    type: str
    description: The raw command to send to nagios, which should not include the submitted time header
      or the line-feed. B(Required) option when using the V(command) O(action).
  comment:
    type: str
    default: Scheduling downtime
    description: Comment when O(action) is V(downtime) or V(acknowledge).
  host:
    type: str
    description: Host to operate on in Nagios.
  minutes:
    type: int
    default: 30
    description: Minutes to schedule downtime for. Only usable with O(action=downtime).
  servicegroup:
    type: str
    description: The Servicegroup we want to set downtimes/alerts for. B(Required) option when using the
      V(servicegroup_service_downtime) and V(servicegroup_host_downtime) O(action).
  services:
    type: str
    aliases:
    - service
    description: 'What to manage downtime/alerts for. Separate multiple services with commas. B(Required)
      option when O(action) is one of: V(downtime), V(acknowledge), V(forced_check), V(enable_alerts),
      V(disable_alerts).'
  start:
    type: str
    description: When downtime should start, in C(time_t) format (epoch seconds).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set 30 minutes of apache downtime\n  community.general.nagios:\n    action: downtime\n\
  \    minutes: 30\n    service: httpd\n    host: '{{ inventory_hostname }}'\n\n- name: Schedule an hour\
  \ of HOST downtime\n  community.general.nagios:\n    action: downtime\n    minutes: 60\n    service:\
  \ host\n    host: '{{ inventory_hostname }}'\n\n- name: Schedule an hour of HOST downtime starting at\
  \ 2019-04-23T02:00:00+00:00\n  community.general.nagios:\n    action: downtime\n    start: 1555984800\n\
  \    minutes: 60\n    service: host\n    host: '{{ inventory_hostname }}'\n\n- name: Schedule an hour\
  \ of HOST downtime, with a comment describing the reason\n  community.general.nagios:\n    action: downtime\n\
  \    minutes: 60\n    service: host\n    host: '{{ inventory_hostname }}'\n    comment: Rebuilding machine\n\
  \n- name: Schedule downtime for ALL services on HOST\n  community.general.nagios:\n    action: downtime\n\
  \    minutes: 45\n    service: all\n    host: '{{ inventory_hostname }}'\n\n- name: Schedule downtime\
  \ for a few services\n  community.general.nagios:\n    action: downtime\n    services: frob,foobar,qeuz\n\
  \    host: '{{ inventory_hostname }}'\n\n- name: Set 30 minutes downtime for all services in servicegroup\
  \ foo\n  community.general.nagios:\n    action: servicegroup_service_downtime\n    minutes: 30\n   \
  \ servicegroup: foo\n    host: '{{ inventory_hostname }}'\n\n- name: Set 30 minutes downtime for all\
  \ host in servicegroup foo\n  community.general.nagios:\n    action: servicegroup_host_downtime\n  \
  \  minutes: 30\n    servicegroup: foo\n    host: '{{ inventory_hostname }}'\n\n- name: Delete all downtime\
  \ for a given host\n  community.general.nagios:\n    action: delete_downtime\n    host: '{{ inventory_hostname\
  \ }}'\n    service: all\n\n- name: Delete all downtime for HOST with a particular comment\n  community.general.nagios:\n\
  \    action: delete_downtime\n    host: '{{ inventory_hostname }}'\n    service: host\n    comment:\
  \ Planned maintenance\n\n- name: Acknowledge an HOST with a particular comment\n  community.general.nagios:\n\
  \    action: acknowledge\n    service: host\n    host: '{{ inventory_hostname }}'\n    comment: 'power\
  \ outage - see casenr 12345'\n\n- name: Acknowledge an active service problem for the httpd service\
  \ with a particular comment\n  community.general.nagios:\n    action: acknowledge\n    service: httpd\n\
  \    host: '{{ inventory_hostname }}'\n    comment: 'service crashed - see casenr 12345'\n\n- name:\
  \ Reset a passive service check for snmp trap\n  community.general.nagios:\n    action: forced_check\n\
  \    service: snmp\n    host: '{{ inventory_hostname }}'\n\n- name: Force an active service check for\
  \ the httpd service\n  community.general.nagios:\n    action: forced_check\n    service: httpd\n   \
  \ host: '{{ inventory_hostname }}'\n\n- name: Force an active service check for all services of a particular\
  \ host\n  community.general.nagios:\n    action: forced_check\n    service: all\n    host: '{{ inventory_hostname\
  \ }}'\n\n- name: Force an active service check for a particular host\n  community.general.nagios:\n\
  \    action: forced_check\n    service: host\n    host: '{{ inventory_hostname }}'\n\n- name: Enable\
  \ SMART disk alerts\n  community.general.nagios:\n    action: enable_alerts\n    service: smart\n  \
  \  host: '{{ inventory_hostname }}'\n\n- name: Disable httpd and nfs alerts\n  community.general.nagios:\n\
  \    action: disable_alerts\n    service: httpd,nfs\n    host: '{{ inventory_hostname }}'\n\n- name:\
  \ Disable HOST alerts\n  community.general.nagios:\n    action: disable_alerts\n    service: host\n\
  \    host: '{{ inventory_hostname }}'\n\n- name: Silence ALL alerts\n  community.general.nagios:\n \
  \   action: silence\n    host: '{{ inventory_hostname }}'\n\n- name: Unsilence all alerts\n  community.general.nagios:\n\
  \    action: unsilence\n    host: '{{ inventory_hostname }}'\n\n- name: Shut up nagios\n  community.general.nagios:\n\
  \    action: silence_nagios\n\n- name: Annoy me negios\n  community.general.nagios:\n    action: unsilence_nagios\n\
  \n- name: Command something\n  community.general.nagios:\n    action: command\n    command: DISABLE_FAILURE_PREDICTION\n"
