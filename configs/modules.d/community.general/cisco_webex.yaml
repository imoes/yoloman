name: cisco_webex
fqcn: community.general.cisco_webex
collection: community.general
short_description: Send a message to a Cisco Webex Teams Room or Individual
description: Send a message to a Cisco Webex Teams Room or Individual with options to control the formatting.
options:
  msg:
    type: str
    required: true
    description: The message you would like to send.
  msg_type:
    type: str
    default: text
    choices:
    - text
    - markdown
    aliases:
    - message_type
    description: Specifies how you would like the message formatted.
  personal_token:
    type: str
    required: true
    aliases:
    - token
    description: Your personal access token required to validate the Webex Teams API.
  recipient_id:
    type: str
    required: true
    description: The unique identifier associated with the supplied O(recipient_type).
  recipient_type:
    type: str
    required: true
    choices:
    - roomId
    - toPersonEmail
    - toPersonId
    description: The request parameter you would like to send the message to. Messages can be sent to
      either a room or individual (by ID or E-Mail).
writes: true
runtime: starlark
source: translated
examples: "\n# Note: The following examples assume a variable file has been imported\n# that contains\
  \ the appropriate information.\n\n- name: Cisco Webex Teams - Markdown Message to a Room\n  community.general.cisco_webex:\n\
  \    recipient_type: roomId\n    recipient_id: \"{{ room_id }}\"\n    msg_type: markdown\n    personal_token:\
  \ \"{{ token }}\"\n    msg: \"**Cisco Webex Teams Ansible Module - Room Message in Markdown**\"\n\n\
  - name: Cisco Webex Teams - Text Message to a Room\n  community.general.cisco_webex:\n    recipient_type:\
  \ roomId\n    recipient_id: \"{{ room_id }}\"\n    msg_type: text\n    personal_token: \"{{ token }}\"\
  \n    msg: \"Cisco Webex Teams Ansible Module - Room Message in Text\"\n\n- name: Cisco Webex Teams\
  \ - Text Message by an Individuals ID\n  community.general.cisco_webex:\n    recipient_type: toPersonId\n\
  \    recipient_id: \"{{ person_id}}\"\n    msg_type: text\n    personal_token: \"{{ token }}\"\n   \
  \ msg: \"Cisco Webex Teams Ansible Module - Text Message to Individual by ID\"\n\n- name: Cisco Webex\
  \ Teams - Text Message by an Individuals E-Mail Address\n  community.general.cisco_webex:\n    recipient_type:\
  \ toPersonEmail\n    recipient_id: \"{{ person_email }}\"\n    msg_type: text\n    personal_token: \"\
  {{ token }}\"\n    msg: \"Cisco Webex Teams Ansible Module - Text Message to Individual by E-Mail\"\n\
  \n"
