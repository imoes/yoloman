name: rpm_ostree_pkg
fqcn: community.general.rpm_ostree_pkg
collection: community.general
short_description: Install or uninstall overlay additional packages
description: Install or uninstall overlay additional packages using C(rpm-ostree) command.
options:
  name:
    type: list
    required: true
    aliases:
    - pkg
    description: Name of overlay package to install or remove.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: State of the overlay package. V(present) simply ensures that a desired package is installed.
      V(absent) removes the specified package.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install overlay package\n  community.general.rpm_ostree_pkg:\n    name: nfs-utils\n\
  \    state: present\n\n- name: Remove overlay package\n  community.general.rpm_ostree_pkg:\n    name:\
  \ nfs-utils\n    state: absent\n"
