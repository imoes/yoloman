name: librato_annotation
fqcn: community.general.librato_annotation
collection: community.general
short_description: Create an annotation in librato
description: Create an annotation event on the given annotation stream :name. If the annotation stream
  does not exist, it will be created automatically
options:
  api_key:
    type: str
    required: true
    description: Librato account api key
  description:
    type: str
    description: The description contains extra metadata about a particular annotation The description
      should contain specifics on the individual annotation e.g. Deployed 9b562b2 shipped new feature
      foo!
  end_time:
    type: int
    description: The unix timestamp indicating the time at which the event referenced by this annotation
      ended For events that have a duration, this is a useful way to annotate the duration of the event
  links:
    type: list
    description: See examples
  name:
    type: str
    description: The annotation stream name If the annotation stream does not exist, it will be created
      automatically
  source:
    type: str
    description: A string which describes the originating source of an annotation when that annotation
      is tracked across multiple members of a population
  start_time:
    type: int
    description: The unix timestamp indicating the time at which the event referenced by this annotation
      started
  title:
    type: str
    required: true
    description: The title of an annotation is a string and may contain spaces The title should be a short,
      high-level summary of the annotation e.g. v45 Deployment
  user:
    type: str
    required: true
    description: Librato account username
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a simple annotation event with a source\n  community.general.librato_annotation:\n\
  \    user: user@example.com\n    api_key: XXXXXXXXXXXXXXXXX\n    title: App Config Change\n    source:\
  \ foo.bar\n    description: This is a detailed description of the config change\n\n- name: Create an\
  \ annotation that includes a link\n  community.general.librato_annotation:\n    user: user@example.com\n\
  \    api_key: XXXXXXXXXXXXXXXXXX\n    name: code.deploy\n    title: app code deploy\n    description:\
  \ this is a detailed description of a deployment\n    links:\n      - rel: example\n        href: http://www.example.com/deploy\n\
  \n- name: Create an annotation with a start_time and end_time\n  community.general.librato_annotation:\n\
  \    user: user@example.com\n    api_key: XXXXXXXXXXXXXXXXXX\n    name: maintenance\n    title: Maintenance\
  \ window\n    description: This is a detailed description of maintenance\n    start_time: 1395940006\n\
  \    end_time: 1395954406\n"
