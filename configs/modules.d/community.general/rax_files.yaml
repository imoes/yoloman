name: rax_files
fqcn: community.general.rax_files
collection: community.general
short_description: Manipulate Rackspace Cloud Files Containers
description: Manipulate Rackspace Cloud Files Containers
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  clear_meta:
    type: bool
    default: false
    description: Optionally clear existing metadata when applying metadata to existing containers. Selecting
      this option is only appropriate when setting type=meta
  container:
    type: str
    description: The container to use for container or metadata operations.
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  meta:
    type: dict
    default: {}
    description: A hash of items to set as metadata values on a container
  private:
    type: bool
    default: false
    description: Used to set a container as private, removing it from the CDN.  B(Warning!) Private containers,
      if previously made public, can have live objects available until the TTL on cached objects expires
  public:
    type: bool
    default: false
    description: Used to set a container as public, available via the Cloud Files CDN
  region:
    type: str
    description: Region to create an instance in
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - list
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  ttl:
    type: int
    description: In seconds, set a container-wide TTL for all objects cached on CDN edge nodes. Setting
      a TTL is only appropriate for containers that are public
  type:
    type: str
    default: container
    choices:
    - container
    - meta
    description: Type of object to do work on, i.e. metadata object or a container object
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  web_error:
    type: str
    description: Sets an object to be presented as the HTTP error page when accessed by the CDN URL
  web_index:
    type: str
    description: Sets an object to be presented as the HTTP index page when accessed by the CDN URL
writes: true
runtime: starlark
source: translated
examples: "\n- name: \"Test Cloud Files Containers\"\n  hosts: local\n  gather_facts: false\n  tasks:\n\
  \    - name: \"List all containers\"\n      community.general.rax_files:\n        state: list\n\n  \
  \  - name: \"Create container called 'mycontainer'\"\n      community.general.rax_files:\n        container:\
  \ mycontainer\n\n    - name: \"Create container 'mycontainer2' with metadata\"\n      community.general.rax_files:\n\
  \        container: mycontainer2\n        meta:\n          key: value\n          file_for: someuser@example.com\n\
  \n    - name: \"Set a container's web index page\"\n      community.general.rax_files:\n        container:\
  \ mycontainer\n        web_index: index.html\n\n    - name: \"Set a container's web error page\"\n \
  \     community.general.rax_files:\n        container: mycontainer\n        web_error: error.html\n\n\
  \    - name: \"Make container public\"\n      community.general.rax_files:\n        container: mycontainer\n\
  \        public: true\n\n    - name: \"Make container public with a 24 hour TTL\"\n      community.general.rax_files:\n\
  \        container: mycontainer\n        public: true\n        ttl: 86400\n\n    - name: \"Make container\
  \ private\"\n      community.general.rax_files:\n        container: mycontainer\n        private: true\n\
  \n- name: \"Test Cloud Files Containers Metadata Storage\"\n  hosts: local\n  gather_facts: false\n\
  \  tasks:\n    - name: \"Get mycontainer2 metadata\"\n      community.general.rax_files:\n        container:\
  \ mycontainer2\n        type: meta\n\n    - name: \"Set mycontainer2 metadata\"\n      community.general.rax_files:\n\
  \        container: mycontainer2\n        type: meta\n        meta:\n          uploaded_by: someuser@example.com\n\
  \n    - name: \"Remove mycontainer2 metadata\"\n      community.general.rax_files:\n        container:\
  \ \"mycontainer2\"\n        type: meta\n        state: absent\n        meta:\n          key: \"\"\n\
  \          file_for: \"\"\n"
