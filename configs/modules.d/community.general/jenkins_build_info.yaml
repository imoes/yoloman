name: jenkins_build_info
fqcn: community.general.jenkins_build_info
collection: community.general
short_description: Get information about Jenkins builds
description: Get information about Jenkins builds with Jenkins REST API.
options:
  build_number:
    type: int
    description: An integer which specifies a build of a job. If not specified the last build information
      will be returned.
  name:
    type: str
    required: true
    description: Name of the Jenkins job to which the build belongs.
  password:
    type: str
    description: Password to authenticate with the Jenkins server.
  token:
    type: str
    description: API token used to authenticate with the Jenkins server.
  url:
    type: str
    default: http://localhost:8080
    description: URL of the Jenkins server.
  user:
    type: str
    description: User to authenticate with the Jenkins server.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Get information about a jenkins build using basic authentication\n  community.general.jenkins_build_info:\n\
  \    name: \"test-check\"\n    build_number: 1\n    user: admin\n    password: asdfg\n    url: http://localhost:8080\n\
  \n- name: Get information about a jenkins build anonymously\n  community.general.jenkins_build_info:\n\
  \    name: \"stop-check\"\n    build_number: 3\n    url: http://localhost:8080\n\n- name: Get information\
  \ about a jenkins build using token authentication\n  community.general.jenkins_build_info:\n    name:\
  \ \"delete-experiment\"\n    build_number: 30\n    user: Jenkins\n    token: abcdefghijklmnopqrstuvwxyz123456\n\
  \    url: http://localhost:8080\n"
