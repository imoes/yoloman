name: proxmox_kvm
fqcn: community.general.proxmox_kvm
collection: community.general
short_description: Management of Qemu(KVM) Virtual Machines in Proxmox VE cluster
description: Allows you to create/delete/stop Qemu(KVM) Virtual Machines in Proxmox VE cluster. Since
  community.general 4.0.0 on, there are no more default values, see O(proxmox_default_behavior).
options:
  acpi:
    type: bool
    description: Specify if ACPI should be enabled/disabled. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(true).
  agent:
    type: str
    description: Specify if the QEMU Guest Agent should be enabled/disabled. Since community.general 5.5.0,
      this can also be a string instead of a boolean. This allows to specify values such as V(enabled=1,fstrim_cloned_disks=1).
  api_host:
    type: str
    required: true
    description: Specify the target host of the Proxmox VE cluster.
  api_password:
    type: str
    description: Specify the password to authenticate with. You can use E(PROXMOX_PASSWORD) environment
      variable.
  api_token_id:
    type: str
    description: Specify the token ID. Requires C(proxmoxer>=1.1.0) to work.
  api_token_secret:
    type: str
    description: Specify the token secret. Requires C(proxmoxer>=1.1.0) to work.
  api_user:
    type: str
    required: true
    description: Specify the user to authenticate with.
  archive:
    type: str
    description: Specify a path to an archive to restore (instead of creating or cloning a VM).
  args:
    type: str
    description: Pass arbitrary arguments to kvm. This option is for experts only! If O(proxmox_default_behavior)
      is set to V(compatibility), this option has a default of V(-serial unix:/var/run/qemu-server/<vmid>.serial,server,nowait).
  autostart:
    type: bool
    description: Specify if the VM should be automatically restarted after crash (currently ignored in
      PVE API). This option has no default unless O(proxmox_default_behavior) is set to V(compatibility);
      then the default is V(false).
  balloon:
    type: int
    description: Specify the amount of RAM for the VM in MB. Using zero disables the balloon driver. This
      option has no default unless O(proxmox_default_behavior) is set to V(compatibility); then the default
      is V(0).
  bios:
    type: str
    choices:
    - seabios
    - ovmf
    description: Specify the BIOS implementation.
  boot:
    type: str
    description: Specify the boot order -> boot on floppy V(a), hard disk V(c), CD-ROM V(d), or network
      V(n). For newer versions of Proxmox VE, use a boot order like V(order=scsi0;net0;hostpci0). You
      can combine to set order. This option has no default unless O(proxmox_default_behavior) is set to
      V(compatibility); then the default is V(cnd).
  bootdisk:
    type: str
    description: Enable booting from specified disk. Format V((ide|sata|scsi|virtio\)\\d+).
  cicustom:
    type: str
    description: 'cloud-init: Specify custom files to replace the automatically generated ones at start.'
  cipassword:
    type: str
    description: 'cloud-init: password of default user to create.'
  citype:
    type: str
    choices:
    - nocloud
    - configdrive2
    description: 'cloud-init: Specifies the cloud-init configuration format. The default depends on the
      configured operating system type (V(ostype)). We use the V(nocloud) format for Linux, and V(configdrive2)
      for Windows.'
  ciuser:
    type: str
    description: 'cloud-init: username of default user to create.'
  clone:
    type: str
    description: Name of VM to be cloned. If O(vmid) is set, O(clone) can take an arbitrary value but
      is required for initiating the clone.
  cores:
    type: int
    description: Specify number of cores per socket. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(1).
  cpu:
    type: str
    description: Specify emulated CPU type. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(kvm64).
  cpulimit:
    type: int
    description: Specify if CPU usage will be limited. Value 0 indicates no CPU limit. If the computer
      has 2 CPUs, it has total of '2' CPU time
  cpuunits:
    type: int
    description: Specify CPU weight for a VM. You can disable fair-scheduler configuration by setting
      this to 0 This option has no default unless O(proxmox_default_behavior) is set to V(compatibility);
      then the default is V(1000).
  delete:
    type: str
    description: Specify a list of settings you want to delete.
  description:
    type: str
    description: Specify the description for the VM. Only used on the configuration web interface. This
      is saved as comment inside the configuration file.
  digest:
    type: str
    description: Specify if to prevent changes if current configuration file has different SHA1 digest.
      This can be used to prevent concurrent modifications.
  efidisk0:
    type: dict
    description: Specify a hash/dictionary of EFI disk options. Requires O(bios=ovmf) to be set to be
      able to use it.
  force:
    type: bool
    description: Allow to force stop VM. Can be used with states V(stopped), V(restarted), and V(absent).
      This option has no default unless O(proxmox_default_behavior) is set to V(compatibility); then the
      default is V(false).
  format:
    type: str
    choices:
    - cloop
    - cow
    - qcow
    - qcow2
    - qed
    - raw
    - vmdk
    - unspecified
    description: Target drive's backing file's data format. Used only with clone Use O(format=unspecified)
      and O(full=false) for a linked clone. Please refer to the Proxmox VE Administrator Guide, section
      Proxmox VE Storage (see U(https://pve.proxmox.com/pve-docs/chapter-pvesm.html) for the latest version,
      tables 3 to 14) to find out format supported by the provided storage backend. This option has no
      default unless O(proxmox_default_behavior) is set to V(compatibility); then the default is V(qcow2).
      If O(proxmox_default_behavior) is set to V(no_defaults), not specifying this option is equivalent
      to setting it to V(unspecified).
  freeze:
    type: bool
    description: Specify if PVE should freeze CPU at startup (use 'c' monitor command to start execution).
  full:
    type: bool
    default: true
    description: Create a full copy of all disk. This is always done when you clone a normal VM. For VM
      templates, we try to create a linked clone by default. Used only with clone
  hookscript:
    type: str
    description: Script that will be executed during various steps in the containers lifetime.
  hostpci:
    type: dict
    description: Specify a hash/dictionary of map host pci devices into guest. O(hostpci='{"key":"value",
      "key":"value"}'). Keys allowed are - C(hostpci[n]) where 0 ≤ n ≤ N. Values allowed are -  C("host="HOSTPCIID[;HOSTPCIID2...]",pcie="1|0",rombar="1|0",x-vga="1|0"").
      The C(host) parameter is Host PCI device pass through. HOSTPCIID syntax is C(bus:dev.func) (hexadecimal
      numbers). C(pcie=boolean) C(default=0) Choose the PCI-express bus (needs the q35 machine model).
      C(rombar=boolean) C(default=1) Specify whether or not the device's ROM will be visible in the guest's
      memory map. C(x-vga=boolean) C(default=0) Enable vfio-vga device support. /!\ This option allows
      direct access to host hardware. So it is no longer possible to migrate such machines - use with
      special care.
  hotplug:
    type: str
    description: Selectively enable hotplug features. This is a comma separated list of hotplug features
      V(network), V(disk), V(cpu), V(memory), and V(usb). Value 0 disables hotplug completely and value
      1 is an alias for the default V(network,disk,usb).
  hugepages:
    type: str
    choices:
    - any
    - '2'
    - '1024'
    description: Enable/disable hugepages memory.
  ide:
    type: dict
    description: A hash/dictionary of volume used as IDE hard disk or CD-ROM. O(ide='{"key":"value", "key":"value"}').
      Keys allowed are - C(ide[n]) where 0 ≤ n ≤ 3. Values allowed are - C("storage:size,format=value").
      C(storage) is the storage identifier where to create the disk. C(size) is the size of the disk in
      GB. C(format) is the drive's backing file's data format. C(qcow2|raw|subvol). Please refer to the
      Proxmox VE Administrator Guide, section Proxmox VE Storage (see U(https://pve.proxmox.com/pve-docs/chapter-pvesm.html)
      for the latest version, tables 3 to 14) to find out format supported by the provided storage backend.
  ipconfig:
    type: dict
    description: 'cloud-init: Set the IP configuration. A hash/dictionary of network ip configurations.
      O(ipconfig=''{"key":"value", "key":"value"}''). Keys allowed are - C(ipconfig[n]) where 0 ≤ n ≤
      network interfaces. Values allowed are -  C("[gw=<GatewayIPv4>] [,gw6=<GatewayIPv6>] [,ip=<IPv4Format/CIDR>]
      [,ip6=<IPv6Format/CIDR>]"). cloud-init: Specify IP addresses and gateways for the corresponding
      interface. IP addresses use CIDR notation, gateways are optional but they should be in the same
      subnet of specified IP address. The special string ''dhcp'' can be used for IP addresses to use
      DHCP, in which case no explicit gateway should be provided. For IPv6 the special string ''auto''
      can be used to use stateless autoconfiguration. If cloud-init is enabled and neither an IPv4 nor
      an IPv6 address is specified, it defaults to using dhcp on IPv4.'
  keyboard:
    type: str
    description: Sets the keyboard layout for VNC server.
  kvm:
    type: bool
    description: Enable/disable KVM hardware virtualization. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(true).
  localtime:
    type: bool
    description: Sets the real time clock to local time. This is enabled by default if ostype indicates
      a Microsoft OS.
  lock:
    type: str
    choices:
    - migrate
    - backup
    - snapshot
    - rollback
    description: Lock/unlock the VM.
  machine:
    type: str
    description: Specifies the Qemu machine type. Type => V((pc|pc(-i440fx\)?-\\d+\\.\\d+(\\.pxe\)?|q35|pc-q35-\\d+\\.\\d+(\\.pxe\)?\)).
  memory:
    type: int
    description: Memory size in MB for instance. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(512).
  migrate:
    type: bool
    default: false
    description: Migrate the VM to O(node) if it is on another node.
  migrate_downtime:
    type: int
    description: Sets maximum tolerated downtime (in seconds) for migrations.
  migrate_speed:
    type: int
    description: Sets maximum speed (in MB/s) for migrations. A value of 0 is no limit.
  name:
    type: str
    description: Specifies the VM name. Name could be non-unique across the cluster. Required only for
      O(state=present). With O(state=present) if O(vmid) not provided and VM with name exists in the cluster
      then no changes will be made.
  nameservers:
    type: list
    description: 'cloud-init: DNS server IP address(es). If unset, PVE host settings are used.'
  net:
    type: dict
    description: A hash/dictionary of network interfaces for the VM. O(net='{"key":"value", "key":"value"}').
      Keys allowed are - C(net[n]) where 0 ≤ n ≤ N. Values allowed are - C("model="XX:XX:XX:XX:XX:XX",bridge="value",rate="value",tag="value",firewall="1|0",trunks="vlanid"").
      Model is one of C(e1000 e1000-82540em e1000-82544gc e1000-82545em i82551 i82557b i82559er ne2k_isa
      ne2k_pci pcnet rtl8139 virtio vmxnet3). C(XX:XX:XX:XX:XX:XX) should be an unique MAC address. This
      is automatically generated if not specified. The C(bridge) parameter can be used to automatically
      add the interface to a bridge device. The Proxmox VE standard bridge is called 'vmbr0'. Option C(rate)
      is used to limit traffic bandwidth from and to this interface. It is specified as floating point
      number, unit is 'Megabytes per second'. If you specify no bridge, we create a kvm 'user' (NATed)
      network device, which provides DHCP and DNS services.
  newid:
    type: int
    description: VMID for the clone. Used only with clone. If newid is not set, the next available VM
      ID will be fetched from ProxmoxAPI.
  node:
    type: str
    description: Proxmox VE node on which to operate. Only required for O(state=present). For every other
      states it will be autodiscovered.
  numa:
    type: dict
    description: A hash/dictionaries of NUMA topology. O(numa='{"key":"value", "key":"value"}'). Keys
      allowed are - C(numa[n]) where 0 ≤ n ≤ N. Values allowed are - C("cpu="<id[-id];...>",hostnodes="<id[-id];...>",memory="number",policy="(bind|interleave|preferred)"").
      C(cpus) CPUs accessing this NUMA node. C(hostnodes) Host NUMA nodes to use. C(memory) Amount of
      memory this NUMA node provides. C(policy) NUMA allocation policy.
  numa_enabled:
    type: bool
    description: Enables NUMA.
  onboot:
    type: bool
    description: Specifies whether a VM will be started during system bootup. This option has no default
      unless O(proxmox_default_behavior) is set to V(compatibility); then the default is V(true).
  ostype:
    type: str
    choices:
    - other
    - wxp
    - w2k
    - w2k3
    - w2k8
    - wvista
    - win7
    - win8
    - win10
    - win11
    - l24
    - l26
    - solaris
    description: Specifies guest operating system. This is used to enable special optimization/features
      for specific operating systems. The l26 is Linux 2.6/3.X Kernel. This option has no default unless
      O(proxmox_default_behavior) is set to V(compatibility); then the default is V(l26).
  parallel:
    type: dict
    description: A hash/dictionary of map host parallel devices. O(parallel='{"key":"value", "key":"value"}').
      Keys allowed are - (parallel[n]) where 0 ≤ n ≤ 2. Values allowed are - C("/dev/parport\d+|/dev/usb/lp\d+").
  pool:
    type: str
    description: Add the new VM to the specified pool.
  protection:
    type: bool
    description: Enable/disable the protection flag of the VM. This will enable/disable the remove VM
      and remove disk operations.
  proxmox_default_behavior:
    type: str
    default: no_defaults
    choices:
    - compatibility
    - no_defaults
    description: As of community.general 4.0.0, various options no longer have default values. These default
      values caused problems when users expected different behavior from Proxmox by default or filled
      options which caused problems when set. - The value V(compatibility) (default before community.general
      4.0.0) will ensure that the default values are used when the values are not explicitly specified
      by the user. The new default is V(no_defaults), which makes sure these options have no defaults.
      - This affects the O(acpi), O(autostart), O(balloon), O(boot), O(cores), O(cpu), O(cpuunits), O(force),
      O(format), O(kvm), O(memory), O(onboot), O(ostype), O(sockets), O(tablet), O(template), and O(vga)
      options. - This option is deprecated and will be removed in community.general 10.0.0.
  reboot:
    type: bool
    description: Allow reboot. If set to V(true), the VM exit on reboot.
  revert:
    type: str
    description: Revert a pending change.
  sata:
    type: dict
    description: A hash/dictionary of volume used as sata hard disk or CD-ROM. O(sata='{"key":"value",
      "key":"value"}'). Keys allowed are - C(sata[n]) where 0 ≤ n ≤ 5. Values allowed are -  C("storage:size,format=value").
      C(storage) is the storage identifier where to create the disk. C(size) is the size of the disk in
      GB. C(format) is the drive's backing file's data format. C(qcow2|raw|subvol). Please refer to the
      Proxmox VE Administrator Guide, section Proxmox VE Storage (see U(https://pve.proxmox.com/pve-docs/chapter-pvesm.html)
      for the latest version, tables 3 to 14) to find out format supported by the provided storage backend.
  scsi:
    type: dict
    description: A hash/dictionary of volume used as SCSI hard disk or CD-ROM. O(scsi='{"key":"value",
      "key":"value"}'). Keys allowed are - C(scsi[n]) where 0 ≤ n ≤ 13. Values allowed are -  C("storage:size,format=value").
      C(storage) is the storage identifier where to create the disk. C(size) is the size of the disk in
      GB. C(format) is the drive's backing file's data format. C(qcow2|raw|subvol). Please refer to the
      Proxmox VE Administrator Guide, section Proxmox VE Storage (see U(https://pve.proxmox.com/pve-docs/chapter-pvesm.html)
      for the latest version, tables 3 to 14) to find out format supported by the provided storage backend.
  scsihw:
    type: str
    choices:
    - lsi
    - lsi53c810
    - virtio-scsi-pci
    - virtio-scsi-single
    - megasas
    - pvscsi
    description: Specifies the SCSI controller model.
  searchdomains:
    type: list
    description: 'cloud-init: Sets DNS search domain(s). If unset, PVE host settings are used.'
  serial:
    type: dict
    description: A hash/dictionary of serial device to create inside the VM. V('{"key":"value", "key":"value"}').
      Keys allowed are - serial[n](str; required) where 0 ≤ n ≤ 3. Values allowed are - V((/dev/.+|socket\)).
      /!\ If you pass through a host serial device, it is no longer possible to migrate such machines
      - use with special care.
  shares:
    type: int
    description: Rets amount of memory shares for auto-ballooning. (0 - 50000). The larger the number
      is, the more memory this VM gets. The number is relative to weights of all other running VMs. Using
      0 disables auto-ballooning, this means no limit.
  skiplock:
    type: bool
    description: Ignore locks Only root is allowed to use this option.
  smbios:
    type: str
    description: 'Specifies SMBIOS type 1 fields. Comma separated, Base64 encoded (optional) SMBIOS properties:
      V([base64=<1|0>] [,family=<Base64 encoded string>]) V([,manufacturer=<Base64 encoded string>]) V([,product=<Base64
      encoded string>]) V([,serial=<Base64 encoded string>]) V([,sku=<Base64 encoded string>]) V([,uuid=<UUID>])
      V([,version=<Base64 encoded string>])'
  snapname:
    type: str
    description: The name of the snapshot. Used only with clone.
  sockets:
    type: int
    description: Sets the number of CPU sockets. (1 - N). This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(1).
  sshkeys:
    type: str
    description: 'cloud-init: SSH key to assign to the default user. NOT TESTED with multiple keys but
      a multi-line value should work.'
  startdate:
    type: str
    description: Sets the initial date of the real time clock. Valid format for date are V('now') or V('2016-09-25T16:01:21')
      or V('2016-09-25').
  startup:
    type: str
    description: Startup and shutdown behavior. V([[order=]\\d+] [,up=\\d+] [,down=\\d+]). Order is a
      non-negative number defining the general startup order. Shutdown in done with reverse ordering.
  state:
    type: str
    default: present
    choices:
    - present
    - started
    - absent
    - stopped
    - restarted
    - current
    - template
    description: Indicates desired state of the instance. If V(current), the current state of the VM will
      be fetched. You can access it with C(results.status) V(template) was added in community.general
      8.1.0.
  storage:
    type: str
    description: Target storage for full clone.
  tablet:
    type: bool
    description: Enables/disables the USB tablet device. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(false).
  tags:
    type: list
    description: List of tags to apply to the VM instance. Tags must start with V([a-z0-9_]) followed
      by zero or more of the following characters V([a-z0-9_-+.]). Tags are only available in Proxmox
      6+.
  target:
    type: str
    description: Target node. Only allowed if the original VM is on shared storage. Used only with clone
  tdf:
    type: bool
    description: Enables/disables time drift fix.
  template:
    type: bool
    description: Enables/disables the template. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(false).
  timeout:
    type: int
    default: 30
    description: Timeout for operations. When used with O(state=stopped) the option sets a graceful timeout
      for VM stop after which a VM will be forcefully stopped.
  tpmstate0:
    type: dict
    description: A hash/dictionary of options for the Trusted Platform Module disk. A TPM state disk is
      required for Windows 11 installations.
  update:
    type: bool
    default: false
    description: If V(true), the VM will be updated with new value. Because of the operations of the API
      and security reasons, I have disabled the update of the following parameters O(net), O(virtio),
      O(ide), O(sata), O(scsi). Per example updating O(net) update the MAC address and C(virtio) create
      always new disk... Update of O(pool) is disabled. It needs an additional API endpoint not covered
      by this module.
  validate_certs:
    type: bool
    default: false
    description: If V(false), SSL certificates will not be validated. This should only be used on personally
      controlled sites using self-signed certificates.
  vcpus:
    type: int
    description: Sets number of hotplugged vcpus.
  vga:
    type: str
    choices:
    - std
    - cirrus
    - vmware
    - qxl
    - serial0
    - serial1
    - serial2
    - serial3
    - qxl2
    - qxl3
    - qxl4
    description: Select VGA type. If you want to use high resolution modes (>= 1280x1024x16) then you
      should use option 'std' or 'vmware'. This option has no default unless O(proxmox_default_behavior)
      is set to V(compatibility); then the default is V(std).
  virtio:
    type: dict
    description: A hash/dictionary of volume used as VIRTIO hard disk. O(virtio='{"key":"value", "key":"value"}').
      Keys allowed are - C(virtio[n]) where 0 ≤ n ≤ 15. Values allowed are -  C("storage:size,format=value").
      C(storage) is the storage identifier where to create the disk. C(size) is the size of the disk in
      GB. C(format) is the drive's backing file's data format. C(qcow2|raw|subvol). Please refer to the
      Proxmox VE Administrator Guide, section Proxmox VE Storage (see U(https://pve.proxmox.com/pve-docs/chapter-pvesm.html)
      for the latest version, tables 3 to 14) to find out format supported by the provided storage backend.
  vmid:
    type: int
    description: Specifies the instance ID. If not set the next available ID will be fetched from ProxmoxAPI.
  watchdog:
    type: str
    description: Creates a virtual hardware watchdog device.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create new VM with minimal options\n  community.general.proxmox_kvm:\n    api_user:\
  \ root@pam\n    api_password: secret\n    api_host: helldorado\n    name: spynal\n    node: sabrewulf\n\
  \n- name: Create a VM from archive (backup)\n  community.general.proxmox_kvm:\n    api_user: root@pam\n\
  \    api_password: secret\n    api_host: helldorado\n    archive: backup-storage:backup/vm/140/2023-03-08T06:41:23Z\n\
  \    name: spynal\n\n- name: Create new VM with minimal options and given vmid\n  community.general.proxmox_kvm:\n\
  \    api_user: root@pam\n    api_password: secret\n    api_host: helldorado\n    name: spynal\n    node:\
  \ sabrewulf\n    vmid: 100\n\n- name: Create new VM with two network interface options\n  community.general.proxmox_kvm:\n\
  \    api_user: root@pam\n    api_password: secret\n    api_host: helldorado\n    name: spynal\n    node:\
  \ sabrewulf\n    net:\n      net0: 'virtio,bridge=vmbr1,rate=200'\n      net1: 'e1000,bridge=vmbr2'\n\
  \n- name: Create new VM with one network interface, three virto hard disk, 4 cores, and 2 vcpus\n  community.general.proxmox_kvm:\n\
  \    api_user: root@pam\n    api_password: secret\n    api_host: helldorado\n    name: spynal\n    node:\
  \ sabrewulf\n    net:\n      net0: 'virtio,bridge=vmbr1,rate=200'\n    virtio:\n      virtio0: 'VMs_LVM:10'\n\
  \      virtio1: 'VMs:2,format=qcow2'\n      virtio2: 'VMs:5,format=raw'\n    cores: 4\n    vcpus: 2\n\
  \n- name: Create VM with 1 10GB SATA disk and an EFI disk, with Secure Boot disabled by default\n  community.general.proxmox_kvm:\n\
  \    api_user: root@pam\n    api_password: secret\n    api_host: helldorado\n    name: spynal\n    node:\
  \ sabrewulf\n    sata:\n      sata0: 'VMs_LVM:10,format=raw'\n    bios: ovmf\n    efidisk0:\n      storage:\
  \ VMs_LVM_thin\n      format: raw\n      efitype: 4m\n      pre_enrolled_keys: false\n\n- name: Create\
  \ VM with 1 10GB SATA disk and an EFI disk, with Secure Boot enabled by default\n  community.general.proxmox_kvm:\n\
