name: xcc_redfish_command
fqcn: community.general.xcc_redfish_command
collection: community.general
short_description: Manages Lenovo Out-Of-Band controllers using Redfish APIs
description: Builds Redfish URIs locally and sends them to remote OOB controllers to perform an action
  or get information back or update a configuration attribute. Manages virtual media. Supports getting
  information back via GET method. Supports updating a configuration attribute via PATCH method. Supports
  performing an action via POST method.
options:
  auth_token:
    type: str
    description: Security token for authentication with OOB controller
  baseuri:
    type: str
    required: true
    description: Base URI of OOB controller.
  category:
    type: str
    required: true
    description: Category to execute on OOB controller.
  command:
    type: list
    required: true
    description: List of commands to execute on OOB controller.
  password:
    type: str
    description: Password for authentication with OOB controller.
  request_body:
    type: dict
    description: The request body to patch or post.
  resource_id:
    type: str
    description: The ID of the System, Manager or Chassis to modify.
  resource_uri:
    type: str
    description: The resource uri to get or patch or post.
  timeout:
    type: int
    default: 10
    description: Timeout in seconds for URL requests to OOB controller.
  username:
    type: str
    description: Username for authentication with OOB controller.
  virtual_media:
    type: dict
    description: The options for VirtualMedia commands.
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Insert Virtual Media\n    community.general.xcc_redfish_command:\n      category:\
  \ Manager\n      command: VirtualMediaInsert\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{\
  \ username }}\"\n      password: \"{{ password }}\"\n      virtual_media:\n        image_url: \"http://example.com/images/SomeLinux-current.iso\"\
  \n        media_types:\n          - CD\n          - DVD\n      resource_id: \"1\"\n\n  - name: Eject\
  \ Virtual Media\n    community.general.xcc_redfish_command:\n      category: Manager\n      command:\
  \ VirtualMediaEject\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n      virtual_media:\n        image_url: \"http://example.com/images/SomeLinux-current.iso\"\
  \n      resource_id: \"1\"\n\n  - name: Eject all Virtual Media\n    community.general.xcc_redfish_command:\n\
  \      category: Manager\n      command: VirtualMediaEject\n      baseuri: \"{{ baseuri }}\"\n     \
  \ username: \"{{ username }}\"\n      password: \"{{ password }}\"\n      resource_id: \"1\"\n\n  -\
  \ name: Get ComputeSystem Oem property SystemStatus via GetResource command\n    community.general.xcc_redfish_command:\n\
  \      category: Raw\n      command: GetResource\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      resource_uri: \"/redfish/v1/Systems/1\"\
  \n    register: result\n  - ansible.builtin.debug:\n      msg: \"{{ result.redfish_facts.data.Oem.Lenovo.SystemStatus\
  \ }}\"\n\n  - name: Get Oem DNS setting via GetResource command\n    community.general.xcc_redfish_command:\n\
  \      category: Raw\n      command: GetResource\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      resource_uri: \"/redfish/v1/Managers/1/NetworkProtocol/Oem/Lenovo/DNS\"\
  \n    register: result\n\n  - name: Print fetched information\n    ansible.builtin.debug:\n      msg:\
  \ \"{{ result.redfish_facts.data }}\"\n\n  - name: Get Lenovo FoD key collection resource via GetCollectionResource\
  \ command\n    community.general.xcc_redfish_command:\n      category: Raw\n      command: GetCollectionResource\n\
  \      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password\
  \ }}\"\n      resource_uri: \"/redfish/v1/Managers/1/Oem/Lenovo/FoD/Keys\"\n    register: result\n\n\
  \  - name: Print fetched information\n    ansible.builtin.debug:\n      msg: \"{{ result.redfish_facts.data_list\
  \ }}\"\n\n  - name: Update ComputeSystem property AssetTag via PatchResource command\n    community.general.xcc_redfish_command:\n\
  \      category: Raw\n      command: PatchResource\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n      resource_uri: \"/redfish/v1/Systems/1\"\
  \n      request_body:\n        AssetTag: \"new_asset_tag\"\n\n  - name: Perform BootToBIOSSetup action\
  \ via PostResource command\n    community.general.xcc_redfish_command:\n      category: Raw\n      command:\
  \ PostResource\n      baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password:\
  \ \"{{ password }}\"\n      resource_uri: \"/redfish/v1/Systems/1/Actions/Oem/LenovoComputerSystem.BootToBIOSSetup\"\
  \n      request_body: {}\n\n  - name: Perform SecureBoot.ResetKeys action via PostResource command\n\
  \    community.general.xcc_redfish_command:\n      category: Raw\n      command: PostResource\n    \
  \  baseuri: \"{{ baseuri }}\"\n      username: \"{{ username }}\"\n      password: \"{{ password }}\"\
  \n      resource_uri: \"/redfish/v1/Systems/1/SecureBoot/Actions/SecureBoot.ResetKeys\"\n      request_body:\n\
  \        ResetKeysType: DeleteAllKeys\n\n  - name: Create session\n    community.general.redfish_command:\n\
  \      category: Sessions\n      command: CreateSession\n      baseuri: \"{{ baseuri }}\"\n      username:\
  \ \"{{ username }}\"\n      password: \"{{ password }}\"\n    register: result\n\n  - name: Update Manager\
  \ DateTimeLocalOffset property using security token for auth\n    community.general.xcc_redfish_command:\n\
  \      category: Raw\n      command: PatchResource\n      baseuri: \"{{ baseuri }}\"\n      auth_token:\
  \ \"{{ result.session.token }}\"\n      resource_uri: \"/redfish/v1/Managers/1\"\n      request_body:\n\
  \        DateTimeLocalOffset: \"+08:00\"\n\n  - name: Delete session using security token created by\
  \ CreateSesssion above\n    community.general.redfish_command:\n      category: Sessions\n      command:\
  \ DeleteSession\n      baseuri: \"{{ baseuri }}\"\n      auth_token: \"{{ result.session.token }}\"\n\
  \      session_uri: \"{{ result.session.uri }}\"\n"
