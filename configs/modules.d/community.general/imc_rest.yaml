name: imc_rest
fqcn: community.general.imc_rest
collection: community.general
short_description: Manage Cisco IMC hardware through its REST API
description: Provides direct access to the Cisco IMC REST API. Perform any configuration changes and actions
  that the Cisco IMC supports. More information about the IMC REST API is available from U(http://www.cisco.com/c/en/us/td/docs/unified_computing/ucs/c/sw/api/3_0/b_Cisco_IMC_api_301.html).
options:
  content:
    type: str
    description: When used instead of O(path), sets the content of the API requests directly. This may
      be convenient to template simple requests, for anything complex use the M(ansible.builtin.template)
      module. You can collate multiple IMC XML fragments and they will be processed sequentially in a
      single stream, the Cisco IMC output is subsequently merged. Parameter O(content) is mutual exclusive
      with parameter O(path).
  hostname:
    type: str
    required: true
    aliases:
    - host
    - ip
    description: IP Address or hostname of Cisco IMC, resolvable by Ansible control host.
  password:
    type: str
    default: password
    description: The password to use for authentication.
  path:
    type: path
    aliases:
    - src
    - config_file
    description: Name of the absolute path of the filename that includes the body of the http request
      being sent to the Cisco IMC REST API. Parameter O(path) is mutual exclusive with parameter O(content).
  protocol:
    type: str
    default: https
    choices:
    - http
    - https
    description: Connection protocol to use.
  timeout:
    type: int
    default: 60
    description: The socket level timeout in seconds. This is the time that every single connection (every
      fragment) can spend. If this O(timeout) is reached, the module will fail with a C(Connection failure)
      indicating that C(The read operation timed out).
  username:
    type: str
    default: admin
    aliases:
    - user
    description: Username used to login to the switch.
  validate_certs:
    type: bool
    default: true
    description: If V(false), SSL certificates will not be validated. This should only set to V(false)
      used on personally controlled sites using self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Power down server\n  community.general.imc_rest:\n    hostname: '{{ imc_hostname\
  \ }}'\n    username: '{{ imc_username }}'\n    password: '{{ imc_password }}'\n    validate_certs: false\
  \  # only do this when you trust the network!\n    content: |\n      <configConfMo><inConfig>\n    \
  \    <computeRackUnit dn=\"sys/rack-unit-1\" adminPower=\"down\"/>\n      </inConfig></configConfMo>\n\
  \  delegate_to: localhost\n\n- name: Configure IMC using multiple XML fragments\n  community.general.imc_rest:\n\
  \    hostname: '{{ imc_hostname }}'\n    username: '{{ imc_username }}'\n    password: '{{ imc_password\
  \ }}'\n    validate_certs: false  # only do this when you trust the network!\n    timeout: 120\n   \
  \ content: |\n      <!-- Configure Serial-on-LAN -->\n      <configConfMo><inConfig>\n        <solIf\
  \ dn=\"sys/rack-unit-1/sol-if\" adminState=\"enable\" speed==\"115200\" comport=\"com0\"/>\n      </inConfig></configConfMo>\n\
  \n      <!-- Configure Console Redirection -->\n      <configConfMo><inConfig>\n        <biosVfConsoleRedirection\
  \ dn=\"sys/rack-unit-1/bios/bios-settings/Console-redirection\"\n          vpBaudRate=\"115200\"\n \
  \         vpConsoleRedirection=\"com-0\"\n          vpFlowControl=\"none\"\n          vpTerminalType=\"\
  vt100\"\n          vpPuttyKeyPad=\"LINUX\"\n          vpRedirectionAfterPOST=\"Always Enable\"/>\n \
  \     </inConfig></configConfMo>\n  delegate_to: localhost\n\n- name: Enable PXE boot and power-cycle\
  \ server\n  community.general.imc_rest:\n    hostname: '{{ imc_hostname }}'\n    username: '{{ imc_username\
  \ }}'\n    password: '{{ imc_password }}'\n    validate_certs: false  # only do this when you trust\
  \ the network!\n    content: |\n      <!-- Configure PXE boot -->\n      <configConfMo><inConfig>\n\
  \        <lsbootLan dn=\"sys/rack-unit-1/boot-policy/lan-read-only\" access=\"read-only\" order=\"1\"\
  \ prot=\"pxe\" type=\"lan\"/>\n      </inConfig></configConfMo>\n\n      <!-- Power cycle server -->\n\
  \      <configConfMo><inConfig>\n        <computeRackUnit dn=\"sys/rack-unit-1\" adminPower=\"cycle-immediate\"\
  />\n      </inConfig></configConfMo>\n  delegate_to: localhost\n\n- name: Reconfigure IMC to boot from\
  \ storage\n  community.general.imc_rest:\n    hostname: '{{ imc_host }}'\n    username: '{{ imc_username\
  \ }}'\n    password: '{{ imc_password }}'\n    validate_certs: false  # only do this when you trust\
  \ the network!\n    content: |\n      <configConfMo><inConfig>\n        <lsbootStorage dn=\"sys/rack-unit-1/boot-policy/storage-read-write\"\
  \ access=\"read-write\" order=\"1\" type=\"storage\"/>\n      </inConfig></configConfMo>\n  delegate_to:\
  \ localhost\n\n- name: Add customer description to server\n  community.general.imc_rest:\n    hostname:\
  \ '{{ imc_host }}'\n    username: '{{ imc_username }}'\n    password: '{{ imc_password }}'\n    validate_certs:\
  \ false  # only do this when you trust the network!\n    content: |\n        <configConfMo><inConfig>\n\
  \          <computeRackUnit dn=\"sys/rack-unit-1\" usrLbl=\"Customer Lab - POD{{ pod_id }} - {{ inventory_hostname_short\
  \ }}\"/>\n        </inConfig></configConfMo>\n    delegate_to: localhost\n\n- name: Disable HTTP and\
  \ increase session timeout to max value 10800 secs\n  community.general.imc_rest:\n    hostname: '{{\
  \ imc_host }}'\n    username: '{{ imc_username }}'\n    password: '{{ imc_password }}'\n    validate_certs:\
  \ false  # only do this when you trust the network!\n    timeout: 120\n    content: |\n        <configConfMo><inConfig>\n\
  \          <commHttp dn=\"sys/svc-ext/http-svc\" adminState=\"disabled\"/>\n        </inConfig></configConfMo>\n\
  \n        <configConfMo><inConfig>\n          <commHttps dn=\"sys/svc-ext/https-svc\" adminState=\"\
  enabled\" sessionTimeout=\"10800\"/>\n        </inConfig></configConfMo>\n    delegate_to: localhost\n"
