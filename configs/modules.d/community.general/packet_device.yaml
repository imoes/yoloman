name: packet_device
fqcn: community.general.packet_device
collection: community.general
short_description: Manage a bare metal server in the Packet Host
description: Manage a bare metal server in the Packet Host (a "device" in the API terms). When the machine
  is created it can optionally wait for public IP address, or for active state. This module has a dependency
  on packet >= 1.0. API is documented at U(https://www.packet.net/developers/api/devices).
options:
  always_pxe:
    type: bool
    default: false
    description: Persist PXE as the first boot option. Normally, the PXE process happens only on the first
      boot. Set this arg to have your device continuously boot to iPXE.
  auth_token:
    type: str
    description: Packet API token. You can also supply it in environment variable E(PACKET_API_TOKEN).
  count:
    type: int
    default: 1
    description: The number of devices to create. Count number can be included in hostname via the %d
      string formatter.
  count_offset:
    type: int
    default: 1
    description: From which number to start the count.
  device_ids:
    type: list
    description: List of device IDs on which to operate.
  facility:
    type: str
    description: Facility slug for device creation. See Packet API for current list - U(https://www.packet.net/developers/api/facilities/).
  features:
    type: dict
    description: Dict with "features" for device creation. See Packet API docs for details.
  hostnames:
    type: list
    aliases:
    - name
    description: A hostname of a device, or a list of hostnames. If given string or one-item list, you
      can use the C("%d") Python string format to expand numbers from O(count). If only one hostname,
      it might be expanded to list if O(count)>1.
  ipxe_script_url:
    type: str
    default: ''
    description: URL of custom iPXE script for provisioning. More about custom iPXE for Packet devices
      at U(https://help.packet.net/technical/infrastructure/custom-ipxe).
  locked:
    type: bool
    default: false
    aliases:
    - lock
    description: Whether to lock a created device.
  operating_system:
    type: str
    description: OS slug for device creation. See Packet API for current list - U(https://www.packet.net/developers/api/operatingsystems/).
  plan:
    type: str
    description: Plan slug for device creation. See Packet API for current list - U(https://www.packet.net/developers/api/plans/).
  project_id:
    type: str
    required: true
    description: ID of project of the device.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - active
    - inactive
    - rebooted
    description: Desired state of the device. If set to V(present) (the default), the module call will
      return immediately after the device-creating HTTP request successfully returns. If set to V(active),
      the module call will block until all the specified devices are in state active due to the Packet
      API, or until O(wait_timeout).
  tags:
    type: list
    description: List of device tags. Currently implemented only for device creation.
  user_data:
    type: str
    description: Userdata blob made available to the machine
  wait_for_public_IPv:
    type: int
    choices:
    - 4
    - 6
    description: Whether to wait for the instance to be assigned a public IPv4/IPv6 address. If set to
      4, it will wait until IPv4 is assigned to the instance. If set to 6, wait until public IPv6 is assigned
      to the instance.
  wait_timeout:
    type: int
    default: 900
    description: How long (seconds) to wait either for automatic IP address assignment, or for the device
      to reach the V(active) state. If O(wait_for_public_IPv) is set and O(state=active), the module will
      wait for both events consequently, applying the timeout twice.
writes: true
runtime: starlark
source: translated
examples: "\n# All the examples assume that you have your Packet API token in environment variable PACKET_API_TOKEN.\n\
  # You can also pass it to the auth_token parameter of the module instead.\n\n# Creating devices\n\n\
  - name: Create 1 device\n  hosts: localhost\n  tasks:\n  - community.general.packet_device:\n      project_id:\
  \ 89b497ee-5afc-420a-8fb5-56984898f4df\n      hostnames: myserver\n      tags: ci-xyz\n      operating_system:\
  \ ubuntu_16_04\n      plan: baremetal_0\n      facility: sjc1\n\n# Create the same device and wait until\
  \ it is in state \"active\", (when it's\n# ready for other API operations). Fail if the device is not\
  \ \"active\" in\n# 10 minutes.\n\n- name: Create device and wait up to 10 minutes for active state\n\
  \  hosts: localhost\n  tasks:\n  - community.general.packet_device:\n      project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n\
  \      hostnames: myserver\n      operating_system: ubuntu_16_04\n      plan: baremetal_0\n      facility:\
  \ sjc1\n      state: active\n      wait_timeout: 600\n\n- name: Create 3 ubuntu devices called server-01,\
  \ server-02 and server-03\n  hosts: localhost\n  tasks:\n  - community.general.packet_device:\n    \
  \  project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n      hostnames: server-%02d\n      count: 3\n\
  \      operating_system: ubuntu_16_04\n      plan: baremetal_0\n      facility: sjc1\n\n- name: Create\
  \ 3 coreos devices with userdata, wait until they get IPs and then wait for SSH\n  hosts: localhost\n\
  \  tasks:\n  - name: Create 3 devices and register their facts\n    community.general.packet_device:\n\
  \      hostnames: [coreos-one, coreos-two, coreos-three]\n      operating_system: coreos_stable\n  \
  \    plan: baremetal_0\n      facility: ewr1\n      locked: true\n      project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n\
  \      wait_for_public_IPv: 4\n      user_data: |\n        #cloud-config\n        ssh_authorized_keys:\n\
  \          - {{ lookup('file', 'my_packet_sshkey') }}\n        coreos:\n          etcd:\n          \
  \  discovery: https://discovery.etcd.io/6a28e078895c5ec737174db2419bb2f3\n            addr: $private_ipv4:4001\n\
  \            peer-addr: $private_ipv4:7001\n          fleet:\n            public-ip: $private_ipv4\n\
  \          units:\n            - name: etcd.service\n              command: start\n            - name:\
  \ fleet.service\n              command: start\n    register: newhosts\n\n  - name: Wait for ssh\n  \
  \  ansible.builtin.wait_for:\n      delay: 1\n      host: \"{{ item.public_ipv4 }}\"\n      port: 22\n\
  \      state: started\n      timeout: 500\n    with_items: \"{{ newhosts.devices }}\"\n\n\n# Other states\
  \ of devices\n\n- name: Remove 3 devices by uuid\n  hosts: localhost\n  tasks:\n  - community.general.packet_device:\n\
  \      project_id: 89b497ee-5afc-420a-8fb5-56984898f4df\n      state: absent\n      device_ids:\n  \
  \      - 1fb4faf8-a638-4ac7-8f47-86fe514c30d8\n        - 2eb4faf8-a638-4ac7-8f47-86fe514c3043\n    \
  \    - 6bb4faf8-a638-4ac7-8f47-86fe514c301f\n"
