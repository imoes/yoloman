name: pkgng
fqcn: community.general.pkgng
collection: community.general
short_description: Package manager for FreeBSD >= 9.0
description: Manage binary packages for FreeBSD using 'pkgng' which is available in versions after 9.0.
options:
  annotation:
    type: list
    description: A list of keyvalue-pairs of the form C(<+/-/:><key>[=<value>]). A V(+) denotes adding
      an annotation, a V(-) denotes removing an annotation, and V(:) denotes modifying an annotation.
      If setting or modifying annotations, a value must be provided.
  autoremove:
    type: bool
    default: false
    description: Remove automatically installed packages which are no longer needed.
  cached:
    type: bool
    default: false
    description: Use local package base instead of fetching an updated one.
  chroot:
    type: path
    description: Pkg will chroot in the specified environment. Can not be used together with O(rootdir)
      or O(jail) options.
  ignore_osver:
    type: bool
    default: false
    description: Ignore FreeBSD OS version check, useful on -STABLE and -CURRENT branches. Defines the
      E(IGNORE_OSVERSION) environment variable.
  jail:
    type: str
    description: Pkg will execute in the given jail name or id. Can not be used together with O(chroot)
      or O(rootdir) options.
  name:
    type: list
    required: true
    aliases:
    - pkg
    description: Name or list of names of packages to install/remove. With O(name=*), O(state=latest)
      will operate, but O(state=present) and O(state=absent) will be noops.
  pkgsite:
    type: str
    description: For pkgng versions before 1.1.4, specify packagesite to use for downloading packages.
      If not specified, use settings from C(/usr/local/etc/pkg.conf). For newer pkgng versions, specify
      a the name of a repository configured in C(/usr/local/etc/pkg/repos).
  rootdir:
    type: path
    description: For pkgng versions 1.5 and later, pkg will install all packages within the specified
      root directory. Can not be used together with O(chroot) or O(jail) options.
  state:
    type: str
    default: present
    choices:
    - present
    - latest
    - absent
    description: State of the package.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install package foo\n  community.general.pkgng:\n    name: foo\n    state: present\n\
  \n- name: Annotate package foo and bar\n  community.general.pkgng:\n    name:\n      - foo\n      -\
  \ bar\n    annotation: '+test1=baz,-test2,:test3=foobar'\n\n- name: Remove packages foo and bar\n  community.general.pkgng:\n\
  \    name:\n      - foo\n      - bar\n    state: absent\n\n# \"latest\" support added in 2.7\n- name:\
  \ Upgrade package baz\n  community.general.pkgng:\n    name: baz\n    state: latest\n\n- name: Upgrade\
  \ all installed packages (see warning for the name option first!)\n  community.general.pkgng:\n    name:\
  \ \"*\"\n    state: latest\n"
