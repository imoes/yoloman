name: lxca_cmms
fqcn: community.general.lxca_cmms
collection: community.general
short_description: Custom module for lxca cmms inventory utility
description: This module returns/displays a inventory details of cmms
options:
  auth_url:
    type: str
    required: true
    description: lxca HTTPS full web address.
  chassis:
    type: str
    description: uuid of chassis, this is string with length greater than 16.
  command_options:
    type: str
    default: cmms
    choices:
    - cmms
    - cmms_by_uuid
    - cmms_by_chassis_uuid
    description: options to filter nodes information
  login_password:
    type: str
    required: true
    description: The password for use in HTTP basic authentication.
  login_user:
    type: str
    required: true
    description: The username for use in HTTP basic authentication.
  uuid:
    type: str
    description: uuid of device, this is string with length greater than 16.
writes: true
runtime: starlark
source: translated
examples: "\n# get all cmms info\n- name: Get nodes data from LXCA\n  community.general.lxca_cmms:\n \
  \   login_user: USERID\n    login_password: Password\n    auth_url: \"https://10.243.15.168\"\n\n# get\
  \ specific cmms info by uuid\n- name: Get nodes data from LXCA\n  community.general.lxca_cmms:\n   \
  \ login_user: USERID\n    login_password: Password\n    auth_url: \"https://10.243.15.168\"\n    uuid:\
  \ \"3C737AA5E31640CE949B10C129A8B01F\"\n    command_options: cmms_by_uuid\n\n# get specific cmms info\
  \ by chassis uuid\n- name: Get nodes data from LXCA\n  community.general.lxca_cmms:\n    login_user:\
  \ USERID\n    login_password: Password\n    auth_url: \"https://10.243.15.168\"\n    chassis: \"3C737AA5E31640CE949B10C129A8B01F\"\
  \n    command_options: cmms_by_chassis_uuid\n\n"
