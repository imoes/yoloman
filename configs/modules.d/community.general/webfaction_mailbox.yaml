name: webfaction_mailbox
fqcn: community.general.webfaction_mailbox
collection: community.general
short_description: Add or remove mailboxes on Webfaction
description: Add or remove mailboxes on a Webfaction account. Further documentation at https://github.com/quentinsf/ansible-webfaction.
options:
  login_name:
    type: str
    required: true
    description: The webfaction account to use
  login_password:
    type: str
    required: true
    description: The webfaction password to use
  mailbox_name:
    type: str
    required: true
    description: The name of the mailbox
  mailbox_password:
    type: str
    required: true
    description: The password for the mailbox
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the mailbox should exist
writes: true
runtime: starlark
source: translated
examples: "\n  - name: Create a mailbox\n    community.general.webfaction_mailbox:\n      mailbox_name=\"\
  mybox\"\n      mailbox_password=\"myboxpw\"\n      state=present\n      login_name={{webfaction_user}}\n\
  \      login_password={{webfaction_passwd}}\n"
