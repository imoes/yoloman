name: utm_proxy_frontend
fqcn: community.general.utm_proxy_frontend
collection: community.general
short_description: Create, update or destroy reverse_proxy frontend entry in Sophos UTM
description: Create, update or destroy a reverse_proxy frontend entry in Sophos UTM. This module needs
  to have the REST Ability of the UTM to be activated.
options:
  add_content_type_header:
    type: bool
    default: false
    description: Whether to add the content type header or not
  address:
    type: str
    default: REF_DefaultInternalAddress
    description: The reference name of the network/interface_address object.
  allowed_networks:
    type: list
    default:
    - REF_NetworkAny
    description: A list of reference names for the allowed networks.
  certificate:
    type: str
    default: ''
    description: The reference name of the ca/host_key_cert object.
  comment:
    type: str
    default: ''
    description: An optional comment to add to the object
  disable_compression:
    type: bool
    default: false
    description: Whether to enable the compression
  domain:
    type: list
    description: A list of domain names for the frontend object
  exceptions:
    type: list
    default: []
    description: A list of exception ref names (reverse_proxy/exception)
  headers:
    type: dict
    default: {}
    description: A dictionary of additional headers to be sent to POST and PUT requests. Is needed for
      some modules.
  htmlrewrite:
    type: bool
    default: false
    description: Whether to enable html rewrite or not
  htmlrewrite_cookies:
    type: bool
    default: false
    description: Whether to enable html rewrite cookie or not
  implicitredirect:
    type: bool
    default: false
    description: Whether to enable implicit redirection or not
  lbmethod:
    type: str
    default: bybusyness
    choices:
    - ''
    - bybusyness
    - bytraffic
    - byrequests
    description: Which loadbalancer method should be used
  locations:
    type: list
    default: []
    description: A list of location ref names (reverse_proxy/location)
  name:
    type: str
    required: true
    description: The name of the object. Will be used to identify the entry
  port:
    type: int
    default: 80
    description: The frontend http port
  preservehost:
    type: bool
    default: false
    description: Whether to preserve host header
  profile:
    type: str
    default: ''
    description: The reference string of the reverse_proxy/profile
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: The desired state of the object. V(present) will create or update an object. V(absent)
      will delete an object if it was present.
  status:
    type: bool
    default: true
    description: Whether to activate the frontend entry or not
  type:
    type: str
    default: http
    choices:
    - http
    - https
    description: Which protocol should be used
  utm_host:
    type: str
    required: true
    description: The REST Endpoint of the Sophos UTM.
  utm_port:
    type: int
    default: 4444
    description: The port of the REST interface.
  utm_protocol:
    type: str
    default: https
    choices:
    - http
    - https
    description: The protocol of the REST Endpoint.
  utm_token:
    type: str
    required: true
    description: The token used to identify at the REST-API. See U(https://www.sophos.com/en-us/medialibrary/PDFs/documentation/UTMonAWS/Sophos-UTM-RESTful-API.pdf?la=en),
      Chapter 2.4.2.
  validate_certs:
    type: bool
    default: true
    description: Whether the REST interface's ssl certificate should be verified or not.
  xheaders:
    type: bool
    default: false
    description: Whether to pass the host header or not
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create utm proxy_frontend\n  community.general.utm_proxy_frontend:\n    utm_host:\
  \ sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestFrontendEntry\n    host: REF_OBJECT_STRING\n\
  \    state: present\n\n- name: Remove utm proxy_frontend\n  community.general.utm_proxy_frontend:\n\
  \    utm_host: sophos.host.name\n    utm_token: abcdefghijklmno1234\n    name: TestFrontendEntry\n \
  \   state: absent\n"
