name: rax_meta
fqcn: community.general.rax_meta
collection: community.general
short_description: Manipulate metadata for Rackspace Cloud Servers
description: Manipulate metadata for Rackspace Cloud Servers
options:
  address:
    type: str
    description: Server IP address to modify metadata for, will match any IP assigned to the server
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  id:
    type: str
    description: Server ID to modify metadata for
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  meta:
    type: dict
    default: {}
    description: A hash of metadata to associate with the instance
  name:
    type: str
    description: Server name to modify metadata for
  region:
    type: str
    description: Region to create an instance in.
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set metadata for a server\n  hosts: all\n  gather_facts: false\n  tasks:\n    - name:\
  \ Set metadata\n      local_action:\n        module: rax_meta\n        credentials: ~/.raxpub\n    \
  \    name: \"{{ inventory_hostname }}\"\n        region: DFW\n        meta:\n          group: primary_group\n\
  \          groups:\n            - group_two\n            - group_three\n          app: my_app\n\n  \
  \  - name: Clear metadata\n      local_action:\n        module: rax_meta\n        credentials: ~/.raxpub\n\
  \        name: \"{{ inventory_hostname }}\"\n        region: DFW\n"
