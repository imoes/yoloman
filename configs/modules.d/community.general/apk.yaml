name: apk
fqcn: community.general.apk
collection: community.general
short_description: Manages apk packages
description: Manages C(apk) packages for Alpine Linux.
options:
  available:
    type: bool
    default: false
    description: During upgrade, reset versioned world dependencies and change logic to prefer replacing
      or downgrading packages (instead of holding them) if the currently installed package is no longer
      available from any repository.
  name:
    type: list
    description: A package name, like V(foo), or multiple packages, like V(foo, bar).
  no_cache:
    type: bool
    default: false
    description: Do not use any local cache path.
  repository:
    type: list
    description: A package repository or multiple repositories. Unlike with the underlying apk command,
      this list will override the system repositories rather than supplement them.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - latest
    - installed
    - removed
    description: Indicates the desired package(s) state. V(present) ensures the package(s) is/are present.
      V(installed) can be used as an alias. V(absent) ensures the package(s) is/are absent. V(removed)
      can be used as an alias. V(latest) ensures the package(s) is/are present and the latest version(s).
  update_cache:
    type: bool
    default: false
    description: Update repository indexes. Can be run with other steps or on it's own.
  upgrade:
    type: bool
    default: false
    description: Upgrade all installed packages to their latest version.
  world:
    type: str
    default: /etc/apk/world
    description: Use a custom world file when checking for explicitly installed packages.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Update repositories and install foo package\n  community.general.apk:\n    name:\
  \ foo\n    update_cache: true\n\n- name: Update repositories and install foo and bar packages\n  community.general.apk:\n\
  \    name: foo,bar\n    update_cache: true\n\n- name: Remove foo package\n  community.general.apk:\n\
  \    name: foo\n    state: absent\n\n- name: Remove foo and bar packages\n  community.general.apk:\n\
  \    name: foo,bar\n    state: absent\n\n- name: Install the package foo\n  community.general.apk:\n\
  \    name: foo\n    state: present\n\n- name: Install the packages foo and bar\n  community.general.apk:\n\
  \    name: foo,bar\n    state: present\n\n- name: Update repositories and update package foo to latest\
  \ version\n  community.general.apk:\n    name: foo\n    state: latest\n    update_cache: true\n\n- name:\
  \ Update repositories and update packages foo and bar to latest versions\n  community.general.apk:\n\
  \    name: foo,bar\n    state: latest\n    update_cache: true\n\n- name: Update all installed packages\
  \ to the latest versions\n  community.general.apk:\n    upgrade: true\n\n- name: Upgrade / replace /\
  \ downgrade / uninstall all installed packages to the latest versions available\n  community.general.apk:\n\
  \    available: true\n    upgrade: true\n\n- name: Update repositories as a separate step\n  community.general.apk:\n\
  \    update_cache: true\n\n- name: Install package from a specific repository\n  community.general.apk:\n\
  \    name: foo\n    state: latest\n    update_cache: true\n    repository: http://dl-3.alpinelinux.org/alpine/edge/main\n\
  \n- name: Install package without using cache\n  community.general.apk:\n    name: foo\n    state: latest\n\
  \    no_cache: true\n\n- name: Install package checking a custom world\n  community.general.apk:\n \
  \   name: foo\n    state: latest\n    world: /etc/apk/world.custom\n"
