name: archive
fqcn: community.general.archive
collection: community.general
short_description: Creates a compressed archive of one or more files or trees
description: Creates or extends an archive. The source and archive are on the remote host, and the archive
  I(is not) copied to the local host. Source files can be deleted after archival by specifying O(remove=True).
options:
  attributes:
    type: str
    aliases:
    - attr
    description: The attributes the resulting filesystem object should have. To get supported flags look
      at the man page for I(chattr) on the target system. This string should contain the attributes in
      the same order as the one displayed by I(lsattr). The C(=) operator is assumed as default, otherwise
      C(+) or C(-) operators need to be included in the string.
  dest:
    type: path
    description: The file name of the destination archive. The parent directory must exists on the remote
      host. This is required when O(path) refers to multiple files by either specifying a glob, a directory
      or multiple paths in a list. If the destination archive already exists, it will be truncated and
      overwritten.
  exclude_path:
    type: list
    default: []
    description: Remote absolute path, glob, or list of paths or globs for the file or files to exclude
      from O(path) list and glob expansion. Use O(exclusion_patterns) to instead exclude files or subdirectories
      below any of the paths from the O(path) list.
  exclusion_patterns:
    type: list
    description: Glob style patterns to exclude files or directories from the resulting archive. This
      differs from O(exclude_path) which applies only to the source paths from O(path).
  force_archive:
    type: bool
    default: false
    description: Allows you to force the module to treat this as an archive even if only a single file
      is specified. By default when a single file is specified it is compressed only (not archived). Enable
      this if you want to use M(ansible.builtin.unarchive) on an archive of a single file created with
      this module.
  format:
    type: str
    default: gz
    choices:
    - bz2
    - gz
    - tar
    - xz
    - zip
    description: The type of compression to use.
  group:
    type: str
    description: Name of the group that should own the filesystem object, as would be fed to I(chown).
      When left unspecified, it uses the current group of the current user unless you are root, in which
      case it can preserve the previous ownership.
  mode:
    type: raw
    description: The permissions the resulting filesystem object should have. For those used to I(/usr/bin/chmod)
      remember that modes are actually octal numbers. You must give Ansible enough information to parse
      them correctly. For consistent results, quote octal numbers (for example, V('644') or V('1777'))
      so Ansible receives a string and can do its own conversion from string into number. Adding a leading
      zero (for example, V(0755)) works sometimes, but can fail in loops and some other circumstances.
      Giving Ansible a number without following either of these rules will end up with a decimal number
      which will have unexpected results. As of Ansible 1.8, the mode may be specified as a symbolic mode
      (for example, V(u+rwx) or V(u=rw,g=r,o=r)). If O(mode) is not specified and the destination filesystem
      object B(does not) exist, the default C(umask) on the system will be used when setting the mode
      for the newly created filesystem object. If O(mode) is not specified and the destination filesystem
      object B(does) exist, the mode of the existing filesystem object will be used. Specifying O(mode)
      is the best way to ensure filesystem objects are created with the correct permissions. See CVE-2020-1736
      for further details.
  owner:
    type: str
    description: Name of the user that should own the filesystem object, as would be fed to I(chown).
      When left unspecified, it uses the current user unless you are root, in which case it can preserve
      the previous ownership. Specifying a numeric username will be assumed to be a user ID and not a
      username. Avoid numeric usernames to avoid this confusion.
  path:
    type: list
    required: true
    description: Remote absolute path, glob, or list of paths or globs for the file or files to compress
      or archive.
  remove:
    type: bool
    default: false
    description: Remove any added source files and trees after adding to archive.
  selevel:
    type: str
    description: The level part of the SELinux filesystem object context. This is the MLS/MCS attribute,
      sometimes known as the C(range). When set to V(_default), it will use the C(level) portion of the
      policy if available.
  serole:
    type: str
    description: The role part of the SELinux filesystem object context. When set to V(_default), it will
      use the C(role) portion of the policy if available.
  setype:
    type: str
    description: The type part of the SELinux filesystem object context. When set to V(_default), it will
      use the C(type) portion of the policy if available.
  seuser:
    type: str
    description: The user part of the SELinux filesystem object context. By default it uses the V(system)
      policy, where applicable. When set to V(_default), it will use the C(user) portion of the policy
      if available.
  unsafe_writes:
    type: bool
    default: false
    description: Influence when to use atomic operation to prevent data corruption or inconsistent reads
      from the target filesystem object. By default this module uses atomic operations to prevent data
      corruption or inconsistent reads from the target filesystem objects, but sometimes systems are configured
      or just broken in ways that prevent this. One example is docker mounted filesystem objects, which
      cannot be updated atomically from inside the container and can only be written in an unsafe manner.
      This option allows Ansible to fall back to unsafe methods of updating filesystem objects when atomic
      operations fail (however, it doesn't force Ansible to perform unsafe writes). IMPORTANT! Unsafe
      writes are subject to race conditions and can lead to data corruption.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Compress directory /path/to/foo/ into /path/to/foo.tgz\n  community.general.archive:\n\
  \    path: /path/to/foo\n    dest: /path/to/foo.tgz\n\n- name: Compress regular file /path/to/foo into\
  \ /path/to/foo.gz and remove it\n  community.general.archive:\n    path: /path/to/foo\n    remove: true\n\
  \n- name: Create a zip archive of /path/to/foo\n  community.general.archive:\n    path: /path/to/foo\n\
  \    format: zip\n\n- name: Create a bz2 archive of multiple files, rooted at /path\n  community.general.archive:\n\
  \    path:\n    - /path/to/foo\n    - /path/wong/foo\n    dest: /path/file.tar.bz2\n    format: bz2\n\
  \n- name: Create a bz2 archive of a globbed path, while excluding specific dirnames\n  community.general.archive:\n\
  \    path:\n    - /path/to/foo/*\n    dest: /path/file.tar.bz2\n    exclude_path:\n    - /path/to/foo/bar\n\
  \    - /path/to/foo/baz\n    format: bz2\n\n- name: Create a bz2 archive of a globbed path, while excluding\
  \ a glob of dirnames\n  community.general.archive:\n    path:\n    - /path/to/foo/*\n    dest: /path/file.tar.bz2\n\
  \    exclude_path:\n    - /path/to/foo/ba*\n    format: bz2\n\n- name: Use gzip to compress a single\
  \ archive (i.e don't archive it first with tar)\n  community.general.archive:\n    path: /path/to/foo/single.file\n\
  \    dest: /path/file.gz\n    format: gz\n\n- name: Create a tar.gz archive of a single file.\n  community.general.archive:\n\
  \    path: /path/to/foo/single.file\n    dest: /path/file.tar.gz\n    format: gz\n    force_archive:\
  \ true\n"
