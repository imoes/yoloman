name: npm
fqcn: community.general.npm
collection: community.general
short_description: Manage node.js packages with npm
description: Manage node.js packages with Node Package Manager (npm).
options:
  ci:
    type: bool
    default: false
    description: Install packages based on package-lock file, same as running C(npm ci).
  executable:
    type: path
    description: The executable location for npm. This is useful if you are using a version manager, such
      as nvm.
  global:
    type: bool
    default: false
    description: Install the node.js library globally.
  ignore_scripts:
    type: bool
    default: false
    description: Use the C(--ignore-scripts) flag when installing.
  name:
    type: str
    description: The name of a node.js library to install.
  no_bin_links:
    type: bool
    default: false
    description: Use the C(--no-bin-links) flag when installing.
  no_optional:
    type: bool
    default: false
    description: Use the C(--no-optional) flag when installing.
  path:
    type: path
    description: The base path where to install the node.js libraries.
  production:
    type: bool
    default: false
    description: Install dependencies in production mode, excluding devDependencies.
  registry:
    type: str
    description: The registry to install modules from.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - latest
    description: The state of the node.js library.
  unsafe_perm:
    type: bool
    default: false
    description: Use the C(--unsafe-perm) flag when installing.
  version:
    type: str
    description: The version to be installed.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install \"coffee-script\" node.js package.\n  community.general.npm:\n    name: coffee-script\n\
  \    path: /app/location\n\n- name: Install \"coffee-script\" node.js package on version 1.6.1.\n  community.general.npm:\n\
  \    name: coffee-script\n    version: '1.6.1'\n    path: /app/location\n\n- name: Install \"coffee-script\"\
  \ node.js package globally.\n  community.general.npm:\n    name: coffee-script\n    global: true\n\n\
  - name: Remove the globally package \"coffee-script\".\n  community.general.npm:\n    name: coffee-script\n\
  \    global: true\n    state: absent\n\n- name: Install \"coffee-script\" node.js package from custom\
  \ registry.\n  community.general.npm:\n    name: coffee-script\n    registry: 'http://registry.mysite.com'\n\
  \n- name: Install packages based on package.json.\n  community.general.npm:\n    path: /app/location\n\
  \n- name: Update packages based on package.json to their latest version.\n  community.general.npm:\n\
  \    path: /app/location\n    state: latest\n\n- name: Install packages based on package.json using\
  \ the npm installed with nvm v0.10.1.\n  community.general.npm:\n    path: /app/location\n    executable:\
  \ /opt/nvm/v0.10.1/bin/npm\n    state: present\n"
