name: gitlab_group_variable
fqcn: community.general.gitlab_group_variable
collection: community.general
short_description: Creates, updates, or deletes GitLab groups variables
description: Creates a group variable if it does not exist. When a group variable does exist, its value
  will be updated when the values are different. Variables which are untouched in the playbook, but are
  not untouched in the GitLab group, they stay untouched (O(purge=false)) or will be deleted (O(purge=true)).
options:
  api_job_token:
    type: str
    description: GitLab CI job token for logging in.
  api_oauth_token:
    type: str
    description: GitLab OAuth token for logging in.
  api_password:
    type: str
    description: The password to use for authentication against the API.
  api_token:
    type: str
    description: GitLab access token with API permissions.
  api_url:
    type: str
    description: The resolvable endpoint for the API.
  api_username:
    type: str
    description: The username to use for authentication against the API.
  ca_path:
    type: str
    description: The CA certificates bundle to use to verify GitLab server certificate.
  group:
    type: str
    required: true
    description: The path and name of the group.
  purge:
    type: bool
    default: false
    description: When set to V(true), delete all variables which are not untouched in the task.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Create or delete group variable.
  validate_certs:
    type: bool
    default: true
    description: Whether or not to validate SSL certs when supplying a HTTPS endpoint.
  variables:
    type: list
    default: []
    description: A list of dictionaries that represents CI/CD variables. This modules works internal with
      this structure, even if the older O(vars) parameter is used.
  vars:
    type: dict
    default: {}
    description: When the list element is a simple key-value pair, masked, raw and protected will be set
      to false. When the list element is a dict with the keys C(value), C(masked), C(raw) and C(protected),
      the user can have full control about whether a value should be masked, raw, protected or both. Support
      for group variables requires GitLab >= 9.5. Support for environment_scope requires GitLab Premium
      >= 13.11. Support for protected values requires GitLab >= 9.3. Support for masked values requires
      GitLab >= 11.10. Support for raw values requires GitLab >= 15.7. A C(value) must be a string or
      a number. Field C(variable_type) must be a string with either V(env_var), which is the default,
      or V(file). When a value is masked, it must be in Base64 and have a length of at least 8 characters.
      See GitLab documentation on acceptable values for a masked variable (U(https://docs.gitlab.com/ce/ci/variables/#masked-variables)).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set or update some CI/CD variables\n  community.general.gitlab_group_variable:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    group: scodeman/testgroup/\n\
  \    purge: false\n    variables:\n      - name: ACCESS_KEY_ID\n        value: abc123\n      - name:\
  \ SECRET_ACCESS_KEY\n        value: 3214cbad\n        masked: true\n        protected: true\n      \
  \  variable_type: env_var\n        environment_scope: production\n\n- name: Set or update some CI/CD\
  \ variables with raw value\n  community.general.gitlab_group_variable:\n    api_url: https://gitlab.com\n\
  \    api_token: secret_access_token\n    group: scodeman/testgroup/\n    purge: false\n    vars:\n \
  \     ACCESS_KEY_ID: abc123\n      SECRET_ACCESS_KEY:\n        value: 3214cbad\n        masked: true\n\
  \        protected: true\n        raw: true\n        variable_type: env_var\n        environment_scope:\
  \ '*'\n\n- name: Set or update some CI/CD variables with expandable value\n  community.general.gitlab_group_variable:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    group: scodeman/testgroup/\n\
  \    purge: false\n    vars:\n      ACCESS_KEY_ID: abc123\n      SECRET_ACCESS_KEY:\n        value:\
  \ '$MY_OTHER_VARIABLE'\n        masked: true\n        protected: true\n        raw: false\n        variable_type:\
  \ env_var\n        environment_scope: '*'\n\n- name: Delete one variable\n  community.general.gitlab_group_variable:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    group: scodeman/testgroup/\n\
  \    state: absent\n    vars:\n      ACCESS_KEY_ID: abc123\n"
