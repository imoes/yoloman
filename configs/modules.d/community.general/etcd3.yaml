name: etcd3
fqcn: community.general.etcd3
collection: community.general
short_description: Set or delete key value pairs from an etcd3 cluster
description: Sets or deletes values in etcd3 cluster using its v3 api. Needs python etcd3 lib to work
options:
  ca_cert:
    type: path
    description: The Certificate Authority to use to verify the etcd host. Required if O(client_cert)
      and O(client_key) are defined.
  client_cert:
    type: path
    description: PEM formatted certificate chain file to be used for SSL client authentication. Required
      if O(client_key) is defined.
  client_key:
    type: path
    description: PEM formatted file that contains your private key to be used for SSL client authentication.
      Required if O(client_cert) is defined.
  host:
    type: str
    default: localhost
    description: the IP address of the cluster
  key:
    type: str
    required: true
    description: the key where the information is stored in the cluster
  password:
    type: str
    description: The password to use for authentication. Required if O(user) is defined.
  port:
    type: int
    default: 2379
    description: the port number used to connect to the cluster
  state:
    type: str
    required: true
    choices:
    - present
    - absent
    description: the state of the value for the key. can be present or absent
  timeout:
    type: int
    description: The socket level timeout in seconds.
  user:
    type: str
    description: The etcd user to authenticate with.
  value:
    type: str
    required: true
    description: the information stored
writes: true
runtime: starlark
source: translated
examples: "\n- name: Store a value \"bar\" under the key \"foo\" for a cluster located \"http://localhost:2379\"\
  \n  community.general.etcd3:\n    key: \"foo\"\n    value: \"baz3\"\n    host: \"localhost\"\n    port:\
  \ 2379\n    state: \"present\"\n\n- name: Authenticate using user/password combination with a timeout\
  \ of 10 seconds\n  community.general.etcd3:\n    key: \"foo\"\n    value: \"baz3\"\n    state: \"present\"\
  \n    user: \"someone\"\n    password: \"password123\"\n    timeout: 10\n\n- name: Authenticate using\
  \ TLS certificates\n  community.general.etcd3:\n    key: \"foo\"\n    value: \"baz3\"\n    state: \"\
  present\"\n    ca_cert: \"/etc/ssl/certs/CA_CERT.pem\"\n    client_cert: \"/etc/ssl/certs/cert.crt\"\
  \n    client_key: \"/etc/ssl/private/key.pem\"\n"
