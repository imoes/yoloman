name: oneview_fcoe_network
fqcn: community.general.oneview_fcoe_network
collection: community.general
short_description: Manage OneView FCoE Network resources
description: Provides an interface to manage FCoE Network resources. Can create, update, or delete.
options:
  api_version:
    type: int
    description: OneView API Version.
  config:
    type: path
    description: Path to a JSON configuration file containing the OneView client configuration. The configuration
      file is optional and when used should be present in the host running the ansible commands. If the
      file path is not provided, the configuration will be loaded from environment variables. For links
      to example configuration files or how to use the environment variables verify the notes section.
  data:
    type: dict
    required: true
    description: List with FCoE Network properties.
  hostname:
    type: str
    description: IP address or hostname for the appliance.
  image_streamer_hostname:
    type: str
    description: IP address or hostname for the HPE Image Streamer REST API.
  password:
    type: str
    description: Password for API authentication.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicates the desired state for the FCoE Network resource. V(present) will ensure data
      properties are compliant with OneView. V(absent) will remove the resource from OneView, if it exists.
  username:
    type: str
    description: Username for API authentication.
  validate_etag:
    type: bool
    default: true
    description: When the ETag Validation is enabled, the request will be conditionally processed only
      if the current ETag for the resource matches the ETag provided in the data.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure that FCoE Network is present using the default configuration\n  community.general.oneview_fcoe_network:\n\
  \    config: '/etc/oneview/oneview_config.json'\n    state: present\n    data:\n      name: Test FCoE\
  \ Network\n      vlanId: 201\n  delegate_to: localhost\n\n- name: Update the FCOE network scopes\n \
  \ community.general.oneview_fcoe_network:\n    config: '/etc/oneview/oneview_config.json'\n    state:\
  \ present\n    data:\n      name: New FCoE Network\n      scopeUris:\n        - '/rest/scopes/00SC123456'\n\
  \        - '/rest/scopes/01SC123456'\n  delegate_to: localhost\n\n- name: Ensure that FCoE Network is\
  \ absent\n  community.general.oneview_fcoe_network:\n    config: '/etc/oneview/oneview_config.json'\n\
  \    state: absent\n    data:\n      name: New FCoE Network\n  delegate_to: localhost\n"
