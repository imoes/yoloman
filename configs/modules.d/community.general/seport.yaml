name: seport
fqcn: community.general.seport
collection: community.general
short_description: Manages SELinux network port type definitions
description: Manages SELinux network port type definitions.
options:
  ignore_selinux_state:
    type: bool
    default: false
    description: Run independent of selinux runtime state
  local:
    type: bool
    default: false
    description: Work with local modifications only.
  ports:
    type: list
    required: true
    description: Ports or port ranges. Can be a list (since 2.6) or comma separated string.
  proto:
    type: str
    required: true
    choices:
    - tcp
    - udp
    description: Protocol for the specified port.
  reload:
    type: bool
    default: true
    description: Reload SELinux policy after commit.
  setype:
    type: str
    required: true
    description: SELinux type for the specified port.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Desired boolean value.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Allow Apache to listen on tcp port 8888\n  community.general.seport:\n    ports:\
  \ 8888\n    proto: tcp\n    setype: http_port_t\n    state: present\n\n- name: Allow sshd to listen\
  \ on tcp port 8991\n  community.general.seport:\n    ports: 8991\n    proto: tcp\n    setype: ssh_port_t\n\
  \    state: present\n\n- name: Allow memcached to listen on tcp ports 10000-10100 and 10112\n  community.general.seport:\n\
  \    ports: 10000-10100,10112\n    proto: tcp\n    setype: memcache_port_t\n    state: present\n\n-\
  \ name: Allow memcached to listen on tcp ports 10000-10100 and 10112\n  community.general.seport:\n\
  \    ports:\n      - 10000-10100\n      - 10112\n    proto: tcp\n    setype: memcache_port_t\n    state:\
  \ present\n\n- name: Remove tcp port 22 local modification if exists\n  community.general.seport:\n\
  \    ports: 22\n    protocol: tcp\n    setype: ssh_port_t\n    state: absent\n    local: true\n"
