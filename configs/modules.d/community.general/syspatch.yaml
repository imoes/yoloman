name: syspatch
fqcn: community.general.syspatch
collection: community.general
short_description: Manage OpenBSD system patches
description: Manage OpenBSD system patches using syspatch.
options:
  revert:
    type: str
    choices:
    - all
    - one
    description: Revert system patches.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Apply all available system patches\n  community.general.syspatch:\n\n- name: Revert\
  \ last patch\n  community.general.syspatch:\n    revert: one\n\n- name: Revert all patches\n  community.general.syspatch:\n\
  \    revert: all\n\n# NOTE: You can reboot automatically if a patch requires it:\n- name: Apply all\
  \ patches and store result\n  community.general.syspatch:\n  register: syspatch\n\n- name: Reboot if\
  \ patch requires it\n  ansible.builtin.reboot:\n  when: syspatch.reboot_needed\n"
