name: jenkins_job
fqcn: community.general.jenkins_job
collection: community.general
short_description: Manage jenkins jobs
description: Manage Jenkins jobs by using Jenkins REST API.
options:
  config:
    type: str
    description: config in XML format. Required if job does not yet exist. Mutually exclusive with O(enabled).
      Considered if O(state=present).
  enabled:
    type: bool
    description: Whether the job should be enabled or disabled. Mutually exclusive with O(config). Considered
      if O(state=present).
  name:
    type: str
    required: true
    description: Name of the Jenkins job.
  password:
    type: str
    description: Password to authenticate with the Jenkins server.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Attribute that specifies if the job has to be created or deleted.
  token:
    type: str
    description: API token used to authenticate alternatively to password.
  url:
    type: str
    default: http://localhost:8080
    description: URL where the Jenkins server is accessible.
  user:
    type: str
    description: User to authenticate with the Jenkins server.
  validate_certs:
    type: bool
    default: true
    description: If set to V(false), the SSL certificates will not be validated. This should only set
      to V(false) used on personally controlled sites using self-signed certificates as it avoids verifying
      the source site. The C(python-jenkins) library only handles this by using the environment variable
      E(PYTHONHTTPSVERIFY).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a jenkins job using basic authentication\n  community.general.jenkins_job:\n\
  \    config: \"{{ lookup('file', 'templates/test.xml') }}\"\n    name: test\n    password: admin\n \
  \   url: http://localhost:8080\n    user: admin\n\n- name: Create a jenkins job using the token\n  community.general.jenkins_job:\n\
  \    config: \"{{ lookup('template', 'templates/test.xml.j2') }}\"\n    name: test\n    token: asdfasfasfasdfasdfadfasfasdfasdfc\n\
  \    url: http://localhost:8080\n    user: admin\n\n- name: Delete a jenkins job using basic authentication\n\
  \  community.general.jenkins_job:\n    name: test\n    password: admin\n    state: absent\n    url:\
  \ http://localhost:8080\n    user: admin\n\n- name: Delete a jenkins job using the token\n  community.general.jenkins_job:\n\
  \    name: test\n    token: asdfasfasfasdfasdfadfasfasdfasdfc\n    state: absent\n    url: http://localhost:8080\n\
  \    user: admin\n\n- name: Disable a jenkins job using basic authentication\n  community.general.jenkins_job:\n\
  \    name: test\n    password: admin\n    enabled: false\n    url: http://localhost:8080\n    user:\
  \ admin\n\n- name: Disable a jenkins job using the token\n  community.general.jenkins_job:\n    name:\
  \ test\n    token: asdfasfasfasdfasdfadfasfasdfasdfc\n    enabled: false\n    url: http://localhost:8080\n\
  \    user: admin\n"
