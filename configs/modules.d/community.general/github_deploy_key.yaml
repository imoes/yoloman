name: github_deploy_key
fqcn: community.general.github_deploy_key
collection: community.general
short_description: Manages deploy keys for GitHub repositories
description: Adds or removes deploy keys for GitHub repositories. Supports authentication using username
  and password, username and password and 2-factor authentication code (OTP), OAuth2 token, or personal
  access token. Admin rights on the repository are required.
options:
  force:
    type: bool
    default: false
    description: If V(true), forcefully adds the deploy key by deleting any existing deploy key with the
      same public key or title.
  github_url:
    type: str
    default: https://api.github.com
    description: The base URL of the GitHub API
  key:
    type: str
    required: true
    description: The SSH public key to add to the repository as a deploy key.
  name:
    type: str
    required: true
    aliases:
    - title
    - label
    description: The name for the deploy key.
  otp:
    type: int
    description: The 6 digit One Time Password for 2-Factor Authentication. Required together with O(username)
      and O(password).
  owner:
    type: str
    required: true
    aliases:
    - account
    - organization
    description: The name of the individual account or organization that owns the GitHub repository.
  password:
    type: str
    description: The password to authenticate with. Alternatively, a personal access token can be used
      instead of O(username) and O(password) combination.
  read_only:
    type: bool
    default: true
    description: If V(true), the deploy key will only be able to read repository contents. Otherwise,
      the deploy key will be able to read and write.
  repo:
    type: str
    required: true
    aliases:
    - repository
    description: The name of the GitHub repository.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: The state of the deploy key.
  token:
    type: str
    description: The OAuth2 token or personal access token to authenticate with. Mutually exclusive with
      O(password).
  username:
    type: str
    description: The username to authenticate with. Should not be set when using personal access token
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add a new read-only deploy key to a GitHub repository using basic authentication\n\
  \  community.general.github_deploy_key:\n    owner: \"johndoe\"\n    repo: \"example\"\n    name: \"\
  new-deploy-key\"\n    key: \"ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDAwXxn7kIMNWzcDfou...\"\n    read_only:\
  \ true\n    username: \"johndoe\"\n    password: \"supersecretpassword\"\n\n- name: Remove an existing\
  \ deploy key from a GitHub repository\n  community.general.github_deploy_key:\n    owner: \"johndoe\"\
  \n    repository: \"example\"\n    name: \"new-deploy-key\"\n    key: \"ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDAwXxn7kIMNWzcDfou...\"\
  \n    force: true\n    username: \"johndoe\"\n    password: \"supersecretpassword\"\n    state: absent\n\
  \n- name: Add a new deploy key to a GitHub repository, replace an existing key, use an OAuth2 token\
  \ to authenticate\n  community.general.github_deploy_key:\n    owner: \"johndoe\"\n    repository: \"\
  example\"\n    name: \"new-deploy-key\"\n    key: \"{{ lookup('file', '~/.ssh/github.pub') }}\"\n  \
  \  force: true\n    token: \"ABAQDAwXxn7kIMNWzcDfo...\"\n\n- name: Re-add a deploy key to a GitHub repository\
  \ but with a different name\n  community.general.github_deploy_key:\n    owner: \"johndoe\"\n    repository:\
  \ \"example\"\n    name: \"replace-deploy-key\"\n    key: \"{{ lookup('file', '~/.ssh/github.pub') }}\"\
  \n    username: \"johndoe\"\n    password: \"supersecretpassword\"\n\n- name: Add a new deploy key to\
  \ a GitHub repository using 2FA\n  community.general.github_deploy_key:\n    owner: \"johndoe\"\n  \
  \  repo: \"example\"\n    name: \"new-deploy-key-2\"\n    key: \"ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDAwXxn7kIMNWzcDfou...\"\
  \n    username: \"johndoe\"\n    password: \"supersecretpassword\"\n    otp: 123456\n\n- name: Add a\
  \ read-only deploy key to a repository hosted on GitHub Enterprise\n  community.general.github_deploy_key:\n\
  \    github_url: \"https://api.example.com\"\n    owner: \"janedoe\"\n    repo: \"example\"\n    name:\
  \ \"new-deploy-key\"\n    key: \"ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDAwXxn7kIMNWzcDfou...\"\n   \
  \ read_only: true\n    username: \"janedoe\"\n    password: \"supersecretpassword\"\n"
