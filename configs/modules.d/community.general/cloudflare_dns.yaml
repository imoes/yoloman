name: cloudflare_dns
fqcn: community.general.cloudflare_dns
collection: community.general
short_description: Manage Cloudflare DNS records
description: 'Manages dns records via the Cloudflare API, see the docs: U(https://api.cloudflare.com/).'
options:
  account_api_key:
    type: str
    aliases:
    - account_api_token
    description: 'Account API key. Required for api keys authentication. You can obtain your API key from
      the bottom of the Cloudflare ''My Account'' page, found here: U(https://dash.cloudflare.com/).'
  account_email:
    type: str
    description: Account email. Required for API keys authentication.
  algorithm:
    type: int
    description: Algorithm number. Required for O(type=DS) and O(type=SSHFP) when O(state=present).
  api_token:
    type: str
    description: 'API token. Required for api token authentication. You can obtain your API token from
      the bottom of the Cloudflare ''My Account'' page, found here: U(https://dash.cloudflare.com/). Can
      be specified in E(CLOUDFLARE_TOKEN) environment variable since community.general 2.0.0.'
  cert_usage:
    type: int
    choices:
    - 0
    - 1
    - 2
    - 3
    description: Certificate usage number. Required for O(type=TLSA) when O(state=present).
  flag:
    type: int
    choices:
    - 0
    - 1
    description: Issuer Critical Flag. Required for O(type=CAA) when O(state=present).
  hash_type:
    type: int
    choices:
    - 1
    - 2
    description: Hash type number. Required for O(type=DS), O(type=SSHFP) and O(type=TLSA) when O(state=present).
  key_tag:
    type: int
    description: DNSSEC key tag. Needed for O(type=DS) when O(state=present).
  port:
    type: int
    description: Service port. Required for O(type=SRV) and O(type=TLSA).
  priority:
    type: int
    default: 1
    description: Record priority. Required for O(type=MX) and O(type=SRV)
  proto:
    type: str
    description: Service protocol. Required for O(type=SRV) and O(type=TLSA). Common values are TCP and
      UDP.
  proxied:
    type: bool
    default: false
    description: Proxy through Cloudflare network or just use DNS.
  record:
    type: str
    default: '@'
    aliases:
    - name
    description: Record to add. Required if O(state=present). Default is V(@) (that is, the zone name).
  selector:
    type: int
    choices:
    - 0
    - 1
    description: Selector number. Required for O(type=TLSA) when O(state=present).
  service:
    type: str
    description: Record service. Required for O(type=SRV).
  solo:
    type: bool
    description: Whether the record should be the only one for that record type and record name. Only
      use with O(state=present). This will delete all other records with the same record name and type.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether the record(s) should exist or not.
  tag:
    type: str
    choices:
    - issue
    - issuewild
    - iodef
    description: CAA issue restriction. Required for O(type=CAA) when O(state=present).
  timeout:
    type: int
    default: 30
    description: Timeout for Cloudflare API calls.
  ttl:
    type: int
    default: 1
    description: The TTL to give the new record. Must be between 120 and 2,147,483,647 seconds, or 1 for
      automatic.
  type:
    type: str
    choices:
    - A
    - AAAA
    - CNAME
    - DS
    - MX
    - NS
    - SPF
    - SRV
    - SSHFP
    - TLSA
    - CAA
    - TXT
    description: The type of DNS record to create. Required if O(state=present). Note that V(SPF) is no
      longer supported by CloudFlare. Support for it will be removed from community.general 9.0.0.
  value:
    type: str
    aliases:
    - content
    description: The record value. Required for O(state=present).
  weight:
    type: int
    default: 1
    description: Service weight. Required for O(type=SRV).
  zone:
    type: str
    required: true
    aliases:
    - domain
    description: The name of the Zone to work with (e.g. "example.com"). The Zone must already exist.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a test.example.net A record to point to 127.0.0.1\n  community.general.cloudflare_dns:\n\
  \    zone: example.net\n    record: test\n    type: A\n    value: 127.0.0.1\n    account_email: test@example.com\n\
  \    account_api_key: dummyapitoken\n  register: record\n\n- name: Create a record using api token\n\
  \  community.general.cloudflare_dns:\n    zone: example.net\n    record: test\n    type: A\n    value:\
  \ 127.0.0.1\n    api_token: dummyapitoken\n\n- name: Create a example.net CNAME record to example.com\n\
  \  community.general.cloudflare_dns:\n    zone: example.net\n    type: CNAME\n    value: example.com\n\
  \    account_email: test@example.com\n    account_api_key: dummyapitoken\n    state: present\n\n- name:\
  \ Change its TTL\n  community.general.cloudflare_dns:\n    zone: example.net\n    type: CNAME\n    value:\
  \ example.com\n    ttl: 600\n    account_email: test@example.com\n    account_api_key: dummyapitoken\n\
  \    state: present\n\n- name: Delete the record\n  community.general.cloudflare_dns:\n    zone: example.net\n\
  \    type: CNAME\n    value: example.com\n    account_email: test@example.com\n    account_api_key:\
  \ dummyapitoken\n    state: absent\n\n- name: Create a example.net CNAME record to example.com and proxy\
  \ through Cloudflare's network\n  community.general.cloudflare_dns:\n    zone: example.net\n    type:\
  \ CNAME\n    value: example.com\n    proxied: true\n    account_email: test@example.com\n    account_api_key:\
  \ dummyapitoken\n    state: present\n\n# This deletes all other TXT records named \"test.example.net\"\
  \n- name: Create TXT record \"test.example.net\" with value \"unique value\"\n  community.general.cloudflare_dns:\n\
  \    domain: example.net\n    record: test\n    type: TXT\n    value: unique value\n    solo: true\n\
  \    account_email: test@example.com\n    account_api_key: dummyapitoken\n    state: present\n\n- name:\
  \ Create an SRV record _foo._tcp.example.net\n  community.general.cloudflare_dns:\n    domain: example.net\n\
  \    service: foo\n    proto: tcp\n    port: 3500\n    priority: 10\n    weight: 20\n    type: SRV\n\
  \    value: fooserver.example.net\n\n- name: Create a SSHFP record login.example.com\n  community.general.cloudflare_dns:\n\
  \    zone: example.com\n    record: login\n    type: SSHFP\n    algorithm: 4\n    hash_type: 2\n   \
  \ value: 9dc1d6742696d2f51ca1f1a78b3d16a840f7d111eb9454239e70db31363f33e1\n\n- name: Create a TLSA record\
  \ _25._tcp.mail.example.com\n  community.general.cloudflare_dns:\n    zone: example.com\n    record:\
  \ mail\n    port: 25\n    proto: tcp\n    type: TLSA\n    cert_usage: 3\n    selector: 1\n    hash_type:\
  \ 1\n    value: 6b76d034492b493e15a7376fccd08e63befdad0edab8e442562f532338364bf3\n\n- name: Create a\
  \ CAA record subdomain.example.com\n  community.general.cloudflare_dns:\n    zone: example.com\n   \
  \ record: subdomain\n    type: CAA\n    flag: 0\n    tag: issue\n    value: ca.example.com\n\n- name:\
  \ Create a DS record for subdomain.example.com\n  community.general.cloudflare_dns:\n    zone: example.com\n\
  \    record: subdomain\n    type: DS\n    key_tag: 5464\n    algorithm: 8\n    hash_type: 2\n    value:\
  \ B4EB5AC4467D2DFB3BAF9FB9961DC1B6FED54A58CDFAA3E465081EC86F89BFAB\n"
