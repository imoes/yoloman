name: pagerduty_user
fqcn: community.general.pagerduty_user
collection: community.general
short_description: Manage a user account on PagerDuty
description: This module manages the creation/removal of a user account on PagerDuty.
options:
  access_token:
    type: str
    required: true
    description: An API access token to authenticate with the PagerDuty REST API.
  pd_email:
    type: str
    required: true
    description: The user's email address. O(pd_email) is the unique identifier used and cannot be updated
      using this module.
  pd_role:
    type: str
    default: responder
    choices:
    - global_admin
    - manager
    - responder
    - observer
    - stakeholder
    - limited_stakeholder
    - restricted_access
    description: The user's role.
  pd_teams:
    type: list
    description: The teams to which the user belongs. Required if O(state=present).
  pd_user:
    type: str
    required: true
    description: Name of the user in PagerDuty.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the user. On V(present), it creates a user if the user doesn't exist. On V(absent),
      it removes a user if the account exists.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a user account on PagerDuty\n  community.general.pagerduty_user:\n    access_token:\
  \ 'Your_Access_token'\n    pd_user: user_full_name\n    pd_email: user_email\n    pd_role: user_pd_role\n\
  \    pd_teams: user_pd_teams\n    state: \"present\"\n\n- name: Remove a user account from PagerDuty\n\
  \  community.general.pagerduty_user:\n    access_token: 'Your_Access_token'\n    pd_user: user_full_name\n\
  \    pd_email: user_email\n    state: \"absent\"\n"
