name: macports
fqcn: community.general.macports
collection: community.general
short_description: Package manager for MacPorts
description: Manages MacPorts packages (ports)
options:
  name:
    type: list
    aliases:
    - port
    description: A list of port names.
  selfupdate:
    type: bool
    default: false
    aliases:
    - update_cache
    - update_ports
    description: Update Macports and the ports tree, either prior to installing ports or as a separate
      step. Equivalent to running C(port selfupdate).
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - active
    - inactive
    - installed
    - removed
    description: Indicates the desired state of the port.
  upgrade:
    type: bool
    default: false
    description: Upgrade all outdated ports, either prior to installing ports or as a separate step. Equivalent
      to running C(port upgrade outdated).
  variant:
    type: str
    aliases:
    - variants
    description: A port variant specification. O(variant) is only supported with O(state=installed) and
      O(state=present).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install the foo port\n  community.general.macports:\n    name: foo\n\n- name: Install\
  \ the universal, x11 variant of the foo port\n  community.general.macports:\n    name: foo\n    variant:\
  \ +universal+x11\n\n- name: Install a list of ports\n  community.general.macports:\n    name: \"{{ ports\
  \ }}\"\n  vars:\n    ports:\n    - foo\n    - foo-tools\n\n- name: Update Macports and the ports tree,\
  \ then upgrade all outdated ports\n  community.general.macports:\n    selfupdate: true\n    upgrade:\
  \ true\n\n- name: Update Macports and the ports tree, then install the foo port\n  community.general.macports:\n\
  \    name: foo\n    selfupdate: true\n\n- name: Remove the foo port\n  community.general.macports:\n\
  \    name: foo\n    state: absent\n\n- name: Activate the foo port\n  community.general.macports:\n\
  \    name: foo\n    state: active\n\n- name: Deactivate the foo port\n  community.general.macports:\n\
  \    name: foo\n    state: inactive\n"
