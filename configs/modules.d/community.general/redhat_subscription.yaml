name: redhat_subscription
fqcn: community.general.redhat_subscription
collection: community.general
short_description: Manage registration and subscriptions to RHSM using C(subscription-manager)
description: Manage registration and subscription to the Red Hat Subscription Management entitlement platform
  using the C(subscription-manager) command, registering using D-Bus if possible.
options:
  activationkey:
    type: str
    description: supply an activation key for use with registration
  auto_attach:
    type: bool
    aliases:
    - autosubscribe
    description: 'Upon successful registration, auto-consume available subscriptions Please note that
      the alias O(autosubscribe) will be removed in

      community.general 9.0.0.

      '
  consumer_id:
    type: str
    description: 'References an existing consumer ID to resume using a previous registration

      for this system. If the  system''s identity certificate is lost or corrupted,

      this option allows it to resume using its previous identity and subscriptions.

      The default is to not specify a consumer ID so a new ID is created.

      '
  consumer_name:
    type: str
    description: Name of the system to register, defaults to the hostname
  consumer_type:
    type: str
    description: The type of unit to register, defaults to system
  environment:
    type: str
    description: Register with a specific environment in the destination org. Used with Red Hat Satellite
      or Katello
  force_register:
    type: bool
    default: false
    description: Register the system even if it is already registered
  org_id:
    type: str
    description: Organization ID to use in conjunction with activationkey
  password:
    type: str
    description: access.redhat.com or Red Hat Satellite or Katello password
  pool:
    type: str
    default: ^$
    description: "Specify a subscription pool name to consume.  Regular expressions accepted.\nMutually\
      \ exclusive with O(pool_ids).\n Please use O(pool_ids) instead: specifying pool IDs is much faster,\n\
      and it avoids to match new pools that become available for the\nsystem and are not explicitly wanted.\
      \  Also, this option does not\nsupport quantities.\n This option is deprecated for the reasons mentioned\
      \ above,\nand it will be removed in community.general 10.0.0.\n"
  pool_ids:
    type: list
    default: []
    description: 'Specify subscription pool IDs to consume. Prefer over O(pool) when possible as it is
      much faster.

      A pool ID may be specified as a C(string) - just the pool ID (for example V(0123456789abcdef0123456789abcdef)),

      or as a C(dict) with the pool ID as the key, and a quantity as the value (for example

      V(0123456789abcdef0123456789abcdef: 2). If the quantity is provided, it is used to consume multiple

      entitlements from a pool (the pool must support this). Mutually exclusive with O(pool).

      '
  release:
    type: str
    description: Set a release version
  rhsm_baseurl:
    type: str
    description: Specify CDN baseurl
  rhsm_repo_ca_cert:
    type: str
    description: Specify an alternative location for a CA certificate for CDN
  server_hostname:
    type: str
    description: Specify an alternative Red Hat Subscription Management or Red Hat Satellite or Katello
      server.
  server_insecure:
    type: str
    description: Enable or disable https server certificate verification when connecting to O(server_hostname).
  server_port:
    type: str
    description: Specify the port when registering to the Red Hat Subscription Management or Red Hat Satellite
      or Katello server.
  server_prefix:
    type: str
    description: Specify the prefix when registering to the Red Hat Subscription Management or Red Hat
      Satellite or Katello server.
  server_proxy_hostname:
    type: str
    description: Specify an HTTP proxy hostname.
  server_proxy_password:
    type: str
    description: Specify a password for HTTP proxy with basic authentication
  server_proxy_port:
    type: str
    description: Specify an HTTP proxy port.
  server_proxy_scheme:
    type: str
    description: Specify an HTTP proxy scheme, for example V(http) or V(https).
  server_proxy_user:
    type: str
    description: Specify a user for HTTP proxy with basic authentication
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: whether to register and subscribe (V(present)), or unregister (V(absent)) a system
  syspurpose:
    type: dict
    description: Set syspurpose attributes in file C(/etc/rhsm/syspurpose/syspurpose.json) and synchronize
      these attributes with RHSM server. Syspurpose attributes help attach the most appropriate subscriptions
      to the system automatically. When C(syspurpose.json) file already contains some attributes, then
      new attributes overwrite existing attributes. When some attribute is not listed in the new list
      of attributes, the existing attribute will be removed from C(syspurpose.json) file. Unknown attributes
      are ignored.
  token:
    type: str
    description: sso.redhat.com API access token.
  username:
    type: str
    description: access.redhat.com or Red Hat Satellite or Katello username
writes: true
runtime: starlark
source: translated
examples: "\n- name: Register as user (joe_user) with password (somepass) and auto-subscribe to available\
  \ content.\n  community.general.redhat_subscription:\n    state: present\n    username: joe_user\n \
  \   password: somepass\n    auto_attach: true\n\n- name: Same as above but subscribe to a specific pool\
  \ by ID.\n  community.general.redhat_subscription:\n    state: present\n    username: joe_user\n   \
  \ password: somepass\n    pool_ids: 0123456789abcdef0123456789abcdef\n\n- name: Register and subscribe\
  \ to multiple pools.\n  community.general.redhat_subscription:\n    state: present\n    username: joe_user\n\
  \    password: somepass\n    pool_ids:\n      - 0123456789abcdef0123456789abcdef\n      - 1123456789abcdef0123456789abcdef\n\
  \n- name: Same as above but consume multiple entitlements.\n  community.general.redhat_subscription:\n\
  \    state: present\n    username: joe_user\n    password: somepass\n    pool_ids:\n      - 0123456789abcdef0123456789abcdef:\
  \ 2\n      - 1123456789abcdef0123456789abcdef: 4\n\n- name: Register and pull existing system data.\n\
  \  community.general.redhat_subscription:\n    state: present\n    username: joe_user\n    password:\
  \ somepass\n    consumer_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\n\n- name: Register with activationkey\
  \ and consume subscriptions matching Red Hat Enterprise Server or Red Hat Virtualization\n  community.general.redhat_subscription:\n\
  \    state: present\n    activationkey: 1-222333444\n    org_id: 222333444\n    pool: '^(Red Hat Enterprise\
  \ Server|Red Hat Virtualization)$'\n\n- name: Update the consumed subscriptions from the previous example\
  \ (remove Red Hat Virtualization subscription)\n  community.general.redhat_subscription:\n    state:\
  \ present\n    activationkey: 1-222333444\n    org_id: 222333444\n    pool: '^Red Hat Enterprise Server$'\n\
  \n- name: Register as user credentials into given environment (against Red Hat Satellite or Katello),\
  \ and auto-subscribe.\n  community.general.redhat_subscription:\n    state: present\n    username: joe_user\n\
  \    password: somepass\n    environment: Library\n    auto_attach: true\n\n- name: Register as user\
  \ (joe_user) with password (somepass) and a specific release\n  community.general.redhat_subscription:\n\
  \    state: present\n    username: joe_user\n    password: somepass\n    release: 7.4\n\n- name: Register\
  \ as user (joe_user) with password (somepass), set syspurpose attributes and synchronize them with server\n\
  \  community.general.redhat_subscription:\n    state: present\n    username: joe_user\n    password:\
  \ somepass\n    auto_attach: true\n    syspurpose:\n      usage: \"Production\"\n      role: \"Red Hat\
  \ Enterprise Server\"\n      service_level_agreement: \"Premium\"\n      addons:\n        - addon1\n\
  \        - addon2\n      sync: true\n"
