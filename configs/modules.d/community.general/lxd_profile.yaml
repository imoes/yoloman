name: lxd_profile
fqcn: community.general.lxd_profile
collection: community.general
short_description: Manage LXD profiles
description: Management of LXD profiles
options:
  client_cert:
    type: path
    aliases:
    - cert_file
    description: The client certificate file path. If not specified, it defaults to C($HOME/.config/lxc/client.crt).
  client_key:
    type: path
    aliases:
    - key_file
    description: The client certificate key file path. If not specified, it defaults to C($HOME/.config/lxc/client.key).
  config:
    type: dict
    description: 'The config for the instance (e.g. {"limits.memory": "4GB"}). See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/profiles/profile_get).
      If the profile already exists and its "config" value in metadata obtained from GET /1.0/profiles/<name>
      U(https://documentation.ubuntu.com/lxd/en/latest/api/#/profiles/profile_get) are different, then
      this module tries to apply the configurations U(https://documentation.ubuntu.com/lxd/en/latest/api/#/profiles/profile_put).
      Not all config values are supported to apply the existing profile. Maybe you need to delete and
      recreate a profile.'
  description:
    type: str
    description: Description of the profile.
  devices:
    type: dict
    description: 'The devices for the profile (e.g. {"rootfs": {"path": "/dev/kvm", "type": "unix-char"}).
      See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/profiles/profile_get).'
  merge_profile:
    type: bool
    default: false
    description: Merge the configuration of the present profile with the new desired configuration, instead
      of replacing it.
  name:
    type: str
    required: true
    description: Name of a profile.
  new_name:
    type: str
    description: A new name of a profile. If this parameter is specified a profile will be renamed to
      this name. See U(https://documentation.ubuntu.com/lxd/en/latest/api/#/profiles/profile_post).
  project:
    type: str
    description: Project of a profile. See U(https://documentation.ubuntu.com/lxd/en/latest/projects/).
  snap_url:
    type: str
    default: unix:/var/snap/lxd/common/lxd/unix.socket
    description: The unix domain socket path when LXD is installed by snap package manager.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Define the state of a profile.
  trust_password:
    type: str
    description: The client trusted password. You need to set this password on the LXD server before running
      this module using the following command. lxc config set core.trust_password <some random password>
      See U(https://www.stgraber.org/2016/04/18/lxd-api-direct-interaction/) If trust_password is set,
      this module send a request for authentication before sending any requests.
  url:
    type: str
    default: unix:/var/lib/lxd/unix.socket
    description: The unix domain socket path or the https URL for the LXD server.
writes: true
runtime: starlark
source: translated
examples: "\n# An example for creating a profile\n- hosts: localhost\n  connection: local\n  tasks:\n\
  \    - name: Create a profile\n      community.general.lxd_profile:\n        name: macvlan\n       \
  \ state: present\n        config: {}\n        description: my macvlan profile\n        devices:\n  \
  \        eth0:\n            nictype: macvlan\n            parent: br0\n            type: nic\n\n# An\
  \ example for creating a profile in project mytestproject\n- hosts: localhost\n  connection: local\n\
  \  tasks:\n    - name: Create a profile\n      community.general.lxd_profile:\n        name: testprofile\n\
  \        project: mytestproject\n        state: present\n        config: {}\n        description: test\
  \ profile in project mytestproject\n        devices: {}\n\n# An example for creating a profile via http\
  \ connection\n- hosts: localhost\n  connection: local\n  tasks:\n  - name: Create macvlan profile\n\
  \    community.general.lxd_profile:\n      url: https://127.0.0.1:8443\n      # These client_cert and\
  \ client_key values are equal to the default values.\n      #client_cert: \"{{ lookup('env', 'HOME')\
  \ }}/.config/lxc/client.crt\"\n      #client_key: \"{{ lookup('env', 'HOME') }}/.config/lxc/client.key\"\
  \n      trust_password: mypassword\n      name: macvlan\n      state: present\n      config: {}\n  \
  \    description: my macvlan profile\n      devices:\n        eth0:\n          nictype: macvlan\n  \
  \        parent: br0\n          type: nic\n\n# An example for modify/merge a profile\n- hosts: localhost\n\
  \  connection: local\n  tasks:\n    - name: Merge a profile\n      community.general.lxd_profile:\n\
  \        merge_profile: true\n        name: macvlan\n        state: present\n        config: {}\n  \
  \      description: my macvlan profile\n        devices:\n          eth0:\n            nictype: macvlan\n\
  \            parent: br0\n            type: nic\n\n# An example for deleting a profile\n- hosts: localhost\n\
  \  connection: local\n  tasks:\n    - name: Delete a profile\n      community.general.lxd_profile:\n\
  \        name: macvlan\n        state: absent\n\n# An example for renaming a profile\n- hosts: localhost\n\
  \  connection: local\n  tasks:\n    - name: Rename a profile\n      community.general.lxd_profile:\n\
  \        name: macvlan\n        new_name: macvlan2\n        state: present\n"
