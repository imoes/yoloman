name: consul_role
fqcn: community.general.consul_role
collection: community.general
short_description: Manipulate Consul roles
description: Allows the addition, modification and deletion of roles in a consul cluster via the agent.
  For more details on using and configuring ACLs, see U(https://www.consul.io/docs/guides/acl.html).
options:
  ca_path:
    type: str
    description: The CA bundle to use for https connections
  description:
    type: str
    description: Description of the role. If not specified, the assigned description will not be changed.
  host:
    type: str
    default: localhost
    description: Host of the consul agent, defaults to V(localhost).
  name:
    type: str
    required: true
    description: A name used to identify the role.
  node_identities:
    type: list
    description: List of node identities to attach to the role. If not specified, any node identities
      currently assigned will not be changed. If the parameter is an empty array (V([])), any node identities
      assigned will be unassigned.
  policies:
    type: list
    description: List of policies to attach to the role. Each policy is a dict. If the parameter is left
      blank, any policies currently assigned will not be changed. Any empty array (V([])) will clear any
      policies previously set.
  port:
    type: int
    default: 8500
    description: The port on which the consul agent is running.
  scheme:
    type: str
    default: http
    description: The protocol scheme on which the consul agent is running. Defaults to V(http) and can
      be set to V(https) for secure connections.
  service_identities:
    type: list
    description: List of service identities to attach to the role. If not specified, any service identities
      currently assigned will not be changed. If the parameter is an empty array (V([])), any node identities
      assigned will be unassigned.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: whether the role should be present or absent.
  templated_policies:
    type: list
    description: The list of templated policies that should be applied to the role.
  token:
    type: str
    description: The token to use for authorization.
  validate_certs:
    type: bool
    default: true
    description: Whether to verify the TLS certificate of the consul agent.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a role with 2 policies\n  community.general.consul_role:\n    host: consul1.example.com\n\
  \    token: some_management_acl\n    name: foo-role\n    policies:\n      - id: 783beef3-783f-f41f-7422-7087dc272765\n\
  \      - name: \"policy-1\"\n\n- name: Create a role with service identity\n  community.general.consul_role:\n\
  \    host: consul1.example.com\n    token: some_management_acl\n    name: foo-role-2\n    service_identities:\n\
  \      - name: web\n        datacenters:\n          - dc1\n\n- name: Create a role with node identity\n\
  \  community.general.consul_role:\n    host: consul1.example.com\n    token: some_management_acl\n \
  \   name: foo-role-3\n    node_identities:\n      - name: node-1\n        datacenter: dc2\n\n- name:\
  \ Remove a role\n  community.general.consul_role:\n    host: consul1.example.com\n    token: some_management_acl\n\
  \    name: foo-role-3\n    state: absent\n"
