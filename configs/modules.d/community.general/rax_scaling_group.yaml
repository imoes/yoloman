name: rax_scaling_group
fqcn: community.general.rax_scaling_group
collection: community.general
short_description: Manipulate Rackspace Cloud Autoscale Groups
description: Manipulate Rackspace Cloud Autoscale Groups
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  config_drive:
    type: bool
    default: false
    description: Attach read-only configuration drive to server as label config-2
  cooldown:
    type: int
    default: 300
    description: The period of time, in seconds, that must pass before any scaling can occur after the
      previous scaling. Must be an integer between 0 and 86400 (24 hrs).
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  disk_config:
    type: str
    choices:
    - auto
    - manual
    description: Disk partitioning strategy If not specified, it will fallback to V(auto).
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  files:
    type: dict
    default: {}
    description: 'Files to insert into the instance. Hash of C(remotepath: localpath)'
  flavor:
    type: str
    required: true
    description: flavor to use for the instance
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  image:
    type: str
    required: true
    description: image to use for the instance. Can be an C(id), C(human_id) or C(name).
  key_name:
    type: str
    description: key pair to use on the instance
  loadbalancers:
    type: list
    description: List of load balancer C(id) and C(port) hashes
  max_entities:
    type: int
    required: true
    description: The maximum number of entities that are allowed in the scaling group. Must be an integer
      between 0 and 1000.
  meta:
    type: dict
    default: {}
    description: A hash of metadata to associate with the instance
  min_entities:
    type: int
    required: true
    description: The minimum number of entities that are allowed in the scaling group. Must be an integer
      between 0 and 1000.
  name:
    type: str
    required: true
    description: Name to give the scaling group
  networks:
    type: list
    default:
    - public
    - private
    description: The network to attach to the instances. If specified, you must include ALL networks including
      the public and private interfaces. Can be C(id) or C(label).
  region:
    type: str
    description: Region to create an instance in.
  server_name:
    type: str
    required: true
    description: The base name for servers created by Autoscale
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  user_data:
    type: str
    description: Data to be uploaded to the servers config drive. This option implies O(config_drive).
      Can be a file path or a string
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
  wait:
    type: bool
    default: false
    description: wait for the scaling group to finish provisioning the minimum amount of servers
  wait_timeout:
    type: int
    default: 300
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n---\n- hosts: localhost\n  gather_facts: false\n  connection: local\n  tasks:\n    - community.general.rax_scaling_group:\n\
  \        credentials: ~/.raxpub\n        region: ORD\n        cooldown: 300\n        flavor: performance1-1\n\
  \        image: bb02b1a3-bc77-4d17-ab5b-421d89850fca\n        min_entities: 5\n        max_entities:\
  \ 10\n        name: ASG Test\n        server_name: asgtest\n        loadbalancers:\n            - id:\
  \ 228385\n              port: 80\n      register: asg\n"
