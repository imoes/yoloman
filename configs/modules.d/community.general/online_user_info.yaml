name: online_user_info
fqcn: community.general.online_user_info
collection: community.general
short_description: Gather information about Online user
description: Gather information about the user.
options:
  api_timeout:
    type: int
    default: 30
    aliases:
    - timeout
    description: HTTP timeout to Online API in seconds.
  api_token:
    type: str
    required: true
    aliases:
    - oauth_token
    description: Online OAuth token.
  api_url:
    type: str
    default: https://api.online.net
    aliases:
    - base_url
    description: Online API URL.
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certs of the Online API.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather Online user info\n  community.general.online_user_info:\n  register: result\n\
  \n- ansible.builtin.debug:\n    msg: \"{{ result.online_user_info }}\"\n"
