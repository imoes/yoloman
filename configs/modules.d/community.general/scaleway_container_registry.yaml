name: scaleway_container_registry
fqcn: community.general.scaleway_container_registry
collection: community.general
short_description: Scaleway Container registry management module
description: This module manages container registries on Scaleway account.
options:
  api_timeout:
    type: int
    default: 30
    aliases:
    - timeout
    description: HTTP timeout to Scaleway API in seconds.
  api_token:
    type: str
    required: true
    aliases:
    - oauth_token
    description: Scaleway OAuth token.
  api_url:
    type: str
    default: https://api.scaleway.com
    aliases:
    - base_url
    description: Scaleway API URL.
  description:
    type: str
    default: ''
    description: Description of the container registry.
  name:
    type: str
    required: true
    description: Name of the container registry.
  privacy_policy:
    type: str
    default: private
    choices:
    - public
    - private
    description: Default visibility policy. Everyone will be able to pull images from a V(public) registry.
  project_id:
    type: str
    required: true
    description: Project identifier.
  query_parameters:
    type: dict
    default: {}
    description: List of parameters passed to the query string.
  region:
    type: str
    required: true
    choices:
    - fr-par
    - nl-ams
    - pl-waw
    description: Scaleway region to use (for example V(fr-par)).
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the container registry.
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certs of the Scaleway API.
  wait:
    type: bool
    default: true
    description: Wait for the resource to reach its desired state before returning.
  wait_sleep_time:
    type: int
    default: 3
    description: Time to wait before every attempt to check the state of the resource.
  wait_timeout:
    type: int
    default: 300
    description: Time to wait for the resource to reach the expected state.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a container registry\n  community.general.scaleway_container_registry:\n \
  \   project_id: '{{ scw_project }}'\n    state: present\n    region: fr-par\n    name: my-awesome-container-registry\n\
  \  register: container_registry_creation_task\n\n- name: Make sure container registry is deleted\n \
  \ community.general.scaleway_container_registry:\n    project_id: '{{ scw_project }}'\n    state: absent\n\
  \    region: fr-par\n    name: my-awesome-container-registry\n"
