name: udm_user
fqcn: community.general.udm_user
collection: community.general
short_description: Manage posix users on a univention corporate server
description: This module allows to manage posix users on a univention corporate server (UCS). It uses
  the python API of the UCS to create a new object or edit it.
options:
  birthday:
    type: str
    description: Birthday
  city:
    type: str
    description: City of users business address.
  country:
    type: str
    description: Country of users business address.
  department_number:
    type: str
    aliases:
    - departmentNumber
    description: Department number of users business address.
  description:
    type: str
    description: Description (not gecos)
  display_name:
    type: str
    aliases:
    - displayName
    description: Display name (not gecos)
  email:
    type: list
    default:
    - ''
    description: A list of e-mail addresses.
  employee_number:
    type: str
    aliases:
    - employeeNumber
    description: Employee number
  employee_type:
    type: str
    aliases:
    - employeeType
    description: Employee type
  firstname:
    type: str
    description: First name. Required if O(state=present).
  gecos:
    type: str
    description: GECOS
  groups:
    type: list
    default: []
    description: 'POSIX groups, the LDAP DNs of the groups will be found with the LDAP filter for each
      group as $GROUP: V((&(objectClass=posixGroup\)(cn=$GROUP\)\)).'
  home_share:
    type: str
    aliases:
    - homeShare
    description: Home NFS share. Must be a LDAP DN, e.g. V(cn=home,cn=shares,ou=school,dc=example,dc=com).
  home_share_path:
    type: str
    aliases:
    - homeSharePath
    description: Path to home NFS share, inside the homeShare.
  home_telephone_number:
    type: list
    default: []
    aliases:
    - homeTelephoneNumber
    description: List of private telephone numbers.
  homedrive:
    type: str
    description: Windows home drive, for example V("H:").
  lastname:
    type: str
    description: Last name. Required if O(state=present).
  mail_alternative_address:
    type: list
    default: []
    aliases:
    - mailAlternativeAddress
    description: List of alternative e-mail addresses.
  mail_home_server:
    type: str
    aliases:
    - mailHomeServer
    description: FQDN of mail server
  mail_primary_address:
    type: str
    aliases:
    - mailPrimaryAddress
    description: Primary e-mail address
  mobile_telephone_number:
    type: list
    default: []
    aliases:
    - mobileTelephoneNumber
    description: Mobile phone number
  organisation:
    type: str
    aliases:
    - organization
    description: Organisation
  ou:
    type: str
    default: ''
    description: Organizational Unit inside the LDAP Base DN, for example V(school) for LDAP OU C(ou=school,dc=example,dc=com).
  overridePWHistory:
    type: bool
    default: false
    aliases:
    - override_pw_history
    description: Override password history
  overridePWLength:
    type: bool
    default: false
    aliases:
    - override_pw_length
    description: Override password check
  pager_telephonenumber:
    type: list
    default: []
    aliases:
    - pagerTelephonenumber
    description: List of pager telephone numbers.
  password:
    type: str
    description: Password. Required if O(state=present).
  phone:
    type: list
    default: []
    description: List of telephone numbers.
  position:
    type: str
    default: ''
    description: Define the whole position of users object inside the LDAP tree, for example V(cn=employee,cn=users,ou=school,dc=example,dc=com).
  postcode:
    type: str
    description: Postal code of users business address.
  primary_group:
    type: str
    aliases:
    - primaryGroup
    description: Primary group. This must be the group LDAP DN. If not specified, it defaults to V(cn=Domain
      Users,cn=groups,$LDAP_BASE_DN).
  profilepath:
    type: str
    description: Windows profile directory
  pwd_change_next_login:
    type: str
    choices:
    - '0'
    - '1'
    aliases:
    - pwdChangeNextLogin
    description: Change password on next login.
  room_number:
    type: str
    aliases:
    - roomNumber
    description: Room number of users business address.
  samba_privileges:
    type: list
    default: []
    aliases:
    - sambaPrivileges
    description: Samba privilege, like allow printer administration, do domain join.
  samba_user_workstations:
    type: list
    default: []
    aliases:
    - sambaUserWorkstations
    description: Allow the authentication only on this Microsoft Windows host.
  sambahome:
    type: str
    description: Windows home path, for example V('\\\\$FQDN\\$USERNAME').
  scriptpath:
    type: str
    description: Windows logon script.
  secretary:
    type: list
    default: []
    description: A list of superiors as LDAP DNs.
  serviceprovider:
    type: list
    default:
    - ''
    description: Enable user for the following service providers.
  shell:
    type: str
    default: /bin/bash
    description: Login shell
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the user is present or not.
  street:
    type: str
    description: Street of users business address.
  subpath:
    type: str
    default: cn=users
    description: LDAP subpath inside the organizational unit, for example V(cn=teachers,cn=users) for
      LDAP container C(cn=teachers,cn=users,dc=example,dc=com).
  title:
    type: str
    description: Title, for example V(Prof.).
  unixhome:
    type: str
    description: Unix home directory If not specified, it defaults to C(/home/$USERNAME).
  update_password:
    type: str
    default: always
    choices:
    - always
    - on_create
    description: V(always) will update passwords if they differ. V(on_create) will only set the password
      for newly created users.
  userexpiry:
    type: str
    description: Account expiry date, for example V(1999-12-31). If not specified, it defaults to the
      current day plus one year.
  username:
    type: str
    required: true
    aliases:
    - name
    description: User name
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a user on a UCS\n  community.general.udm_user:\n    name: FooBar\n    password:\
  \ secure_password\n    firstname: Foo\n    lastname: Bar\n\n- name: Create a user with the DN uid=foo,cn=teachers,cn=users,ou=school,dc=school,dc=example,dc=com\n\
  \  community.general.udm_user:\n    name: foo\n    password: secure_password\n    firstname: Foo\n \
  \   lastname: Bar\n    ou: school\n    subpath: 'cn=teachers,cn=users'\n\n# or define the position\n\
  - name: Create a user with the DN uid=foo,cn=teachers,cn=users,ou=school,dc=school,dc=example,dc=com\n\
  \  community.general.udm_user:\n    name: foo\n    password: secure_password\n    firstname: Foo\n \
  \   lastname: Bar\n    position: 'cn=teachers,cn=users,ou=school,dc=school,dc=example,dc=com'\n"
