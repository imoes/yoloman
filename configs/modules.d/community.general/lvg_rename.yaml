name: lvg_rename
fqcn: community.general.lvg_rename
collection: community.general
short_description: Renames LVM volume groups
description: This module renames volume groups using the C(vgchange) command.
options:
  vg:
    type: str
    required: true
    description: The name or UUID of the source VG. See V(vgrename(8\)) for valid values.
  vg_new:
    type: str
    required: true
    description: The new name of the VG. See V(lvm(8\)) for valid names.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Rename a VG by name\n  community.general.lvg_rename:\n    vg: vg_orig_name\n    vg_new:\
  \ vg_new_name\n\n- name: Rename a VG by UUID\n  community.general.lvg_rename:\n    vg_uuid: SNgd0Q-rPYa-dPB8-U1g6-4WZI-qHID-N7y9Vj\n\
  \    vg_new: vg_new_name\n"
