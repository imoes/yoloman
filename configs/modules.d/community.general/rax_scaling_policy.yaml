name: rax_scaling_policy
fqcn: community.general.rax_scaling_policy
collection: community.general
short_description: Manipulate Rackspace Cloud Autoscale Scaling Policy
description: Manipulate Rackspace Cloud Autoscale Scaling Policy
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  at:
    type: str
    description: The UTC time when this policy will be executed. The time must be formatted according
      to C(yyyy-MM-dd'T'HH:mm:ss.SSS) such as V(2013-05-19T08:07:08Z)
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  change:
    type: int
    description: The change, either as a number of servers or as a percentage, to make in the scaling
      group. If this is a percentage, you must set O(is_percent) to V(true) also.
  cooldown:
    type: int
    default: 300
    description: The period of time, in seconds, that must pass before any scaling can occur after the
      previous scaling. Must be an integer between 0 and 86400 (24 hrs).
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  cron:
    type: str
    description: The time when the policy will be executed, as a cron entry. For example, if this is parameter
      is set to V(1 0 * * *).
  desired_capacity:
    type: int
    description: The desired server capacity of the scaling the group; that is, how many servers should
      be in the scaling group.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  is_percent:
    type: bool
    default: false
    description: Whether the value in O(change) is a percent value
  name:
    type: str
    required: true
    description: Name to give the policy
  policy_type:
    type: str
    required: true
    choices:
    - webhook
    - schedule
    description: The type of policy that will be executed for the current release.
  region:
    type: str
    description: Region to create an instance in.
  scaling_group:
    type: str
    required: true
    description: Name of the scaling group that this policy will be added to
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
writes: true
runtime: starlark
source: translated
examples: "\n---\n- hosts: localhost\n  gather_facts: false\n  connection: local\n  tasks:\n    - community.general.rax_scaling_policy:\n\
  \        credentials: ~/.raxpub\n        region: ORD\n        at: '2013-05-19T08:07:08Z'\n        change:\
  \ 25\n        cooldown: 300\n        is_percent: true\n        name: ASG Test Policy - at\n        policy_type:\
  \ schedule\n        scaling_group: ASG Test\n      register: asps_at\n\n    - community.general.rax_scaling_policy:\n\
  \        credentials: ~/.raxpub\n        region: ORD\n        cron: '1 0 * * *'\n        change: 25\n\
  \        cooldown: 300\n        is_percent: true\n        name: ASG Test Policy - cron\n        policy_type:\
  \ schedule\n        scaling_group: ASG Test\n      register: asp_cron\n\n    - community.general.rax_scaling_policy:\n\
  \        credentials: ~/.raxpub\n        region: ORD\n        cooldown: 300\n        desired_capacity:\
  \ 5\n        name: ASG Test Policy - webhook\n        policy_type: webhook\n        scaling_group: ASG\
  \ Test\n      register: asp_webhook\n"
