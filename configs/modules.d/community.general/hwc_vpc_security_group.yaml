name: hwc_vpc_security_group
fqcn: community.general.hwc_vpc_security_group
collection: community.general
short_description: Creates a resource of Vpc/SecurityGroup in Huawei Cloud
description: vpc security group management.
options:
  domain:
    type: str
    required: true
    description: The name of the Domain to scope to (Identity v3). Currently only domain names are supported,
      and not domain IDs.
  enterprise_project_id:
    type: str
    description: Specifies the enterprise project ID. When creating a security group, associate the enterprise
      project ID with the security group.s
  id:
    type: str
    description: The ID of resource to be managed.
  identity_endpoint:
    type: str
    required: true
    description: The Identity authentication URL.
  name:
    type: str
    required: true
    description: Specifies the security group name. The value is a string of 1 to 64 characters that can
      contain letters, digits, underscores (V(_)), hyphens (V(-)), and periods (V(.)).
  password:
    type: str
    required: true
    description: The password to login with.
  project:
    type: str
    required: true
    description: The name of the Tenant (Identity v2) or Project (Identity v3). Currently only project
      names are supported, and not project IDs.
  region:
    type: str
    description: The region to which the project belongs.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the given object should exist in Huawei Cloud.
  user:
    type: str
    required: true
    description: The user name to login with. Currently only user names are supported, and not user IDs.
  vpc_id:
    type: str
    description: Specifies the resource ID of the VPC to which the security group belongs.
writes: true
runtime: starlark
source: translated
examples: "\n# create a security group\n- name: Create a security group\n  community.general.hwc_vpc_security_group:\n\
  \    name: \"ansible_network_security_group_test\"\n"
