name: supervisorctl
fqcn: community.general.supervisorctl
collection: community.general
short_description: Manage the state of a program or group of programs running via supervisord
description: Manage the state of a program or group of programs running via supervisord
options:
  config:
    type: path
    description: The supervisor configuration file path
  name:
    type: str
    required: true
    description: The name of the supervisord program or group to manage. The name will be taken as group
      name when it ends with a colon V(:). If O(name=all), all programs and program groups will be managed.
  password:
    type: str
    description: password to use for authentication
  server_url:
    type: str
    description: URL on which supervisord server is listening
  signal:
    type: str
    description: The signal to send to the program/group, when combined with the 'signalled' state. Required
      when l(state=signalled).
  state:
    type: str
    required: true
    choices:
    - present
    - started
    - stopped
    - restarted
    - absent
    - signalled
    description: The desired state of program/group.
  stop_before_removing:
    type: bool
    default: false
    description: Use O(stop_before_removing=true) to stop the program/group before removing it
  supervisorctl_path:
    type: path
    description: path to supervisorctl executable
  username:
    type: str
    description: username to use for authentication
writes: true
runtime: starlark
source: translated
examples: "\n- name: Manage the state of program to be in started state\n  community.general.supervisorctl:\n\
  \    name: my_app\n    state: started\n\n- name: Manage the state of program group to be in started\
  \ state\n  community.general.supervisorctl:\n    name: 'my_apps:'\n    state: started\n\n- name: Restart\
  \ my_app, reading supervisorctl configuration from a specified file\n  community.general.supervisorctl:\n\
  \    name: my_app\n    state: restarted\n    config: /var/opt/my_project/supervisord.conf\n\n- name:\
  \ Restart my_app, connecting to supervisord with credentials and server URL\n  community.general.supervisorctl:\n\
  \    name: my_app\n    state: restarted\n    username: test\n    password: testpass\n    server_url:\
  \ http://localhost:9001\n\n- name: Send a signal to my_app via supervisorctl\n  community.general.supervisorctl:\n\
  \    name: my_app\n    state: signalled\n    signal: USR1\n\n- name: Restart all programs and program\
  \ groups\n  community.general.supervisorctl:\n    name: all\n    state: restarted\n"
