name: scaleway_sshkey
fqcn: community.general.scaleway_sshkey
collection: community.general
short_description: Scaleway SSH keys management module
description: This module manages SSH keys on Scaleway account U(https://developer.scaleway.com).
options:
  api_timeout:
    type: int
    default: 30
    aliases:
    - timeout
    description: HTTP timeout to Scaleway API in seconds.
  api_token:
    type: str
    required: true
    aliases:
    - oauth_token
    description: Scaleway OAuth token.
  api_url:
    type: str
    default: https://account.scaleway.com
    aliases:
    - base_url
    description: Scaleway API URL.
  query_parameters:
    type: dict
    default: {}
    description: List of parameters passed to the query string.
  ssh_pub_key:
    type: str
    required: true
    description: The public SSH key as a string to add.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the SSH key.
  validate_certs:
    type: bool
    default: true
    description: Validate SSL certs of the Scaleway API.
writes: true
runtime: starlark
source: translated
examples: "\n- name: \"Add SSH key\"\n  community.general.scaleway_sshkey:\n    ssh_pub_key: \"ssh-rsa\
  \ AAAA...\"\n    state: \"present\"\n\n- name: \"Delete SSH key\"\n  community.general.scaleway_sshkey:\n\
  \    ssh_pub_key: \"ssh-rsa AAAA...\"\n    state: \"absent\"\n\n- name: \"Add SSH key with explicit\
  \ token\"\n  community.general.scaleway_sshkey:\n    ssh_pub_key: \"ssh-rsa AAAA...\"\n    state: \"\
  present\"\n    oauth_token: \"6ecd2c9b-6f4f-44d4-a187-61a92078d08c\"\n"
