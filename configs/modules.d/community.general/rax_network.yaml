name: rax_network
fqcn: community.general.rax_network
collection: community.general
short_description: Create / delete an isolated network in Rackspace Public Cloud
description: creates / deletes a Rackspace Public Cloud isolated network.
options:
  api_key:
    type: str
    aliases:
    - password
    description: Rackspace API key, overrides O(credentials).
  auth_endpoint:
    type: str
    description: The URI of the authentication service. If not specified will be set to U(https://identity.api.rackspacecloud.com/v2.0/).
  cidr:
    type: str
    description: cidr of the network being created
  credentials:
    type: path
    aliases:
    - creds_file
    description: File to find the Rackspace credentials in. Ignored if O(api_key) and O(username) are
      provided.
  env:
    type: str
    description: Environment as configured in C(~/.pyrax.cfg), see U(https://github.com/rackspace/pyrax/blob/master/docs/getting_started.md#pyrax-configuration).
  identity_type:
    type: str
    default: rackspace
    description: Authentication mechanism to use, such as rackspace or keystone.
  label:
    type: str
    required: true
    description: Label (name) to give the network
  region:
    type: str
    description: Region to create an instance in.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Indicate desired state of the resource
  tenant_id:
    type: str
    description: The tenant ID used for authentication.
  tenant_name:
    type: str
    description: The tenant name used for authentication.
  username:
    type: str
    description: Rackspace username, overrides O(credentials).
  validate_certs:
    type: bool
    aliases:
    - verify_ssl
    description: Whether or not to require SSL validation of API endpoints.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Build an Isolated Network\n  gather_facts: false\n\n  tasks:\n    - name: Network\
  \ create request\n      local_action:\n        module: rax_network\n        credentials: ~/.raxpub\n\
  \        label: my-net\n        cidr: 192.168.3.0/24\n        state: present\n"
