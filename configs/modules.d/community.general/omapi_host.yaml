name: omapi_host
fqcn: community.general.omapi_host
collection: community.general
short_description: Setup OMAPI hosts
description: Manage OMAPI hosts into compatible DHCPd servers
options:
  ddns:
    type: bool
    default: false
    description: Enable dynamic DNS updates for this host.
  host:
    type: str
    default: localhost
    description: Sets OMAPI server host to interact with.
  hostname:
    type: str
    aliases:
    - name
    description: Sets the host lease hostname (mandatory if state=present).
  ip:
    type: str
    description: Sets the lease host IP address.
  key:
    type: str
    required: true
    description: Sets the TSIG key content for authenticating against OMAPI server.
  key_name:
    type: str
    required: true
    description: Sets the TSIG key name for authenticating against OMAPI server.
  macaddr:
    type: str
    required: true
    description: Sets the lease host MAC address.
  port:
    type: int
    default: 7911
    description: Sets the OMAPI server port to interact with.
  state:
    type: str
    required: true
    choices:
    - absent
    - present
    description: Create or remove OMAPI host.
  statements:
    type: list
    default: []
    description: Attach a list of OMAPI DHCP statements with host lease (without ending semicolon).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add a host using OMAPI\n  community.general.omapi_host:\n    key_name: defomapi\n\
  \    key: +bFQtBCta6j2vWkjPkNFtgA==\n    host: 10.98.4.55\n    macaddr: 44:dd:ab:dd:11:44\n    name:\
  \ server01\n    ip: 192.168.88.99\n    ddns: true\n    statements:\n    - filename \"pxelinux.0\"\n\
  \    - next-server 1.1.1.1\n    state: present\n\n- name: Remove a host using OMAPI\n  community.general.omapi_host:\n\
  \    key_name: defomapi\n    key: +bFQtBCta6j2vWkjPkNFtgA==\n    host: 10.1.1.1\n    macaddr: 00:66:ab:dd:11:44\n\
  \    state: absent\n"
