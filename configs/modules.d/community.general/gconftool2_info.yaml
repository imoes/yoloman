name: gconftool2_info
fqcn: community.general.gconftool2_info
collection: community.general
short_description: Retrieve GConf configurations
description: This module allows retrieving application preferences from the GConf database, with the help
  of C(gconftool-2).
options:
  key:
    type: str
    required: true
    description: The key name for an element in the GConf database.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Get value for a certain key in the database.\n  community.general.gconftool2_info:\n\
  \    key: /desktop/gnome/background/picture_filename\n  register: result\n"
