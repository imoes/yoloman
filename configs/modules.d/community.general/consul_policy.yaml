name: consul_policy
fqcn: community.general.consul_policy
collection: community.general
short_description: Manipulate Consul policies
description: Allows the addition, modification and deletion of policies in a consul cluster via the agent.
  For more details on using and configuring ACLs, see U(https://www.consul.io/docs/guides/acl.html).
options:
  ca_path:
    type: str
    description: The CA bundle to use for https connections
  description:
    type: str
    description: Description of the policy.
  host:
    type: str
    default: localhost
    description: Host of the consul agent, defaults to V(localhost).
  name:
    type: str
    required: true
    description: The name that should be associated with the policy, this is opaque to Consul.
  port:
    type: int
    default: 8500
    description: The port on which the consul agent is running.
  rules:
    type: str
    description: Rule document that should be associated with the current policy.
  scheme:
    type: str
    default: http
    description: The protocol scheme on which the consul agent is running. Defaults to V(http) and can
      be set to V(https) for secure connections.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the policy should be present or absent.
  token:
    type: str
    description: The token to use for authorization.
  valid_datacenters:
    type: list
    description: Valid datacenters for the policy. All if list is empty.
  validate_certs:
    type: bool
    default: true
    description: Whether to verify the TLS certificate of the consul agent.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a policy with rules\n  community.general.consul_policy:\n    host: consul1.example.com\n\
  \    token: some_management_acl\n    name: foo-access\n    rules: |\n        key \"foo\" {\n       \
  \     policy = \"read\"\n        }\n        key \"private/foo\" {\n            policy = \"deny\"\n \
  \       }\n\n- name: Update the rules associated to a policy\n  community.general.consul_policy:\n \
  \   host: consul1.example.com\n    token: some_management_acl\n    name: foo-access\n    rules: |\n\
  \        key \"foo\" {\n            policy = \"read\"\n        }\n        key \"private/foo\" {\n  \
  \          policy = \"deny\"\n        }\n        event \"bbq\" {\n            policy = \"write\"\n \
  \       }\n\n- name: Remove a policy\n  community.general.consul_policy:\n    host: consul1.example.com\n\
  \    token: some_management_acl\n    name: foo-access\n    state: absent\n"
