name: pip_package_info
fqcn: community.general.pip_package_info
collection: community.general
short_description: Pip package information
description: Return information about installed pip packages
options:
  clients:
    type: list
    default:
    - pip
    description: A list of the pip executables that will be used to get the packages. They can be supplied
      with the full path or just the executable name, for example V(pip3.7).
writes: false
runtime: starlark
source: translated
examples: "\n- name: Just get the list from default pip\n  community.general.pip_package_info:\n\n- name:\
  \ Get the facts for default pip, pip2 and pip3.6\n  community.general.pip_package_info:\n    clients:\
  \ ['pip', 'pip2', 'pip3.6']\n\n- name: Get from specific paths (virtualenvs?)\n  community.general.pip_package_info:\n\
  \    clients: '/home/me/projec42/python/pip3.5'\n"
