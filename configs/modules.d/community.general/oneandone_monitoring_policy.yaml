name: oneandone_monitoring_policy
fqcn: community.general.oneandone_monitoring_policy
collection: community.general
short_description: Configure 1&1 monitoring policy
description: Create, remove, update monitoring policies (and add/remove ports, processes, and servers).
  This module has a dependency on 1and1 >= 1.0.
options:
  add_ports:
    type: list
    default: []
    description: Ports to add to the monitoring policy.
  add_processes:
    type: list
    default: []
    description: Processes to add to the monitoring policy.
  add_servers:
    type: list
    default: []
    description: Servers to add to the monitoring policy.
  agent:
    type: str
    description: Set true for using agent.
  api_url:
    type: str
    description: Custom API URL. Overrides the ONEANDONE_API_URL environment variable.
  auth_token:
    type: str
    description: Authenticating API token provided by 1&1.
  description:
    type: str
    description: Monitoring policy description. maxLength=256
  email:
    type: str
    description: User's email. maxLength=128
  monitoring_policy:
    type: str
    description: The identifier (id or name) of the monitoring policy used with update state.
  name:
    type: str
    description: Monitoring policy name used with present state. Used as identifier (id or name) when
      used with absent state. maxLength=128
  ports:
    type: list
    default: []
    description: Array of ports that will be monitoring.
  processes:
    type: list
    default: []
    description: Array of processes that will be monitoring.
  remove_ports:
    type: list
    default: []
    description: Ports to remove from the monitoring policy.
  remove_processes:
    type: list
    default: []
    description: Processes to remove from the monitoring policy.
  remove_servers:
    type: list
    default: []
    description: Servers to remove from the monitoring policy.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - update
    description: Define a monitoring policy's state to create, remove, update.
  thresholds:
    type: list
    default: []
    description: Monitoring policy thresholds. Each of the suboptions have warning and critical, which
      both have alert and value suboptions. Warning is used to set limits for warning alerts, critical
      is used to set critical alerts. alert enables alert, and value is used to advise when the value
      is exceeded.
  update_ports:
    type: list
    default: []
    description: Ports to be updated on the monitoring policy.
  update_processes:
    type: list
    default: []
    description: Processes to be updated on the monitoring policy.
  wait:
    type: bool
    default: true
    description: wait for the instance to be in state 'running' before returning
  wait_interval:
    type: int
    default: 5
    description: Defines the number of seconds to wait when using the _wait_for methods
  wait_timeout:
    type: int
    default: 600
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a monitoring policy\n  community.general.oneandone_monitoring_policy:\n  \
  \  auth_token: oneandone_private_api_key\n    name: ansible monitoring policy\n    description: Testing\
  \ creation of a monitoring policy with ansible\n    email: your@emailaddress.com\n    agent: true\n\
  \    thresholds:\n     -\n       cpu:\n         warning:\n           value: 80\n           alert: false\n\
  \         critical:\n           value: 92\n           alert: false\n     -\n       ram:\n         warning:\n\
  \           value: 80\n           alert: false\n         critical:\n           value: 90\n         \
  \  alert: false\n     -\n       disk:\n         warning:\n           value: 80\n           alert: false\n\
  \         critical:\n           value: 90\n           alert: false\n     -\n       internal_ping:\n\
  \         warning:\n           value: 50\n           alert: false\n         critical:\n           value:\
  \ 100\n           alert: false\n     -\n       transfer:\n         warning:\n           value: 1000\n\
  \           alert: false\n         critical:\n           value: 2000\n           alert: false\n    ports:\n\
  \     -\n       protocol: TCP\n       port: 22\n       alert_if: RESPONDING\n       email_notification:\
  \ false\n    processes:\n     -\n       process: test\n       alert_if: NOT_RUNNING\n       email_notification:\
  \ false\n    wait: true\n\n- name: Destroy a monitoring policy\n  community.general.oneandone_monitoring_policy:\n\
  \    auth_token: oneandone_private_api_key\n    state: absent\n    name: ansible monitoring policy\n\
  \n- name: Update a monitoring policy\n  community.general.oneandone_monitoring_policy:\n    auth_token:\
  \ oneandone_private_api_key\n    monitoring_policy: ansible monitoring policy\n    name: ansible monitoring\
  \ policy updated\n    description: Testing creation of a monitoring policy with ansible updated\n  \
  \  email: another@emailaddress.com\n    thresholds:\n     -\n       cpu:\n         warning:\n      \
  \     value: 70\n           alert: false\n         critical:\n           value: 90\n           alert:\
  \ false\n     -\n       ram:\n         warning:\n           value: 70\n           alert: false\n   \
  \      critical:\n           value: 80\n           alert: false\n     -\n       disk:\n         warning:\n\
  \           value: 70\n           alert: false\n         critical:\n           value: 80\n         \
  \  alert: false\n     -\n       internal_ping:\n         warning:\n           value: 60\n          \
  \ alert: false\n         critical:\n           value: 90\n           alert: false\n     -\n       transfer:\n\
  \         warning:\n           value: 900\n           alert: false\n         critical:\n           value:\
  \ 1900\n           alert: false\n    wait: true\n    state: update\n\n- name: Add a port to a monitoring\
  \ policy\n  community.general.oneandone_monitoring_policy:\n    auth_token: oneandone_private_api_key\n\
  \    monitoring_policy: ansible monitoring policy updated\n    add_ports:\n     -\n       protocol:\
  \ TCP\n       port: 33\n       alert_if: RESPONDING\n       email_notification: false\n    wait: true\n\
  \    state: update\n\n- name: Update existing ports of a monitoring policy\n  community.general.oneandone_monitoring_policy:\n\
  \    auth_token: oneandone_private_api_key\n    monitoring_policy: ansible monitoring policy updated\n\
  \    update_ports:\n     -\n       id: existing_port_id\n       protocol: TCP\n       port: 34\n   \
  \    alert_if: RESPONDING\n       email_notification: false\n     -\n       id: existing_port_id\n \
  \      protocol: TCP\n       port: 23\n       alert_if: RESPONDING\n       email_notification: false\n\
  \    wait: true\n    state: update\n\n- name: Remove a port from a monitoring policy\n  community.general.oneandone_monitoring_policy:\n\
  \    auth_token: oneandone_private_api_key\n    monitoring_policy: ansible monitoring policy updated\n\
  \    remove_ports:\n     - port_id\n    state: update\n\n- name: Add a process to a monitoring policy\n\
  \  community.general.oneandone_monitoring_policy:\n    auth_token: oneandone_private_api_key\n    monitoring_policy:\
  \ ansible monitoring policy updated\n    add_processes:\n     -\n       process: test_2\n       alert_if:\
  \ NOT_RUNNING\n       email_notification: false\n    wait: true\n    state: update\n\n- name: Update\
  \ existing processes of a monitoring policy\n  community.general.oneandone_monitoring_policy:\n    auth_token:\
  \ oneandone_private_api_key\n    monitoring_policy: ansible monitoring policy updated\n    update_processes:\n\
  \     -\n       id: process_id\n       process: test_1\n       alert_if: NOT_RUNNING\n       email_notification:\
  \ false\n     -\n       id: process_id\n       process: test_3\n       alert_if: NOT_RUNNING\n     \
  \  email_notification: false\n    wait: true\n    state: update\n\n- name: Remove a process from a monitoring\
  \ policy\n  community.general.oneandone_monitoring_policy:\n    auth_token: oneandone_private_api_key\n\
  \    monitoring_policy: ansible monitoring policy updated\n    remove_processes:\n     - process_id\n\
  \    wait: true\n    state: update\n\n- name: Add server to a monitoring policy\n  community.general.oneandone_monitoring_policy:\n\
  \    auth_token: oneandone_private_api_key\n    monitoring_policy: ansible monitoring policy updated\n\
  \    add_servers:\n     - server id or name\n    wait: true\n    state: update\n\n- name: Remove server\
  \ from a monitoring policy\n  community.general.oneandone_monitoring_policy:\n    auth_token: oneandone_private_api_key\n\
  \    monitoring_policy: ansible monitoring policy updated\n    remove_servers:\n     - server01\n  \
  \  wait: true\n    state: update\n"
