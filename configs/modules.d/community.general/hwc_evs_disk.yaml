name: hwc_evs_disk
fqcn: community.general.hwc_evs_disk
collection: community.general
short_description: Creates a resource of Evs/Disk in Huawei Cloud
description: block storage management.
options:
  availability_zone:
    type: str
    required: true
    description: Specifies the AZ where you want to create the disk.
  backup_id:
    type: str
    description: Specifies the ID of the backup that can be used to create a disk. This parameter is mandatory
      when you use a backup to create the disk.
  description:
    type: str
    description: Specifies the disk description. The value can contain a maximum of 255 bytes.
  domain:
    type: str
    required: true
    description: The name of the Domain to scope to (Identity v3). Currently only domain names are supported,
      and not domain IDs.
  enable_full_clone:
    type: bool
    description: If the disk is created from a snapshot and linked cloning needs to be used, set this
      parameter to True.
  enable_scsi:
    type: bool
    description: If this parameter is set to True, the disk device type will be SCSI, which allows ECS
      OSs to directly access underlying storage media. SCSI reservation command is supported. If this
      parameter is set to False, the disk device type will be VBD, which supports only simple SCSI read/write
      commands. If parameter enable_share is set to True and this parameter is not specified, shared SCSI
      disks are created. SCSI EVS disks cannot be created from backups, which means that this parameter
      cannot be True if backup_id has been specified.
  enable_share:
    type: bool
    description: Specifies whether the disk is shareable. The default value is False.
  encryption_id:
    type: str
    description: Specifies the encryption ID. The length of it fixes at 36 bytes.
  enterprise_project_id:
    type: str
    description: Specifies the enterprise project ID. This ID is associated with the disk during the disk
      creation. If it is not specified, the disk is bound to the default enterprise project.
  id:
    type: str
    description: The ID of resource to be managed.
  identity_endpoint:
    type: str
    required: true
    description: The Identity authentication URL.
  image_id:
    type: str
    description: Specifies the image ID. If this parameter is specified, the disk is created from an image.
      BMS system disks cannot be created from BMS images.
  name:
    type: str
    required: true
    description: Specifies the disk name. The value can contain a maximum of 255 bytes.
  password:
    type: str
    required: true
    description: The password to login with.
  project:
    type: str
    required: true
    description: The name of the Tenant (Identity v2) or Project (Identity v3). Currently only project
      names are supported, and not project IDs.
  region:
    type: str
    description: The region to which the project belongs.
  size:
    type: int
    description: Specifies the disk size, in GB. Its values are as follows, System disk 1 GB to 1024 GB,
      Data disk 10 GB to 32768 GB. This parameter is mandatory when you create an empty disk or use an
      image or a snapshot to create a disk. If you use an image or a snapshot to create a disk, the disk
      size must be greater than or equal to the image or snapshot size. This parameter is optional when
      you use a backup to create a disk. If this parameter is not specified, the disk size is equal to
      the backup size.
  snapshot_id:
    type: str
    description: Specifies the snapshot ID. If this parameter is specified, the disk is created from a
      snapshot.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Whether the given object should exist in Huaweicloud Cloud.
  timeouts:
    type: dict
    default: {}
    description: The timeouts for each operations.
  user:
    type: str
    required: true
    description: The user name to login with. Currently only user names are supported, and not user IDs.
  volume_type:
    type: str
    required: true
    description: Specifies the disk type. Currently, the value can be SSD, SAS, or SATA. SSD specifies
      the ultra-high I/O disk type. SAS specifies the high I/O disk type. SATA specifies the common I/O
      disk type. If the specified disk type is not available in the AZ, the disk will fail to create.
      If the EVS disk is created from a snapshot, the volume_type field must be the same as that of the
      snapshot's source disk.
writes: true
runtime: starlark
source: translated
examples: "\n# test create disk\n- name: Create a disk\n  community.general.hwc_evs_disk:\n    availability_zone:\
  \ \"cn-north-1a\"\n    name: \"ansible_evs_disk_test\"\n    volume_type: \"SATA\"\n    size: 10\n"
