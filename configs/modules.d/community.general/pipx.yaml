name: pipx
fqcn: community.general.pipx
collection: community.general
short_description: Manages applications installed with pipx
description: Manage Python applications installed in isolated virtualenvs using pipx.
options:
  editable:
    type: bool
    default: false
    description: Install the project in editable mode.
  executable:
    type: path
    description: 'Path to the C(pipx) installed in the system. If not specified, the module will use C(python
      -m pipx) to run the tool, using the same Python interpreter as ansible itself.

      '
  force:
    type: bool
    default: false
    description: Force modification of the application's virtual environment. See C(pipx) for details.
      Only used when O(state=install), O(state=upgrade), O(state=upgrade_all), O(state=latest), or O(state=inject).
  include_injected:
    type: bool
    default: false
    description: Upgrade the injected packages along with the application. Only used when O(state=upgrade),
      O(state=upgrade_all), or O(state=latest). This is used with O(state=upgrade) and O(state=latest)
      since community.general 6.6.0.
  index_url:
    type: str
    description: Base URL of Python Package Index. Only used when O(state=install), O(state=upgrade),
      O(state=latest), or O(state=inject).
  inject_packages:
    type: list
    description: Packages to be injected into an existing virtual environment. Only used when O(state=inject).
  install_apps:
    type: bool
    default: false
    description: Add apps from the injected packages. Only used when O(state=inject).
  install_deps:
    type: bool
    default: false
    description: Include applications of dependent packages. Only used when O(state=install), O(state=latest),
      or O(state=inject).
  name:
    type: str
    description: 'The name of the application to be installed. It must to be a simple package name. For
      passing package specifications or installing from URLs or directories, please use the O(source)
      option.

      '
  pip_args:
    type: str
    description: Arbitrary arguments to pass directly to C(pip).
  python:
    type: str
    description: Python version to be used when creating the application virtual environment. Must be
      3.6+. Only used when O(state=install), O(state=latest), O(state=reinstall), or O(state=reinstall_all).
  source:
    type: str
    description: "If the application source, such as a package with version specifier, or an URL, directory\
      \ or any other accepted specification. See C(pipx) documentation for more details.\n When specified,\
      \ the C(pipx) command will use O(source) instead of O(name)."
  state:
    type: str
    default: install
    choices:
    - present
    - absent
    - install
    - uninstall
    - uninstall_all
    - inject
    - upgrade
    - upgrade_all
    - reinstall
    - reinstall_all
    - latest
    description: Desired state for the application. The states V(present) and V(absent) are aliases to
      V(install) and V(uninstall), respectively. The state V(latest) is equivalent to executing the task
      twice, with state V(install) and then V(upgrade). It was added in community.general 5.5.0.
  system_site_packages:
    type: bool
    default: false
    description: Give application virtual environment access to the system site-packages directory. Only
      used when O(state=install) or O(state=latest).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install tox\n  community.general.pipx:\n    name: tox\n\n- name: Install tox from\
  \ git repository\n  community.general.pipx:\n    name: tox\n    source: git+https://github.com/tox-dev/tox.git\n\
  \n- name: Upgrade tox\n  community.general.pipx:\n    name: tox\n    state: upgrade\n\n- name: Reinstall\
  \ black with specific Python version\n  community.general.pipx:\n    name: black\n    state: reinstall\n\
  \    python: 3.7\n\n- name: Uninstall pycowsay\n  community.general.pipx:\n    name: pycowsay\n    state:\
  \ absent\n"
