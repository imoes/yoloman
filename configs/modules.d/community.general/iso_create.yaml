name: iso_create
fqcn: community.general.iso_create
collection: community.general
short_description: Generate ISO file with specified files or folders
description: This module is used to generate ISO file with specified path of files.
options:
  dest_iso:
    type: path
    required: true
    description: The absolute path with file name of the new generated ISO file on local machine. Will
      create intermediate folders when they does not exist.
  interchange_level:
    type: int
    default: 1
    choices:
    - 1
    - 2
    - 3
    - 4
    description: The ISO9660 interchange level to use, it dictates the rules on the names of files. Levels
      and valid values V(1), V(2), V(3), V(4) are supported. The default value is level V(1), which is
      the most conservative, level V(3) is recommended. ISO9660 file names at interchange level V(1) cannot
      have more than 8 characters or 3 characters in the extension.
  joliet:
    type: int
    choices:
    - 1
    - 2
    - 3
    description: Support levels and valid values are V(1), V(2), or V(3). Level V(3) is by far the most
      common. If not specified, then no Joliet support is added.
  rock_ridge:
    type: str
    choices:
    - '1.09'
    - '1.10'
    - '1.12'
    description: Whether to make this ISO have the Rock Ridge extensions or not. Valid values are V(1.09),
      V(1.10) or V(1.12), means adding the specified Rock Ridge version to the ISO. If unsure, set V(1.09)
      to ensure maximum compatibility. If not specified, then not add Rock Ridge extension to the ISO.
  src_files:
    type: list
    required: true
    description: 'This is a list of absolute paths of source files or folders which will be contained
      in the new generated ISO file. Will fail if specified file or folder in O(src_files) does not exist
      on local machine. Note: With all ISO9660 levels from 1 to 3, all file names are restricted to uppercase
      letters, numbers and underscores (_). File names are limited to 31 characters, directory nesting
      is limited to 8 levels, and path names are limited to 255 characters.'
  udf:
    type: bool
    default: false
    description: Whether to add UDF support to this ISO. If set to V(true), then version 2.60 of the UDF
      spec is used. If not specified or set to V(false), then no UDF support is added.
  vol_ident:
    type: str
    description: The volume identification string to use on the new generated ISO image.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create an ISO file\n  community.general.iso_create:\n    src_files:\n      - /root/testfile.yml\n\
  \      - /root/testfolder\n    dest_iso: /tmp/test.iso\n    interchange_level: 3\n\n- name: Create an\
  \ ISO file with Rock Ridge extension\n  community.general.iso_create:\n    src_files:\n      - /root/testfile.yml\n\
  \      - /root/testfolder\n    dest_iso: /tmp/test.iso\n    rock_ridge: 1.09\n\n- name: Create an ISO\
  \ file with Joliet support\n  community.general.iso_create:\n    src_files:\n      - ./windows_config/Autounattend.xml\n\
  \    dest_iso: ./test.iso\n    interchange_level: 3\n    joliet: 3\n    vol_ident: WIN_AUTOINSTALL\n"
