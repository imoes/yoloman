name: keycloak_component_info
fqcn: community.general.keycloak_component_info
collection: community.general
short_description: Retrive component info in Keycloak
description: This module retrive information on component from Keycloak.
options:
  auth_client_id:
    type: str
    default: admin-cli
    description: OpenID Connect C(client_id) to authenticate to the API with.
  auth_client_secret:
    type: str
    description: Client Secret to use in conjunction with O(auth_client_id) (if required).
  auth_keycloak_url:
    type: str
    required: true
    aliases:
    - url
    description: URL to the Keycloak instance.
  auth_password:
    type: str
    aliases:
    - password
    description: Password to authenticate for API access with.
  auth_realm:
    type: str
    description: Keycloak realm name to authenticate to for API access.
  auth_username:
    type: str
    aliases:
    - username
    description: Username to authenticate for API access with.
  connection_timeout:
    type: int
    default: 10
    description: Controls the HTTP connections timeout period (in seconds) to Keycloak API.
  http_agent:
    type: str
    default: Ansible
    description: Configures the HTTP User-Agent header.
  name:
    type: str
    description: Name of the Component.
  parent_id:
    type: str
    description: Container ID of the components.
  provider_type:
    type: str
    description: 'Provider type of components. Example: V(org.keycloak.storage.UserStorageProvider), V(org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy),
      V(org.keycloak.keys.KeyProvider), V(org.keycloak.userprofile.UserProfileProvider), V(org.keycloak.storage.ldap.mappers.LDAPStorageMapper).'
  realm:
    type: str
    required: true
    description: The name of the realm.
  token:
    type: str
    description: Authentication token for Keycloak API.
  validate_certs:
    type: bool
    default: true
    description: Verify TLS certificates (do not disable this in production).
writes: false
runtime: starlark
source: translated
examples: "\n    - name: Retrive info of a UserStorageProvider named myldap\n      community.general.keycloak_component_info:\n\
  \        auth_keycloak_url: http://localhost:8080/auth\n        auth_sername: admin\n        auth_password:\
  \ password\n        auth_realm: master\n        realm: myrealm\n        name: myldap\n        provider_type:\
  \ org.keycloak.storage.UserStorageProvider\n\n    - name: Retrive key info component\n      community.general.keycloak_component_info:\n\
  \        auth_keycloak_url: http://localhost:8080/auth\n        auth_sername: admin\n        auth_password:\
  \ password\n        auth_realm: master\n        realm: myrealm\n        name: rsa-enc-generated\n  \
  \      provider_type: org.keycloak.keys.KeyProvider\n\n    - name: Retrive all component from realm\
  \ master\n      community.general.keycloak_component_info:\n        auth_keycloak_url: http://localhost:8080/auth\n\
  \        auth_sername: admin\n        auth_password: password\n        auth_realm: master\n        realm:\
  \ myrealm\n\n    - name: Retrive all sub components of parent component filter by type\n      community.general.keycloak_component_info:\n\
  \        auth_keycloak_url: http://localhost:8080/auth\n        auth_sername: admin\n        auth_password:\
  \ password\n        auth_realm: master\n        realm: myrealm\n        parent_id: \"075ef2fa-19fc-4a6d-bf4c-249f57365fd2\"\
  \n        provider_type: \"org.keycloak.storage.ldap.mappers.LDAPStorageMapper\"\n\n\n"
