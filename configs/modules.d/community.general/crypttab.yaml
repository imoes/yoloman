name: crypttab
fqcn: community.general.crypttab
collection: community.general
short_description: Encrypted Linux block devices
description: Control Linux encrypted block devices that are set up during system boot in C(/etc/crypttab).
options:
  backing_device:
    type: str
    description: Path to the underlying block device or file, or the UUID of a block-device prefixed with
      V(UUID=).
  name:
    type: str
    required: true
    description: Name of the encrypted block device as it appears in the C(/etc/crypttab) file, or optionally
      prefixed with V(/dev/mapper/), as it appears in the filesystem. V(/dev/mapper/) will be stripped
      from O(name).
  opts:
    type: str
    description: A comma-delimited list of options. See V(crypttab(5\)) for details.
  password:
    type: path
    description: Encryption password, the path to a file containing the password, or V(-) or unset if
      the password should be entered at boot.
  path:
    type: path
    default: /etc/crypttab
    description: Path to file to use instead of V(/etc/crypttab). This might be useful in a chroot environment.
  state:
    type: str
    required: true
    choices:
    - absent
    - opts_absent
    - opts_present
    - present
    description: Use V(present) to add a line to C(/etc/crypttab) or update its definition if already
      present. Use V(absent) to remove a line with matching O(name). Use V(opts_present) to add options
      to those already present; options with different values will be updated. Use V(opts_absent) to remove
      options from the existing set.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set the options explicitly a device which must already exist\n  community.general.crypttab:\n\
  \    name: luks-home\n    state: present\n    opts: discard,cipher=aes-cbc-essiv:sha256\n\n- name: Add\
  \ the 'discard' option to any existing options for all devices\n  community.general.crypttab:\n    name:\
  \ '{{ item.device }}'\n    state: opts_present\n    opts: discard\n  loop: '{{ ansible_mounts }}'\n\
  \  when: \"'/dev/mapper/luks-' in {{ item.device }}\"\n"
