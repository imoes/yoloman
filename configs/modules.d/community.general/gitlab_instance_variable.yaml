name: gitlab_instance_variable
fqcn: community.general.gitlab_instance_variable
collection: community.general
short_description: Creates, updates, or deletes GitLab instance variables
description: Creates a instance variable if it does not exist. When a instance variable does exist, its
  value will be updated if the values are different. Support for instance variables requires GitLab >=
  13.0. Variables which are not mentioned in the modules options, but are present on the GitLab instance,
  will either stay (O(purge=false)) or will be deleted (O(purge=true)).
options:
  api_job_token:
    type: str
    description: GitLab CI job token for logging in.
  api_oauth_token:
    type: str
    description: GitLab OAuth token for logging in.
  api_password:
    type: str
    description: The password to use for authentication against the API.
  api_token:
    type: str
    description: GitLab access token with API permissions.
  api_url:
    type: str
    description: The resolvable endpoint for the API.
  api_username:
    type: str
    description: The username to use for authentication against the API.
  ca_path:
    type: str
    description: The CA certificates bundle to use to verify GitLab server certificate.
  purge:
    type: bool
    default: false
    description: When set to V(true), delete all variables which are not mentioned in the task.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: Create or delete instance variable.
  validate_certs:
    type: bool
    default: true
    description: Whether or not to validate SSL certs when supplying a HTTPS endpoint.
  variables:
    type: list
    default: []
    description: A list of dictionaries that represents CI/CD variables.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set or update some CI/CD variables\n  community.general.gitlab_instance_variable:\n\
  \    api_url: https://gitlab.com\n    api_token: secret_access_token\n    purge: false\n    variables:\n\
  \      - name: ACCESS_KEY_ID\n        value: abc1312cba\n      - name: SECRET_ACCESS_KEY\n        value:\
  \ 1337\n        masked: true\n        protected: true\n        variable_type: env_var\n\n- name: Delete\
  \ one variable\n  community.general.gitlab_instance_variable:\n    api_url: https://gitlab.com\n   \
  \ api_token: secret_access_token\n    state: absent\n    variables:\n      - name: ACCESS_KEY_ID\n"
