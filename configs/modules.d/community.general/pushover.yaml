name: pushover
fqcn: community.general.pushover
collection: community.general
short_description: Send notifications via U(https://pushover.net)
description: Send notifications via pushover, to subscriber list of devices, and email addresses. Requires
  pushover app on devices.
options:
  app_token:
    type: str
    required: true
    description: Pushover issued token identifying your pushover app.
  device:
    type: str
    description: A device the message should be sent to. Multiple devices can be specified, separated
      by a comma.
  msg:
    type: str
    required: true
    description: What message you wish to send.
  pri:
    type: str
    default: '0'
    choices:
    - '-2'
    - '-1'
    - '0'
    - '1'
    - '2'
    description: Message priority (see U(https://pushover.net) for details).
  title:
    type: str
    description: Message title.
  user_key:
    type: str
    required: true
    description: Pushover issued authentication key for your user.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Send notifications via pushover.net\n  community.general.pushover:\n    msg: '{{\
  \ inventory_hostname }} is acting strange ...'\n    app_token: wxfdksl\n    user_key: baa5fe97f2c5ab3ca8f0bb59\n\
  \  delegate_to: localhost\n\n- name: Send notifications via pushover.net\n  community.general.pushover:\n\
  \    title: 'Alert!'\n    msg: '{{ inventory_hostname }} has exploded in flames, It is now time to panic'\n\
  \    pri: 1\n    app_token: wxfdksl\n    user_key: baa5fe97f2c5ab3ca8f0bb59\n  delegate_to: localhost\n\
  \n- name: Send notifications via pushover.net to a specific device\n  community.general.pushover:\n\
  \    msg: '{{ inventory_hostname }} has been lost somewhere'\n    app_token: wxfdksl\n    user_key:\
  \ baa5fe97f2c5ab3ca8f0bb59\n    device: admins-iPhone\n  delegate_to: localhost\n"
