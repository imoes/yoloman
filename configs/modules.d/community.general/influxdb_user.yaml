name: influxdb_user
fqcn: community.general.influxdb_user
collection: community.general
short_description: Manage InfluxDB users
description: Manage InfluxDB users.
options:
  admin:
    type: bool
    default: false
    description: Whether the user should be in the admin role or not. Since version 2.8, the role will
      also be updated.
  grants:
    type: list
    description: Privileges to grant to this user. Takes a list of dicts containing the "database" and
      "privilege" keys. If this argument is not provided, the current grants will be left alone. If an
      empty list is provided, all grants for the user will be removed.
  hostname:
    type: str
    default: localhost
    description: The hostname or IP address on which InfluxDB server is listening.
  password:
    type: str
    default: root
    aliases:
    - login_password
    description: Password that will be used to authenticate against InfluxDB server.
  path:
    type: str
    default: ''
    description: The path on which InfluxDB server is accessible. Only available when using python-influxdb
      >= 5.1.0.
  port:
    type: int
    default: 8086
    description: The port on which InfluxDB server is listening.
  proxies:
    type: dict
    default: {}
    description: HTTP(S) proxy to use for Requests to connect to InfluxDB server.
  retries:
    type: int
    default: 3
    description: Number of retries client will try before aborting. V(0) indicates try until success.
      Only available when using python-influxdb >= 4.1.0.
  ssl:
    type: bool
    default: false
    description: Use https instead of http to connect to InfluxDB server.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: State of the user.
  timeout:
    type: int
    description: Number of seconds Requests will wait for client to establish a connection.
  udp_port:
    type: int
    default: 4444
    description: UDP port to connect to InfluxDB server.
  use_udp:
    type: bool
    default: false
    description: Use UDP to connect to InfluxDB server.
  user_name:
    type: str
    required: true
    description: Name of the user.
  user_password:
    type: str
    description: Password to be set for the user.
  username:
    type: str
    default: root
    aliases:
    - login_username
    description: Username that will be used to authenticate against InfluxDB server.
  validate_certs:
    type: bool
    default: true
    description: If set to V(false), the SSL certificates will not be validated. This should only set
      to V(false) used on personally controlled sites using self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a user on localhost using default login credentials\n  community.general.influxdb_user:\n\
  \    user_name: john\n    user_password: s3cr3t\n\n- name: Create a user on localhost using custom login\
  \ credentials\n  community.general.influxdb_user:\n    user_name: john\n    user_password: s3cr3t\n\
  \    login_username: \"{{ influxdb_username }}\"\n    login_password: \"{{ influxdb_password }}\"\n\n\
  - name: Create an admin user on a remote host using custom login credentials\n  community.general.influxdb_user:\n\
  \    user_name: john\n    user_password: s3cr3t\n    admin: true\n    hostname: \"{{ influxdb_hostname\
  \ }}\"\n    login_username: \"{{ influxdb_username }}\"\n    login_password: \"{{ influxdb_password\
  \ }}\"\n\n- name: Create a user on localhost with privileges\n  community.general.influxdb_user:\n \
  \   user_name: john\n    user_password: s3cr3t\n    login_username: \"{{ influxdb_username }}\"\n  \
  \  login_password: \"{{ influxdb_password }}\"\n    grants:\n      - database: 'collectd'\n        privilege:\
  \ 'WRITE'\n      - database: 'graphite'\n        privilege: 'READ'\n\n- name: Destroy a user using custom\
  \ login credentials\n  community.general.influxdb_user:\n    user_name: john\n    login_username: \"\
  {{ influxdb_username }}\"\n    login_password: \"{{ influxdb_password }}\"\n    state: absent\n"
