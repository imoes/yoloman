name: profitbricks
fqcn: community.general.profitbricks
collection: community.general
short_description: Create, destroy, start, stop, and reboot a ProfitBricks virtual machine
description: Create, destroy, update, start, stop, and reboot a ProfitBricks virtual machine. When the
  virtual machine is created it can optionally wait for it to be 'running' before returning. This module
  has a dependency on profitbricks >= 1.0.0
options:
  assign_public_ip:
    type: bool
    default: false
    description: This will assign the machine to the public LAN. If no LAN exists with public Internet
      access it is created.
  auto_increment:
    type: bool
    default: true
    description: Whether or not to increment a single number in the name for created virtual machines.
  bus:
    type: str
    default: VIRTIO
    choices:
    - IDE
    - VIRTIO
    description: The bus type for the volume.
  cores:
    type: int
    default: 2
    description: The number of CPU cores to allocate to the virtual machine.
  count:
    type: int
    default: 1
    description: The number of virtual machines to create.
  cpu_family:
    type: str
    default: AMD_OPTERON
    choices:
    - AMD_OPTERON
    - INTEL_XEON
    description: The CPU family type to allocate to the virtual machine.
  datacenter:
    type: str
    description: The datacenter to provision this virtual machine.
  disk_type:
    type: str
    default: HDD
    choices:
    - SSD
    - HDD
    description: the type of disk to be allocated.
  image:
    type: str
    description: The system image ID for creating the virtual machine, e.g. a3eae284-a2fe-11e4-b187-5f1f641608c8.
  image_password:
    type: str
    description: Password set for the administrative user.
  instance_ids:
    type: list
    default: []
    description: list of instance ids, currently only used when state='absent' to remove instances.
  lan:
    type: int
    default: 1
    description: The ID of the LAN you wish to add the servers to.
  location:
    type: str
    default: us/las
    choices:
    - us/las
    - de/fra
    - de/fkb
    description: The datacenter location. Use only if you want to create the Datacenter or else this value
      is ignored.
  name:
    type: str
    description: The name of the virtual machine.
  ram:
    type: int
    default: 2048
    description: The amount of memory to allocate to the virtual machine.
  remove_boot_volume:
    type: bool
    default: true
    description: remove the bootVolume of the virtual machine you're destroying.
  ssh_keys:
    type: list
    default: []
    description: Public SSH keys allowing access to the virtual machine.
  state:
    type: str
    default: present
    description: 'create or terminate instances The choices available are: V(running), V(stopped), V(absent),
      V(present).'
  subscription_password:
    type: str
    description: THe ProfitBricks password. Overrides the PB_PASSWORD environment variable.
  subscription_user:
    type: str
    description: The ProfitBricks username. Overrides the PB_SUBSCRIPTION_ID environment variable.
  volume_size:
    type: int
    default: 10
    description: The size in GB of the boot volume.
  wait:
    type: bool
    default: true
    description: wait for the instance to be in state 'running' before returning
  wait_timeout:
    type: int
    default: 600
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n\n# Note: These examples do not set authentication details, see the AWS Guide for details.\n\
  \n# Provisioning example\n- name: Create three servers and enumerate their names\n  community.general.profitbricks:\n\
  \    datacenter: Tardis One\n    name: web%02d.stackpointcloud.com\n    cores: 4\n    ram: 2048\n  \
  \  volume_size: 50\n    cpu_family: INTEL_XEON\n    image: a3eae284-a2fe-11e4-b187-5f1f641608c8\n  \
  \  location: us/las\n    count: 3\n    assign_public_ip: true\n\n- name: Remove virtual machines\n \
  \ community.general.profitbricks:\n    datacenter: Tardis One\n    instance_ids:\n      - 'web001.stackpointcloud.com'\n\
  \      - 'web002.stackpointcloud.com'\n      - 'web003.stackpointcloud.com'\n    wait_timeout: 500\n\
  \    state: absent\n\n- name: Start virtual machines\n  community.general.profitbricks:\n    datacenter:\
  \ Tardis One\n    instance_ids:\n      - 'web001.stackpointcloud.com'\n      - 'web002.stackpointcloud.com'\n\
  \      - 'web003.stackpointcloud.com'\n    wait_timeout: 500\n    state: running\n\n- name: Stop virtual\
  \ machines\n  community.general.profitbricks:\n    datacenter: Tardis One\n    instance_ids:\n     \
  \ - 'web001.stackpointcloud.com'\n      - 'web002.stackpointcloud.com'\n      - 'web003.stackpointcloud.com'\n\
  \    wait_timeout: 500\n    state: stopped\n"
