name: wakeonlan
fqcn: community.general.wakeonlan
collection: community.general
short_description: Send a magic Wake-on-LAN (WoL) broadcast packet
description: The C(wakeonlan) module sends magic Wake-on-LAN (WoL) broadcast packets.
options:
  broadcast:
    type: str
    default: 255.255.255.255
    description: Network broadcast address to use for broadcasting magic Wake-on-LAN packet.
  mac:
    type: str
    required: true
    description: MAC address to send Wake-on-LAN broadcast packet for.
  port:
    type: int
    default: 7
    description: UDP port to use for magic Wake-on-LAN packet.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Send a magic Wake-on-LAN packet to 00:00:5E:00:53:66\n  community.general.wakeonlan:\n\
  \    mac: '00:00:5E:00:53:66'\n    broadcast: 192.0.2.23\n  delegate_to: localhost\n\n- community.general.wakeonlan:\n\
  \    mac: 00:00:5E:00:53:66\n    port: 9\n  delegate_to: localhost\n"
