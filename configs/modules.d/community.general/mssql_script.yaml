name: mssql_script
fqcn: community.general.mssql_script
collection: community.general
short_description: Execute SQL scripts on a MSSQL database
description: Execute SQL scripts on a MSSQL database.
options:
  login_host:
    type: str
    required: true
    description: Host running the database.
  login_password:
    type: str
    description: The password used to authenticate with.
  login_port:
    type: int
    default: 1433
    description: Port of the MSSQL server. Requires O(login_host) be defined as well.
  login_user:
    type: str
    description: The username used to authenticate with.
  name:
    type: str
    default: ''
    aliases:
    - db
    description: Database to run script against.
  output:
    type: str
    default: default
    choices:
    - dict
    - default
    description: With V(default) each row will be returned as a list of values. See RV(query_results).
      Output format V(dict) will return dictionary with the column names as keys. See RV(query_results_dict).
      V(dict) requires named columns to be returned by each query otherwise an error is thrown.
  params:
    type: dict
    description: 'Parameters passed to the script as SQL parameters.

      (Query V(''SELECT %(name\)s"'') with V(example: ''{"name": "John Doe"}).)''

      '
  script:
    type: str
    required: true
    description: The SQL script to be executed. Script can contain multiple SQL statements. Multiple Batches
      can be separated by V(GO) command. Each batch must return at least one result set.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Check DB connection\n  community.general.mssql_script:\n    login_user: \"{{ mssql_login_user\
  \ }}\"\n    login_password: \"{{ mssql_login_password }}\"\n    login_host: \"{{ mssql_host }}\"\n \
  \   login_port: \"{{ mssql_port }}\"\n    db: master\n    script: \"SELECT 1\"\n\n- name: Query with\
  \ parameter\n  community.general.mssql_script:\n    login_user: \"{{ mssql_login_user }}\"\n    login_password:\
  \ \"{{ mssql_login_password }}\"\n    login_host: \"{{ mssql_host }}\"\n    login_port: \"{{ mssql_port\
  \ }}\"\n    script: |\n      SELECT name, state_desc FROM sys.databases WHERE name = %(dbname)s\n  \
  \  params:\n      dbname: msdb\n  register: result_params\n- assert:\n    that:\n      - result_params.query_results[0][0][0][0]\
  \ == 'msdb'\n      - result_params.query_results[0][0][0][1] == 'ONLINE'\n\n- name: two batches with\
  \ default output\n  community.general.mssql_script:\n    login_user: \"{{ mssql_login_user }}\"\n  \
  \  login_password: \"{{ mssql_login_password }}\"\n    login_host: \"{{ mssql_host }}\"\n    login_port:\
  \ \"{{ mssql_port }}\"\n    script: |\n      SELECT 'Batch 0 - Select 0'\n      SELECT 'Batch 0 - Select\
  \ 1'\n      GO\n      SELECT 'Batch 1 - Select 0'\n  register: result_batches\n- assert:\n    that:\n\
  \      - result_batches.query_results | length == 2  # two batch results\n      - result_batches.query_results[0]\
  \ | length == 2  # two selects in first batch\n      - result_batches.query_results[0][0] | length ==\
  \ 1  # one row in first select\n      - result_batches.query_results[0][0][0] | length == 1  # one column\
  \ in first row\n      - result_batches.query_results[0][0][0][0] == 'Batch 0 - Select 0'  # each row\
  \ contains a list of values.\n\n- name: two batches with dict output\n  community.general.mssql_script:\n\
  \    login_user: \"{{ mssql_login_user }}\"\n    login_password: \"{{ mssql_login_password }}\"\n  \
  \  login_host: \"{{ mssql_host }}\"\n    login_port: \"{{ mssql_port }}\"\n    output: dict\n    script:\
  \ |\n      SELECT 'Batch 0 - Select 0' as b0s0\n      SELECT 'Batch 0 - Select 1' as b0s1\n      GO\n\
  \      SELECT 'Batch 1 - Select 0' as b1s0\n  register: result_batches_dict\n- assert:\n    that:\n\
  \      - result_batches_dict.query_results_dict | length == 2  # two batch results\n      - result_batches_dict.query_results_dict[0]\
  \ | length == 2  # two selects in first batch\n      - result_batches_dict.query_results_dict[0][0]\
  \ | length == 1  # one row in first select\n      - result_batches_dict.query_results_dict[0][0][0]['b0s0']\
  \ == 'Batch 0 - Select 0'  # column 'b0s0' of first row\n"
