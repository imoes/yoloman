name: oneandone_firewall_policy
fqcn: community.general.oneandone_firewall_policy
collection: community.general
short_description: Configure 1&1 firewall policy
description: Create, remove, reconfigure, update firewall policies. This module has a dependency on 1and1
  >= 1.0.
options:
  add_rules:
    type: list
    default: []
    description: A list of rules that will be added to an existing firewall policy. It is syntax is the
      same as the one used for rules parameter. Used in combination with update state.
  add_server_ips:
    type: list
    default: []
    description: A list of server identifiers (id or name) to be assigned to a firewall policy. Used in
      combination with update state.
  api_url:
    type: str
    description: Custom API URL. Overrides the ONEANDONE_API_URL environment variable.
  auth_token:
    type: str
    description: Authenticating API token provided by 1&1.
  description:
    type: str
    description: Firewall policy description. maxLength=256
  firewall_policy:
    type: str
    description: The identifier (id or name) of the firewall policy used with update state.
  name:
    type: str
    description: Firewall policy name used with present state. Used as identifier (id or name) when used
      with absent state. maxLength=128
  remove_rules:
    type: list
    default: []
    description: A list of rule ids that will be removed from an existing firewall policy. Used in combination
      with update state.
  remove_server_ips:
    type: list
    default: []
    description: A list of server IP ids to be unassigned from a firewall policy. Used in combination
      with update state.
  rules:
    type: list
    default: []
    description: A list of rules that will be set for the firewall policy. Each rule must contain protocol
      parameter, in addition to three optional parameters (port_from, port_to, and source)
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    - update
    description: Define a firewall policy state to create, remove, or update.
  wait:
    type: bool
    default: true
    description: wait for the instance to be in state 'running' before returning
  wait_interval:
    type: int
    default: 5
    description: Defines the number of seconds to wait when using the _wait_for methods
  wait_timeout:
    type: int
    default: 600
    description: how long before wait gives up, in seconds
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a firewall policy\n  community.general.oneandone_firewall_policy:\n    auth_token:\
  \ oneandone_private_api_key\n    name: ansible-firewall-policy\n    description: Testing creation of\
  \ firewall policies with ansible\n    rules:\n     -\n       protocol: TCP\n       port_from: 80\n \
  \      port_to: 80\n       source: 0.0.0.0\n    wait: true\n    wait_timeout: 500\n\n- name: Destroy\
  \ a firewall policy\n  community.general.oneandone_firewall_policy:\n    auth_token: oneandone_private_api_key\n\
  \    state: absent\n    name: ansible-firewall-policy\n\n- name: Update a firewall policy\n  community.general.oneandone_firewall_policy:\n\
  \    auth_token: oneandone_private_api_key\n    state: update\n    firewall_policy: ansible-firewall-policy\n\
  \    name: ansible-firewall-policy-updated\n    description: Testing creation of firewall policies with\
  \ ansible - updated\n\n- name: Add server to a firewall policy\n  community.general.oneandone_firewall_policy:\n\
  \    auth_token: oneandone_private_api_key\n    firewall_policy: ansible-firewall-policy-updated\n \
  \   add_server_ips:\n     - server_identifier (id or name)\n     - server_identifier #2 (id or name)\n\
  \    wait: true\n    wait_timeout: 500\n    state: update\n\n- name: Remove server from a firewall policy\n\
  \  community.general.oneandone_firewall_policy:\n    auth_token: oneandone_private_api_key\n    firewall_policy:\
  \ ansible-firewall-policy-updated\n    remove_server_ips:\n     - B2504878540DBC5F7634EB00A07C1EBD (server's\
  \ IP id)\n    wait: true\n    wait_timeout: 500\n    state: update\n\n- name: Add rules to a firewall\
  \ policy\n  community.general.oneandone_firewall_policy:\n    auth_token: oneandone_private_api_key\n\
  \    firewall_policy: ansible-firewall-policy-updated\n    description: Adding rules to an existing\
  \ firewall policy\n    add_rules:\n     -\n       protocol: TCP\n       port_from: 70\n       port_to:\
  \ 70\n       source: 0.0.0.0\n     -\n       protocol: TCP\n       port_from: 60\n       port_to: 60\n\
  \       source: 0.0.0.0\n    wait: true\n    wait_timeout: 500\n    state: update\n\n- name: Remove\
  \ rules from a firewall policy\n  community.general.oneandone_firewall_policy:\n    auth_token: oneandone_private_api_key\n\
  \    firewall_policy: ansible-firewall-policy-updated\n    remove_rules:\n     - rule_id #1\n     -\
  \ rule_id #2\n     - ...\n    wait: true\n    wait_timeout: 500\n    state: update\n"
