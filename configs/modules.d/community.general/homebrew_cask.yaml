name: homebrew_cask
fqcn: community.general.homebrew_cask
collection: community.general
short_description: Install and uninstall homebrew casks
description: Manages Homebrew casks.
options:
  accept_external_apps:
    type: bool
    default: false
    description: Allow external apps.
  greedy:
    type: bool
    default: false
    description: Upgrade casks that auto update. Passes C(--greedy) to C(brew outdated --cask) when checking
      if an installed cask has a newer version available, or to C(brew upgrade --cask) when upgrading
      all casks.
  install_options:
    type: list
    aliases:
    - options
    description: Options flags to install a package.
  name:
    type: list
    aliases:
    - cask
    - package
    - pkg
    description: Name of cask to install or remove.
  path:
    type: path
    default: /usr/local/bin:/opt/homebrew/bin
    description: ''':'' separated list of paths to search for ''brew'' executable.'
  state:
    type: str
    default: present
    choices:
    - absent
    - installed
    - latest
    - present
    - removed
    - uninstalled
    - upgraded
    description: State of the cask.
  sudo_password:
    type: str
    description: The sudo password to be passed to SUDO_ASKPASS.
  update_homebrew:
    type: bool
    default: false
    description: Update homebrew itself first. Note that C(brew cask update) is a synonym for C(brew update).
  upgrade_all:
    type: bool
    default: false
    aliases:
    - upgrade
    description: Upgrade all casks. Mutually exclusive with C(upgraded) state.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install cask\n  community.general.homebrew_cask:\n    name: alfred\n    state: present\n\
  \n- name: Remove cask\n  community.general.homebrew_cask:\n    name: alfred\n    state: absent\n\n-\
  \ name: Install cask with install options\n  community.general.homebrew_cask:\n    name: alfred\n  \
  \  state: present\n    install_options: 'appdir=/Applications'\n\n- name: Install cask with install\
  \ options\n  community.general.homebrew_cask:\n    name: alfred\n    state: present\n    install_options:\
  \ 'debug,appdir=/Applications'\n\n- name: Install cask with force option\n  community.general.homebrew_cask:\n\
  \    name: alfred\n    state: present\n    install_options: force\n\n- name: Allow external app\n  community.general.homebrew_cask:\n\
  \    name: alfred\n    state: present\n    accept_external_apps: true\n\n- name: Remove cask with force\
  \ option\n  community.general.homebrew_cask:\n    name: alfred\n    state: absent\n    install_options:\
  \ force\n\n- name: Upgrade all casks\n  community.general.homebrew_cask:\n    upgrade_all: true\n\n\
  - name: Upgrade all casks with greedy option\n  community.general.homebrew_cask:\n    upgrade_all: true\n\
  \    greedy: true\n\n- name: Upgrade given cask with force option\n  community.general.homebrew_cask:\n\
  \    name: alfred\n    state: upgraded\n    install_options: force\n\n- name: Upgrade cask with greedy\
  \ option\n  community.general.homebrew_cask:\n    name: 1password\n    state: upgraded\n    greedy:\
  \ true\n\n- name: Using sudo password for installing cask\n  community.general.homebrew_cask:\n    name:\
  \ wireshark\n    state: present\n    sudo_password: \"{{ ansible_become_pass }}\"\n"
