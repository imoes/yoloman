name: aix_filesystem
fqcn: community.general.aix_filesystem
collection: community.general
short_description: Configure LVM and NFS file systems for AIX
description: This module creates, removes, mount and unmount LVM and NFS file system for AIX using C(/etc/filesystems).
  For LVM file systems is possible to resize a file system.
options:
  account_subsystem:
    type: bool
    default: false
    description: Specifies whether the file system is to be processed by the accounting subsystem.
  attributes:
    type: list
    default:
    - agblksize='4096'
    - isnapshot='no'
    description: Specifies attributes for files system separated by comma.
  auto_mount:
    type: bool
    default: true
    description: File system is automatically mounted at system restart.
  device:
    type: str
    description: Logical volume (LV) device name or remote export device to create a NFS file system.
      It is used to create a file system on an already existing logical volume or the exported NFS file
      system. If not mentioned a new logical volume name will be created following AIX standards (LVM).
  filesystem:
    type: str
    required: true
    description: Specifies the mount point, which is the directory where the file system will be mounted.
  fs_type:
    type: str
    default: jfs2
    description: Specifies the virtual file system type.
  mount_group:
    type: str
    description: Specifies the mount group.
  nfs_server:
    type: str
    description: Specifies a Network File System (NFS) server.
  permissions:
    type: str
    default: rw
    choices:
    - ro
    - rw
    description: Set file system permissions. V(rw) (read-write) or V(ro) (read-only).
  rm_mount_point:
    type: bool
    default: false
    description: Removes the mount point directory when used with state V(absent).
  size:
    type: str
    description: Specifies the file system size. For already V(present) it will be resized. 512-byte blocks,
      Megabytes or Gigabytes. If the value has M specified it will be in Megabytes. If the value has G
      specified it will be in Gigabytes. If no M or G the value will be 512-byte blocks. If "+" is specified
      in begin of value, the value will be added. If "-" is specified in begin of value, the value will
      be removed. If "+" or "-" is not specified, the total value will be the specified. Size will respects
      the LVM AIX standards.
  state:
    type: str
    default: present
    choices:
    - absent
    - mounted
    - present
    - unmounted
    description: Controls the file system state. V(present) check if file system exists, creates or resize.
      V(absent) removes existing file system if already V(unmounted). V(mounted) checks if the file system
      is mounted or mount the file system. V(unmounted) check if the file system is unmounted or unmount
      the file system.
  vg:
    type: str
    description: Specifies an existing volume group (VG).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create filesystem in a previously defined logical volume.\n  community.general.aix_filesystem:\n\
  \    device: testlv\n    filesystem: /testfs\n    state: present\n\n- name: Creating NFS filesystem\
  \ from nfshost.\n  community.general.aix_filesystem:\n    device: /home/ftp\n    nfs_server: nfshost\n\
  \    filesystem: /home/ftp\n    state: present\n\n- name: Creating a new file system without a previously\
  \ logical volume.\n  community.general.aix_filesystem:\n    filesystem: /newfs\n    size: 1G\n    state:\
  \ present\n    vg: datavg\n\n- name: Unmounting /testfs.\n  community.general.aix_filesystem:\n    filesystem:\
  \ /testfs\n    state: unmounted\n\n- name: Resizing /mksysb to +512M.\n  community.general.aix_filesystem:\n\
  \    filesystem: /mksysb\n    size: +512M\n    state: present\n\n- name: Resizing /mksysb to 11G.\n\
  \  community.general.aix_filesystem:\n    filesystem: /mksysb\n    size: 11G\n    state: present\n\n\
  - name: Resizing /mksysb to -2G.\n  community.general.aix_filesystem:\n    filesystem: /mksysb\n   \
  \ size: -2G\n    state: present\n\n- name: Remove NFS filesystem /home/ftp.\n  community.general.aix_filesystem:\n\
  \    filesystem: /home/ftp\n    rm_mount_point: true\n    state: absent\n\n- name: Remove /newfs.\n\
  \  community.general.aix_filesystem:\n    filesystem: /newfs\n    rm_mount_point: true\n    state: absent\n"
