name: nmcli
fqcn: community.general.nmcli
collection: community.general
short_description: Manage Networking
description: 'Manage the network devices. Create, modify and manage various connection and device type
  e.g., ethernet, teams, bonds, vlans etc. On CentOS 8 and Fedora >=29 like systems, the requirements
  can be met by installing the following packages: NetworkManager. On CentOS 7 and Fedora <=28 like systems,
  the requirements can be met by installing the following packages: NetworkManager-tui. On Ubuntu and
  Debian like systems, the requirements can be met by installing the following packages: network-manager
  On openSUSE, the requirements can be met by installing the following packages: NetworkManager.'
options:
  addr_gen_mode6:
    type: str
    choices:
    - default
    - default-or-eui64
    - eui64
    - stable-privacy
    description: Configure method for creating the address for use with IPv6 Stateless Address Autoconfiguration.
      V(default) and V(default-or-eui64) have been added in community.general 6.5.0.
  ageingtime:
    type: int
    default: 300
    description: This is only used with bridge - [ageing-time <0-1000000>] the Ethernet MAC address aging
      time, in seconds.
  arp_interval:
    type: int
    description: This is only used with bond - ARP interval.
  arp_ip_target:
    type: str
    description: This is only used with bond - ARP IP target.
  autoconnect:
    type: bool
    default: true
    description: Whether the connection should start on boot. Whether the connection profile can be automatically
      activated
  conn_name:
    type: str
    required: true
    description: The name used to call the connection. Pattern is <type>[-<ifname>][-<num>].
  dhcp_client_id:
    type: str
    description: DHCP Client Identifier sent to the DHCP server.
  dns4:
    type: list
    description: A list of up to 3 DNS servers. The entries must be IPv4 addresses, for example V(192.0.2.53).
  dns4_ignore_auto:
    type: bool
    default: false
    description: Ignore automatically configured IPv4 name servers.
  dns4_options:
    type: list
    description: A list of DNS options.
  dns4_search:
    type: list
    description: A list of DNS search domains.
  dns6:
    type: list
    description: A list of up to 3 DNS servers. The entries must be IPv6 addresses, for example V(2001:4860:4860::8888).
  dns6_ignore_auto:
    type: bool
    default: false
    description: Ignore automatically configured IPv6 name servers.
  dns6_options:
    type: list
    description: A list of DNS options.
  dns6_search:
    type: list
    description: A list of DNS search domains.
  downdelay:
    type: int
    description: This is only used with bond - downdelay.
  egress:
    type: str
    description: This is only used with VLAN - VLAN egress priority mapping.
  flags:
    type: str
    description: This is only used with VLAN - flags.
  forwarddelay:
    type: int
    default: 15
    description: This is only used with bridge - [forward-delay <2-30>] STP forwarding delay, in seconds.
  gsm:
    type: dict
    description: 'The configuration of the GSM connection. Note the list of suboption attributes may vary
      depending on which version of NetworkManager/nmcli is installed on the host. An up-to-date list
      of supported attributes can be found here: U(https://networkmanager.dev/docs/api/latest/settings-gsm.html).
      For instance to use apn, pin, username and password: V({apn: provider.apn, pin: 1234, username:
      apn.username, password: apn.password}).'
  gw4:
    type: str
    description: The IPv4 gateway for this interface. Use the format V(192.0.2.1). This parameter is mutually_exclusive
      with never_default4 parameter.
  gw4_ignore_auto:
    type: bool
    default: false
    description: Ignore automatically configured IPv4 routes.
  gw6:
    type: str
    description: The IPv6 gateway for this interface. Use the format V(2001:db8::1).
  gw6_ignore_auto:
    type: bool
    default: false
    description: Ignore automatically configured IPv6 routes.
  hairpin:
    type: bool
    default: false
    description: This is only used with 'bridge-slave' - 'hairpin mode' for the slave, which allows frames
      to be sent back out through the slave the frame was received on. The default change to V(false)
      in community.general 7.0.0. It used to be V(true) before.
  hellotime:
    type: int
    default: 2
    description: This is only used with bridge - [hello-time <1-10>] STP hello time, in seconds.
  ifname:
    type: str
    description: The interface to bind the connection to. The connection will only be applicable to this
      interface name. A special value of V('*') can be used for interface-independent connections. The
      ifname argument is mandatory for all connection types except bond, team, bridge, vlan and vpn. This
      parameter defaults to O(conn_name) when left unset for all connection types except vpn that removes
      it.
  ignore_unsupported_suboptions:
    type: bool
    default: false
    description: Ignore suboptions which are invalid or unsupported by the version of NetworkManager/nmcli
      installed on the host. Only O(wifi) and O(wifi_sec) options are currently affected.
  ingress:
    type: str
    description: This is only used with VLAN - VLAN ingress priority mapping.
  ip4:
    type: list
    description: List of IPv4 addresses to this interface. Use the format V(192.0.2.24/24) or V(192.0.2.24).
      If defined and O(method4) is not specified, automatically set C(ipv4.method) to V(manual).
  ip6:
    type: list
    description: List of IPv6 addresses to this interface. Use the format V(abbe::cafe/128) or V(abbe::cafe).
      If defined and O(method6) is not specified, automatically set C(ipv6.method) to V(manual).
  ip_privacy6:
    type: str
    choices:
    - disabled
    - prefer-public-addr
    - prefer-temp-addr
    - unknown
    description: If enabled, it makes the kernel generate a temporary IPv6 address in addition to the
      public one.
  ip_tunnel_dev:
    type: str
    description: This is used with GRE/IPIP/SIT - parent device this GRE/IPIP/SIT tunnel, can use ifname.
  ip_tunnel_input_key:
    type: str
    description: The key used for tunnel input packets. Only used when O(type=gre).
  ip_tunnel_local:
    type: str
    description: This is used with GRE/IPIP/SIT - GRE/IPIP/SIT local IP address.
  ip_tunnel_output_key:
    type: str
    description: The key used for tunnel output packets. Only used when O(type=gre).
  ip_tunnel_remote:
    type: str
    description: This is used with GRE/IPIP/SIT - GRE/IPIP/SIT destination IP address.
  mac:
    type: str
    description: MAC address of the connection. Note this requires a recent kernel feature, originally
      introduced in 3.15 upstream kernel.
  macvlan:
    type: dict
    description: 'The configuration of the MAC VLAN connection. Note the list of suboption attributes
      may vary depending on which version of NetworkManager/nmcli is installed on the host. An up-to-date
      list of supported attributes can be found here: U(https://networkmanager.dev/docs/api/latest/settings-macvlan.html).'
  master:
    type: str
    description: Master <master (ifname, or connection UUID or conn_name) of bridge, team, bond master
      connection profile. Mandatory if O(slave_type) is defined.
  maxage:
    type: int
    default: 20
    description: This is only used with bridge - [max-age <6-42>] STP maximum message age, in seconds.
  may_fail4:
    type: bool
    default: true
    description: If you need O(ip4) configured before C(network-online.target) is reached, set this option
      to V(false). This option applies when O(method4) is not V(disabled).
  method4:
    type: str
    choices:
    - auto
    - link-local
    - manual
    - shared
    - disabled
    description: Configuration method to be used for IPv4. If O(ip4) is set, C(ipv4.method) is automatically
      set to V(manual) and this parameter is not needed.
  method6:
    type: str
    choices:
    - ignore
    - auto
    - dhcp
    - link-local
    - manual
    - shared
    - disabled
    description: Configuration method to be used for IPv6 If O(ip6) is set, C(ipv6.method) is automatically
      set to V(manual) and this parameter is not needed. V(disabled) was added in community.general 3.3.0.
  miimon:
    type: int
    description: This is only used with bond - miimon. This parameter defaults to V(100) when unset.
  mode:
    type: str
    default: balance-rr
    choices:
    - 802.3ad
    - active-backup
    - balance-alb
    - balance-rr
    - balance-tlb
    - balance-xor
    - broadcast
    description: This is the type of device or network connection that you wish to create for a bond or
      bridge.
  mtu:
    type: int
    description: The connection MTU, e.g. 9000. This can't be applied when creating the interface and
      is done once the interface has been created. Can be used when modifying Team, VLAN, Ethernet (Future
      plans to implement wifi, gsm, pppoe, infiniband) This parameter defaults to V(1500) when unset.
  never_default4:
    type: bool
    default: false
    description: Set as default route. This parameter is mutually_exclusive with gw4 parameter.
  path_cost:
    type: int
    default: 100
    description: This is only used with 'bridge-slave' - [<1-65535>] - STP port cost for destinations
      via this slave.
  primary:
    type: str
    description: This is only used with bond and is the primary interface name (for "active-backup" mode),
      this is the usually the 'ifname'.
  priority:
    type: int
    default: 128
    description: This is only used with 'bridge' - sets STP priority.
  route_metric4:
    type: int
    description: Set metric level of ipv4 routes configured on interface.
  route_metric6:
    type: int
    description: Set metric level of IPv6 routes configured on interface.
  routes4:
    type: list
    description: The list of IPv4 routes. Use the format V(192.0.3.0/24 192.0.2.1). To specify more complex
      routes, use the O(routes4_extended) option.
  routes4_extended:
    type: list
    description: The list of IPv4 routes.
  routes6:
    type: list
    description: The list of IPv6 routes. Use the format V(fd12:3456:789a:1::/64 2001:dead:beef::1). To
      specify more complex routes, use the O(routes6_extended) option.
  routes6_extended:
    type: list
    description: The list of IPv6 routes but with parameters.
  routing_rules4:
    type: list
    description: Is the same as in an C(ip rule add) command, except always requires specifying a priority.
  runner:
    type: str
    default: roundrobin
    choices:
    - broadcast
    - roundrobin
    - activebackup
    - loadbalance
    - lacp
    description: This is the type of device or network connection that you wish to create for a team.
  runner_fast_rate:
    type: bool
    description: Option specifies the rate at which our link partner is asked to transmit LACPDU packets.
      If this is V(true) then packets will be sent once per second. Otherwise they will be sent every
      30 seconds. Only allowed for O(runner=lacp).
  runner_hwaddr_policy:
    type: str
    choices:
    - same_all
    - by_active
    - only_active
    description: This defines the policy of how hardware addresses of team device and port devices should
      be set during the team lifetime.
  slave_type:
    type: str
    choices:
    - bond
    - bridge
    - team
    description: Type of the device of this slave's master connection (for example V(bond)).
  slavepriority:
    type: int
    default: 32
    description: This is only used with 'bridge-slave' - [<0-63>] - STP priority of this slave.
  ssid:
    type: str
    description: Name of the Wireless router or the access point.
  state:
    type: str
    required: true
    choices:
    - absent
    - present
    description: Whether the device should exist or not, taking action if the state is different from
      what is stated.
  stp:
    type: bool
    default: true
    description: This is only used with bridge and controls whether Spanning Tree Protocol (STP) is enabled
      for this bridge.
  transport_mode:
    type: str
    choices:
    - datagram
    - connected
    description: This option sets the connection type of Infiniband IPoIB devices.
  type:
    type: str
    choices:
    - bond
    - bond-slave
    - bridge
    - bridge-slave
    - dummy
    - ethernet
    - generic
    - gre
    - infiniband
    - ipip
    - macvlan
    - sit
    - team
    - team-slave
    - vlan
    - vxlan
    - wifi
    - gsm
    - wireguard
    - vpn
    - loopback
    description: This is the type of device or network connection that you wish to create or modify. Type
      V(dummy) is added in community.general 3.5.0. Type V(gsm) is added in community.general 3.7.0. Type
      V(infiniband) is added in community.general 2.0.0. Type V(loopback) is added in community.general
      8.1.0. Type V(macvlan) is added in community.general 6.6.0. Type V(wireguard) is added in community.general
      4.3.0. Type V(vpn) is added in community.general 5.1.0. Using V(bond-slave), V(bridge-slave), or
      V(team-slave) implies V(ethernet) connection type with corresponding O(slave_type) option. If you
      want to control non-ethernet connection attached to V(bond), V(bridge), or V(team) consider using
      O(slave_type) option.
  updelay:
    type: int
    description: This is only used with bond - updelay.
  vlandev:
    type: str
    description: This is only used with VLAN - parent device this VLAN is on, can use ifname.
  vlanid:
    type: int
    description: This is only used with VLAN - VLAN ID in range <0-4095>.
  vpn:
    type: dict
    description: Configuration of a VPN connection (PPTP and L2TP). In order to use L2TP you need to be
      sure that C(network-manager-l2tp) - and C(network-manager-l2tp-gnome) if host has UI - are installed
      on the host.
  vxlan_id:
    type: int
    description: This is only used with VXLAN - VXLAN ID.
  vxlan_local:
    type: str
    description: This is only used with VXLAN - VXLAN local IP address.
  vxlan_remote:
    type: str
    description: This is only used with VXLAN - VXLAN destination IP address.
  wifi:
    type: dict
    description: 'The configuration of the WiFi connection. Note the list of suboption attributes may
      vary depending on which version of NetworkManager/nmcli is installed on the host. An up-to-date
      list of supported attributes can be found here: U(https://networkmanager.dev/docs/api/latest/settings-802-11-wireless.html).
      For instance to create a hidden AP mode WiFi connection: V({hidden: true, mode: ap}).'
  wifi_sec:
    type: dict
    description: 'The security configuration of the WiFi connection. Note the list of suboption attributes
      may vary depending on which version of NetworkManager/nmcli is installed on the host. An up-to-date
      list of supported attributes can be found here: U(https://networkmanager.dev/docs/api/latest/settings-802-11-wireless-security.html).
      For instance to use common WPA-PSK auth with a password: V({key-mgmt: wpa-psk, psk: my_password}).'
  wireguard:
    type: dict
    description: 'The configuration of the Wireguard connection. Note the list of suboption attributes
      may vary depending on which version of NetworkManager/nmcli is installed on the host. An up-to-date
      list of supported attributes can be found here: U(https://networkmanager.dev/docs/api/latest/settings-wireguard.html).
      For instance to configure a listen port: V({listen-port: 12345}).'
  xmit_hash_policy:
    type: str
    description: This is only used with bond - xmit_hash_policy type.
  zone:
    type: str
    description: The trust level of the connection. When updating this property on a currently activated
      connection, the change takes effect immediately.
writes: true
runtime: starlark
source: translated
examples: "\n# These examples are using the following inventory:\n#\n# ## Directory layout:\n#\n# |_/inventory/cloud-hosts\n\
  # |           /group_vars/openstack-stage.yml\n# |           /host_vars/controller-01.openstack.host.com\n\
  # |           /host_vars/controller-02.openstack.host.com\n# |_/playbook/library/nmcli.py\n# |     \
  \     /playbook-add.yml\n# |          /playbook-del.yml\n# ```\n#\n# ## inventory examples\n# ### groups_vars\n\
  # ```yml\n# ---\n# #devops_os_define_network\n# storage_gw: \"192.0.2.254\"\n# external_gw: \"198.51.100.254\"\
  \n# tenant_gw: \"203.0.113.254\"\n#\n# #Team vars\n# nmcli_team:\n#   - conn_name: tenant\n#     ip4:\
  \ '{{ tenant_ip }}'\n#     gw4: '{{ tenant_gw }}'\n#   - conn_name: external\n#     ip4: '{{ external_ip\
  \ }}'\n#     gw4: '{{ external_gw }}'\n#   - conn_name: storage\n#     ip4: '{{ storage_ip }}'\n#  \
  \   gw4: '{{ storage_gw }}'\n# nmcli_team_slave:\n#   - conn_name: em1\n#     ifname: em1\n#     master:\
  \ tenant\n#   - conn_name: em2\n#     ifname: em2\n#     master: tenant\n#   - conn_name: p2p1\n#  \
  \   ifname: p2p1\n#     master: storage\n#   - conn_name: p2p2\n#     ifname: p2p2\n#     master: external\n\
  #\n# #bond vars\n# nmcli_bond:\n#   - conn_name: tenant\n#     ip4: '{{ tenant_ip }}'\n#     gw4: ''\n\
  #     mode: balance-rr\n#   - conn_name: external\n#     ip4: '{{ external_ip }}'\n#     gw4: ''\n#\
  \     mode: balance-rr\n#   - conn_name: storage\n#     ip4: '{{ storage_ip }}'\n#     gw4: '{{ storage_gw\
  \ }}'\n#     mode: balance-rr\n# nmcli_bond_slave:\n#   - conn_name: em1\n#     ifname: em1\n#     master:\
  \ tenant\n#   - conn_name: em2\n#     ifname: em2\n#     master: tenant\n#   - conn_name: p2p1\n#  \
  \   ifname: p2p1\n#     master: storage\n#   - conn_name: p2p2\n#     ifname: p2p2\n#     master: external\n\
  #\n# #ethernet vars\n# nmcli_ethernet:\n#   - conn_name: em1\n#     ifname: em1\n#     ip4:\n#     \
  \  - '{{ tenant_ip }}'\n#       - '{{ second_tenant_ip }}'\n#     gw4: '{{ tenant_gw }}'\n#   - conn_name:\
  \ em2\n#     ifname: em2\n#     ip4: '{{ tenant_ip1 }}'\n#     gw4: '{{ tenant_gw }}'\n#   - conn_name:\
  \ p2p1\n#     ifname: p2p1\n#     ip4: '{{ storage_ip }}'\n#     gw4: '{{ storage_gw }}'\n#   - conn_name:\
  \ p2p2\n#     ifname: p2p2\n#     ip4: '{{ external_ip }}'\n#     gw4: '{{ external_gw }}'\n# ```\n\
  #\n# ### host_vars\n# ```yml\n# ---\n# storage_ip: \"192.0.2.91/23\"\n# external_ip: \"198.51.100.23/21\"\
  \n# tenant_ip: \"203.0.113.77/23\"\n# second_tenant_ip: \"204.0.113.77/23\"\n# ```\n\n\n\n## playbook-add.yml\
  \ example\n\n---\n- hosts: openstack-stage\n  remote_user: root\n  tasks:\n\n  - name: Install needed\
  \ network manager libs\n    ansible.builtin.package:\n      name:\n        - NetworkManager-libnm\n\
  \        - nm-connection-editor\n        - libsemanage-python\n        - policycoreutils-python\n  \
  \    state: present\n\n##### Working with all cloud nodes - Teaming\n  - name: Try nmcli add team -\
  \ conn_name only & ip4 gw4\n    community.general.nmcli:\n      type: team\n      conn_name: '{{ item.conn_name\
  \ }}'\n      ip4: '{{ item.ip4 }}'\n      gw4: '{{ item.gw4 }}'\n      state: present\n    with_items:\n\
  \      - '{{ nmcli_team }}'\n\n  - name: Try nmcli add teams-slave\n    community.general.nmcli:\n \
  \     type: team-slave\n      conn_name: '{{ item.conn_name }}'\n      ifname: '{{ item.ifname }}'\n\
  \      master: '{{ item.master }}'\n      state: present\n    with_items:\n      - '{{ nmcli_team_slave\
  \ }}'\n\n###### Working with all cloud nodes - Bonding\n  - name: Try nmcli add bond - conn_name only\
  \ & ip4 gw4 mode\n    community.general.nmcli:\n      type: bond\n      conn_name: '{{ item.conn_name\
  \ }}'\n      ip4: '{{ item.ip4 }}'\n      gw4: '{{ item.gw4 }}'\n      mode: '{{ item.mode }}'\n   \
  \   state: present\n    with_items:\n      - '{{ nmcli_bond }}'\n\n  - name: Try nmcli add bond-slave\n\
  \    community.general.nmcli:\n      type: bond-slave\n      conn_name: '{{ item.conn_name }}'\n   \
  \   ifname: '{{ item.ifname }}'\n      master: '{{ item.master }}'\n      state: present\n    with_items:\n\
  \      - '{{ nmcli_bond_slave }}'\n\n##### Working with all cloud nodes - Ethernet\n  - name: Try nmcli\
  \ add Ethernet - conn_name only & ip4 gw4\n    community.general.nmcli:\n      type: ethernet\n    \
  \  conn_name: '{{ item.conn_name }}'\n      ip4: '{{ item.ip4 }}'\n      gw4: '{{ item.gw4 }}'\n   \
  \   state: present\n    with_items:\n      - '{{ nmcli_ethernet }}'\n\n## playbook-del.yml example\n\
  - hosts: openstack-stage\n  remote_user: root\n  tasks:\n\n  - name: Try nmcli del team - multiple\n\
  \    community.general.nmcli:\n      conn_name: '{{ item.conn_name }}'\n      state: absent\n    with_items:\n\
  \      - conn_name: em1\n      - conn_name: em2\n      - conn_name: p1p1\n      - conn_name: p1p2\n\
  \      - conn_name: p2p1\n      - conn_name: p2p2\n      - conn_name: tenant\n      - conn_name: storage\n\
  \      - conn_name: external\n      - conn_name: team-em1\n      - conn_name: team-em2\n      - conn_name:\
  \ team-p1p1\n      - conn_name: team-p1p2\n      - conn_name: team-p2p1\n      - conn_name: team-p2p2\n\
  \n  - name: Add an Ethernet connection with static IP configuration\n    community.general.nmcli:\n\
  \      conn_name: my-eth1\n      ifname: eth1\n      type: ethernet\n      ip4: 192.0.2.100/24\n   \
  \   gw4: 192.0.2.1\n      state: present\n\n  - name: Add an Team connection with static IP configuration\n\
  \    community.general.nmcli:\n      conn_name: my-team1\n      ifname: my-team1\n      type: team\n\
  \      ip4: 192.0.2.100/24\n      gw4: 192.0.2.1\n      state: present\n      autoconnect: true\n\n\
  \  - name: Optionally, at the same time specify IPv6 addresses for the device\n    community.general.nmcli:\n\
  \      conn_name: my-eth1\n      ifname: eth1\n      type: ethernet\n      ip4: 192.0.2.100/24\n   \
  \   gw4: 192.0.2.1\n      ip6: 2001:db8::cafe\n      gw6: 2001:db8::1\n      state: present\n\n  - name:\
  \ Add two IPv4 DNS server addresses\n    community.general.nmcli:\n      conn_name: my-eth1\n      type:\
  \ ethernet\n      dns4:\n      - 192.0.2.53\n      - 198.51.100.53\n      state: present\n\n  - name:\
  \ Make a profile usable for all compatible Ethernet interfaces\n    community.general.nmcli:\n     \
  \ ctype: ethernet\n      name: my-eth1\n      ifname: '*'\n      state: present\n\n  - name: Change\
  \ the property of a setting e.g. MTU\n    community.general.nmcli:\n      conn_name: my-eth1\n     \
  \ mtu: 9000\n      type: ethernet\n      state: present\n\n  - name: Add second ip4 address\n    community.general.nmcli:\n\
  \      conn_name: my-eth1\n      ifname: eth1\n      type: ethernet\n      ip4:\n        - 192.0.2.100/24\n\
  \        - 192.0.3.100/24\n      state: present\n\n  - name: Add second ip6 address\n    community.general.nmcli:\n\
  \      conn_name: my-eth1\n      ifname: eth1\n      type: ethernet\n      ip6:\n        - 2001:db8::cafe\n\
  \        - 2002:db8::cafe\n      state: present\n\n  - name: Add VxLan\n    community.general.nmcli:\n\
  \      type: vxlan\n      conn_name: vxlan_test1\n      vxlan_id: 16\n      vxlan_local: 192.168.1.2\n\
  \      vxlan_remote: 192.168.1.5\n\n  - name: Add gre\n    community.general.nmcli:\n      type: gre\n\
  \      conn_name: gre_test1\n      ip_tunnel_dev: eth0\n      ip_tunnel_local: 192.168.1.2\n      ip_tunnel_remote:\
  \ 192.168.1.5\n\n  - name: Add ipip\n    community.general.nmcli:\n      type: ipip\n      conn_name:\
  \ ipip_test1\n      ip_tunnel_dev: eth0\n      ip_tunnel_local: 192.168.1.2\n      ip_tunnel_remote:\
  \ 192.168.1.5\n\n  - name: Add sit\n    community.general.nmcli:\n      type: sit\n      conn_name:\
  \ sit_test1\n      ip_tunnel_dev: eth0\n      ip_tunnel_local: 192.168.1.2\n      ip_tunnel_remote:\
  \ 192.168.1.5\n\n  - name: Add zone\n    community.general.nmcli:\n      type: ethernet\n      conn_name:\
  \ my-eth1\n      zone: external\n      state: present\n\n# nmcli exits with status 0 if it succeeds\
  \ and exits with a status greater\n# than zero when there is a failure. The following list of status\
  \ codes may be\n# returned:\n#\n#     - 0 Success - indicates the operation succeeded\n#     - 1 Unknown\
  \ or unspecified error\n#     - 2 Invalid user input, wrong nmcli invocation\n#     - 3 Timeout expired\
  \ (see --wait option)\n#     - 4 Connection activation failed\n#     - 5 Connection deactivation failed\n\
  #     - 6 Disconnecting device failed\n#     - 7 Connection deletion failed\n#     - 8 NetworkManager\
  \ is not running\n#     - 9 nmcli and NetworkManager versions mismatch\n#     - 10 Connection, device,\
  \ or access point does not exist.\n\n- name: Create the wifi connection\n  community.general.nmcli:\n\
  \    type: wifi\n    conn_name: Brittany\n    ifname: wlp4s0\n    ssid: Brittany\n    wifi_sec:\n  \
  \    key-mgmt: wpa-psk\n      psk: my_password\n    autoconnect: true\n    state: present\n\n- name:\
  \ Create a hidden AP mode wifi connection\n  community.general.nmcli:\n    type: wifi\n    conn_name:\
  \ ChocoMaster\n    ifname: wlo1\n    ssid: ChocoMaster\n    wifi:\n      hidden: true\n      mode: ap\n\
  \    autoconnect: true\n    state: present\n\n- name: Create a gsm connection\n  community.general.nmcli:\n\
  \    type: gsm\n    conn_name: my-gsm-provider\n    ifname: cdc-wdm0\n    gsm:\n        apn: my.provider.apn\n\
  \        username: my-provider-username\n        password: my-provider-password\n        pin: my-sim-pin\n\
  \    autoconnect: true\n    state: present\n\n- name: Create a macvlan connection\n  community.general.nmcli:\n\
  \    type: macvlan\n    conn_name: my-macvlan-connection\n    ifname: mymacvlan0\n    macvlan:\n   \
  \     mode: 2\n        parent: eth1\n    autoconnect: true\n    state: present\n\n- name: Create a wireguard\
  \ connection\n  community.general.nmcli:\n    type: wireguard\n    conn_name: my-wg-provider\n    ifname:\
  \ mywg0\n    wireguard:\n        listen-port: 51820\n        private-key: my-private-key\n    autoconnect:\
  \ true\n    state: present\n\n- name: >-\n    Create a VPN L2TP connection for ansible_user to connect\
  \ on vpn.example.com\n    authenticating with user 'brittany' and pre-shared key as 'Brittany123'\n\
  \  community.general.nmcli:\n    type: vpn\n    conn_name: my-vpn-connection\n    vpn:\n        permissions:\
  \ \"{{ ansible_user }}\"\n        service-type: org.freedesktop.NetworkManager.l2tp\n        gateway:\
  \ vpn.example.com\n        password-flags: 2\n        user: brittany\n        ipsec-enabled: true\n\
  \        ipsec-psk: \"0s{{ 'Brittany123' | ansible.builtin.b64encode }}\"\n    autoconnect: false\n\
  \    state: present\n\n## Creating bond attached to bridge example\n- name: Create bond attached to\
  \ bridge\n  community.general.nmcli:\n    type: bond\n    conn_name: bond0\n    slave_type: bridge\n\
  \    master: br0\n    state: present\n\n- name: Create master bridge\n  community.general.nmcli:\n \
  \   type: bridge\n    conn_name: br0\n    method4: disabled\n    method6: disabled\n    state: present\n\
  \n## Creating vlan connection attached to bridge\n- name: Create master bridge\n  community.general.nmcli:\n\
  \    type: bridge\n    conn_name: br0\n    state: present\n\n- name: Create VLAN 5\n  community.general.nmcli:\n\
  \    type: vlan\n    conn_name: eth0.5\n    slave_type: bridge\n    master: br0\n    vlandev: eth0\n\
  \    vlanid: 5\n    state: present\n\n## Defining ip rules while setting a static IP\n## table 'production'\
  \ is set with id 200 in this example.\n- name: Set Static ips for interface with ip rules and routes\n\
  \  community.general.nmcli:\n    type: ethernet\n    conn_name: 'eth0'\n    ip4: '192.168.1.50'\n  \
  \  gw4: '192.168.1.1'\n    state: present\n    routes4_extended:\n      - ip: \"0.0.0.0/0\"\n      \
  \  next_hop: \"192.168.1.1\"\n        table: \"production\"\n    routing_rules4:\n      - \"priority\
  \ 0 from 192.168.1.50 table 200\"\n"
