name: keycloak_group
fqcn: community.general.keycloak_group
collection: community.general
short_description: Allows administration of Keycloak groups via Keycloak API
description: This module allows you to add, remove or modify Keycloak groups via the Keycloak REST API.
  It requires access to the REST API via OpenID Connect; the user connecting and the client being used
  must have the requisite access rights. In a default Keycloak installation, admin-cli and an admin user
  would work, as would a separate client definition with the scope tailored to your needs and a user having
  the expected roles. The names of module options are snake_cased versions of the camelCase ones found
  in the Keycloak API and its documentation at U(https://www.keycloak.org/docs-api/20.0.2/rest-api/index.html).
  Attributes are multi-valued in the Keycloak API. All attributes are lists of individual values and will
  be returned that way by this module. You may pass single values for attributes when calling the module,
  and this will be translated into a list suitable for the API. When updating a group, where possible
  provide the group ID to the module. This removes a lookup to the API to translate the name into the
  group ID.
options:
  attributes:
    type: dict
    description: A dict of key/value pairs to set as custom attributes for the group. Values may be single
      values (e.g. a string) or a list of strings.
  auth_client_id:
    type: str
    default: admin-cli
    description: OpenID Connect C(client_id) to authenticate to the API with.
  auth_client_secret:
    type: str
    description: Client Secret to use in conjunction with O(auth_client_id) (if required).
  auth_keycloak_url:
    type: str
    required: true
    aliases:
    - url
    description: URL to the Keycloak instance.
  auth_password:
    type: str
    aliases:
    - password
    description: Password to authenticate for API access with.
  auth_realm:
    type: str
    description: Keycloak realm name to authenticate to for API access.
  auth_username:
    type: str
    aliases:
    - username
    description: Username to authenticate for API access with.
  connection_timeout:
    type: int
    default: 10
    description: Controls the HTTP connections timeout period (in seconds) to Keycloak API.
  http_agent:
    type: str
    default: Ansible
    description: Configures the HTTP User-Agent header.
  id:
    type: str
    description: The unique identifier for this group. This parameter is not required for updating or
      deleting a group but providing it will reduce the number of API calls required.
  name:
    type: str
    description: Name of the group. This parameter is required only when creating or updating the group.
  parents:
    type: list
    description: List of parent groups for the group to handle sorted top to bottom. Set this to create
      a group as a subgroup of another group or groups (parents) or when accessing an existing subgroup
      by name. Not necessary to set when accessing an existing subgroup by its C(ID) because in that case
      the group can be directly queried without necessarily knowing its parent(s).
  realm:
    type: str
    default: master
    description: They Keycloak realm under which this group resides.
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: State of the group. On V(present), the group will be created if it does not yet exist,
      or updated with the parameters you provide. On V(absent), the group will be removed if it exists.
      Be aware that absenting a group with subgroups will automatically delete all its subgroups too.
  token:
    type: str
    description: Authentication token for Keycloak API.
  validate_certs:
    type: bool
    default: true
    description: Verify TLS certificates (do not disable this in production).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a Keycloak group, authentication with credentials\n  community.general.keycloak_group:\n\
  \    name: my-new-kc-group\n    realm: MyCustomRealm\n    state: present\n    auth_client_id: admin-cli\n\
  \    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm: master\n    auth_username: USERNAME\n\
  \    auth_password: PASSWORD\n  register: result_new_kcgrp\n  delegate_to: localhost\n\n- name: Create\
  \ a Keycloak group, authentication with token\n  community.general.keycloak_group:\n    name: my-new-kc-group\n\
  \    realm: MyCustomRealm\n    state: present\n    auth_client_id: admin-cli\n    auth_keycloak_url:\
  \ https://auth.example.com/auth\n    token: TOKEN\n  delegate_to: localhost\n\n- name: Delete a keycloak\
  \ group\n  community.general.keycloak_group:\n    id: '9d59aa76-2755-48c6-b1af-beb70a82c3cd'\n    state:\
  \ absent\n    realm: MyCustomRealm\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n  delegate_to: localhost\n\
  \n- name: Delete a Keycloak group based on name\n  community.general.keycloak_group:\n    name: my-group-for-deletion\n\
  \    state: absent\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n  delegate_to: localhost\n\
  \n- name: Update the name of a Keycloak group\n  community.general.keycloak_group:\n    id: '9d59aa76-2755-48c6-b1af-beb70a82c3cd'\n\
  \    name: an-updated-kc-group-name\n    state: present\n    auth_client_id: admin-cli\n    auth_keycloak_url:\
  \ https://auth.example.com/auth\n    auth_realm: master\n    auth_username: USERNAME\n    auth_password:\
  \ PASSWORD\n  delegate_to: localhost\n\n- name: Create a keycloak group with some custom attributes\n\
  \  community.general.keycloak_group:\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n\
  \    auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    name: my-new_group\n\
  \    attributes:\n        attrib1: value1\n        attrib2: value2\n        attrib3:\n            -\
  \ with\n            - numerous\n            - individual\n            - list\n            - items\n\
  \  delegate_to: localhost\n\n- name: Create a Keycloak subgroup of a base group (using parent name)\n\
  \  community.general.keycloak_group:\n    name: my-new-kc-group-sub\n    realm: MyCustomRealm\n    state:\
  \ present\n    auth_client_id: admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n   \
  \ auth_realm: master\n    auth_username: USERNAME\n    auth_password: PASSWORD\n    parents:\n     \
  \ - name: my-new-kc-group\n  register: result_new_kcgrp_sub\n  delegate_to: localhost\n\n- name: Create\
  \ a Keycloak subgroup of a base group (using parent id)\n  community.general.keycloak_group:\n    name:\
  \ my-new-kc-group-sub2\n    realm: MyCustomRealm\n    state: present\n    auth_client_id: admin-cli\n\
  \    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm: master\n    auth_username: USERNAME\n\
  \    auth_password: PASSWORD\n    parents:\n      - id: \"{{ result_new_kcgrp.end_state.id }}\"\n  delegate_to:\
  \ localhost\n\n- name: Create a Keycloak subgroup of a subgroup (using parent names)\n  community.general.keycloak_group:\n\
  \    name: my-new-kc-group-sub-sub\n    realm: MyCustomRealm\n    state: present\n    auth_client_id:\
  \ admin-cli\n    auth_keycloak_url: https://auth.example.com/auth\n    auth_realm: master\n    auth_username:\
  \ USERNAME\n    auth_password: PASSWORD\n    parents:\n      - name: my-new-kc-group\n      - name:\
  \ my-new-kc-group-sub\n  delegate_to: localhost\n\n- name: Create a Keycloak subgroup of a subgroup\
  \ (using direct parent id)\n  community.general.keycloak_group:\n    name: my-new-kc-group-sub-sub\n\
  \    realm: MyCustomRealm\n    state: present\n    auth_client_id: admin-cli\n    auth_keycloak_url:\
  \ https://auth.example.com/auth\n    auth_realm: master\n    auth_username: USERNAME\n    auth_password:\
  \ PASSWORD\n    parents:\n      - id: \"{{ result_new_kcgrp_sub.end_state.id }}\"\n  delegate_to: localhost\n"
