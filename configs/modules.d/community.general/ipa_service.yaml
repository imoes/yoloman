name: ipa_service
fqcn: community.general.ipa_service
collection: community.general
short_description: Manage FreeIPA service
description: Add and delete an IPA service using IPA API.
options:
  force:
    type: bool
    description: Force principal name even if host is not in DNS.
  hosts:
    type: list
    description: Defines the list of 'ManagedBy' hosts.
  ipa_host:
    type: str
    default: ipa.example.com
    description: IP or hostname of IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_HOST) will be used instead. If both the environment variable E(IPA_HOST)
      and the value are not specified in the task, then DNS will be used to try to discover the FreeIPA
      server. The relevant entry needed in FreeIPA is the C(ipa-ca) entry. If neither the DNS entry, nor
      the environment E(IPA_HOST), nor the value are available in the task, then the default value will
      be used.
  ipa_pass:
    type: str
    description: Password of administrative user. If the value is not specified in the task, the value
      of environment variable E(IPA_PASS) will be used instead. Note that if the C(urllib_gssapi) library
      is available, it is possible to use GSSAPI to authenticate to FreeIPA. If the environment variable
      E(KRB5CCNAME) is available, the module will use this kerberos credentials cache to authenticate
      to the FreeIPA server. If the environment variable E(KRB5_CLIENT_KTNAME) is available, and E(KRB5CCNAME)
      is not; the module will use this kerberos keytab to authenticate. If GSSAPI is not available, the
      usage of O(ipa_pass) is required.
  ipa_port:
    type: int
    default: 443
    description: Port of FreeIPA / IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PORT) will be used instead. If both the environment variable E(IPA_PORT)
      and the value are not specified in the task, then default value is set.
  ipa_prot:
    type: str
    default: https
    choices:
    - http
    - https
    description: Protocol used by IPA server. If the value is not specified in the task, the value of
      environment variable E(IPA_PROT) will be used instead. If both the environment variable E(IPA_PROT)
      and the value are not specified in the task, then default value is set.
  ipa_timeout:
    type: int
    default: 10
    description: Specifies idle timeout (in seconds) for the connection. For bulk operations, you may
      want to increase this in order to avoid timeout from IPA server. If the value is not specified in
      the task, the value of environment variable E(IPA_TIMEOUT) will be used instead. If both the environment
      variable E(IPA_TIMEOUT) and the value are not specified in the task, then default value is set.
  ipa_user:
    type: str
    default: admin
    description: Administrative account used on IPA server. If the value is not specified in the task,
      the value of environment variable E(IPA_USER) will be used instead. If both the environment variable
      E(IPA_USER) and the value are not specified in the task, then default value is set.
  krbcanonicalname:
    type: str
    required: true
    aliases:
    - name
    description: Principal of the service. Can not be changed as it is the unique identifier.
  skip_host_check:
    type: bool
    default: false
    description: Force service to be created even when host object does not exist to manage it. This is
      only used on creation, not for updating existing services.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: State to ensure.
  validate_certs:
    type: bool
    default: true
    description: This only applies if O(ipa_prot) is V(https). If set to V(false), the SSL certificates
      will not be validated. This should only set to V(false) used on personally controlled sites using
      self-signed certificates.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Ensure service is present\n  community.general.ipa_service:\n    name: http/host01.example.com\n\
  \    state: present\n    ipa_host: ipa.example.com\n    ipa_user: admin\n    ipa_pass: topsecret\n\n\
  - name: Ensure service is absent\n  community.general.ipa_service:\n    name: http/host01.example.com\n\
  \    state: absent\n    ipa_host: ipa.example.com\n    ipa_user: admin\n    ipa_pass: topsecret\n\n\
  - name: Changing Managing hosts list\n  community.general.ipa_service:\n    name: http/host01.example.com\n\
  \    hosts:\n       - host01.example.com\n       - host02.example.com\n    ipa_host: ipa.example.com\n\
  \    ipa_user: admin\n    ipa_pass: topsecret\n"
