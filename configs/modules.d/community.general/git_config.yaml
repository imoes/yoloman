name: git_config
fqcn: community.general.git_config
collection: community.general
short_description: Read and write git configuration
description: The M(community.general.git_config) module changes git configuration by invoking C(git config).
  This is needed if you do not want to use M(ansible.builtin.template) for the entire git config file
  (for example because you need to change just C(user.email) in /etc/.git/config).  Solutions involving
  M(ansible.builtin.command) are cumbersome or do not work correctly in check mode.
options:
  add_mode:
    type: str
    default: replace-all
    choices:
    - add
    - replace-all
    description: Specify if a value should replace the existing value(s) or if the new value should be
      added alongside other values with the same name. This option is only relevant when adding/replacing
      values. If O(state=absent) or values are just read out, this option is not considered.
  file:
    type: path
    description: Path to an adhoc git configuration file to be managed using the V(file) scope.
  list_all:
    type: bool
    default: false
    description: List all settings (optionally limited to a given O(scope)).
  name:
    type: str
    description: The name of the setting. If no value is supplied, the value will be read from the config
      if it has been set.
  repo:
    type: path
    description: Path to a git repository for reading and writing values from a specific repo.
  scope:
    type: str
    choices:
    - file
    - local
    - global
    - system
    description: Specify which scope to read/set values from. This is required when setting config values.
      If this is set to V(local), you must also specify the O(repo) parameter. If this is set to V(file),
      you must also specify the O(file) parameter. It defaults to system only when not using O(list_all=true).
  state:
    type: str
    default: present
    choices:
    - present
    - absent
    description: 'Indicates the setting should be set/unset. This parameter has higher precedence than
      O(value) parameter: when O(state=absent) and O(value) is defined, O(value) is discarded.'
  value:
    type: str
    description: When specifying the name of a single setting, supply a value to set that setting to the
      given value.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Add a setting to ~/.gitconfig\n  community.general.git_config:\n    name: alias.ci\n\
  \    scope: global\n    value: commit\n\n- name: Add a setting to ~/.gitconfig\n  community.general.git_config:\n\
  \    name: alias.st\n    scope: global\n    value: status\n\n- name: Remove a setting from ~/.gitconfig\n\
  \  community.general.git_config:\n    name: alias.ci\n    scope: global\n    state: absent\n\n- name:\
  \ Add a setting to ~/.gitconfig\n  community.general.git_config:\n    name: core.editor\n    scope:\
  \ global\n    value: vim\n\n- name: Add a setting system-wide\n  community.general.git_config:\n   \
  \ name: alias.remotev\n    scope: system\n    value: remote -v\n\n- name: Add a setting to a system\
  \ scope (default)\n  community.general.git_config:\n    name: alias.diffc\n    value: diff --cached\n\
  \n- name: Add a setting to a system scope (default)\n  community.general.git_config:\n    name: color.ui\n\
  \    value: auto\n\n- name: Add several options for the same name\n  community.general.git_config:\n\
  \    name: push.pushoption\n    value: \"{{ item }}\"\n    add_mode: add\n  loop:\n    - merge_request.create\n\
  \    - merge_request.draft\n\n- name: Make etckeeper not complaining when it is invoked by cron\n  community.general.git_config:\n\
  \    name: user.email\n    repo: /etc\n    scope: local\n    value: 'root@{{ ansible_fqdn }}'\n\n- name:\
  \ Read individual values from git config\n  community.general.git_config:\n    name: alias.ci\n    scope:\
  \ global\n\n- name: Scope system is also assumed when reading values, unless list_all=true\n  community.general.git_config:\n\
  \    name: alias.diffc\n\n- name: Read all values from git config\n  community.general.git_config:\n\
  \    list_all: true\n    scope: global\n\n- name: When list_all is yes and no scope is specified, you\
  \ get configuration from all scopes\n  community.general.git_config:\n    list_all: true\n\n- name:\
  \ Specify a repository to include local settings\n  community.general.git_config:\n    list_all: true\n\
  \    repo: /path/to/repo.git\n"
