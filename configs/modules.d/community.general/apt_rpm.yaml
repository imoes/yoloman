name: apt_rpm
fqcn: community.general.apt_rpm
collection: community.general
short_description: APT-RPM package manager
description: Manages packages with C(apt-rpm). Both low-level (C(rpm)) and high-level (C(apt-get)) package
  manager binaries required.
options:
  clean:
    type: bool
    default: false
    description: Run the equivalent of C(apt-get clean) to clear out the local repository of retrieved
      package files. It removes everything but the lock file from C(/var/cache/apt/archives/) and C(/var/cache/apt/archives/partial/).
      Can be run as part of the package installation (clean runs before install) or as a separate step.
  dist_upgrade:
    type: bool
    default: false
    description: If true performs an C(apt-get dist-upgrade) to upgrade system.
  package:
    type: list
    aliases:
    - name
    - pkg
    description: List of packages to install, upgrade, or remove. Since community.general 8.0.0, may include
      paths to local C(.rpm) files if O(state=installed) or O(state=present), requires C(rpm) python module.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    - installed
    - removed
    description: Indicates the desired package state.
  update_cache:
    type: bool
    default: false
    description: Run the equivalent of C(apt-get update) before the operation. Can be run as part of the
      package installation or as a separate step. Default is not to update the cache.
  update_kernel:
    type: bool
    default: false
    description: If true performs an C(update-kernel) to upgrade kernel packages.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Install package foo\n  community.general.apt_rpm:\n    pkg: foo\n    state: present\n\
  \n- name: Install packages foo and bar\n  community.general.apt_rpm:\n    pkg:\n      - foo\n      -\
  \ bar\n    state: present\n\n- name: Remove package foo\n  community.general.apt_rpm:\n    pkg: foo\n\
  \    state: absent\n\n- name: Remove packages foo and bar\n  community.general.apt_rpm:\n    pkg: foo,bar\n\
  \    state: absent\n\n# bar will be the updated if a newer version exists\n- name: Update the package\
  \ database and install bar\n  community.general.apt_rpm:\n    name: bar\n    state: present\n    update_cache:\
  \ true\n\n- name: Run the equivalent of \"apt-get clean\" as a separate step\n  community.general.apt_rpm:\n\
  \    clean: true\n\n- name: Perform cache update and complete system upgrade (includes kernel)\n  community.general.apt_rpm:\n\
  \    update_cache: true\n    dist_upgrade: true\n    update_kernel: true\n"
