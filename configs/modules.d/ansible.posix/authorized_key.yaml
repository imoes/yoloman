name: authorized_key
fqcn: ansible.posix.authorized_key
collection: ansible.posix
short_description: Adds or removes an SSH authorized key
description: Adds or removes SSH authorized keys for particular user accounts.
options:
  comment:
    type: str
    description: Change the comment on the public key. Rewriting the comment is useful in cases such as
      fetching it from GitHub or GitLab. If no comment is specified, the existing comment will be kept.
  exclusive:
    type: bool
    default: false
    description: Whether to remove all other non-specified keys from the authorized_keys file. Multiple
      keys can be specified in a single C(key) string value by separating them by newlines. This option
      is not loop aware, so if you use C(with_) , it will be exclusive per iteration of the loop. If you
      want multiple keys in the file you need to pass them all to C(key) in a single batch as mentioned
      above.
  follow:
    type: bool
    default: false
    description: Follow path symlink instead of replacing it.
  key:
    type: str
    required: true
    description: The SSH public key(s), as a string or (since Ansible 1.9) url (https://github.com/username.keys).
  key_options:
    type: str
    description: A string of ssh key options to be prepended to the key in the authorized_keys file.
  manage_dir:
    type: bool
    default: true
    description: Whether this module should manage the directory of the authorized key file. If set to
      C(true), the module will create the directory, as well as set the owner and permissions of an existing
      directory. Be sure to set C(manage_dir=false) if you are using an alternate directory for authorized_keys,
      as set with C(path), since you could lock yourself out of SSH access. See the example below.
  path:
    type: path
    description: Alternate path to the authorized_keys file. When unset, this value defaults to I(~/.ssh/authorized_keys).
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Whether the given key (with the given key_options) should or should not be in the file.
  user:
    type: str
    required: true
    description: The username on the remote host whose authorized_keys file will be modified.
  validate_certs:
    type: bool
    default: true
    description: This only applies if using a https url as the source of the keys. If set to C(false),
      the SSL certificates will not be validated. This should only set to C(false) used on personally
      controlled sites using self-signed certificates as it avoids verifying the source site. Prior to
      2.1 the code worked as if this was set to C(true).
writes: true
runtime: starlark
source: translated
examples: "\n- name: Set authorized key taken from file\n  ansible.posix.authorized_key:\n    user: charlie\n\
  \    state: present\n    key: \"{{ lookup('file', '/home/charlie/.ssh/id_rsa.pub') }}\"\n\n- name: Set\
  \ authorized keys taken from url\n  ansible.posix.authorized_key:\n    user: charlie\n    state: present\n\
  \    key: https://github.com/charlie.keys\n\n- name: Set authorized keys taken from url using lookup\n\
  \  ansible.posix.authorized_key:\n    user: charlie\n    state: present\n    key: \"{{ lookup('url',\
  \ 'https://github.com/charlie.keys', split_lines=False) }}\"\n\n- name: Set authorized key in alternate\
  \ location\n  ansible.posix.authorized_key:\n    user: charlie\n    state: present\n    key: \"{{ lookup('file',\
  \ '/home/charlie/.ssh/id_rsa.pub') }}\"\n    path: /etc/ssh/authorized_keys/charlie\n    manage_dir:\
  \ false\n\n- name: Set up multiple authorized keys\n  ansible.posix.authorized_key:\n    user: deploy\n\
  \    state: present\n    key: '{{ item }}'\n  with_file:\n    - public_keys/doe-jane\n    - public_keys/doe-john\n\
  \n- name: Set authorized key defining key options\n  ansible.posix.authorized_key:\n    user: charlie\n\
  \    state: present\n    key: \"{{ lookup('file', '/home/charlie/.ssh/id_rsa.pub') }}\"\n    key_options:\
  \ 'no-port-forwarding,from=\"10.0.1.1\"'\n\n- name: Set authorized key without validating the TLS/SSL\
  \ certificates\n  ansible.posix.authorized_key:\n    user: charlie\n    state: present\n    key: https://github.com/user.keys\n\
  \    validate_certs: false\n\n- name: Set authorized key, removing all the authorized keys already set\n\
  \  ansible.posix.authorized_key:\n    user: root\n    key: \"{{ lookup('file', 'public_keys/doe-jane')\
  \ }}\"\n    state: present\n    exclusive: true\n\n- name: Set authorized key for user ubuntu copying\
  \ it from current user\n  ansible.posix.authorized_key:\n    user: ubuntu\n    state: present\n    key:\
  \ \"{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa.pub') }}\"\n"
