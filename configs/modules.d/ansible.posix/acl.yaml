name: acl
fqcn: ansible.posix.acl
collection: ansible.posix
short_description: Set and retrieve file ACL information.
description: Set and retrieve file ACL information.
options:
  default:
    type: bool
    default: false
    description: If the target is a directory, setting this to C(true) will make it the default ACL for
      entities created inside the directory. Setting C(default) to C(true) causes an error if the path
      is a file.
  entity:
    type: str
    default: ''
    description: The actual user or group that the ACL applies to when matching entity types user or group
      are selected.
  entry:
    type: str
    description: DEPRECATED. The ACL to set or remove. This must always be quoted in the form of C(<etype>:<qualifier>:<perms>).
      The qualifier may be empty for some types, but the type and perms are always required. C(-) can
      be used as placeholder when you do not care about permissions. This is now superseded by entity,
      type and permissions fields.
  etype:
    type: str
    choices:
    - group
    - mask
    - other
    - user
    description: The entity type of the ACL to apply, see C(setfacl) documentation for more info.
  follow:
    type: bool
    default: true
    description: Whether to follow symlinks on the path if a symlink is encountered.
  path:
    type: path
    required: true
    aliases:
    - name
    description: The full path of the file or object.
  permissions:
    type: str
    description: The permissions to apply/remove can be any combination of C(r), C(w), C(x) (read, write
      and execute respectively), and C(X) (execute permission if the file is a directory or already has
      execute permission for some user)
  recalculate_mask:
    type: str
    default: default
    choices:
    - default
    - mask
    - no_mask
    description: Select if and when to recalculate the effective right masks of the files. See C(setfacl)
      documentation for more info. Incompatible with C(state=query).
  recursive:
    type: bool
    default: false
    aliases:
    - recurse
    description: Recursively sets the specified ACL. Incompatible with C(state=query). Alias C(recurse)
      added in version 1.3.0.
  state:
    type: str
    default: query
    choices:
    - absent
    - present
    - query
    description: Define whether the ACL should be present or not. The C(query) state gets the current
      ACL without changing it, for use in C(register) operations.
  use_nfsv4_acls:
    type: bool
    default: false
    description: Use NFSv4 ACLs instead of POSIX ACLs.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Grant user Joe read access to a file\n  ansible.posix.acl:\n    path: /etc/foo.conf\n\
  \    entity: joe\n    etype: user\n    permissions: r\n    state: present\n\n- name: Removes the ACL\
  \ for Joe on a specific file\n  ansible.posix.acl:\n    path: /etc/foo.conf\n    entity: joe\n    etype:\
  \ user\n    state: absent\n\n- name: Sets default ACL for joe on /etc/foo.d/\n  ansible.posix.acl:\n\
  \    path: /etc/foo.d/\n    entity: joe\n    etype: user\n    permissions: rw\n    default: true\n \
  \   state: present\n\n- name: Same as previous but using entry shorthand\n  ansible.posix.acl:\n   \
  \ path: /etc/foo.d/\n    entry: default:user:joe:rw-\n    state: present\n\n- name: Obtain the ACL for\
  \ a specific file\n  ansible.posix.acl:\n    path: /etc/foo.conf\n  register: acl_info\n"
