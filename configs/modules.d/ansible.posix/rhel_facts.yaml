name: rhel_facts
fqcn: ansible.posix.rhel_facts
collection: ansible.posix
short_description: Facts module to set or override RHEL specific facts.
description: Compatibility layer for using the "package" module for rpm-ostree based systems via setting
  the "pkg_mgr" fact correctly.
options: {}
writes: false
runtime: starlark
source: translated
examples: "\n- name: Playbook to use the package module on all RHEL footprints\n  vars:\n    ansible_facts_modules:\n\
  \      - setup # REQUIRED to be run before all custom fact modules\n      - ansible.posix.rhel_facts\n\
  \  tasks:\n    - name: Ensure packages are installed\n      ansible.builtin.package:\n        name:\n\
  \          - htop\n          - ansible\n        state: present\n"
