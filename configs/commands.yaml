# Binary whitelist + argument policy for the run_pipeline tool and any
# tools.d/*.yaml "pipeline:" tasks. A binary not listed here cannot appear
# in any pipeline stage. forbid_patterns are regular expressions matched
# against the joined argument string (not the binary name) — a match
# rejects the whole pipeline call.
allow:
  - binary: cat
  - binary: grep
  - binary: dmesg
  - binary: journalctl
  - binary: ps
  - binary: tail
  - binary: head
  - binary: sort
  - binary: uniq
  - binary: wc
  - binary: awk
  - binary: tr
  - binary: find
    forbid_patterns:
      - "-exec\\b"
      - "-delete\\b"
      - "-fprintf\\b"
  - binary: curl
  - binary: gpg
  - binary: systemctl
    forbid_patterns:
      - "\\bstop\\b"
      - "\\bdisable\\b"
      - "\\bmask\\b"
      - "\\bpoweroff\\b"
      - "\\breboot\\b"
      - "\\bhalt\\b"
      - "\\bkill\\b"
