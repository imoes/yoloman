- name: install-request-key.conf
  hosts: all
  become: true
  vars:
    _dest: "/etc/request-key.conf"
    _service: ""
    _packages:
      - keyutils
    config_rules: []
  tasks:
    - name: Install Request Key Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: request-key.conf.j2
        dest: "{{ _dest }}"
      vars:
        config_rules: "{{ config_rules }}"

    - name: Enable and restart Request Key Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
