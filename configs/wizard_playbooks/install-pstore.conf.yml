- name: install-pstore.conf
  hosts: all
  become: true
  vars:
    _dest: "/etc/systemd/pstore.conf"
    backend: "yes"
    compress: true
    _service: ""
    keep_keys:
      - "dmesg"
      - "pmsg"
      - "console"
    log_level: 0
    mount_path: "/sys/fs/pstore"
    subsystems: []
    ignore_keys:
      - "efi"
    max_entries: 100
    max_msg_size: 65536
    compress_algorithm: "lz4"
    _packages:
      - "systemd"
  tasks:
    - name: Install Pstore Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: pstore.conf.j2
        dest: "{{ _dest }}"
      vars:
        backend: "{{ backend }}"
        compress: "{{ compress }}"
        keep_keys: "{{ keep_keys }}"
        log_level: "{{ log_level }}"
        mount_path: "{{ mount_path }}"
        subsystems: "{{ subsystems }}"
        ignore_keys: "{{ ignore_keys }}"
        max_entries: "{{ max_entries }}"
        max_msg_size: "{{ max_msg_size }}"
        compress_algorithm: "{{ compress_algorithm }}"

    - name: Enable and restart Pstore Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
