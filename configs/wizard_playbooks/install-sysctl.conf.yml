- name: install-sysctl.conf
  hosts: all
  become: true
  vars:
    _dest: /etc/sysctl.conf
    _service: ""
    _packages:
      - procps
      - ufw
    sysctl_params: []
  tasks:
    - name: Install Sysctl Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: sysctl.conf.j2
        dest: "{{ _dest }}"
      vars:
        sysctl_params: "{{ sysctl_params }}"

    - name: Enable and restart Sysctl Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
