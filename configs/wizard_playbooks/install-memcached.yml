- name: install-memcached
  hosts: all
  become: true
  # The form is config_templates/memcached.conf's schema (the Debian file). On RedHat the
  # render step picks the family template memcached-redhat for /etc/sysconfig/memcached,
  # which shares port / max_connections / max_memory_mb / bind_address / extra_options.
  vars:
    log_file: /var/log/memcached.log
    verbosity: 0
    max_memory_mb: 64
    port: 11211
    udp_port: 0
    user: memcache
    bind_address: 127.0.0.1
    max_connections: 1024
    num_threads: 4
    max_item_size: 1m
    growth_factor: 1.25
    min_chunk_size: 48
    pid_file: /var/run/memcached/memcached.pid
    no_evictions: false
    lock_memory: false
    disable_cas: false
    enable_sasl: false
    extra_options: []
  tasks:
    - name: Install Memcached
      ansible.builtin.package:
        name: ["memcached"]
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: memcached.conf.j2
        dest: "{{ _dest }}"

    - name: Enable and restart Memcached
      ansible.builtin.service:
        name: memcached
        state: restarted
        enabled: true
