- name: install-updatedb.conf
  hosts: all
  become: true
  vars:
    _dest: /etc/updatedb.conf
    nodirs:
      - ""
    db_file: /var/lib/plocate/plocate.db
    prunefs:
      - proc
      - sysfs
      - fusectl
      - debugfs
      - devpts
      - rpc_pipefs
      - securityfs
      - cgroup
    _service: ""
    _packages:
      - plocate
    prune_paths:
      - /tmp
      - /var/tmp
      - /dev
      - /proc
      - /sys
    updatedb_opts:
      - --localpaths
      - /
    db_compression: gzip
    update_at_boot: false
    update_interval: 7
    cron_daily_update: true
  tasks:
    - name: Install Updatedb Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: updatedb.conf.j2
        dest: "{{ _dest }}"
        owner: root
        group: root
        mode: '0644'
      vars:
        nodirs: "{{ nodirs }}"
        db_file: "{{ db_file }}"
        prunefs: "{{ prunefs }}"
        prune_paths: "{{ prune_paths }}"
        updatedb_opts: "{{ updatedb_opts }}"
        db_compression: "{{ db_compression }}"
        update_at_boot: "{{ update_at_boot }}"
        update_interval: "{{ update_interval }}"
        cron_daily_update: "{{ cron_daily_update }}"

    - name: Enable and restart Updatedb Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
