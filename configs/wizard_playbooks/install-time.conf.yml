- name: install-time.conf
  hosts: all
  become: true
  vars:
    _dest: "/etc/security/time.conf"
    rules: []
    _service: ""
    _packages:
      - libpam-modules
  tasks:
    - name: Install Time Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: time.conf.j2
        dest: "{{ _dest }}"
        owner: root
        group: root
        mode: '0644'
      vars:
        rules: "{{ rules }}"

    - name: Enable and restart Time Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
