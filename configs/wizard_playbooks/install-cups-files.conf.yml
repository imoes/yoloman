- name: install-cups-files.conf
  hosts: all
  become: true
  vars:
    _dest: /etc/cups/cups-files.conf
    log_dir: /var/log/cups
    timeout: 300
    _service: ""
    browsing: true
    max_jobs: 500
    ppd_path: /etc/cups/ppd
    temp_dir: /var/spool/cups/tmp
    _packages:
      - cups-daemon
    cache_dir: /var/cache/cups
    cups_user: root
    http_port: 631
    log_level: warn
    state_dir: /var/spool/cups
    cups_group: lp
    encryption: IfRequested
    https_port: 0
    page_logic: false
    auth_helper: /usr/lib/cups/authhelper
    max_clients: 100
    remote_root: deny
    server_deny: []
    server_name: localhost
    server_port: 631
    server_root: /etc/cups
    max_job_size: 0
    server_allow: []
    snmp_support: false
    system_group: lpadmin
    language_file: /usr/share/cups/language
    web_interface: false
    default_shared: true
    default_protocol: ipp
    remote_admin_deny: []
    job_private_access: owner
    job_private_values: none
    remote_admin_allow: []
    enable_remote_admin: false
    remote_printers_deny: []
    remote_printers_allow: []
    browse_local_protocols:
      - dnssd
      - cups
    enable_remote_printers: false
    printer_private_access: owner
    printer_private_values: none
    browse_remote_protocols:
      - dnssd
  tasks:
    - name: Install Cups Files Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: cups-files.conf.j2
        dest: "{{ _dest }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        log_dir: "{{ log_dir }}"
        timeout: "{{ timeout }}"
        browsing: "{{ browsing }}"
        max_jobs: "{{ max_jobs }}"
        ppd_path: "{{ ppd_path }}"
        temp_dir: "{{ temp_dir }}"
        cache_dir: "{{ cache_dir }}"
        cups_user: "{{ cups_user }}"
        http_port: "{{ http_port }}"
        log_level: "{{ log_level }}"
        state_dir: "{{ state_dir }}"
        cups_group: "{{ cups_group }}"
        encryption: "{{ encryption }}"
        https_port: "{{ https_port }}"
        page_logic: "{{ page_logic }}"
        auth_helper: "{{ auth_helper }}"
        max_clients: "{{ max_clients }}"
        remote_root: "{{ remote_root }}"
        server_deny: "{{ server_deny }}"
        server_name: "{{ server_name }}"
        server_port: "{{ server_port }}"
        server_root: "{{ server_root }}"
        max_job_size: "{{ max_job_size }}"
        server_allow: "{{ server_allow }}"
        snmp_support: "{{ snmp_support }}"
        system_group: "{{ system_group }}"
        language_file: "{{ language_file }}"
        web_interface: "{{ web_interface }}"
        default_shared: "{{ default_shared }}"
        default_protocol: "{{ default_protocol }}"
        remote_admin_deny: "{{ remote_admin_deny }}"
        job_private_access: "{{ job_private_access }}"
        job_private_values: "{{ job_private_values }}"
        remote_admin_allow: "{{ remote_admin_allow }}"
        enable_remote_admin: "{{ enable_remote_admin }}"
        remote_printers_deny: "{{ remote_printers_deny }}"
        remote_printers_allow: "{{ remote_printers_allow }}"
        browse_local_protocols: "{{ browse_local_protocols }}"
        enable_remote_printers: "{{ enable_remote_printers }}"
        printer_private_access: "{{ printer_private_access }}"
        printer_private_values: "{{ printer_private_values }}"
        browse_remote_protocols: "{{ browse_remote_protocols }}"

    - name: Enable and restart Cups Files Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
