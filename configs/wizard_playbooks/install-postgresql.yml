- name: install-postgresql
  hosts: all
  become: true
  vars:
    port: 5432
    lc_time: en_US.UTF-8
    lc_numeric: en_US.UTF-8
    lc_messages: en_US.UTF-8
    lc_monetary: en_US.UTF-8
    wal_buffers: 16MB
    log_filename: postgresql-%Y-%m-%d_%H%M%S.log
    log_timezone: UTC
    log_directory: /var/log/postgresql
    extra_settings: []
    shared_buffers: 256MB
    max_connections: 100
    listen_addresses: localhost
    log_min_messages: WARNING
    wal_segment_size: 16MB
    logging_collector: true
    default_text_search_config: pg_catalog.english
    log_min_duration_statement: 1000
    checkpoint_completion_target: 0.9
  tasks:
    - name: Install PostgreSQL Database
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: postgresql.j2
        dest: "{{ _dest }}"
      vars:
        port: "{{ port }}"
        lc_time: "{{ lc_time }}"
        lc_numeric: "{{ lc_numeric }}"
        lc_messages: "{{ lc_messages }}"
        lc_monetary: "{{ lc_monetary }}"
        wal_buffers: "{{ wal_buffers }}"
        log_filename: "{{ log_filename }}"
        log_timezone: "{{ log_timezone }}"
        log_directory: "{{ log_directory }}"
        extra_settings: "{{ extra_settings }}"
        shared_buffers: "{{ shared_buffers }}"
        max_connections: "{{ max_connections }}"
        listen_addresses: "{{ listen_addresses }}"
        log_min_messages: "{{ log_min_messages }}"
        wal_segment_size: "{{ wal_segment_size }}"
        logging_collector: "{{ logging_collector }}"
        default_text_search_config: "{{ default_text_search_config }}"
        log_min_duration_statement: "{{ log_min_duration_statement }}"
        checkpoint_completion_target: "{{ checkpoint_completion_target }}"

    - name: Enable and restart PostgreSQL Database
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
