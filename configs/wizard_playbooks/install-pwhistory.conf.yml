- name: install-pwhistory.conf
  hosts: all
  become: true
  vars:
    file: /etc/security/opasswd
    rules: []
    remember: 5
    retry_count: 1
    enable_audit: false
    root_min_delay: 0
    _dest: /etc/security/pwhistory.conf
    _service: ""
    _packages:
      - libpam-modules
  tasks:
    - name: Install Pwhistory Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: pwhistory.conf.j2
        dest: "{{ _dest }}"
        owner: root
        group: root
        mode: '0644'
      vars:
        file: "{{ file }}"
        rules: "{{ rules }}"
        remember: "{{ remember }}"
        retry_count: "{{ retry_count }}"
        enable_audit: "{{ enable_audit }}"
        root_min_delay: "{{ root_min_delay }}"

    - name: Enable and restart Pwhistory Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
