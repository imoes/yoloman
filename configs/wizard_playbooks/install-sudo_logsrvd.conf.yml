- name: install-sudo_logsrvd.conf
  hosts: all
  become: true
  vars:
    enabled: true
    tls_key: ""
    log_file: /var/log/sudo_logsrvd.log
    tls_cert: ""
    bind_host: 127.0.0.1
    bind_port: 3333
    log_level: info
    log_max_size: 10485760
    log_keep_count: 5
    allowed_clients: []
    log_compression: gzip
    max_connections: 100
  tasks:
    - name: Install Sudo Logsrvd Conf
      ansible.builtin.package:
        name:
          - sudo
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: sudo_logsrvd.conf.j2
        dest: /etc/sudo_logsrvd.conf
        mode: '0644'
      vars:
        enabled: "{{ enabled }}"
        tls_key: "{{ tls_key }}"
        log_file: "{{ log_file }}"
        tls_cert: "{{ tls_cert }}"
        bind_host: "{{ bind_host }}"
        bind_port: "{{ bind_port }}"
        log_level: "{{ log_level }}"
        log_max_size: "{{ log_max_size }}"
        log_keep_count: "{{ log_keep_count }}"
        allowed_clients: "{{ allowed_clients }}"
        log_compression: "{{ log_compression }}"
        max_connections: "{{ max_connections }}"

    - name: Enable and restart Sudo Logsrvd Conf
      ansible.builtin.service:
        name: ""
        state: restarted
        enabled: true
