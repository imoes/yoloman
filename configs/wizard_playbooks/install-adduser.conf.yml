- name: install-adduser.conf
  hosts: all
  become: true
  vars:
    home: "/home"
    skel: "/etc/skel"
    _dest: "/etc/adduser.conf"
    dgroup: "users"
    _service: ""
    dir_mode: "0755"
    last_gid: 60000
    last_uid: 60000
    skeleton: "/etc/skel"
    _packages:
      - "adduser"
    first_gid: 1000
    first_uid: 1000
    mkhomedir: true
    setgid_home: false
    default_home: true
    range_config:
      - key: "SYSTEM_UID_MIN"
        value: "100"
        description: "First UID for system accounts (users with UID < SYSTEM_UID_MIN are considered system users)."
      - key: "SYSTEM_UID_MAX"
        value: "999"
        description: "Last UID for system accounts."
      - key: "SYSTEM_GID_MIN"
        value: "100"
        description: "First GID for system groups."
      - key: "SYSTEM_GID_MAX"
        value: "999"
        description: "Last GID for system groups."
    no_user_group: false
    usergroups_enab: true
    add_extra_groups: false
    add_extra_groups_default: []
  tasks:
    - name: Install Adduser Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: adduser.conf.j2
        dest: "{{ _dest }}"
        mode: "0644"
      vars:
        home: "{{ home }}"
        skel: "{{ skel }}"
        dgroup: "{{ dgroup }}"
        dir_mode: "{{ dir_mode }}"
        last_gid: "{{ last_gid }}"
        last_uid: "{{ last_uid }}"
        skeleton: "{{ skeleton }}"
        first_gid: "{{ first_gid }}"
        first_uid: "{{ first_uid }}"
        mkhomedir: "{{ mkhomedir }}"
        setgid_home: "{{ setgid_home }}"
        default_home: "{{ default_home }}"
        range_config: "{{ range_config }}"
        no_user_group: "{{ no_user_group }}"
        usergroups_enab: "{{ usergroups_enab }}"
        add_extra_groups: "{{ add_extra_groups }}"
        add_extra_groups_default: "{{ add_extra_groups_default }}"

    - name: Enable and restart Adduser Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service != ""
