- name: install-sensors.conf
  hosts: all
  become: true
  vars:
    fans: []
    sensors: []
    _dest: /etc/sensors.d/.placeholder
    _service: ""
    temp_max: 85
    _packages:
      - libsensors-config
    fan_speed_max: 65535
    monitor_enabled: true
    voltage_tolerance: 10
  tasks:
    - name: Install Sensors Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: sensors.conf.j2
        dest: "{{ _dest }}"
      vars:
        fans: "{{ fans }}"
        sensors: "{{ sensors }}"
        temp_max: "{{ temp_max }}"
        fan_speed_max: "{{ fan_speed_max }}"
        monitor_enabled: "{{ monitor_enabled }}"
        voltage_tolerance: "{{ voltage_tolerance }}"

    - name: Enable and restart Sensors Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
