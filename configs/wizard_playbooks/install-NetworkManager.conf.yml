- name: install-NetworkManager.conf
  hosts: all
  become: true
  vars:
    _dest: "/etc/NetworkManager/NetworkManager.conf"
    plugins: "ifupdown,keyfile"
    _service: ""
    _packages:
      - "network-manager"
    ifupdown_managed: false
  tasks:
    - name: Install Networkmanager Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: NetworkManager.conf.j2
        dest: "{{ _dest }}"
        mode: '0644'
      vars:
        plugins: "{{ plugins }}"
        ifupdown_managed: "{{ ifupdown_managed }}"

    - name: Enable and restart Networkmanager Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
      ignore_errors: true
