# Variables = the docker-daemon template's schema fields and defaults. The old vars set `hosts` (dockerd refuses
# it next to the unit's -H fd://: Bossman-path e2e), Google's DNS as a default the package does not have, and two
# fields no template line used.
- name: install-docker-daemon
  hosts: all
  become: true
  vars:
    data_root: /var/lib/docker
    default_runtime: runc
    dns: []
    dns_search: []
    hosts: []
    insecure_registries: []
    log_driver: json-file
    log_opts: {}
    runtimes: {}
    storage_driver: ''
  tasks:
  - name: Install Docker Engine
    ansible.builtin.package:
      name:
      - docker-ce
      - docker.io
      state: present
  - name: Render configuration
    ansible.builtin.template:
      src: docker-daemon.j2
      dest: /etc/docker/daemon.json
      mode: '0644'
    vars:
      dns: '{{ dns }}'
      hosts: '{{ hosts }}'
      log_opts: '{{ log_opts }}'
      runtimes: '{{ runtimes }}'
      data_root: '{{ data_root }}'
      dns_search: '{{ dns_search }}'
      log_driver: '{{ log_driver }}'
      live_restore: '{{ live_restore }}'
      storage_driver: '{{ storage_driver }}'
      default_runtime: '{{ default_runtime }}'
      insecure_registries: '{{ insecure_registries }}'
      features_containerd_snapshotter: '{{ features_containerd_snapshotter }}'
  - name: Enable and restart Docker Engine
    ansible.builtin.service:
      name: docker
      state: restarted
      enabled: true
