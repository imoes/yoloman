- name: install-pam.conf
  hosts: all
  become: true
  vars:
    _dest: "/etc/pam.conf"
    _service: ""
    services: []
  tasks:
    - name: Install Pam Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: pam.conf.j2
        dest: "{{ _dest }}"
      vars:
        services: "{{ services }}"

    - name: Enable and restart Pam Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
