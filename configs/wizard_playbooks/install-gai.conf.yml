- name: install-gai.conf
  hosts: all
  become: true
  vars:
    _dest: "/etc/gai.conf"
    _service: ""
    _packages:
      - "libc-bin"
    label_overrides: []
    precedence_overrides: []
  tasks:
    - name: Install Gai Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: gai.conf.j2
        dest: "{{ _dest }}"
      vars:
        label_overrides: "{{ label_overrides }}"
        precedence_overrides: "{{ precedence_overrides }}"

    - name: Enable and restart Gai Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service != ""
