- name: install-oddjobd.conf
  hosts: all
  become: true
  vars:
    _dest: /etc/oddjobd.conf
    _service: ""
    services: []
    _packages:
      - oddjob
      - oddjob-mkhomedir
    max_threads: 10
    service_timeout: 30
    mkhomedir_helper_path: /usr/lib/oddjob/oddjob-mkhomedir
  tasks:
    - name: Install Oddjobd Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: oddjobd.conf.j2
        dest: "{{ _dest }}"
      vars:
        services: "{{ services }}"
        max_threads: "{{ max_threads }}"
        service_timeout: "{{ service_timeout }}"
        mkhomedir_helper_path: "{{ mkhomedir_helper_path }}"

    - name: Enable and restart Oddjobd Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service | length > 0
