- name: install-avahi-daemon.conf
  hosts: all
  become: true
  vars:
    min_ttl: 120
    use_ipv4: true
    use_ipv6: true
    publish_mx: true
    publish_ftp: false
    publish_ipp: false
    publish_lpd: false
    publish_srv: true
    publish_ssh: false
    publish_txt: true
    rlimit_core: 0
    publish_apia: false
    publish_cups: false
    reflect_ipv4: true
    reflect_ipv6: true
    publish_hinfo: true
    rlimit_nofile: 512
    publish_domain: true
    publish_webdav: false
    enable_reflector: false
    enable_wide_area: false
    publish_airprint: false
    rate_limit_burst: 50
    publish_resolv_conf: true
    publish_workstation: true
    publish_local_domain: true
    publish_local_services: true
    rate_limit_interval_usec: 1000000
    _packages:
      - avahi-daemon
    _dest: /etc/avahi/avahi-daemon.conf
    _service: ""
  tasks:
    - name: Install Avahi Daemon Conf
      ansible.builtin.package:
        name: "{{ _packages }}"
        state: present

    - name: Render configuration
      ansible.builtin.template:
        src: avahi-daemon.conf.j2
        dest: "{{ _dest }}"
        owner: root
        group: root
        mode: '0644'
      vars:
        min_ttl: "{{ min_ttl }}"
        use_ipv4: "{{ use_ipv4 }}"
        use_ipv6: "{{ use_ipv6 }}"
        publish_mx: "{{ publish_mx }}"
        publish_ftp: "{{ publish_ftp }}"
        publish_ipp: "{{ publish_ipp }}"
        publish_lpd: "{{ publish_lpd }}"
        publish_srv: "{{ publish_srv }}"
        publish_ssh: "{{ publish_ssh }}"
        publish_txt: "{{ publish_txt }}"
        rlimit_core: "{{ rlimit_core }}"
        publish_apia: "{{ publish_apia }}"
        publish_cups: "{{ publish_cups }}"
        reflect_ipv4: "{{ reflect_ipv4 }}"
        reflect_ipv6: "{{ reflect_ipv6 }}"
        publish_hinfo: "{{ publish_hinfo }}"
        rlimit_nofile: "{{ rlimit_nofile }}"
        publish_domain: "{{ publish_domain }}"
        publish_webdav: "{{ publish_webdav }}"
        enable_reflector: "{{ enable_reflector }}"
        enable_wide_area: "{{ enable_wide_area }}"
        publish_airprint: "{{ publish_airprint }}"
        rate_limit_burst: "{{ rate_limit_burst }}"
        publish_resolv_conf: "{{ publish_resolv_conf }}"
        publish_workstation: "{{ publish_workstation }}"
        publish_local_domain: "{{ publish_local_domain }}"
        publish_local_services: "{{ publish_local_services }}"
        rate_limit_interval_usec: "{{ rate_limit_interval_usec }}"

    - name: Enable and restart Avahi Daemon Conf
      ansible.builtin.service:
        name: "{{ _service }}"
        state: restarted
        enabled: true
      when: _service != ""
