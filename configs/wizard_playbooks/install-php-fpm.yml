# The php-fpm pool role (one pool file per host). Variables = the pool template's schema fields; package, unit
# and file come from the catalog for the host's family (_packages/_service/_dest). The old vars (pool/global
# objects, process_manager, a /etc/php/*/ pattern as _dest) matched no php-fpm directive — Bossman-path e2e.
- name: install-php-fpm
  hosts: all
  become: true
  vars:
    pool_name: www
    user: www-data
    group: www-data
    listen: /run/php/php8.4-fpm.sock
    listen_owner: www-data
    listen_group: www-data
    listen_mode: ''
    listen_acl_users: ''
    listen_allowed_clients: ''
    pm: dynamic
    pm_max_children: 5
    pm_start_servers: 2
    pm_min_spare_servers: 1
    pm_max_spare_servers: 3
    pm_max_requests: 0
    pm_status_path: ''
    slowlog: ''
    request_slowlog_timeout: ''
    php_admin_values: {}
    php_admin_flags: {}
    php_values: {}
    php_flags: {}
  tasks:
  - name: Install PHP-FPM
    ansible.builtin.package:
      name: '{{ _packages }}'
      state: present
  - name: Render configuration
    ansible.builtin.template:
      src: php-fpm.j2
      dest: '{{ _dest }}'
      owner: root
      group: root
      mode: '0644'
  - name: Validate configuration
    ansible.builtin.command:
      cmd: php-fpm{{ '8.4' if _family == 'debian' else '' }} -t
  - name: Enable and restart PHP-FPM
    ansible.builtin.service:
      name: '{{ _service }}'
      state: restarted
      enabled: true
