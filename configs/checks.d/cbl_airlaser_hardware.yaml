short_description: CBL Airlaser Hardware
description: "## Overview\nMonitors hardware status and temperatures of a CBL Airlaser\
  \ device using agent-provided structured data, ensuring critical components remain\
  \ within safe thermal and operational limits to prevent laser failure or safety\
  \ hazards.\n\n## What it monitors\n- Temperatures: chassis, front screen, optical\
  \ transmit (opttx), optical receive (optrx), and amplifier module (apmod)\n- Power\
  \ supply statuses: +48 V, +230 V, +5 V, +3.3 V, +2.5 V\n- Fan statuses: chassis\
  \ fan 1 and fan 2\n\n## How it works\nIn discovery mode, it yields a single service\
  \ item with default temperature thresholds. In check mode, it parses agent output\
  \ (expected to include cbl_airlaser sections) and compares measured values against\
  \ thresholds: if any temperature exceeds WARN or CRIT limits, or a power/fan status\
  \ indicates failure, the state degrades accordingly.\n\n## Parameters\nNone.\n\n\
  ## States\n- OK: all temperatures within limits and power/fan statuses normal  \n\
  - WARN: any temperature ≥ WARN threshold (but < CRIT) or minor power/fan issues\
  \  \n- CRIT: any temperature ≥ CRIT threshold or power/fan failure  \n- UNKNOWN:\
  \ agent data missing, malformed, or parsing fails (e.g., no agent section)\n\n##\
  \ Metrics\n- chassisFrontScreenTempValue — temperature in °C  \n- chassisTempValue\
  \ — temperature in °C  \n- opttxTempValue — temperature in °C  \n- optrxTempValue\
  \ — temperature in °C  \n- apmodTempValue — temperature in °C  \n- chassisFan1Status\
  \ — status (0=OK, 1=FAIL)  \n- chassisFan2Status — status (0=OK, 1=FAIL)  \n- psStatus48V,\
  \ psStatus230V, psStatus5V, psStatus3V3, psStatus2V5 — power supply status (0=OK,\
  \ 1=FAIL)"
