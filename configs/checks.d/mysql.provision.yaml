check: mysql
title: Create a MySQL monitoring user
description: 'Creates a least-privilege ''monitor'' MySQL user with a generated password

  and grants the rights the mysql check needs (PROCESS, REPLICATION CLIENT).

  The admin credentials are used only to create the account and are never

  stored; the generated monitoring credential is saved on the check.'
admin_params:
  admin_user: MySQL admin user (e.g. root)
  admin_password: MySQL admin password
secret_params:
- admin_password
generate:
- monitor_password
argv:
- mysql
- -u{admin_user}
- -p{admin_password}
- -e
- CREATE USER IF NOT EXISTS 'monitor'@'localhost' IDENTIFIED BY '{monitor_password}';
  GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'monitor'@'localhost'; FLUSH PRIVILEGES;
produces:
  user: monitor
  password: '{monitor_password}'
