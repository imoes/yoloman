name: nagios_plugin
short_description: Run any Nagios-compatible plugin / local check
description: '## Overview

  This check acts as a universal wrapper that executes any Nagios-compatible plugin
  or local check command and interprets its exit code and output to determine the
  monitoring state.


  ## What it monitors

  - The exit code and stdout/stderr output of the specified plugin command.

  - Performance data embedded in the plugin''s output (e.g., load values, disk usage
  percentages).

  - Any metric values extracted from perfdata tokens (numeric values with optional
  units).


  ## How it works

  The check runs the configured `command` (argv list) on the host. It interprets Nagios
  exit codes: 0 → OK, 1 → WARN, 2 → CRIT, others → UNKNOWN. It splits the first line
  of stdout into status text and perfdata using the `|` separator, then parses perfdata
  tokens into numeric metrics. Discovery is static: only a single service is created
  with item `""`.


  ## Parameters

  `command` (list, required) — The full argv list specifying the plugin executable
  and its arguments.


  ## States

  - **OK**: Plugin exits with code 0.

  - **WARN**: Plugin exits with code 1.

  - **CRIT**: Plugin exits with code 2.

  - **UNKNOWN**: Plugin exits with any other code, or no command is configured.


  ## Metrics

  - `label` (numeric value) — Extracted perfdata labels (e.g., `load1`, `usage`, `temp`)
  converted to numbers, with UOM and thresholds discarded.'
options:
  command:
    type: list
    required: true
    description: The plugin argv, e.g. ["/usr/lib/nagios/plugins/check_load", "-w",
      "5", "-c", "10"]
writes: false
runtime: starlark
source: custom
kind: check
category: Other
