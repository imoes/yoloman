name: check_plugin
short_description: Universal check bridge — auto-detects Nagios / local-check output
description: "## Overview\nThe `check_plugin` acts as a universal bridge for external\
  \ monitoring checks, automatically detecting and normalizing output from Nagios\
  \ plugins, yolo-man local checks, or agent sections into a consistent verdict format.\n\
  \n## What it monitors\n- Exit code and stdout of arbitrary external check commands.\n\
  - Format-specific structures: Nagios summary/perfdata, yolo-man local-service lines,\
  \ or yolo-man agent sections.\n\n## How it works\nRuns the configured command via\
  \ `ctx.run`, detects output format (nagios/local/agent) using regex heuristics,\
  \ then parses accordingly. For `local` format, it discovers and selects services\
  \ by `item`. Verdict is derived from exit code (nagios), parsed status token (local),\
  \ or always OK (agent). Discovery is supported via `_discover` mode.\n\n## Parameters\n\
  - `command` (list, required) — argv of the external check to run.\n- `force_format`\
  \ (str, optional, default: `\"\"`) — overrides auto-detection with `\"nagios\"`,\
  \ `\"local\"`, or `\"agent\"`.\n- `item` (str, optional, default: `\"\"`) — for\
  \ local checks, selects which service line to evaluate.\n\n## States\nOK: nagios\
  \ exit 0, local status `0`/`P`, or agent section output.  \nWARN: nagios exit 1\
  \ or local status `1`.  \nCRIT: nagios exit 2 or local status `2`.  \nUNKNOWN: nagios\
  \ exit 3, local status `3`, item not found, invalid command, or format ambiguity.\n\
  \n## Metrics\n- `sections` (int, agent format only) — count of detected agent sections.\
  \  \n- Other metrics extracted from perfdata (Nagios/local): `label` → numeric value\
  \ (e.g., load, usage %)."
options:
  command:
    type: list
    required: true
    description: The check argv, e.g. ["/usr/lib/nagios/plugins/check_load", "-w",
      "5", "-c", "10"]
  item:
    type: str
    required: false
    description: For local-check output, which service line to evaluate (default the
      unnamed one)
  force_format:
    type: str
    required: false
    description: Skip auto-detection and force "nagios", "local", or "agent"
writes: false
runtime: starlark
source: custom
kind: check
category: Applications
