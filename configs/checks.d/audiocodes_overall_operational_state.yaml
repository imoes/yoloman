collection: checkmk
short_description: Operational state
description: "## Overview\nMonitors the overall operational state of AudioCodes devices\
  \ by evaluating both a generic operational state and a gateway-specific severity,\
  \ ensuring timely detection of device issues.\n\n## What it monitors\n- Generic\
  \ operational state (0=OK, 1=UNKNOWN, 2=WARN, 3=CRIT)  \n- Gateway severity level\
  \ (0–5, mapped to alarm descriptions and OK/WARN/CRIT states)  \n- Associated error\
  \ messages and error IDs from the device  \n\n## How it works\nReads agent data\
  \ from either a JSON file (`/var/lib/check-mk-agent/audit/audiocodes_overall_operational_state.json`)\
  \ or a text spool file (`/var/lib/check-mk-agent/spool/audiocodes_overall_operational_state`).\
  \ In discovery mode, yields one service with empty item. The final state is determined\
  \ by prioritizing the worse of the two states (CRIT > WARN > UNKNOWN > OK). Details\
  \ include error message and ID if present.\n\n## Parameters\nNone.\n\n## States\n\
  - **OK**: Both operational and gateway states are \"OK\".  \n- **WARN**: Either\
  \ state is WARN or Minor/Warning.  \n- **CRIT**: Either state is CRIT or Major/Critical.\
  \  \n- **UNKNOWN**: Data unavailable, or both states map to UNKNOWN.  \n\n## Metrics\n\
  None."
