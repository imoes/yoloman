name: disk_smb
fqcn: checkmk.disk_smb
collection: checkmk
short_description: SMB share disk usage
description: Connects to an SMB/CIFS share using smbclient and retrieves disk capacity
  statistics via the SMB fsinfo protocol. Reports total size, free space, and used
  percentage, raising WARN or CRIT when the used percentage meets or exceeds the configured
  thresholds. Optional authentication, workgroup, TCP port override, and IP address
  override are all supported.
options:
  service_name:
    type: string
    description: Service name displayed in monitoring
    required: true
  share:
    type: string
    description: SMB share name only (e.g. 'data', not '\\\\server\\data')
    required: true
  host:
    type: string
    description: NetBIOS name or IP address of the SMB server
    required: true
  workgroup:
    type: string
    description: 'Workgroup or domain name (default: WORKGROUP)'
  ip_address:
    type: string
    description: Override IP address for the SMB server (needed if host is in a different
      network)
  port:
    type: number
    description: TCP port to connect to (usually 139 or 445)
    default: '445'
  auth_user:
    type: string
    description: Username for SMB authentication
  auth_password:
    type: string
    description: Password for SMB authentication
    secret: 'true'
  warn_pct:
    type: number
    description: Warn when disk used percentage is at or above this value (e.g. 85)
  crit_pct:
    type: number
    description: Critical when disk used percentage is at or above this value (e.g.
      95)
  timeout_s:
    type: number
    description: Connection timeout in seconds
    default: '30'
writes: false
runtime: starlark
source: translated
kind: check
category: Service checks
