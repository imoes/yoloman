short_description: CBL Airlaser Status
description: "## Overview  \nMonitors the operational status of a CBL Airlaser device\
  \ via SNMP self-test results, ensuring it is functioning correctly in normal, testing,\
  \ warning, or failure states.  \n\n## What it monitors  \n- Overall airlaser self-test\
  \ status (normal, testing, warning, or component failure)  \n\n## How it works \
  \ \nIn discovery mode, it emits a single service with default thresholds for temperature\
  \ metrics (not used in check mode). In check mode, it runs `snmpget` on OID `.1.3.6.1.4.1.2800.2.1.3.0`,\
  \ parses the response, and maps values `1`–`4` to OK, WARN, WARN, and CRIT states,\
  \ respectively. Unknown or unparseable values yield UNKNOWN.  \n\n## Parameters\
  \  \nNone.  \n\n## States  \n- **OK**: `1` — normal operation  \n- **WARN**: `2`\
  \ — testing mode, or `3` — warning condition  \n- **CRIT**: `4` — component self-test\
  \ failure  \n- **UNKNOWN**: SNMP error, non-numeric response, or value outside `1`–`4`\
  \  \n\n## Metrics  \nNone."
