# agentic-mcpd example configuration.
# Copy to /etc/agentic-mcp/config.yaml and adjust for production use.

listen: "127.0.0.1:8010"

# Bearer token required for MCP/REST access. The .deb postinst script
# generates a random one; for local testing, set your own.
token: ""

# Master write gate. When false (default), all mutating tools/modules
# (mode: put|update|delete) are not registered at all — only reads and
# check_mode/dry-run previews are possible.
write: false

tls:
  enabled: false
  cert_file: ""
  key_file: ""

ebpf:
  enabled: true

db:
  driver: sqlite
  path: /var/lib/agentic-mcp/agentic-mcp.db

pam:
  enabled: true
  service: agentic-mcp

ui:
  enabled: true

tools_dir: /etc/agentic-mcp/tools.d
commands_file: /etc/agentic-mcp/commands.yaml
