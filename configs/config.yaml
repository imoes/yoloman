# agentic-mcpd example configuration.
# Copy to /etc/agentic-mcp/config.yaml and adjust for production use.

listen: "127.0.0.1:8010"

# Operating mode. The packaged default is a fully self-contained "standalone"
# Duppy. `agentic-mcpd register` flips this to "satellite" on enrolment (a
# Fleet Commander then pulls this agent's data). "proxy" (Selecta) polls other
# satellites and re-serves the aggregate.
mode: standalone

# Load ONLY the built-in modules at startup (native Go + the embedded curated
# Starlark set) instead of bulk-loading everything under modules_dir. A
# standalone Duppy doesn't need a fleet-sized pushed library; extra modules
# still load on demand when pushed via /api/v1/modules/apply. `register` sets
# this true so an enrolled satellite loads the check/collection library a Fleet
# Commander pushes it.
modules_autoload: false

# Bearer token required for MCP/REST access. The .deb postinst script
# generates a random one; for local testing, set your own.
token: ""

# Master write gate. When false (default), all mutating tools/modules
# (mode: put|update|delete) are not registered at all — only reads and
# check_mode/dry-run previews are possible.
write: false

tls:
  enabled: false
  cert_file: ""
  key_file: ""

ebpf:
  enabled: true

# Periodic OS-metric sampler. interval is the sample cadence AND the stored
# resolution (the agent buffers points at this rate; Bossman ingests all of
# them). 60s keeps the metrics table an order of magnitude smaller than 30s.
# psi: per-service pressure-stall metrics are OFF — extremely high-cardinality
# (~18 series/service) and no Bossman feature consumes them (coroot-parity).
#
# services: OFF for the same reason, one scale up. The per-systemd-unit metrics
# (service_running, service_cpu_seconds_total, service_memory_bytes,
# service_io_{read,write}_bytes_total) were 38.8% of every row in the metrics DB —
# 5 metrics x ~180 units — and an audit of all 86 metric names against the UI, the
# backend and check_rules found no consumer for any of them. Turn it back on when
# something reads them.
#
# drop_metrics: individual metrics inside a collector we otherwise want. The disk
# *time* counters are the raw input from which the agent derives
# disk_await_ms_device in its own meter, not from the stored series, so storing
# them is pure vorratshaltung. NOTE the two that are deliberately NOT here:
# disk_reads_total and disk_writes_total ARE consumed ("Reads/Writes per device"
# in service-graphs-dialog).
#
# See docs/metrics-storage.md for the audit and the measurements.
collect:
  enabled: true
  interval: 60s
  services: false
  docker: true
  psi: false
  drop_metrics:
    - disk_read_time_ms_total
    - disk_write_time_ms_total

db:
  driver: sqlite
  path: /var/lib/agentic-mcp/agentic-mcp.db

pam:
  enabled: true
  service: agentic-mcp

ui:
  enabled: true

tools_dir: /etc/agentic-mcp/tools.d
commands_file: /etc/agentic-mcp/commands.yaml
