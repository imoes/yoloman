[project]
name = "bossman"
version = "0.1.0"
description = "Bossman — Fleet Commander for agentic-mcpd (\"Duppy\") node agents"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "asyncssh>=2.21.2",
    # passlib's bcrypt scheme needs a BACKEND, and passlib ships none. Debian's libxcrypt provides one
    # through os_crypt, EL 9's does not — so the .rpm could create no operator account
    # ("MissingBackendError: bcrypt: no backends available") while the .deb worked. Depending on the host's
    # crypt implementation for password hashing is not a dependency worth having.
    # PINNED BELOW 4.1 because passlib 1.7.4 is not compatible with the newer API: bcrypt >= 4.1 refuses a
    # secret longer than 72 bytes, and passlib's backend probe hands it exactly that ("ValueError: password
    # cannot be longer than 72 bytes"). Measured on both distributions. passlib is unmaintained upstream, so
    # the real fix is to stop using it for hashing — a code change, not a pin, and not one to make while
    # packaging.
    "bcrypt>=4.0,<4.1",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "mcp>=1.28.1",
    "passlib>=1.7.4",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    # The enrich batch's gate 3 (enrich_gates.gate_ansible_empty) renders with the REAL ansible-core
    # filter set; without it the gate silently falls back to weaker stubs. Batch tooling only — the
    # FastAPI server never imports ansible.
    "ansible-core>=2.16,<2.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
