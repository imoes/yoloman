[project]
name = "bossman"
version = "0.1.0"
description = "Bossman — Fleet Commander for agentic-mcpd (\"Duppy\") node agents"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "asyncssh>=2.21.2",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "mcp>=1.28.1",
    "nestedtext>=3.7",
    "passlib>=1.7.4",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
