# nfpm package definition for agentic-mcpd — builds both .deb and .rpm from
# this single config (nfpm package -f packaging/nfpm.yaml -p rpm|deb -t <out>).
# See docs/plan.md's packaging section for the build/install-test workflow.
name: agentic-mcp
arch: amd64
platform: linux
version: "0.1.0"
section: admin
priority: optional
maintainer: "mutkluge"
homepage: "https://github.com/mutkluge/agentic-mcp"
description: |
  YOLO-MANager (agentic-mcpd) — an AI-native Linux node agent exposing
  system state and management over MCP (Streamable HTTP) and REST,
  reimplementing ansible.builtin modules natively in Go. The daemon is
  nicknamed "Duppy".
license: MIT

contents:
  - src: ../agentic-mcpd
    dst: /usr/bin/agentic-mcpd
    file_info:
      mode: 0755

  - src: ./agentic-mcp.service
    dst: /usr/lib/systemd/system/agentic-mcp.service
    file_info:
      mode: 0644

  - src: ../configs/config.yaml
    dst: /etc/agentic-mcp/config.yaml.example
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ../configs/commands.yaml
    dst: /etc/agentic-mcp/commands.yaml
    type: config|noreplace
    file_info:
      mode: 0644

  - dst: /etc/agentic-mcp/tools.d
    type: dir
    file_info:
      mode: 0755

  - dst: /etc/agentic-mcp/trusted
    type: dir
    file_info:
      mode: 0700

  - dst: /var/lib/agentic-mcp/uploads
    type: dir
    file_info:
      mode: 0700

  - dst: /var/log/agentic-mcp
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: ./postinst
  postremove: ./postrm

rpm:
  compression: gzip

deb:
  compression: gzip
