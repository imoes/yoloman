# Included inside nginx's http{} context (conf.d/*.conf), so the map below is
# valid here — it drives the WebSocket Upgrade/Connection dance for the host
# console proxy (WS /api/v1/agents/{id}/console).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Agent self-update pushes a multi-MB .deb through this proxy (the UI's
    # Update button → POST /agents/{id}/update). nginx's 1 MB default would
    # 413 it; match the agent's own upload ceiling.
    client_max_body_size 512m;

    # Same-origin reverse proxy to the Bossman backend — the production build's
    # environment.prod.ts uses a relative apiUrl ('/api/v1'), so no CORS is
    # needed. WebSocket upgrade headers here make the host console work; the
    # long read/send timeouts keep an idle terminal from being dropped.
    location /api/v1/ {
        proxy_pass http://bossman:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Console is a long-lived WebSocket — effectively disable the idle
        # timeout so a shell left open (or watching output) is never dropped.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Fingerprinted build assets (Angular hashes main-*.js, chunk-*.js,
    # styles-*.css, polyfills-*.js) — the content hash is in the filename, so
    # a changed file always has a new URL. Cache them hard/immutable.
    location ~* "-[A-Za-z0-9]{8,}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular SPA routing: any path not matching a real file falls back
    # to index.html so client-side routes (e.g. /fleet, /hosts/123) work
    # on a hard refresh, not just via in-app navigation.
    #
    # `no-cache` on the shell (index.html + non-fingerprinted files) forces
    # the browser to revalidate every load. Without it nginx sends no
    # Cache-Control and browsers heuristically cache index.html — so after a
    # deploy the stale shell keeps pointing at the OLD hashed bundles and the
    # UI silently runs old code until a manual hard refresh. Revalidation is
    # cheap (ETag → 304) and makes new deploys take effect immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
