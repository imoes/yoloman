# Included inside nginx's http{} context (conf.d/*.conf), so the map below is
# valid here — it drives the WebSocket Upgrade/Connection dance for the host
# console proxy (WS /api/v1/agents/{id}/console).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Agent self-update pushes a multi-MB .deb through this proxy (the UI's
    # Update button → POST /agents/{id}/update). nginx's 1 MB default would
    # 413 it; match the agent's own upload ceiling.
    client_max_body_size 512m;

    # Same-origin reverse proxy to the Bossman backend — the production build's
    # environment.prod.ts uses a relative apiUrl ('/api/v1'), so no CORS is
    # needed. WebSocket upgrade headers here make the host console work; the
    # long read/send timeouts keep an idle terminal from being dropped.
    location /api/v1/ {
        proxy_pass http://bossman:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Angular SPA routing: any path not matching a real file falls back
    # to index.html so client-side routes (e.g. /fleet, /hosts/123) work
    # on a hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
