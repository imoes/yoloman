server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the Bossman backend — the production
    # build's environment.prod.ts uses a relative apiUrl ('/api/v1'), so
    # no CORS configuration is needed for this stack.
    location /api/v1/ {
        proxy_pass http://bossman:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular SPA routing: any path not matching a real file falls back
    # to index.html so client-side routes (e.g. /fleet, /hosts/123) work
    # on a hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
