---
# A minimal Ansible role: install a package, then template a file. The e2e directory-import scenario (A3)
# imports this tree through the Roles library; templates/ and defaults/ are not plans and must be skipped.
- name: Install figlet
  ansible.builtin.package:
    name: figlet
    state: present

- name: Render the message of the day
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: "0644"
