@if (isLoggedIn() && !chromeless()) {
  <div class="bm-shell">
    <nav class="bm-nav" aria-label="Main navigation">
      <div class="bm-nav-head">
        <span class="bm-brand-logo" [innerHTML]="brandMark"></span>
        <span class="bm-brand">Bossman</span>
        <span class="bm-brand-sub">Fleet Commander</span>
      </div>
      @for (item of mainItems(); track item.path) {
        <a class="bm-nav-item" [routerLink]="item.path" routerLinkActive="bm-nav-item-active">
          <app-icon class="bm-nav-icon" [name]="navIcon(item.path)" [size]="20" />
          <span class="bm-nav-label">{{ item.label }}</span>
        </a>
      }
      <!-- Configuration/admin surfaces, grouped so day-to-day views stay uncluttered. -->
      <button type="button" class="bm-nav-item bm-nav-group" [class.bm-nav-item-active]="setupActive()" (click)="toggleSetup()">
        <app-icon class="bm-nav-icon" name="setup" [size]="20" />
        <span class="bm-nav-label">Setup</span>
        <app-icon class="bm-nav-caret" [class.bm-caret-open]="setupOpen() || setupActive()" name="chevron-down" [size]="18" />
      </button>
      @if (setupOpen() || setupActive()) {
        @for (item of setupItems(); track item.path) {
          <a class="bm-nav-item bm-nav-sub" [routerLink]="item.path" routerLinkActive="bm-nav-item-active">
            <app-icon class="bm-nav-icon" [name]="navIcon(item.path)" [size]="18" />
            <span class="bm-nav-label">{{ item.label }}</span>
          </a>
        }
      }
      <div class="bm-nav-footer">
        <span class="bm-user">{{ auth.username() }}</span>
        <button class="bm-logout" (click)="auth.logout()" title="Log out" aria-label="Log out">
          <app-icon name="logout" [size]="18" />
        </button>
      </div>
    </nav>
    <div class="bm-content">
      <div class="bm-main">
        <router-outlet></router-outlet>
      </div>
      <app-chat-dock />
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}
