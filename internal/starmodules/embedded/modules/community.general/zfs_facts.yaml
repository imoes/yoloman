name: zfs_facts
fqcn: community.general.zfs_facts
collection: community.general
short_description: Gather facts about ZFS datasets
description: Gather facts from ZFS dataset properties.
options:
  depth:
    type: int
    default: 0
    description: Specifies recursion depth.
  name:
    type: str
    required: true
    aliases:
    - ds
    - dataset
    description: ZFS dataset name.
  parsable:
    type: bool
    default: false
    description: Specifies if property values should be displayed in machine friendly format.
  properties:
    type: str
    default: all
    description: Specifies which dataset properties should be queried in comma-separated format. For more
      information about dataset properties, check zfs(1M) man page.
  recurse:
    type: bool
    default: false
    description: Specifies if properties for any children should be recursively displayed.
  type:
    type: str
    default: all
    choices:
    - all
    - filesystem
    - volume
    - snapshot
    - bookmark
    description: Specifies which datasets types to display. Multiple values have to be provided in comma-separated
      form.
writes: false
runtime: starlark
source: translated
examples: "\n- name: Gather facts about ZFS dataset rpool/export/home\n  community.general.zfs_facts:\n\
  \    dataset: rpool/export/home\n\n- name: Report space usage on ZFS filesystems under data/home\n \
  \ community.general.zfs_facts:\n    name: data/home\n    recurse: true\n    type: filesystem\n\n- ansible.builtin.debug:\n\
  \    msg: 'ZFS dataset {{ item.name }} consumes {{ item.used }} of disk space.'\n  with_items: '{{ ansible_zfs_datasets\
  \ }}'\n"
