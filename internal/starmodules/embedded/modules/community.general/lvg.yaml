name: lvg
fqcn: community.general.lvg
collection: community.general
short_description: Configure LVM volume groups
description: This module creates, removes or resizes volume groups.
options:
  force:
    type: bool
    default: false
    description: If V(true), allows to remove volume group with logical volumes.
  pesize:
    type: str
    default: '4'
    description: The size of the physical extent. O(pesize) must be a power of 2 of at least 1 sector
      (where the sector size is the largest sector size of the PVs currently used in the VG), or at least
      128KiB. O(pesize) can be optionally suffixed by a UNIT (k/K/m/M/g/G), default unit is megabyte.
  pv_options:
    type: str
    default: ''
    description: Additional options to pass to C(pvcreate) when creating the volume group.
  pvresize:
    type: bool
    default: false
    description: If V(true), resize the physical volume to the maximum available size.
  pvs:
    type: list
    description: List of comma-separated devices to use as physical devices in this volume group. Required
      when creating or resizing volume group. The module will take care of running pvcreate if needed.
  reset_pv_uuid:
    type: bool
    default: false
    description: Whether the volume group's physical volumes' UUIDs are regenerated. This is B(not idempotent).
      Specifying this parameter always results in a change.
  reset_vg_uuid:
    type: bool
    default: false
    description: Whether the volume group's UUID is regenerated. This is B(not idempotent). Specifying
      this parameter always results in a change.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    - active
    - inactive
    description: Control if the volume group exists and it's state. The states V(active) and V(inactive)
      implies V(present) state. Added in 7.1.0 If V(active) or V(inactive), the module manages the VG's
      logical volumes current state. The module also handles the VG's autoactivation state if supported
      unless when creating a volume group and the autoactivation option specified in O(vg_options).
  vg:
    type: str
    required: true
    description: The name of the volume group.
  vg_options:
    type: str
    default: ''
    description: Additional options to pass to C(vgcreate) when creating the volume group.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a volume group on top of /dev/sda1 with physical extent size = 32MB\n  community.general.lvg:\n\
  \    vg: vg.services\n    pvs: /dev/sda1\n    pesize: 32\n\n- name: Create a volume group on top of\
  \ /dev/sdb with physical extent size = 128KiB\n  community.general.lvg:\n    vg: vg.services\n    pvs:\
  \ /dev/sdb\n    pesize: 128K\n\n# If, for example, we already have VG vg.services on top of /dev/sdb1,\n\
  # this VG will be extended by /dev/sdc5.  Or if vg.services was created on\n# top of /dev/sda5, we first\
  \ extend it with /dev/sdb1 and /dev/sdc5,\n# and then reduce by /dev/sda5.\n- name: Create or resize\
  \ a volume group on top of /dev/sdb1 and /dev/sdc5.\n  community.general.lvg:\n    vg: vg.services\n\
  \    pvs: /dev/sdb1,/dev/sdc5\n\n- name: Remove a volume group with name vg.services\n  community.general.lvg:\n\
  \    vg: vg.services\n    state: absent\n\n- name: Create a volume group on top of /dev/sda3 and resize\
  \ the volume group /dev/sda3 to the maximum possible\n  community.general.lvg:\n    vg: resizableVG\n\
  \    pvs: /dev/sda3\n    pvresize: true\n\n- name: Deactivate a volume group\n  community.general.lvg:\n\
  \    state: inactive\n    vg: vg.services\n\n- name: Activate a volume group\n  community.general.lvg:\n\
  \    state: active\n    vg: vg.services\n\n- name: Reset a volume group UUID\n  community.general.lvg:\n\
  \    state: inactive\n    vg: vg.services\n    reset_vg_uuid: true\n\n- name: Reset both volume group\
  \ and pv UUID\n  community.general.lvg:\n    state: inactive\n    vg: vg.services\n    pvs: /dev/sdb1,/dev/sdc5\n\
  \    reset_vg_uuid: true\n    reset_pv_uuid: true\n"
