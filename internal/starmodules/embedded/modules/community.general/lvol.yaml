name: lvol
fqcn: community.general.lvol
collection: community.general
short_description: Configure LVM logical volumes
description: This module creates, removes or resizes logical volumes.
options:
  active:
    type: bool
    default: true
    description: Whether the volume is active and visible to the host.
  force:
    type: bool
    default: false
    description: Shrink or remove operations of volumes requires this switch. Ensures that that filesystems
      get never corrupted/destroyed by mistake.
  lv:
    type: str
    description: The name of the logical volume.
  opts:
    type: str
    description: Free-form options to be passed to the lvcreate command.
  pvs:
    type: list
    description: List of physical volumes (for example V(/dev/sda, /dev/sdb)).
  resizefs:
    type: bool
    default: false
    description: Resize the underlying filesystem together with the logical volume. Supported for C(ext2),
      C(ext3), C(ext4), C(reiserfs) and C(XFS) filesystems. Attempts to resize other filesystem types
      will fail.
  shrink:
    type: bool
    default: true
    description: Shrink if current size is higher than size requested.
  size:
    type: str
    description: The size of the logical volume, according to lvcreate(8) --size, by default in megabytes
      or optionally with one of [bBsSkKmMgGtTpPeE] units; or according to lvcreate(8) --extents as a percentage
      of [VG|PVS|FREE|ORIGIN]; Float values must begin with a digit. When resizing, apart from specifying
      an absolute size you may, according to lvextend(8)|lvreduce(8) C(--size), specify the amount to
      extend the logical volume with the prefix V(+) or the amount to reduce the logical volume by with
      prefix V(-). Resizing using V(+) or V(-) was not supported prior to community.general 3.0.0. Please
      note that when using V(+), V(-), or percentage of FREE, the module is B(not idempotent).
  snapshot:
    type: str
    description: The name of a snapshot volume to be configured. When creating a snapshot volume, the
      O(lv) parameter specifies the origin volume.
  state:
    type: str
    default: present
    choices:
    - absent
    - present
    description: Control if the logical volume exists. If V(present) and the volume does not already exist
      then the O(size) option is required.
  thinpool:
    type: str
    description: The thin pool volume name. When you want to create a thin provisioned volume, specify
      a thin pool volume name.
  vg:
    type: str
    required: true
    description: The volume group this logical volume is part of.
writes: true
runtime: starlark
source: translated
examples: "\n- name: Create a logical volume of 512m\n  community.general.lvol:\n    vg: firefly\n   \
  \ lv: test\n    size: 512\n\n- name: Create a logical volume of 512m with disks /dev/sda and /dev/sdb\n\
  \  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: 512\n    pvs:\n      - /dev/sda\n\
  \      - /dev/sdb\n\n- name: Create cache pool logical volume\n  community.general.lvol:\n    vg: firefly\n\
  \    lv: lvcache\n    size: 512m\n    opts: --type cache-pool\n\n- name: Create a logical volume of\
  \ 512g.\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: 512g\n\n- name: Create\
  \ a logical volume the size of all remaining space in the volume group\n  community.general.lvol:\n\
  \    vg: firefly\n    lv: test\n    size: 100%FREE\n\n- name: Create a logical volume with special options\n\
  \  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: 512g\n    opts: -r 16\n\n- name:\
  \ Extend the logical volume to 1024m.\n  community.general.lvol:\n    vg: firefly\n    lv: test\n  \
  \  size: 1024\n\n- name: Extend the logical volume to consume all remaining space in the volume group\n\
  \  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: +100%FREE\n\n- name: Extend the\
  \ logical volume by given space\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    size:\
  \ +512M\n\n- name: Extend the logical volume to take all remaining space of the PVs and resize the underlying\
  \ filesystem\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: 100%PVS\n    resizefs:\
  \ true\n\n- name: Resize the logical volume to % of VG\n  community.general.lvol:\n    vg: firefly\n\
  \    lv: test\n    size: 80%VG\n    force: true\n\n- name: Reduce the logical volume to 512m\n  community.general.lvol:\n\
  \    vg: firefly\n    lv: test\n    size: 512\n    force: true\n\n- name: Reduce the logical volume\
  \ by given space\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: -512M\n    force:\
  \ true\n\n- name: Set the logical volume to 512m and do not try to shrink if size is lower than current\
  \ one\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    size: 512\n    shrink: false\n\n\
  - name: Remove the logical volume.\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    state:\
  \ absent\n    force: true\n\n- name: Create a snapshot volume of the test logical volume.\n  community.general.lvol:\n\
  \    vg: firefly\n    lv: test\n    snapshot: snap1\n    size: 100m\n\n- name: Deactivate a logical\
  \ volume\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    active: false\n\n- name: Create\
  \ a deactivated logical volume\n  community.general.lvol:\n    vg: firefly\n    lv: test\n    size:\
  \ 512g\n    active: false\n\n- name: Create a thin pool of 512g\n  community.general.lvol:\n    vg:\
  \ firefly\n    thinpool: testpool\n    size: 512g\n\n- name: Create a thin volume of 128g\n  community.general.lvol:\n\
  \    vg: firefly\n    lv: test\n    thinpool: testpool\n    size: 128g\n"
