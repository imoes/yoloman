fqcn: yoloman.machine_identity
name: machine_identity
collection: yoloman
writes: true
runtime: starlark
short_description: Reset a restored disk clone's identity (machine-id, SSH host keys, hostname, /etc/hosts, cloud-init) so it is a distinct machine
options:
  hostname:
    type: str
    required: true
    description: The new fully-qualified hostname. Written to /etc/hostname, the 127.0.1.1 line in /etc/hosts (with its short form), and pinned against cloud-init.
  dry_run:
    type: bool
    description: When true, report what would change without applying it (check_mode).
