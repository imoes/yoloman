fqcn: yoloman.bootloader
name: bootloader
collection: yoloman
writes: true
runtime: starlark
short_description: Install GRUB firmware-aware (BIOS i386-pc / UEFI x86_64-efi) + update-grub, in the target chroot (provisioning-only, PE-baked)
options:
  firmware:
    type: str
    required: true
    choices: [bios, uefi]
    description: bios installs i386-pc to the disk; uefi installs grub-efi (removable) into the ESP.
  disk:
    type: str
    description: The disk to install BIOS grub to (required for firmware=bios, e.g. /dev/sda).
  efi_directory:
    type: str
    description: ESP mount point for firmware=uefi (default /boot/efi).
  bootloader_id:
    type: str
    description: UEFI bootloader id (default debian).
