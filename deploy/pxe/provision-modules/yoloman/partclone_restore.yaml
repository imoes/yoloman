fqcn: yoloman.partclone_restore
name: partclone_restore
collection: yoloman
writes: true
runtime: starlark
short_description: Stream a captured partclone+zstd image onto a target device via curl (provisioning-only, PE-baked)
options:
  device:
    type: str
    required: true
    description: The target device to restore onto (e.g. /dev/sda2 or /dev/mapper/vg-root).
  source_url:
    type: str
    required: true
    description: URL of the .pcl.zst image to restore.
  retries:
    type: int
    description: curl retry count (default 5).
