fqcn: yoloman.disk_partition
name: disk_partition
collection: yoloman
writes: true
runtime: starlark
short_description: Write a target disk's partition table from a verbatim sfdisk dump (provisioning-only, PE-baked)
options:
  disk:
    type: str
    required: true
    description: The target disk to partition (e.g. /dev/sda). Must be blank.
  dump:
    type: str
    description: The sfdisk --dump text of the source layout to replay verbatim. Provide either dump or dump_file.
  dump_file:
    type: str
    description: Path to a file holding the sfdisk --dump text (pe-init.sh writes it to /tmp/target.sfdisk). Provide either dump or dump_file.
