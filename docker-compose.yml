services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bossman
      POSTGRES_PASSWORD: bossman
      POSTGRES_DB: bossman
    volumes:
      - bossman-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bossman -d bossman"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./bossman
    environment:
      BOSSMAN_DATABASE_URL: postgresql+asyncpg://bossman:bossman@db:5432/bossman
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./bossman
    environment:
      BOSSMAN_DATABASE_URL: postgresql+asyncpg://bossman:bossman@db:5432/bossman
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin123
    command: ["uv", "run", "python", "scripts/seed_admin.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bossman:
    build: ./bossman
    environment:
      BOSSMAN_DATABASE_URL: postgresql+asyncpg://bossman:bossman@db:5432/bossman
      BOSSMAN_CLIENT_KEY_PATH: /app/data/tls/bossman-client.key
      BOSSMAN_CLIENT_CERT_PATH: /app/data/tls/bossman-client.crt
      BOSSMAN_PLANS_DIR: /app/plans
      BOSSMAN_JWT_SECRET: dev-only-not-for-production
      # Dev-only shared bootstrap secret for `agentic-mcpd register` (see
      # docs/plan.md's Block E1 enrollment UX) — enrolling a real host also
      # needs BOSSMAN_PUBLIC_URL set to a reachable address, which is
      # host-specific and belongs in docker-compose.override.yml instead.
      BOSSMAN_ENROLL_SECRET: dev-only-not-for-production
    command: ["uv", "run", "uvicorn", "bossman.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./bossman/plans:/app/plans:ro
      - bossman-tls:/app/data/tls
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  bossman-ui:
    build: ./bossman-ui
    depends_on:
      - bossman

volumes:
  bossman-db-data:
  bossman-tls:
